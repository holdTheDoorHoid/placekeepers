# Checks every pull request and every push to main: the data pipeline's tests and lint, the
# workflow helper's tests, and the web app's tests, type check and build. Uses only the small
# committed fixtures, never the network (apart from installing packages).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      # One publish test builds real map tiles when tippecanoe is present.
      - name: Install tippecanoe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tippecanoe
          tippecanoe --version

      - name: Install the pipeline
        run: pip install -e "pipeline[dev]"

      # The vacancy model's spatial tests need DuckDB's spatial extension; without it they skip.
      - name: Install the DuckDB spatial extension
        run: python -c "import duckdb; duckdb.connect().install_extension('spatial')"

      - name: Lint
        run: ruff check pipeline .github/scripts

      - name: Check the registry
        run: pk registry check

      - name: Pipeline tests (no network)
        run: pytest pipeline -m "not live"

      - name: Workflow helper tests
        run: pytest .github/scripts

  web:
    name: Web tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Type check
        run: npm run check

      - name: Build for GitHub Pages
        run: npm run build
