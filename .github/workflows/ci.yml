# Checks every pull request and every push to main: the data pipeline's tests and lint, the
# workflow helper's tests, the web app's tests, type check and build, and end to end tests of both
# views at phone and desktop sizes in Chromium. Uses only the small committed fixtures, never the
# network (apart from installing packages and the browser).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      # One publish test builds real map tiles when tippecanoe is present.
      - name: Install tippecanoe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tippecanoe
          tippecanoe --version

      - name: Install the pipeline
        run: pip install -e "pipeline[dev]"

      # The vacancy model's spatial tests need DuckDB's spatial extension; without it they skip.
      - name: Install the DuckDB spatial extension
        run: python -c "import duckdb; duckdb.connect().install_extension('spatial')"

      - name: Lint
        run: ruff check pipeline .github/scripts

      - name: Check the registry
        run: pk registry check

      - name: Pipeline tests (no network)
        run: pytest pipeline -m "not live"

      - name: Workflow helper tests
        run: pytest .github/scripts

  web:
    name: Web tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Type check
        run: npm run check

      - name: Build for GitHub Pages
        run: npm run build

  e2e:
    name: Web end to end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # The browser download is kept between runs, keyed by the Playwright version in the lockfile.
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the browser
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install the system libraries Chromium needs
        if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Builds the production site on the sample data, serves it, and tests both views at phone and
      # desktop sizes (web/playwright.config.ts).
      - name: End to end tests
        run: npx playwright test

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
