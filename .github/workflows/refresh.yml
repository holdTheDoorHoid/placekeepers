# The weekly data refresh. Every Monday (and whenever someone starts it by hand) it:
#
#   1. data:    restores last week's good copy of every source from the data-snapshots release,
#               runs the pipeline (fetch, check, publish), saves the new good copies back to the
#               release, and reuses the base map extract for a month before making a new one;
#   2. site:    builds the map with the new data in dist/data/;
#   3. deploy:  publishes it on GitHub Pages;
#   4. issues:  opens an issue for a source that failed this week and last week, and closes it
#               once the source works again.
#
# A source that fails keeps last week's copy, so the map never goes dark. If a whole job fails,
# nothing is deployed and the site keeps the previous version.

name: Weekly data refresh

on:
  schedule:
    # Mondays at 10:00 UTC, early morning in Philadelphia.
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      rebuild_basemap:
        description: Make a new base map extract even if the saved one is less than a month old
        type: boolean
        default: false

permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  RELEASE_TAG: data-snapshots

jobs:
  data:
    name: Fetch, check and publish the data
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # read and replace the assets of the data-snapshots release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install tippecanoe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tippecanoe
          tippecanoe --version

      - name: Install the pipeline
        run: pip install -e pipeline

      - name: Prepare folders
        run: |
          {
            echo "PK_CACHE=$RUNNER_TEMP/pk-cache"
            echo "WORK=$RUNNER_TEMP/work"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/work/assets" "$RUNNER_TEMP/work/upload" build/site build/manifests

      - name: Restore last week's snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
              > "$WORK/assets.txt" 2> "$WORK/view-error.txt"; then
            if grep -qi "not found" "$WORK/view-error.txt"; then
              echo "No $RELEASE_TAG release yet, so this run starts without earlier snapshots."
              : > "$WORK/assets.txt"
            else
              # Better to stop than to publish a map without last week's fallbacks.
              cat "$WORK/view-error.txt"
              exit 1
            fi
          fi
          if grep -q '^snapshot-' "$WORK/assets.txt"; then
            gh release download "$RELEASE_TAG" --dir "$WORK/assets" --pattern 'snapshot-*.tar'
          fi
          if grep -qx 'manifest.json' "$WORK/assets.txt"; then
            gh release download "$RELEASE_TAG" --dir "$WORK" --pattern 'manifest.json'
            cp "$WORK/manifest.json" build/manifests/previous-manifest.json
          fi
          python .github/scripts/refresh.py restore --cache "$PK_CACHE" --from "$WORK/assets"

      - name: Fetch, check and publish
        run: pk all --out "$GITHUB_WORKSPACE/build/site/data"

      - name: Source health
        run: pk health

      - name: Save the snapshots to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python .github/scripts/refresh.py pack --cache "$PK_CACHE" --out "$WORK/upload"
          cp build/site/data/manifest.json "$WORK/upload/manifest.json"
          cp build/site/data/manifest.json build/manifests/manifest.json
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Data snapshots" \
              --notes "The last good copy of every data source, the manifest of the last refresh, and the base map extract. The weekly refresh replaces these files; this is not a software release."
          fi
          gh release upload "$RELEASE_TAG" "$WORK"/upload/* --clobber
          # Remove the snapshots of sources that left the registry, so the release stays small.
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$WORK/assets-now.txt"
          # (grep finds nothing when there are no snapshots; steps run with pipefail.)
          { grep '^snapshot-' "$WORK/assets-now.txt" || true; } | while read -r name; do
            if [ ! -e "$WORK/upload/$name" ]; then
              gh release delete-asset "$RELEASE_TAG" "$name" --yes
            fi
          done

      - name: Base map
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REBUILD: ${{ inputs.rebuild_basemap || false }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$WORK/assets-now.txt"
          reuse=""
          if [ "$REBUILD" != "true" ]; then
            reuse=$(python .github/scripts/refresh.py pick-basemap --assets "$WORK/assets-now.txt")
          fi
          if [ -z "$reuse" ]; then
            if PK_BASEMAP_OUT="$GITHUB_WORKSPACE/build/site/basemap" bash web/scripts/make-basemap.sh; then
              built=$(cat build/site/basemap/BUILD)
              tar -cf "$WORK/basemap-$built.tar" -C build/site basemap
              gh release upload "$RELEASE_TAG" "$WORK/basemap-$built.tar" --clobber
              { grep -E '^basemap-[0-9]{8}\.tar$' "$WORK/assets-now.txt" || true; } | while read -r old; do
                if [ "$old" != "basemap-$built.tar" ]; then
                  gh release delete-asset "$RELEASE_TAG" "$old" --yes
                fi
              done
            else
              rm -rf build/site/basemap
              echo "::warning::A new base map extract failed, so the saved one is used if there is one."
              reuse=$(python .github/scripts/refresh.py pick-basemap --assets "$WORK/assets-now.txt" --max-age-days 100000)
            fi
          fi
          if [ -n "$reuse" ]; then
            gh release download "$RELEASE_TAG" --dir "$WORK" --pattern "$reuse"
            tar -xf "$WORK/$reuse" -C build/site
            echo "Using the saved base map $reuse."
          fi
          if [ ! -s build/site/basemap/philly.pmtiles ]; then
            echo "::warning::No base map this week. The map still works, with a plain background."
          fi

      - name: Hand the data to the next jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-data
          path: build/site
          retention-days: 3
          if-no-files-found: error

      - name: Hand the manifests to the issues job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifests
          path: build/manifests
          retention-days: 30
          if-no-files-found: error

  site:
    name: Build the site
    needs: data
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the map
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-data
          path: ${{ runner.temp }}/site-data

      - name: Add the data to the site
        run: |
          mkdir -p web/dist/data
          cp -R "$RUNNER_TEMP/site-data/data/." web/dist/data/
          if [ -d "$RUNNER_TEMP/site-data/basemap" ]; then
            cp -R "$RUNNER_TEMP/site-data/basemap" web/dist/data/basemap
          fi
          test -s web/dist/data/manifest.json
          # GitHub Pages refuses files over 100 MB and sites over 1 GB.
          big=$(find web/dist -type f -size +95M)
          if [ -n "$big" ]; then
            echo "::error::Files too large for GitHub Pages (move them to Cloudflare R2): $big"
            exit 1
          fi
          total=$(du -sm web/dist | cut -f1)
          echo "Site size: ${total} MB"
          if [ "$total" -gt 950 ]; then
            echo "::error::The site is ${total} MB, close to the 1 GB GitHub Pages limit."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    name: Publish on GitHub Pages
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  issues:
    name: Open or close data source issues
    needs: data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install "PyYAML>=6,<7"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manifests
          path: ${{ runner.temp }}/manifests

      - name: Open, update or close issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python .github/scripts/refresh.py issues \
            --current "$RUNNER_TEMP/manifests/manifest.json" \
            --previous "$RUNNER_TEMP/manifests/previous-manifest.json" \
            --registry registry \
            --run-url "$RUN_URL"
