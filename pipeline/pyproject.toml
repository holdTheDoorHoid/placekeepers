[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "placekeepers"
version = "0.1.0"
description = "Data pipeline for Placekeepers, a free map for Philadelphia neighbors and organizers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
  "pydantic>=2.7",
  "duckdb>=1.1",
  "pyarrow>=16",
  "shapely>=2.0",
  "h3>=4.0",
  "geopandas>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pk = "placekeepers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: talks to the real City APIs (run with: pytest -m live)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
