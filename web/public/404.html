<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <!-- GitHub Pages shows this page for any address under the site that does not exist. The links
         use the site's base path, /placekeepers/ (see base in vite.config.ts). -->
    <link rel="icon" href="/placekeepers/favicon.svg" type="image/svg+xml" />
    <title>Page not found, Placekeepers</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        background: #ffffff;
        color: #1d2327;
        font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 48px 16px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 12px;
      }
      a {
        color: #1f5f8b;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 3px solid #0b4f8a;
        outline-offset: 2px;
      }
      ul {
        padding-left: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This page does not exist</h1>
      <p>The address may be mistyped, or the page may have moved.</p>
      <ul>
        <li><a href="/placekeepers/">Go to the map</a></li>
        <li><a href="/placekeepers/status/">See the data status</a></li>
      </ul>
    </main>
  </body>
</html>
