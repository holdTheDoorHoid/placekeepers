# Layer groups, in display order. See docs/CONTRACTS.md.
- id: lots
  label: Lots and buildings
  description: Vacant lots and abandoned buildings, and what could be done with them.
- id: care
  label: Care already happening
  description: Lots already maintained, gardens, parks and other places people already tend.
- id: displacement
  label: Prices and protections
  description: Where prices are rising, so that greening and other improvements can be paired with protections for the neighbors who live there now.
- id: streets
  label: Streets and memorials
  description: The High Injury Network, crashes, people killed on our streets, and the street poles, traffic calming and school crossing guards the City lists.
- id: transit
  label: Buses and trains
  description: SEPTA stops and routes, how often service comes, how many people get on, and which stops have a shelter or a bench, from the City's list of shelters and OpenStreetMap.
- id: heat
  label: Heat, trees and flooding
  description: How hard summer heat hits each neighborhood, the trees the City keeps on its streets and in its parks, and where FEMA expects flooding.
- id: amenities
  label: Benches, water, toilets and more
  description: Places to sit, drink water, use a toilet or borrow a book, as mapped in OpenStreetMap, and drinking fountains in parks.
- id: public_places
  label: Libraries, recreation centers and pools
  description: Free Library branches and Parks and Recreation's recreation centers, pools and spraygrounds, as the City lists them.
- id: conditions
  label: Conditions reported to 311
  description: Illegal dumping, lights out and graffiti that people reported to Philly311 in the last 90 days, counted by block.
- id: placemaking
  label: Art and placemaking
  description: Murals, sculptures, mosaics and other public art, from the City, OpenStreetMap and Wikidata.
- id: walking
  label: Walking, cycling and people
  description: How walkable each area is, how many people and everyday places are within a short walk, and how stressful each street is for people on bikes.
- id: safety_context
  label: Where care is needed most
  description: Context that shows where improvements are likely to help most.
- id: boundaries
  label: Boundaries
  description: Council districts, community organizations and neighborhoods.
- id: basemap
  label: Base map
  description: Streets, buildings and place names underneath everything else.
