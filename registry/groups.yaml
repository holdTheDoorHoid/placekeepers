# Layer groups, in display order. See docs/CONTRACTS.md.
- id: lots
  label: Lots and buildings
  description: Vacant lots and abandoned buildings, and what could be done with them.
- id: care
  label: Care already happening
  description: Lots already maintained, gardens, parks and other places people already tend.
- id: streets
  label: Streets and memorials
  description: The High Injury Network, crashes, and people killed on our streets.
- id: transit
  label: Buses and trains
  description: SEPTA stops and routes, how often service comes, how many people get on, and which stops have a shelter or a bench.
- id: heat
  label: Heat, trees and flooding
  description: How hard summer heat hits each neighborhood, the trees the City keeps on its streets and in its parks, and where FEMA expects flooding.
- id: safety_context
  label: Where care is needed most
  description: Context that shows where improvements are likely to help most.
- id: boundaries
  label: Boundaries
  description: Council districts, community organizations and neighborhoods.
- id: basemap
  label: Base map
  description: Streets, buildings and place names underneath everything else.
