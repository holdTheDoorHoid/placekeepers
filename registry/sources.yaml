# Milestone M2.1: SEPTA schedules and ridership. SEPTA's license agreement (registry/licenses.yaml,
# docs/DATA_SOURCES.md) lets anyone use, reproduce and redistribute this data; downloading it
# means accepting that agreement. No login is needed.
- id: septa_gtfs
  name: SEPTA schedules (GTFS)
  publisher: Southeastern Pennsylvania Transportation Authority (SEPTA)
  homepage: https://www3.septa.org/developer/
  # One zip holding two GTFS feeds: bus, trolley and Metro (subway and El), and Regional Rail.
  # The snapshot keeps one row per stop with its service measures and one per route, not the
  # timetables (pipeline/src/placekeepers/adapters/septa.py).
  endpoint: {kind: url, url: "https://www3.septa.org/developer/gtfs_public.zip", format: zip}
  license: septa_license
  attribution: "Transit schedules: SEPTA"
  cadence: irregular
  health: {min_rows: 9000, max_drop_pct: 15, newest_field: source_date, max_age_days: 90}
  release: v0.2
- id: septa_ridership_bus
  name: SEPTA bus stop ridership
  publisher: Southeastern Pennsylvania Transportation Authority (SEPTA)
  homepage: https://data-septa.opendata.arcgis.com/search?tags=ridership
  # SEPTA publishes a "stop summary" for each schedule period (spring, summer, fall) as its own
  # layer. The newest spring or fall count is used (summer counts miss school trips); this names
  # the newest on 2026-10-04, and each run looks for a newer one in SEPTA's ArcGIS folder.
  endpoint: {kind: arcgis, service: Spring_2026_Stop_Summary_Bus, layer: 0, url: "https://services2.arcgis.com/9U43PSoL47wawX5S/arcgis/rest/services"}
  license: septa_license
  attribution: "Bus stop ridership: SEPTA"
  cadence: irregular
  health: {min_rows: 15000, max_drop_pct: 25, newest_field: source_date, max_age_days: 400}
  release: v0.2
- id: septa_ridership_trolley
  name: SEPTA trolley stop ridership
  publisher: Southeastern Pennsylvania Transportation Authority (SEPTA)
  homepage: https://data-septa.opendata.arcgis.com/search?tags=ridership
  # As for buses: the newest spring or fall trolley count.
  endpoint: {kind: arcgis, service: Spring_2026_Stop_Summary_Trolley, layer: 0, url: "https://services2.arcgis.com/9U43PSoL47wawX5S/arcgis/rest/services"}
  license: septa_license
  attribution: "Trolley stop ridership: SEPTA"
  cadence: irregular
  health: {min_rows: 500, max_drop_pct: 25, newest_field: source_date, max_age_days: 400}
  release: v0.2
# Milestone M2.2: what OpenStreetMap knows about bus stops, shelters and benches. One weekly
# download of Geofabrik's Pennsylvania extract (about 350 MB), filtered on this machine to the city
# limits (with a 200 meter margin) and to the tags below; the extract itself is deleted once the
# snapshot is made. A later layer adds its tags here (docs/CONTRACTS.md section 1); they arrive
# with the next weekly download. railway=tram_stop is not listed: in Philadelphia it marks where a
# trolley stops on its tracks, while riders wait at the platform beside it.
- id: osm_philadelphia
  name: OpenStreetMap in Philadelphia (bus stops, shelters, benches, water, toilets and more)
  publisher: OpenStreetMap contributors, from Geofabrik's Pennsylvania extract
  homepage: https://www.openstreetmap.org/copyright
  endpoint:
    kind: osm_extract
    url: https://download.geofabrik.de/north-america/us/pennsylvania-latest.osm.pbf
    tags:
      - highway=bus_stop
      - public_transport=platform
      - amenity=shelter
      - amenity=bench
      # Amenities (M3.5): drinking water, public toilets, little free libraries, picnic tables
      - amenity=drinking_water
      - amenity=toilets
      - amenity=public_bookcase
      - leisure=picnic_table
  license: odbl
  attribution: "Bus stops, benches, water, toilets and more: © OpenStreetMap contributors (Open Database License)"
  cadence: weekly
  health: {min_rows: 2500, max_drop_pct: 10, newest_field: extract_date, max_age_days: 14}
  release: v0.2
