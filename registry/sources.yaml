- id: epa_walkability
  name: National Walkability Index (EPA Smart Location Database)
  publisher: U.S. Environmental Protection Agency, Office of Community Revitalization
  homepage: https://www.epa.gov/smartgrowth/smart-location-mapping
  # The EPA's own feature service of the Smart Location Database (version 3, 2021, on 2019 block
  # groups), which holds the National Walkability Index and its four parts. Only Philadelphia's
  # 1,336 block groups are downloaded, not the 405 MB national file.
  endpoint: {kind: arcgis, service: Smart_Location_Database_, layer: 0, url: "https://services.arcgis.com/cJ9YHowT8TU7DUyn/arcgis/rest/services"}
  license: public_domain
  attribution: "Walkability: U.S. EPA National Walkability Index (Smart Location Database, 2021)"
