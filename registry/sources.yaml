# Data sources. Wave 1 seeds; later milestones add more. See docs/CONTRACTS.md and docs/DATA_SOURCES.md.
- id: opa_properties
  name: OPA properties
  publisher: City of Philadelphia, Office of Property Assessment
  homepage: https://opendataphilly.org/datasets/philadelphia-properties-and-assessment-history/
