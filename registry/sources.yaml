# Data sources. Wave 1 seeds; later milestones add more. See docs/CONTRACTS.md and docs/DATA_SOURCES.md.
- id: opa_properties
  name: OPA properties
  publisher: City of Philadelphia, Office of Property Assessment
  homepage: https://opendataphilly.org/datasets/philadelphia-properties-and-assessment-history/
  endpoint: {kind: carto, table: opa_properties_public}
  license: city_terms
  attribution: "Property data: City of Philadelphia, Office of Property Assessment"
  cadence: daily
  health: {min_rows: 550000, max_drop_pct: 5, newest_field: sale_date, max_age_days: 30}
  release: v0.1
