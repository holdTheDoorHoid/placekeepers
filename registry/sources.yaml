# Milestone M4.1: the displacement watch. Home sales and assessed values for the whole city (the
# candidate parcels' records above are mostly vacant lots and sheriff sales), renters by census
# tract, and the City's Market Value Analysis (pipeline/src/placekeepers/adapters/displacement.py).
- id: real_estate_sales
  name: Real estate sales, citywide
  publisher: City of Philadelphia, Department of Records
  homepage: https://opendataphilly.org/datasets/real-estate-transfers/
  # Every deed with a price over $100 from the last nine years, for the whole city. The buyers'
  # names are read only to tell a company from a person and are never kept: the snapshot holds
  # each deed's buyer type, not names. The sellers' names are never downloaded.
  endpoint:
    kind: carto
    table: rtt_summary
    where: "document_type ILIKE '%DEED%' AND total_consideration > 100 AND display_date >= now() - interval '9 years'"
  license: city_terms
  attribution: "Real estate transfers: City of Philadelphia, Department of Records"
  cadence: weekly
  health: {min_rows: 150000, max_drop_pct: 15, newest_field: display_date, max_age_days: 120}
  release: v0.4
