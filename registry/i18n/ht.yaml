options:
  live_city_data:
    label: Rekipere done an dirèk nan Vil la
    description: >-
      Lè ou louvri yon paj teren oswa ou chèche yon adrès, navigatè ou mande sèvè piblik Vil
      Filadèlfi yo dènye dosye yo: pwopriyetè a, vant yo, evalyasyon yo, enspeksyon yo ak apèl yo.
      Demann sa yo ale dirèkteman soti nan aparèy ou pou rive nan Vil la, yo pa janm pase nan
      Placekeepers, epi sèvè Vil la wè yo menm jan yo ta wè yon vizit sou pwòp sit entènèt
      pwopriyete Vil la. Foto ayeryen Vil la ak atlas 1860 li, anba "Avan ak kounye a", soti tou
      dirèkteman nan sèvè Vil la, men sèlman lè ou limen youn nan yo. Fèmen sa a pou itilize
      sèlman kopi chak semèn done Placekeepers pibliye. Rechèch adrès, louvri yon pasèl ki pa sou
      lis nou an, ak ansyen foto yo ak atlas la bezwen sa a limen.
