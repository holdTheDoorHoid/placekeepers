layers:
  vacant_parcels:
    label: Teren ak bilding vid
    description: 'Pasèl ki pwobableman vid, ak konbyen nou sèten ak poukisa. Li konbine endikatè vid Vil la ak dosye evalyatè a, anprent bilding yo, demolisyon, ka L&I ak kat itilizasyon tè a, pou yon sèl sous pa ka fè l tonbe.'
    settings:
      min_confidence:
        label: Montre pasèl nou omwen sa a sèten sou yo
        options:
          '1':
            label: Nenpòt siy vid
          '2':
            label: Pwobableman oswa gen anpil chans vid
          '3':
            label: Sèlman sa ki gen anpil chans vid
      kinds:
        label: Montre
        options:
          both:
            label: Teren ak bilding
          lots:
            label: Sèlman teren
          buildings:
            label: Sèlman bilding
      listed:
        label: Ajans tè Vil la mete l sou lis kòm disponib
        options:
          any:
            label: Nenpòt pasèl
          available:
            label: Sèlman sa ki sou lis kòm disponib
      lens:
        label: Kolore teren yo selon
        options:
          violence:
            label: Lantiy rediksyon vyolans
          heat:
            label: Lantiy chalè ak lonbraj
          placemaking:
            label: Lantiy kreyasyon kote
  hin_2025:
    label: High Injury Network
    description: Ri kote pi fò moun ki mouri ak ki blese grav nan trafik Filadèlfi pase, jan pwogram Vision Zero Vil la te kat yo an 2025.
  shootings_hex:
    label: Tire ak zam, konte pa zòn
    description: Moun ki pran bal nan peryòd ou chwazi a, konte pa egzagòn ki gen apeprè de blòk lajè. Nou montre sa pou dirije swen kote li ede pi plis, se pa pou make kote yo kòm danjere.
    settings:
      window:
        label: Peryòd
        options:
          m12:
            label: Dènye 12 mwa
          m36:
            label: Dènye 3 lane
  landcare_lots:
    label: Teren PHS LandCare antretni
    description: Teren vid Pennsylvania Horticultural Society te netwaye, plante, epi ki kontinye koupe zèb, atravè LandCare ak Community LandCare. Se swen sa a esè ki fèt nan Filadèlfi yo te teste.
  gardens:
    label: Jaden kominotè
    description: Jaden ak fèm kominotè PHS oswa Neighborhood Gardens Trust sipòte, ak jaden ki anrejistre nan Pak ak Rekreyasyon. Moun deja pran swen kote sa yo, kidonk yo pa janm parèt kòm vid.
  council_districts:
    label: Distri Konsèy Minisipal
    description: Dis distri Konsèy Minisipal jan yo te trase an 2024, pou ou ka wè ki biwo pou kontakte.
    settings:
      names:
        label: Montre non yo
  community_organizations:
    label: Òganizasyon Kominotè Anrejistre (RCO)
    description: Gwoup katye ki anrejistre nan Vil la, ki tande pale de chanjman zonaj nan zòn yo. Zòn yo souvan chevoche.
    settings:
      names:
        label: Montre non yo
  neighborhoods:
    label: Katye
    description: Non ak limit katye yo, soti nan kat katye OpenDataPhilly pa Abaca Labs.
    settings:
      names:
        label: Montre non yo
  segments:
    label: Sekirite ri, blòk pa blòk
    description: 'Chak blòk ri kolore selon lantiy sekirite ri a: si li sou High Injury Network, konbyen moun ki te mouri oswa ki te blese grav la pandan yo t ap mache oswa ap monte bisiklèt nan senk dènye ane dosye PennDOT yo, si yon moun te mouri la nan dènye de lane yo, ak si gen yon lekòl nan 400 mèt. Deplase glisè lantiy yo pou chanje melanj lan. Yon blòk di tou konbyen poto Vil la mete sou lis ak long li ak konbyen nan lanp yo se LED, ak ralanti trafik Vil la mete sou lis la.'
    settings:
      min_score:
        label: Montre blòk ki gen omwen nòt sa a
        options:
          '1':
            label: Nenpòt nòt pi wo pase zewo
          '20':
            label: 20 sou 100
          '40':
            label: 40 sou 100
          '60':
            label: 60 sou 100
  crashes:
    label: Aksidan
    description: Aksidan yo rapòte bay PennDOT nan Filadèlfi depi 2015 jiska 2024, kolore selon ki jan moun te blese. Chwazi ane yo, ki jan moun te blese ak ki moun ki te enplike. Dosye PennDOT yo rive apeprè yon ane apre aksidan yo, kidonk dènye lanmò yo parèt kòm memoryal olye de sa.
    settings:
      years:
        label: Ane yo
        options:
          latest:
            label: Dènye ane dosye yo
          recent:
            label: Dènye senk ane yo
          all:
            label: Chak ane depi 2015
      severity:
        label: Ki jan moun te blese
        options:
          '3':
            label: Yon moun te mouri
          '2':
            label: Yon moun te mouri oswa te blese grav
          '1':
            label: Yon moun te blese
          '0':
            label: Chak aksidan
      mode:
        label: Ki moun ki te enplike
        options:
          all:
            label: Tout moun
          walk_cycle:
            label: Moun k ap mache oswa ap monte bisiklèt
          walk:
            label: Moun k ap mache
          cycle:
            label: Moun k ap monte bisiklèt
          motorcycle:
            label: Moun sou motosiklèt
  memorials:
    label: Memoryal
    description: Moun ki mouri sou ri nou yo pandan yo t ap mache, ap monte bisiklèt oswa ap monte eskouteur, selon dosye Depatman Polis yo sou lanmò nan aksidan sikilasyon depi 2019, chak make an silans kote sa te rive. Yon non parèt sèlman lè yon lis memoryal piblik deja pataje l, epi nenpòt moun ka mande pou yon non oswa yon makè retire.
    settings:
      show_names:
        label: Montre non yo
      all_fatal:
        label: Sonje tou moun ki mouri nan machin ak sou motosiklèt
  parking_reports:
    label: Pwoblèm estasyonman yo rapòte (Laser Vision)
    description: 'Kote moun k ap itilize aplikasyon Laser Vision Philly Bike Action te rapòte veyikil ki bloke twotwa, pasaj pyeton, kwen, ranp twotwa ak liy bisiklèt pandan 12 mwa jiska dat ki nan lejand la, konte pa zòn ki gen apeprè yon blòk lajè. Li montre kote moun k ap itilize yon sèl aplikasyon te rapòte pwoblèm, se pa chak pwoblèm. Yon zòn ki gen mwens pase 5 rapò pa parèt, pou pa gen yon sèl rapò ki parèt. Anpil rapò nan yon sèl kote se prèv pou amelyorasyon fizik: pwolonjman twotwa, poto pwoteksyon, kwen ki pi vizib, liy bisiklèt ki pwoteje ak zòn chajman.'
    settings:
      kind:
        label: Montre rapò sou veyikil
        options:
          all:
            label: Ki bloke wout la nan nenpòt nan fason sa yo
          sidewalk:
            label: Sou yon twotwa
          bike_lane:
            label: Nan yon liy bisiklèt
          crosswalk:
            label: Sou yon pasaj pyeton
          corner:
            label: Sou yon kwen
          ramp:
            label: Ki bloke yon ranp twotwa
  street_poles:
    label: Poto ri ak lanp Vil la mete sou lis
    description: 'Chak poto ri Depatman Ri a mete sou lis, ak lanp li mete sou lis sou yo: LED, ansyen sodyòm presyon wo a, oswa yon lanp ki gen yon kalite li pa bay non. Anpil poto, tankou poto PECO ak poto siyal trafik yo, pa gen okenn lanp sou lis. Sa a se sa Vil la enstale, se pa si yon lanp mache aswè a: rapòte yon limyè ki etenn bay Philly311 ak nimewo poto a. Montre lè ou zoum antre, sou kèk blòk lajè.'
    settings:
      show:
        label: Montre
        options:
          all:
            label: Chak poto
          lamps:
            label: Poto ki gen yon lanp Vil la mete sou lis
          not_led:
            label: Lanp Vil la pa mete sou lis kòm LED
  traffic_calming:
    label: Ralanti trafik Vil la mete sou lis
    description: Kousen vitès, dòdàn ak tab Depatman Ri a mete pou ralanti chofè sou ri rezidansyèl, ak jou chak te enstale. Vwazen yo ka mande Vil la pou yo sou yon ri rezidansyèl; gwo ri prensipal ak wout eta pa kalifye. Yon blòk ri montre konbyen li genyen ak depi ki lè, epi yon blòk High Injury Network kote moun te blese di lè poko gen okenn ki anrejistre.
  crossing_guards:
    label: Pòs gad travèse lekòl
    description: Kwen kote Vil la mete yon gad travèse lekòl, yon sèvis sekirite ki ede timoun ak tout lòt moun travèse toupre lekòl yo nan kòmansman ak nan fen jounen lekòl la. Chak pòs bay non kwen li ak lekòl ki pi pre nan 400 mèt.
  basemap:
    label: Kat debaz
    description: Ri, bilding, pak, dlo ak non kote ki soti nan OpenStreetMap, anba tout rès la. Chwazi aparans gri a pou fè done yo parèt pi byen, oswa fèmen kat debaz la.
    settings:
      look:
        label: Aparans
        options:
          light:
            label: Klè, an koulè
          muted:
            label: Gri, pou done yo parèt pi byen
  transit_stops:
    label: Estasyon bis ak tramway
    description: 'Chak estasyon bis ak tramway SEPTA nan Filadèlfi, selon orè SEPTA kounye a: liy ki sispann la, chak konbyen tan yon bis oswa yon tramway pase nan yon jou lasemèn òdinè, Samdi ak Dimanch, kilè sèvis la kòmanse epi fini, ak konbyen moun ki monte la nan yon jou lasemèn mwayen, selon pwòp konte SEPTA. Chak estasyon montre sa pasaje yo jwenn la kote OpenStreetMap konnen l, yon abri kote pwòp lis Vil la gen youn, priyorite li selon lantiy konfò transpò a, ak sa vwazen yo ka fè sou sa. Estasyon metwo, El ak Regional Rail yo ka ajoute nan paramèt yo.'
    settings:
      service:
        label: Montre estasyon ki gen
        options:
          all:
            label: Nenpòt sèvis
          frequent:
            label: 'Sèvis souvan: chak 15 minit oswa pi byen a midi'
          long_wait:
            label: 'Long tan datant: mwens souvan pase chak 30 minit a midi'
      color:
        label: Kolore estasyon yo selon
        options:
          lens:
            label: Priyorite selon lantiy konfò transpò a
          wait:
            label: Chak konbyen tan yon bis oswa yon tren pase a midi
          boardings:
            label: Konbyen moun ki monte chak jou lasemèn
      stations:
        label: Montre tou estasyon metwo, El ak Regional Rail
  transit_routes:
    label: Liy bis, tramway ak tren
    description: Ri ak ray chak liy SEPTA swiv nan Filadèlfi, selon orè SEPTA kounye a, kolore selon kalite veyikil la. Chwazi liy ki souvan pou wè kote yon bis oswa yon tren pase omwen chak 15 minit a midi.
    settings:
      service:
        label: Montre liy yo
        options:
          all:
            label: Chak liy
          frequent:
            label: 'Liy ki souvan: chak 15 minit oswa pi byen a midi'
  stop_amenities:
    label: Abri ak ban nan estasyon yo
    description: 'Sa pasaje yo jwenn nan estasyon bis ak tramway OpenStreetMap konnen yo: yon abri oswa yon twati, yon ban men pa gen abri, okenn nan de a, oswa poko verifye. Poko verifye vle di pèsonn poko anrejistre l; sa pa vle di estasyon an pa gen anyen. OpenStreetMap gen sèlman apeprè yon estasyon sou dis pou kounye a (lis konplè estasyon SEPTA se pwòp kouch li). Vwazen yo ka verifye estasyon yo ak aplikasyon telefòn StreetComplete, epi repons yo parèt isit la nan apeprè yon semèn.'
    settings:
      show:
        label: Montre
        options:
          all:
            label: Chak estasyon
          surveyed:
            label: Estasyon yon moun te verifye
          unsurveyed:
            label: Estasyon ki poko verifye
  city_shelters:
    label: Abri bis Vil la mete sou lis
    description: Abri bis ki sou pwòp lis Vil la, ke li enstale ak antretni ak patnè piblisite li, ak estasyon SEPTA chak youn sèvi. Yon estasyon ki gen yon abri Vil la konte kòm gen abri nan lantiy konfò transpò a. Kote OpenStreetMap di yon estasyon pa gen abri men Vil la mete youn sou lis, paj estasyon an di de sous yo pa dakò, epi yon verifikasyon regle sa. Lis la te chanje pou dènye fwa an janvye 2025, kidonk yon abri yo mete oswa yo retire depi lè sa a kapab manke.
  heat_tracts:
    label: Vilnerabilite chalè pa katye
    description: 'Ki jan chalè ete a frape moun nan chak sektè resansman, selon Endèks Vilnerabilite Chalè Vil la (Depatman Sante Piblik ak Biwo Dirabilite, done 2017 a 2019). Li mete ansanm ekspozisyon chalè, ki jan sektè a vin cho nan jou ete jan satelit mezire l, ak sansiblite chalè, konbyen nan moun ki rete la ki pi an risk nan chalè a (douz mezi sou laj, sante, revni, edikasyon, lang ak ras, jan Vil la te konstwi endèks la). Sektè yo ombraje pa senkyèm nan vil la, senkyèm ki pi fonse a se sa ki pi an risk. Ou ka montre ekspozisyon ak sansiblite poukont yo nan paramèt yo.'
    settings:
      measure:
        label: Ombraje sektè yo selon
        options:
          vulnerability:
            label: 'Vilnerabilite chalè: chalè a ak moun ki an risk ansanm'
          exposure:
            label: 'Ekspozisyon chalè: ki jan li vin cho'
          sensitivity:
            label: 'Sansiblite chalè: konbyen moun ki an risk nan chalè a'
      priority:
        label: Make kontou sektè Vil la evalye kòm trè wo yo
  city_trees:
    label: Pyebwa nan ri ak nan pak
    description: 'Chak pyebwa nan envantè pyebwa Pak ak Rekreyasyon (2025): pyebwa Vil la kenbe sou twotwa li yo ak nan pak li yo, se pa pyebwa nan lakou prive, ak kalite chak pyebwa ak gwosè tij li. Montre lè ou zoum antre, sou kèk blòk lajè. Ti pyebwa, ki gen yon tij ki pa rive 4 pous lajè, souvan se jenn pyebwa, epi TreePhilly mande pou jenn pyebwa jwenn apeprè 20 galon dlo chak semèn depi mas jiska desanm.'
    settings:
      show:
        label: Montre
        options:
          all:
            label: Chak pyebwa
          big:
            label: 'Gwo pyebwa lonbraj: yon tij omwen 12 pous lajè'
          small:
            label: 'Ti pyebwa: yon tij ki pa rive 4 pous lajè, souvan jenn'
  floodplain:
    label: Plenn inondasyon
    description: 'Kote kat inondasyon FEMA espere inondasyon, jan Vil la pibliye yo (2023): plenn inondasyon ki gen 1 pousan chans chak ane, kote yon inondasyon gen omwen 1 chans sou 100 chak ane, ak zòn ki gen 0.2 pousan chans chak ane bò kote l (souvan yo rele yo plenn inondasyon 100 an ak 500 an). Tout sa yo bati la dwe swiv règ Vil la pou plenn inondasyon. Amenajman vèt ki absòbe lapli ede la, ak plant ki ka sipòte tè mouye.'
    settings:
      zones:
        label: Montre
        options:
          both:
            label: Zòn 1 pousan ak 0.2 pousan chans chak ane yo
          high:
            label: Sèlman plenn inondasyon 1 pousan chans chak ane a
  benches:
    label: Ban, jan yo make nan OpenStreetMap
    description: 'Kote pou chita: ban moun te ajoute nan OpenStreetMap, kat gratis nenpòt moun ka amelyore, ak si chak gen yon apiye do kote kat la di sa. OpenStreetMap manke anpil ban, kidonk yon ri ki pa gen okenn ki montre ka toujou genyen kèk. Nenpòt moun ka ajoute yon ban ak aplikasyon telefòn StreetComplete, epi li parèt isit la nan apeprè yon semèn.'
  picnic_tables:
    label: Tab pikonik, jan yo make nan OpenStreetMap
    description: Tab pikonik moun te ajoute nan OpenStreetMap, sitou nan pak, ak si chak anba yon twati kote kat la di sa. OpenStreetMap manke anpil ladan yo. Nenpòt moun ka ajoute youn ak aplikasyon telefòn StreetComplete, epi li parèt isit la nan apeprè yon semèn.
  drinking_water:
    label: Dlo pou bwè, jan yo make nan OpenStreetMap
    description: Fontèn pou bwè ak wobinè dlo moun te ajoute nan OpenStreetMap, ak si yo ka ranpli yon boutèy kote kat la di sa. OpenStreetMap konnen sèlman kèk douzèn nan vil la, kidonk fontèn pou bwè Pak ak Rekreyasyon mete sou lis yo se pwòp kouch yo. Nenpòt moun ka ajoute yon fontèn ak aplikasyon telefòn StreetComplete, epi li parèt isit la nan apeprè yon semèn.
  toilets:
    label: Twalèt piblik, jan yo make nan OpenStreetMap
    description: Twalèt moun te ajoute nan OpenStreetMap, ak ki moun ki ka itilize yo, si gen yon frè ak aksè pou chèz woulant kote kat la di sa. Twalèt ki fèmen pou piblik la yo kite deyò. OpenStreetMap konnen mwens pase san nan vil la. Nenpòt moun ka ajoute youn ak aplikasyon telefòn StreetComplete, epi li parèt isit la nan apeprè yon semèn.
  bookcases:
    label: Ti bibliyotèk gratis, jan yo make nan OpenStreetMap
    description: Etajè piblik, ke yo souvan rele ti bibliyotèk gratis, kote nenpòt moun ka pran oswa kite yon liv, jan moun te ajoute yo nan OpenStreetMap. Anpil manke. Nenpòt moun ka ajoute youn ak aplikasyon telefòn StreetComplete, epi li parèt isit la nan apeprè yon semèn.
  park_water:
    label: Fontèn pou bwè nan pak
    description: Fontèn pou bwè ak estasyon pou ranpli boutèy nan pak ak sant rekreyasyon, jan Pak ak Rekreyasyon Filadèlfi mete yo sou lis. Yon fontèn andedan yon sant rekreyasyon ka itilize lè sant lan louvri.
  libraries:
    label: Branch Free Library
    description: Chak kote Free Library of Philadelphia Vil la mete sou lis, ak adrès li, nimewo telefòn li ak yon lyen nan paj li pou orè louvèti. Bibliyotèk yo gratis epi louvri pou tout moun.
  recreation_centers:
    label: Sant rekreyasyon
    description: 'Kote Pak ak Rekreyasyon Filadèlfi fè pwogram: sant rekreyasyon, sant pou granmoun aje ak sant edikasyon sou anviwònman, ak si chak gen yon jimnazyòm, jan Vil la mete yo sou lis.'
  pools:
    label: Pisin ak zòn jwèt dlo
    description: Pisin, zòn jwèt dlo ak awozwa Vil la, kote pou rafrechi nan jou cho, ak si chak an sèvis ane sa a jan Pak ak Rekreyasyon Filadèlfi mete l sou lis. Pisin yo louvri pou sezon ete a sèlman; verifye ak Pak ak Rekreyasyon pou orè semèn sa a.
    settings:
      show:
        label: Montre
        options:
          in_service:
            label: Sèlman sa ki an sèvis ane sa a
          all:
            label: Tout yo, menm sa ki pa an sèvis
  cooling_centers:
    label: Sant pou rafrechi ak pou chofe
    description: 'Kote Biwo Jesyon Ijans Vil la mete sou lis kòm sit pou chofe oswa pou rafrechi: bibliyotèk, sant rekreyasyon, patnè kominotè ak sant kominotè Philadelphia Housing Authority, ak si chak te make kòm louvri, orè li ak sa li ofri, jan yo te make l jou kat sa a te kopye lis la pou dènye fwa. Se pa an dirèk: sit yo louvri epi fèmen selon move tan an, kidonk rele sit la oswa Philly311 anvan ou ale. Yon bibliyotèk oswa yon sant rekreyasyon ki se yon sit tou parèt yon sèl fwa.'
    settings:
      kind:
        label: Sit pou
        options:
          any:
            label: Chalè oswa fredi
          cooling:
            label: Rafrechi nan tan cho
          warming:
            label: Chofe nan tan fwa
      show:
        label: Montre
        options:
          all:
            label: Tout yo, louvri oswa fèmen jan yo make l
          open:
            label: Sèlman sa ki make kòm louvri
  dumping:
    label: Fatra jete ilegalman rapòte bay 311
    description: Blòk kote yon moun te mande Philly311 sou fatra jete ilegalman nan dènye 90 jou yo, ak konbyen demann ak si gen youn ki toujou louvri. Konte pa blòk, pa janm pa adrès, e san okenn enfòmasyon sou ki moun ki te fè rapò a. Yon demann montre yon moun te remake epi te mande èd; gen kèk blòk ki mande pi souvan pase lòt, kidonk si gen kèk demann sa pa vle di blòk la pwòp.
    settings:
      show:
        label: Montre blòk ki gen
        options:
          any:
            label: Nenpòt demann nan dènye 90 jou yo
          open:
            label: Yon demann ki toujou louvri
  dark_lights:
    label: Limyè ri ak koridò ki rapòte etenn
    description: Blòk kote yon moun te mande Philly311 repare yon limyè ri oswa yon limyè koridò ki te etenn nan dènye 90 jou yo, ak konbyen demann ak si gen youn ki toujou louvri, bò kote poto ak lanp Vil la mete sou lis ak long blòk la. Konte pa blòk, pa janm pa adrès, e san okenn enfòmasyon sou ki moun ki te fè rapò a.
    settings:
      show:
        label: Montre blòk ki gen
        options:
          any:
            label: Nenpòt demann nan dènye 90 jou yo
          open:
            label: Yon demann ki toujou louvri
  graffiti:
    label: Grafiti rapòte bay 311
    description: Blòk kote yon moun te mande Philly311 retire grafiti nan dènye 90 jou yo, ak konbyen demann ak si gen youn ki toujou louvri. Konte pa blòk, pa janm pa adrès, e san okenn enfòmasyon sou ki moun ki te fè rapò a.
    settings:
      show:
        label: Montre blòk ki gen
        options:
          any:
            label: Nenpòt demann nan dènye 90 jou yo
          open:
            label: Yon demann ki toujou louvri
  public_art:
    label: Atizay piblik
    description: Miral, eskilti ak estati, mozayik ak lòt atizay piblik, soti nan lis Percent for Art Vil la, OpenStreetMap ak Wikidata. Lè de oswa twa nan yo mete menm zèv la sou lis, kat la montre l yon sèl fwa epi li mete yon lyen pou chak. Zèv atizay ki onore yon moun parèt sèlman kòm zèv atizay memoryal, san non. Mural Arts Philadelphia kenbe pi gwo lis miral vil la sou pwòp sit li; kondisyon li yo pa pèmèt kopye l, kidonk kat la mete yon lyen nan li olye de sa. Si yon zèv manke, ajoute l nan OpenStreetMap epi li parèt isit la nan apeprè yon semèn.
    settings:
      murals:
        label: Miral ak penti sou mi
      sculptures:
        label: Eskilti ak estati
      mosaics:
        label: Mozayik
      other:
        label: Lòt kalite atizay
      inside:
        label: Zèv andedan bilding
  playgrounds:
    label: Teren jwèt
    description: Teren jwèt Pak ak Rekreyasyon Filadèlfi mete sou lis, ak laj chak youn fèt pou yo ak ane li te enstale lè Vil la di sa. Yon pak souvan gen de, youn pou timoun ki pi piti ak youn pou timoun ki pi gran. Paj yon teren bay non teren jwèt ki pi pre a ak ki distans li ye an liy dwat.
  walkability:
    label: Ki jan chak zòn bon pou mache (EPA)
    description: 'Endèks Nasyonal Mache Ajans Pwoteksyon Anviwònman Etazini an pou chak gwoup blòk resansman, yon zòn ki gen kèk blòk, soti nan Smart Location Database li (2021, apati done apeprè 2017 a 2019). Li bay yon nòt de 1 a 20 sou ki jan yon zòn sipòte mache, selon kat mezi: konbyen kwen ri gen, ki jan estasyon transpò ki pi pre a toupre, ak de mezi sou ki jan kay, travay ak magazen melanje byen. Zòn yo ombraje pa senkyèm gwoup blòk Filadèlfi, oswa selon pwòp klas EPA, ki konpare tout peyi a. Ou ka montre chak mezi poukont li nan paramèt yo. Gwoup blòk yo koupe pou tè vil la sèlman, kidonk rivyè yo rete klè.'
    settings:
      measure:
        label: Ombraje zòn yo selon
        options:
          index:
            label: 'Endèks mache a: kat mezi yo ansanm'
          corners:
            label: 'Kwen ri: ki jan ri yo konekte'
          transit:
            label: 'Transpò: ki jan estasyon ki pi pre a toupre'
          mix:
            label: Yon melanj kay, travay ak magazen
      compare:
        label: Konpare ak
        options:
          city:
            label: 'Filadèlfi: senkyèm gwoup blòk vil la'
          nation:
            label: 'Tout peyi a: pwòp klas EPA'
  walking_distance:
    label: Moun ak kote nan distans mache
    description: 'Pou chak egzagòn ki gen apeprè de blòk lajè: konbyen moun ki rete nan 5 minit mache de mitan li, selon resansman 2020; konbyen nan sèt kalite kote chak jou ki nan 10 minit mache (yon bibliyotèk, yon sant rekreyasyon, yon pisin oswa yon zòn jwèt dlo, yon fontèn pou bwè nan yon pak, yon lekòl, yon makèt oswa yon mache ki aksepte SNAP, ak yon estasyon bis, tramway oswa tren); oswa konbyen kwen ri ki nan 5 minit mache. Yon mache 5 minit konte pou 400 mèt epi yon mache 10 minit pou 800 mèt an liy dwat, sa ki rive yon ti jan pi lwen pase yon mache ak long ri yo epi li travèse liy tren, otowout ak rivyè moun k ap mache pa ka travèse.'
    settings:
      measure:
        label: Ombraje egzagòn yo selon
        options:
          people:
            label: Moun ki rete nan 5 minit mache
          places:
            label: Kalite kote chak jou nan 10 minit mache
          corners:
            label: Kwen ri nan 5 minit mache
  traffic_stress:
    label: Estrès trafik pou moun sou bisiklèt (DVRPC)
    description: 'Ki jan chak ri estresan pou monte bisiklèt, jan Delaware Valley Regional Planning Commission evalye l selon kantite bann, ki vitès trafik la ale ak kalite liy bisiklèt la, si genyen: nivo 1 bon pou pifò moun de tout laj, nivo 2 pou pifò granmoun, nivo 3 sèlman pou moun ki konfyan, epi nivo 4 sèlman pou moun ki pi brav. Kote de direksyon yon ri diferan, se sa ki pi estresan an ki montre. Evalyasyon yo soti nan modèl DVRPC ak limit vitès yo afiche, se pa nan monte bisiklèt sou chak ri.'
    settings:
      show:
        label: Montre
        options:
          all:
            label: Chak ri DVRPC evalye
          stressful:
            label: 'Sèlman ri ki estresan: nivo 3 ak 4'
          calm:
            label: 'Sèlman ri ki kalm: nivo 1 ak 2'
  displacement_watch:
    label: 'Veye deplasman: siy ki montre pri yo ap monte'
    description: 'Zòn (sektè resansman) ki gen omwen de nan siy sa yo, omwen youn ladan yo sou pri yo menm (twa premye yo): kay yo vann pou anpil plis pase senk lane avan, pi vit pase nan rès vil la; valè Vil la evalye yo ap monte pi vit pase sa vil la an jeneral; Analiz Valè Mache Vil la ki jwenn pri yo ap monte pi wo pase sa moun ki rete la depi lontan ka peye; konpayi ki achte anpil nan kay yo vann; omwen twa sou senk kay gen lokatè ladan yo; oswa anpil lokatè ap peye mwatye revni yo oswa plis pou lwaye (mèt pwojè a te ajoute sa nan 9 oktòb 2026). Amenajman vèt ak lòt amelyorasyon ka fè pri yo monte plis, kidonk kote yon sijesyon pou vèdi yon teren, plante pyebwa, fè yon kote pou chita, kòmanse yon jaden oswa mande atizay, oswa yon teren Vil la mete sou lis kòm disponib, nan youn nan zòn sa yo, fich li ajoute fason pou pwoteje vwazen yo. Sa a montre siy nan dosye piblik, se pa yon prevwa, epi li pa di anyen sou ki moun ki rete isit la. Tape yon zòn pou wè siy li yo ak sa yo te mezire pou chak, epi, kòm kontèks, lwaye ak revni fanmi mitan ak konbyen kay ki vid, selon sondaj Biwo Resansman an; chak chif sondaj vini ak maj erè li.'
    settings:
      shade:
        label: Ombraje zòn yo (si ou fèmen l, se sèlman kontou yo ki parèt)
  historic_districts:
    label: Distri istorik
    description: 'Distri istorik lokal Komisyon Istorik Filadèlfi a. Chanjman nan bilding ak teren yon distri ka bezwen revizyon Komisyon an, menm yon miral, yon kloti oswa yon jaden: mande Komisyon an an premye (215 686 7660). Vil la mande tout moun konfime estati istorik yon pwopriyete ak Komisyon an. Tape yon distri pou wè non li ak jou yo te deziyen l.'
  historic_properties:
    label: Pwopriyete sou rejis istorik la
    description: 'Pwopriyete sou Philadelphia Register of Historic Places, chak youn pasèl pa l, ki enskri poukont yo oswa kòm pati yon distri istorik (montre lè ou zoum antre). Chanjman isit la ka bezwen revizyon Komisyon Istorik la: mande yo an premye (215 686 7660).'
  zoning_overlays:
    label: Zonaj siperpoze
    description: 'Zòn kote Kòd Zonaj la ajoute pwòp règ li anwo zonaj debaz la: konsèvasyon katye, ri komèsyal, pwoteksyon kont inondasyon ak pant apik, limit sou pavaj toupre Wissahickon, wotè toupre ayewopò a, panno ak plis ankò. Anpil chevoche, epi kèk kouvri pifò vil la. Tape yon kote pou wè chak zonaj siperpoze ki la, ak seksyon li nan Kòd Zonaj la. Zonaj siperpoze yo ka chanje sa ki otorize; verifye ak Vil la anvan ou planifye.'
    settings:
      show:
        label: Montre
        options:
          all:
            label: Distri zonaj siperpoze ak lòt règ espesyal
          districts:
            label: Sèlman distri zonaj siperpoze
  hearings:
    label: Odyans ki poko fèt
    description: Odyans fikse devan Komisyon Ajisteman Zonaj (Zoning Board of Adjustment), Komisyon Revizyon L&I (L&I Review Board), Komisyon Estanda Bilding (Board of Building Standards) ak lòt komisyon Vil la sou yon pwopriyete, selon dosye apèl Vil la, ak jou a, lè a ak kalite apèl la. Nenpòt moun ka patisipe nan yon odyans zonaj; tape youn pou wè kijan, epi pou louvri paj teren an. Ki moun ki depoze yon apèl parèt sèlman sou paj pwòp teren sa a, pa janm sou kat la.
    settings:
      boards:
        label: Montre
        options:
          all:
            label: Chak komisyon
          zoning:
            label: Sèlman Komisyon Ajisteman Zonaj la
  brownfields:
    label: Sit brownfield (EPA)
    description: Pwopriyete kote yon sibvansyon brownfield federal te peye pou yon evalyasyon oswa yon netwayaj, selon dosye EPA. Se pa yon kat tout tè ki kontamine, epi li pa di si yon sit kontamine jodi a. Teste tè a anvan ou plante manje sou yon sit oswa toupre youn.
  aerial_photos:
    label: Foto ayeryen pa ane
    description: 'Foto ayeryen tout vil la, pran depi yon avyon: pwòp foto Vil la pou chak ane li genyen depi 1996 (chak prentan, pifò ane soti mas rive me), ak ansyen foto Vil la mete sou sèvè li, soti nan Delaware Valley Regional Planning Commission (1959 ak 1975) ak U.S. Geological Survey (1999). Glise nan ane yo pou wè sa ki te sou yon blòk avan: kay ki te tonbe, teren yo te netwaye, jaden ki te grandi. Foto yo soti dirèkteman nan sèvè Vil la lè kouch sa a limen, epi yo trase anba tout rès kat la. Ane ki pi ansyen yo mwens klè, epi foto jiska 2000 yo an nwa ak blan.'
