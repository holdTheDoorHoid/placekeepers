# Haitian Creole (ht) translations of the visitor facing words in registry/*.yaml, by id. English
# in registry/*.yaml is the source; anything left out here shows the English. Which fields may be
# translated, and the shape of this file, are in docs/TRANSLATING.md and
# web/src/i18n/registry-text.ts. The key terms are in docs/i18n/glossary-ht.md.
#
# Spelling follows the Akademi Kreyol Ayisyen. The reader is addressed as "ou". No dashes as
# punctuation. Names of offices have the Creole words first, with the English name in
# parentheses where a neighbor may need it to find the office.

groups:
  lots:
    label: Teren ak bilding
    description: Teren vid ak bilding abandone, ak sa yo ta ka fè ak yo.
  care:
    label: Swen ki deja ap fèt
    description: Teren ki deja antretni, jaden, pak ak lòt kote moun deja ap pran swen.
  displacement:
    label: Pri ak pwoteksyon
    description: Kote pri yo ap monte, pou amenajman vèt ak lòt amelyorasyon ka ale ansanm ak pwoteksyon pou vwazen ki rete la kounye a.
  rules:
    label: Règ tè yo ak odyans
    description: Distri ak pwopriyete istorik, zonaj siperpoze, odyans ki poko fèt sou teren ak bilding, ak sit brownfield federal.
  streets:
    label: Ri ak memoryal
    description: High Injury Network, aksidan, moun ki mouri sou ri nou yo, ak poto ri, ralanti trafik ak gad travèse lekòl Vil la mete sou lis.
  transit:
    label: Bis ak tren
    description: Estasyon ak liy SEPTA, chak konbyen tan sèvis la pase, konbyen moun ki monte, epi ki estasyon ki gen yon abri oswa yon ban, selon lis abri Vil la ak OpenStreetMap.
  heat:
    label: Chalè, pyebwa ak inondasyon
    description: Ki jan chalè ete a frape chak katye, pyebwa Vil la kenbe sou ri li yo ak nan pak li yo, ak kote FEMA espere inondasyon.
  amenities:
    label: Ban, dlo, twalèt ak plis ankò
    description: Kote pou chita, pou bwè dlo, pou itilize yon twalèt oswa pou prete yon liv, jan yo make nan OpenStreetMap, ak fontèn pou bwè nan pak yo.
  public_places:
    label: Bibliyotèk, sant rekreyasyon ak pisin
    description: Branch Free Library, sant rekreyasyon Pak ak Rekreyasyon, pisin ak zòn jwèt dlo, ak sit Vil la pou chofe ak pou rafrechi, jan Vil la mete yo sou lis.
  conditions:
    label: Kondisyon yo rapòte bay 311
    description: Fatra jete ilegalman, limyè etenn ak grafiti moun te rapòte bay Philly311 nan dènye 90 jou yo, konte pa blòk.
  placemaking:
    label: Atizay ak kreyasyon kote
    description: Miral, eskilti, mozayik ak lòt atizay piblik, ki soti nan Vil la, OpenStreetMap ak Wikidata, ak teren jwèt Vil la.
  walking:
    label: Mache, monte bisiklèt ak moun
    description: Ki jan chak zòn bon pou mache, konbyen moun ak kote chak jou ki nan yon ti mache, ak ki jan chak ri estresan pou moun sou bisiklèt.
  then_and_now:
    label: Avan ak kounye a
    description: Sa ki te sou yon blòk avan, ak sa ki rete nan sa ki pase a. Foto ayeryen depi 1959 yo ak atlas 1860 la chaje soti nan sèvè Vil la sèlman lè yo limen; kat redlining 1937 la soti nan sit sa a.
  safety_context:
    label: Kote swen pi nesesè
    description: Kontèks ki montre kote amelyorasyon yo gen plis chans pou ede.
  boundaries:
    label: Limit
    description: Distri Konsèy, òganizasyon kominotè ak katye.
  basemap:
    label: Kat debaz
    description: Ri, bilding ak non kote anba tout rès la.

