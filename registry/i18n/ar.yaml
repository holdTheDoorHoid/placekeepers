# Arabic (ar) translations of the visitor facing words in registry/*.yaml, by id. English in
# registry/*.yaml is the source; anything left out here shows the English. Which fields may be
# translated, and the shape of this file, are in docs/TRANSLATING.md and
# web/src/i18n/registry-text.ts. Key terms are fixed in docs/i18n/glossary-ar.md.
#
# Plain Modern Standard Arabic. Western digits, Arabic punctuation, no dashes as punctuation, and
# proper names as they are (Placekeepers, Philly311, LandCare, SEPTA, Land Bank).

groups:
  lots:
    label: قطع الأراضي والمباني
    description: قطع الأراضي الفارغة والمباني المهجورة، وما يمكن فعله بها.
  care:
    label: عناية قائمة بالفعل
    description: قطع أراضٍ يُعتنى بها بالفعل، وحدائق ومتنزهات وأماكن أخرى يرعاها الناس أصلًا.
  displacement:
    label: الأسعار والحماية
    description: >-
      أين ترتفع الأسعار، حتى يُقرن التخضير وغيره من التحسينات بإجراءات حماية للجيران الذين يسكنون
      هناك الآن.
  rules:
    label: قواعد الأرض وجلسات الاستماع
    description: >-
      الأحياء والعقارات التاريخية، ونطاقات تقسيم المناطق الإضافية، وجلسات الاستماع القادمة بشأن
      قطع الأراضي والمباني، ومواقع البراونفيلد الفيدرالية.
  streets:
    label: الشوارع والنُّصُب التذكارية
    description: >-
      شبكة الشوارع الأكثر إصابات، والحوادث، والأشخاص الذين قُتلوا في شوارعنا، وأعمدة الشوارع
      ووسائل تهدئة حركة المرور وحرّاس العبور المدرسيين التي تُدرجها المدينة.
  transit:
    label: الحافلات والقطارات
    description: >-
      مواقف SEPTA وخطوطها، وعدد مرات مجيء الخدمة، وكم شخصًا يصعد، وأي المواقف فيها مظلة أو مقعد،
      بحسب قائمة المدينة للمظلات وOpenStreetMap.
  heat:
    label: الحرارة والأشجار والفيضانات
    description: >-
      مدى تأثير حرّ الصيف في كل حي، والأشجار التي تعتني بها المدينة في شوارعها وحدائقها، وأين
      تتوقع FEMA حدوث فيضانات.
  amenities:
    label: مقاعد وماء ومراحيض وغيرها
    description: >-
      أماكن للجلوس وشرب الماء واستخدام المرحاض أو استعارة كتاب، كما هي مسجّلة في OpenStreetMap،
      ونوافير الشرب في الحدائق.
  public_places:
    label: المكتبات والمراكز الترفيهية والمسابح
    description: >-
      فروع Free Library، والمراكز الترفيهية والمسابح ومناطق الألعاب المائية التابعة لإدارة الحدائق
      والترفيه، ومواقع التدفئة والتبريد لدى المدينة، كما تُدرجها المدينة.
  conditions:
    label: مشكلات بُلّغ عنها إلى 311
    description: >-
      إلقاء النفايات بصورة غير قانونية، وأضواء مطفأة، وكتابات على الجدران بلّغ عنها الناس إلى
      Philly311 في آخر 90 يومًا، تُعدّ بحسب المقطع.
  placemaking:
    label: الفن وتهيئة الأماكن
    description: >-
      جداريات ومنحوتات وفسيفساء وفنون عامة أخرى، من المدينة وOpenStreetMap وWikidata، وملاعب
      الأطفال التابعة للمدينة.
  walking:
    label: المشي وركوب الدراجات والناس
    description: >-
      مدى صلاحية كل منطقة للمشي، وكم شخصًا وكم مكانًا يوميًا على بعد مشي قصير، ومدى الضغط الذي
      يسببه كل شارع لراكبي الدراجات.
  then_and_now:
    label: الماضي والحاضر
    description: >-
      ما كان قائمًا في مقطع شارع من قبل، وما بقي من الماضي. تُحمَّل الصور الجوية منذ 1959 وأطلس
      1860 من خوادم المدينة فقط عند تشغيلها؛ أما خريطة "الخط الأحمر" (redlining) لعام 1937 فتأتي
      من هذا الموقع.
  safety_context:
    label: حيث الحاجة إلى العناية أكبر
    description: سياق يبيّن أين يُرجَّح أن تنفع التحسينات أكثر.
  boundaries:
    label: الحدود
    description: دوائر المجلس والمنظمات المجتمعية والأحياء.
  basemap:
    label: الخريطة الأساسية
    description: الشوارع والمباني وأسماء الأماكن، تحت كل شيء آخر.

