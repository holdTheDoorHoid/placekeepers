    publisher: مدينة فيلادلفيا، إدارة الحدائق والترفيه

layers:
  vacant_parcels:
    label: قطع الأراضي والمباني الفارغة
    description: >-
      قطع يُرجَّح أنها فارغة، مع بيان مدى تأكدنا ولماذا. تجمع بين مؤشر الفراغ لدى المدينة وسجلات
      مُقدِّر العقارات ومخططات المباني وعمليات الهدم وقضايا L&I وخريطة استخدام الأراضي، حتى لا
      يستطيع مصدر واحد أن يُسقطها.
    settings:
      min_confidence:
        label: أظهر القطع التي نتأكد منها بهذا القدر على الأقل
        options:
          "1":
            label: أي علامة على الفراغ
          "2":
            label: فارغة على الأرجح أو على الأرجح جدًا
          "3":
            label: فارغة على الأرجح جدًا فقط
      kinds:
        label: أظهر
        options:
          both:
            label: قطع الأراضي والمباني
          lots:
            label: قطع الأراضي فقط
          buildings:
            label: المباني فقط
      listed:
        label: مُدرجة كمتاحة لدى جهات الأراضي التابعة للمدينة
        options:
          any:
            label: أي قطعة
          available:
            label: المُدرجة كمتاحة فقط
      lens:
        label: لوّن قطع الأراضي بحسب
        options:
          violence:
            label: عدسة خفض العنف
          heat:
            label: عدسة الحرارة والظل
          placemaking:
            label: عدسة تهيئة الأماكن
  hin_2025:
    label: شبكة الشوارع الأكثر إصابات
    description: >-
      الشوارع التي تقع فيها معظم الوفيات والإصابات الجسيمة المرورية في فيلادلفيا، كما رسمها برنامج
      Vision Zero لدى المدينة في 2025.
  shootings_hex:
    label: إطلاق النار، يُعدّ بحسب المنطقة
    description: >-
      ضحايا إطلاق النار في الفترة الزمنية المختارة، يُعدّون في كل شكل سداسي بعرض شارعين تقريبًا.
      يُعرض لتوجيه العناية إلى حيث تنفع أكثر، وليس لوصف الأماكن بأنها خطرة.
    settings:
      window:
        label: الفترة الزمنية
        options:
          m12:
            label: آخر 12 شهرًا
          m36:
            label: آخر 3 سنوات
  landcare_lots:
    label: قطع تعتني بها PHS LandCare
    description: >-
      قطع أراضٍ فارغة نظّفتها جمعية بنسلفانيا للبستنة (Pennsylvania Horticultural Society)
      وخضّرتها وتواصل جزّ عشبها، عبر LandCare وCommunity LandCare. وهذه هي العناية التي اختبرتها
      تجارب فيلادلفيا.
  gardens:
    label: حدائق مجتمعية
    description: >-
      حدائق ومزارع مجتمعية تدعمها PHS أو Neighborhood Gardens Trust، وحدائق مسجّلة لدى إدارة
      الحدائق والترفيه. يعتني الناس بهذه الأماكن بالفعل، لذلك لا تُعرض أبدًا على أنها فارغة.
  council_districts:
    label: دوائر مجلس المدينة
    description: دوائر مجلس المدينة العشر كما رُسمت في 2024، لتعرف أي مكتب تتصل به.
    settings:
      names:
        label: إظهار الأسماء
  community_organizations:
    label: المنظمات المجتمعية المسجّلة
    description: >-
      مجموعات أحياء مسجّلة لدى المدينة، تسمع عن تغييرات تقسيم المناطق في منطقتها. وكثيرًا ما
      تتداخل مناطقها.
    settings:
      names:
        label: إظهار الأسماء
  neighborhoods:
    label: الأحياء
    description: أسماء الأحياء وحدودها، من خريطة أحياء OpenDataPhilly التي أعدّتها Abaca Labs.
    settings:
      names:
        label: إظهار الأسماء
  segments:
    label: سلامة الشوارع، مقطعًا بعد مقطع
    description: >-
      يُلوَّن كل مقطع شارع بعدسة سلامة الشوارع: هل هو على شبكة الشوارع الأكثر إصابات، وكم شخصًا
      قُتل أو أُصيب إصابة جسيمة فيه أثناء المشي أو ركوب الدراجات في أحدث خمس سنوات من سجلات
      PennDOT، وهل قُتل فيه أحد في آخر سنتين، وهل توجد مدرسة على بعد 400 متر أو أقل. حرّك منزلقات
      العدسة لتغيير المزيج. ويذكر المقطع أيضًا كم عمودًا تُدرجه المدينة على امتداده وكم من
      مصابيحها من نوع LED، ووسائل تهدئة حركة المرور التي تُدرجها المدينة هناك.
    settings:
      min_score:
        label: أظهر المقاطع التي تبلغ درجتها على الأقل
        options:
          "1":
            label: أي درجة فوق الصفر
          "20":
            label: 20 من 100
          "40":
            label: 40 من 100
          "60":
            label: 60 من 100
  crashes:
    label: الحوادث
    description: >-
      حوادث أُبلغ عنها إلى PennDOT في فيلادلفيا من 2015 إلى 2024، ملوّنة بحسب مدى إصابة الناس.
      اختر السنوات ومدى إصابة الناس ومن كان طرفًا. وتصل سجلات PennDOT بعد نحو سنة من وقوع الحوادث،
      لذلك تظهر أحدث الوفيات على شكل نُصُب تذكارية بدلًا من ذلك.
    settings:
      years:
        label: السنوات
        options:
          latest:
            label: أحدث سنة في السجلات
          recent:
            label: أحدث خمس سنوات
          all:
            label: كل سنة منذ 2015
      severity:
        label: مدى إصابة الناس
        options:
          "3":
            label: قُتل شخص
          "2":
            label: قُتل شخص أو أُصيب إصابة جسيمة
          "1":
            label: أُصيب شخص
          "0":
            label: كل حادث
      mode:
        label: من كان طرفًا
        options:
          all:
            label: الجميع
          walk_cycle:
            label: أشخاص يمشون أو يركبون الدراجات
          walk:
            label: أشخاص يمشون
          cycle:
            label: أشخاص يركبون الدراجات
          motorcycle:
            label: أشخاص على دراجات نارية
  memorials:
    label: النُّصُب التذكارية
    description: >-
      أشخاص قُتلوا في شوارعنا أثناء المشي أو ركوب الدراجة أو السكوتر، من سجلات إدارة الشرطة لوفيات
      الحوادث المرورية منذ 2019، يُعلَّم كل منهم بهدوء حيث وقع الحادث. لا يظهر اسم إلا حين تشاركه
      قائمة تأبين عامة بالفعل، ويستطيع أي شخص أن يطلب إزالة اسم أو علامة.
    settings:
      show_names:
        label: إظهار الأسماء
      all_fatal:
        label: تذكّر أيضًا من قُتلوا في السيارات وعلى الدراجات النارية
  parking_reports:
    label: مشكلات وقوف بُلّغ عنها (Laser Vision)
    description: >-
      أين أبلغ أشخاص يستخدمون تطبيق Laser Vision من Philly Bike Action عن مركبات تسد الأرصفة
      ومعابر المشاة والزوايا ومنحدرات الأرصفة ومسارات الدراجات خلال 12 شهرًا حتى التاريخ المذكور
      في مفتاح الخريطة، تُعدّ في كل منطقة بحجم مقطع شارع تقريبًا. وهي تُظهر أين أبلغ أشخاص
      يستخدمون تطبيقًا واحدًا عن مشكلات، وليست كل مشكلة. وتُستبعد المنطقة التي فيها أقل من 5
      بلاغات، حتى لا يظهر أي بلاغ منفرد أبدًا. وكثرة البلاغات في موضع واحد دليل على حلول مادية:
      توسيعات الأرصفة عند الزوايا، والأعمدة الواقية (bollards)، وإخلاء الزوايا من المركبات لتتحسن
      الرؤية، ومسارات الدراجات المحمية، ومناطق التحميل.
    settings:
      kind:
        label: أظهر بلاغات المركبات
        options:
          all:
            label: التي تسد الطريق بأي من هذه الطرق
          sidewalk:
            label: على رصيف
          bike_lane:
            label: في مسار دراجات
          crosswalk:
            label: على معبر مشاة
          corner:
            label: على زاوية
          ramp:
            label: التي تسد منحدر رصيف
  street_poles:
    label: أعمدة الشوارع والمصابيح التي تُدرجها المدينة
    description: >-
      كل عمود شارع تُدرجه إدارة الشوارع، مع المصابيح التي تُدرجها عليه: LED، أو من نوع الصوديوم
      عالي الضغط الأقدم، أو مصباح من نوع لا تحدده. وكثير من الأعمدة، مثل أعمدة PECO وأعمدة إشارات
      المرور، لا تُدرج مصباحًا. هذا ما ركّبته المدينة، وليس ما إذا كان المصباح يعمل الليلة: بلّغ
      Philly311 عن أي ضوء مطفأ مع رقم العمود. يُعرض من قريب، على بُعد بضعة مقاطع شوارع.
    settings:
      show:
        label: أظهر
        options:
          all:
            label: كل عمود
          lamps:
            label: الأعمدة التي عليها مصباح تُدرجه المدينة
          not_led:
            label: المصابيح التي لا تُدرجها المدينة على أنها LED
  traffic_calming:
    label: تهدئة حركة المرور التي تُدرجها المدينة
    description: >-
      وسائد السرعة والمطبّات والمصاطب التي وضعتها إدارة الشوارع لإبطاء السائقين في الشوارع
      السكنية، مع اليوم الذي رُكّب فيه كل منها. يستطيع الجيران أن يطلبوها من المدينة في شارع سكني؛
      أما الشوارع الشريانية وطرق الولاية فلا تنطبق عليها. ويذكر مقطع الشارع كم منها فيه ومنذ متى،
      ويقول مقطع على شبكة الشوارع الأكثر إصابات أُصيب فيه ناس متى لا يوجد شيء مسجّل بعد.
  crossing_guards:
    label: نقاط حرّاس العبور المدرسيين
    description: >-
      الزوايا التي تضع فيها المدينة حارس عبور مدرسيًا، وهو خدمة سلامة تساعد الأطفال وغيرهم على
      عبور الشارع قرب المدارس في بداية اليوم الدراسي ونهايته. تذكر كل نقطة زاويتها وأقرب مدرسة على
      بعد 400 متر أو أقل.
  basemap:
    label: الخريطة الأساسية
    description: >-
      الشوارع والمباني والحدائق والمياه وأسماء الأماكن من OpenStreetMap، تحت كل شيء آخر. اختر
      المظهر الرمادي لتبرز البيانات، أو أوقف الخريطة الأساسية.
    settings:
      look:
        label: المظهر
        options:
          light:
            label: فاتح، بالألوان
          muted:
            label: رمادي، لتبرز البيانات
  transit_stops:
    label: مواقف الحافلات والترام
    description: >-
      كل موقف حافلة وترام من مواقف SEPTA في فيلادلفيا، من جداول SEPTA الحالية: الخطوط التي تقف
      هناك، وعدد مرات مجيء حافلة أو ترام في يوم أسبوع عادي ويوم السبت ويوم الأحد، ومتى تبدأ الخدمة
      وتنتهي، وكم شخصًا يصعد هناك في يوم أسبوع عادي، من أعداد SEPTA نفسها. ويُظهر كل موقف ما يجده
      الركاب هناك حيث تعرفه OpenStreetMap، ومظلة حيث تذكر قائمة المدينة مظلة، وأولويته بحسب عدسة
      راحة النقل العام، وما يمكن للجيران فعله بشأنه. ويمكن إضافة محطات مترو الأنفاق وEl وRegional
      Rail من الإعدادات.
    settings:
      service:
        label: أظهر المواقف التي فيها
        options:
          all:
            label: أي خدمة
          frequent:
            label: "خدمة متكررة: كل 15 دقيقة أو أقل في منتصف النهار"
          long_wait:
            label: "انتظار طويل: أقل من مرة كل 30 دقيقة في منتصف النهار"
      color:
        label: لوّن المواقف بحسب
        options:
          lens:
            label: الأولوية بحسب عدسة راحة النقل العام
          wait:
            label: كم مرة تأتي حافلة أو قطار في منتصف النهار
          boardings:
            label: كم شخصًا يصعد في كل يوم أسبوع
      stations:
        label: أظهر أيضًا محطات مترو الأنفاق وEl وRegional Rail
  transit_routes:
    label: خطوط الحافلات والترام والقطارات
    description: >-
      الشوارع والمسارات التي يسلكها كل خط من خطوط SEPTA في فيلادلفيا، من جداول SEPTA الحالية،
      ملوّنة بحسب نوع المركبة. اختر الخطوط المتكررة لترى أين تأتي حافلة أو قطار كل 15 دقيقة على
      الأقل في منتصف النهار.
    settings:
      service:
        label: أظهر الخطوط
        options:
          all:
            label: كل خط
          frequent:
            label: "الخطوط المتكررة: كل 15 دقيقة أو أقل في منتصف النهار"
  stop_amenities:
    label: مظلات ومقاعد في المواقف
    description: >-
      ما يجده الركاب في مواقف الحافلات والترام التي تعرفها OpenStreetMap: مظلة أو سقف، أو مقعد دون
      مظلة، أو لا هذا ولا ذاك، أو لم يُمسح بعد. لم يُمسح بعد يعني أن أحدًا لم يسجّله حتى الآن؛ ولا
      يعني أن الموقف خالٍ من أي شيء. وليس في OpenStreetMap حتى الآن إلا نحو موقف واحد من كل عشرة
      (قائمة SEPTA الكاملة بالمواقف طبقة مستقلة). ويستطيع الجيران مسح المواقف بتطبيق
      StreetComplete على الهاتف، وتظهر إجاباتهم هنا خلال نحو أسبوع.
    settings:
      show:
        label: أظهر
        options:
          all:
            label: كل موقف
          surveyed:
            label: المواقف التي مسحها أحدهم
          unsurveyed:
            label: المواقف التي لم تُمسح بعد
  city_shelters:
    label: مظلات الحافلات التي تُدرجها المدينة
    description: >-
      مظلات الحافلات الواردة في قائمة المدينة نفسها، التي تقيمها وتصونها مع شريكها الإعلاني، مع
      موقف SEPTA الذي تخدمه كل منها. الموقف الذي فيه مظلة من المدينة يُحتسب مظلَّلًا في عدسة راحة
      النقل العام. وحيث تقول OpenStreetMap إن الموقف بلا مظلة بينما تُدرج المدينة واحدة، تقول صفحة
      الموقف إن المصدرين يختلفان، ويحسم المسح الأمر. وآخر تغيير للقائمة كان في يناير 2025، لذلك قد
      تغيب مظلة أُقيمت أو أُزيلت بعد ذلك.
  heat_tracts:
    label: قابلية التأثر بالحرارة بحسب الحي
    description: >-
      مدى تأثير حرّ الصيف في الناس في كل منطقة تعداد، من مؤشر المدينة لقابلية التأثر بالحرارة
      (Heat Vulnerability Index، إدارة الصحة العامة ومكتب الاستدامة، بيانات 2017 إلى 2019). يجمع
      بين التعرّض للحرارة، أي مدى سخونة المنطقة في أيام الصيف كما تقيسها الأقمار الصناعية،
      والحساسية للحرارة، أي كم من الناس الذين يعيشون هناك أكثر عرضة للخطر في الحر (اثنا عشر
      مقياسًا للعمر والصحة والدخل والتعليم واللغة والعِرق، كما بنت المدينة المؤشر). تُظلَّل
      المناطق بحسب أخماس المدينة، وأغمق الأخماس هو الأكثر عرضة للخطر. ويمكن عرض التعرّض والحساسية
      كلًّا على حدة من الإعدادات.
    settings:
      measure:
        label: ظلّل المناطق بحسب
        options:
          vulnerability:
            label: "قابلية التأثر بالحرارة: الحرارة والأشخاص المعرّضون للخطر معًا"
          exposure:
            label: "التعرّض للحرارة: مدى السخونة"
          sensitivity:
            label: "الحساسية للحرارة: كم من الناس معرّضون للخطر في الحر"
      priority:
        label: ارسم إطارًا للمناطق التي تصنفها المدينة بدرجة عالية جدًا
  city_trees:
    label: أشجار الشوارع والحدائق
    description: >-
      كل شجرة في قائمة أشجار إدارة الحدائق والترفيه (2025): الأشجار التي تعتني بها المدينة على
      أرصفتها وفي حدائقها، وليس الأشجار في الأفنية الخاصة، مع نوع كل شجرة وحجم جذعها. تُعرض من
      قريب، على بُعد بضعة مقاطع شوارع. والأشجار الصغيرة، التي يقل عرض جذعها عن 4 بوصات، كثيرًا ما
      تكون فتية، وتطلب TreePhilly أن تُسقى الأشجار الفتية بنحو 20 غالونًا من الماء في الأسبوع من
      مارس إلى ديسمبر.
    settings:
      show:
        label: أظهر
        options:
          all:
            label: كل شجرة
          big:
            label: "أشجار الظل الكبيرة: جذع عرضه 12 بوصة على الأقل"
          small:
            label: "أشجار صغيرة: جذع عرضه أقل من 4 بوصات، وغالبًا فتية"
  floodplain:
    label: سهل الفيضان
    description: >-
      أين تتوقع خرائط FEMA للفيضانات حدوث فيضان، كما تنشرها المدينة (2023): سهل الفيضان باحتمال
      سنوي 1 في المئة، حيث يبلغ احتمال حدوث فيضان 1 من 100 على الأقل كل عام، ومنطقة الاحتمال
      السنوي 0.2 في المئة بجانبه (يُطلق عليهما كثيرًا سهلا فيضان 100 سنة و500 سنة). وأي بناء هناك
      يجب أن يتبع قواعد المدينة لسهول الفيضان. والتخضير الذي يمتص ماء المطر مفيد هناك، بنباتات
      تتحمل الأرض المبتلة.
    settings:
      zones:
        label: أظهر
        options:
          both:
            label: منطقتا الاحتمال السنوي 1 في المئة و0.2 في المئة
          high:
            label: سهل الفيضان باحتمال سنوي 1 في المئة فقط
  benches:
    label: مقاعد، كما هي مسجّلة في OpenStreetMap
    description: >-
      أماكن للجلوس: المقاعد التي أضافها الناس إلى OpenStreetMap، الخريطة المجانية التي يستطيع أي
      شخص تحسينها، مع بيان ما إذا كان لكل منها مسند ظهر حيث تذكر الخريطة ذلك. وتنقص OpenStreetMap
      مقاعد كثيرة، لذلك قد يكون في شارع لا يظهر فيه شيء بعضها. ويستطيع أي شخص إضافة مقعد بتطبيق
      StreetComplete على الهاتف، فيظهر هنا خلال نحو أسبوع.
  picnic_tables:
    label: طاولات نزهة، كما هي مسجّلة في OpenStreetMap
    description: >-
      طاولات نزهة أضافها الناس إلى OpenStreetMap، أغلبها في الحدائق، مع بيان ما إذا كانت كل منها
      تحت سقف حيث تذكر الخريطة ذلك. وتنقص OpenStreetMap منها الكثير. ويستطيع أي شخص إضافة واحدة
      بتطبيق StreetComplete على الهاتف، فتظهر هنا خلال نحو أسبوع.
  drinking_water:
    label: ماء الشرب، كما هو مسجّل في OpenStreetMap
    description: >-
      نوافير شرب وصنابير ماء أضافها الناس إلى OpenStreetMap، مع بيان ما إذا كان يمكن ملء زجاجة حيث
      تذكر الخريطة ذلك. لا تعرف OpenStreetMap في المدينة إلا بضع عشرات، لذلك فنوافير الشرب التي
      تُدرجها إدارة الحدائق والترفيه طبقة مستقلة. ويستطيع أي شخص إضافة نافورة بتطبيق
      StreetComplete على الهاتف، فتظهر هنا خلال نحو أسبوع.
  toilets:
    label: مراحيض عامة، كما هي مسجّلة في OpenStreetMap
    description: >-
      مراحيض أضافها الناس إلى OpenStreetMap، مع من يجوز له استخدامها، وهل هناك رسوم، وإمكانية
      الوصول بكرسي متحرك حيث تذكر الخريطة ذلك. تُستبعد المراحيض المغلقة أمام العامة. وتعرف
      OpenStreetMap أقل من مئة منها في المدينة. ويستطيع أي شخص إضافة واحد بتطبيق StreetComplete
      على الهاتف، فيظهر هنا خلال نحو أسبوع.
  bookcases:
    label: مكتبات صغيرة مجانية، كما هي مسجّلة في OpenStreetMap
    description: >-
      خزائن كتب عامة، تُسمى كثيرًا مكتبات صغيرة مجانية (little free libraries)، يستطيع أي شخص فيها
      أن يأخذ كتابًا أو يترك كتابًا، كما أضافها الناس إلى OpenStreetMap. وتنقص منها الكثير.
      ويستطيع أي شخص إضافة واحدة بتطبيق StreetComplete على الهاتف، فتظهر هنا خلال نحو أسبوع.
  park_water:
    label: نوافير الشرب في الحدائق
    description: >-
      نوافير شرب ومحطات لملء الزجاجات في الحدائق والمراكز الترفيهية، كما تُدرجها إدارة الحدائق
      والترفيه في فيلادلفيا. وما كان داخل مركز ترفيهي يمكن استخدامه حين يكون المركز مفتوحًا.
  libraries:
    label: فروع Free Library
    description: >-
      كل موقع من مواقع Free Library of Philadelphia تُدرجه المدينة، مع عنوانه ورقم هاتفه ورابط إلى
      صفحته لمعرفة ساعات العمل. المكتبات مجانية ومفتوحة للجميع.
  recreation_centers:
    label: المراكز الترفيهية
    description: >-
      أين تدير إدارة الحدائق والترفيه في فيلادلفيا برامجها: المراكز الترفيهية ومراكز كبار السن
      ومراكز التثقيف البيئي، مع بيان ما إذا كان في كل منها صالة رياضية، كما تُدرجها المدينة.
  pools:
    label: المسابح ومناطق الألعاب المائية
    description: >-
      مسابح المدينة ومناطق الألعاب المائية ورشاشات المياه، أماكن للتبرد في الأيام الحارة، مع بيان
      ما إذا كان كل منها في الخدمة هذا العام كما تُدرجه إدارة الحدائق والترفيه في فيلادلفيا. تفتح
      المسابح في موسم الصيف فقط؛ اسأل إدارة الحدائق والترفيه عن ساعات هذا الأسبوع.
    settings:
      show:
        label: أظهر
        options:
          in_service:
            label: ما هو في الخدمة هذا العام فقط
          all:
            label: كلها، حتى ما هو خارج الخدمة
  cooling_centers:
    label: مراكز التبريد والتدفئة
    description: >-
      أماكن يُدرجها مكتب إدارة الطوارئ لدى المدينة على أنها مواقع للتدفئة أو التبريد: مكتبات
      ومراكز ترفيهية وشركاء مجتمعيون ومراكز مجتمعية تابعة لهيئة الإسكان في فيلادلفيا، مع بيان ما
      إذا كان كل منها مُدرجًا على أنه مفتوح، وساعاته وما يقدمه، كما هو مُدرج في اليوم الذي نسخت
      فيه هذه الخريطة القائمة آخر مرة. ليست مباشرة: تفتح المواقع وتغلق بحسب الطقس، فاتصل بالموقع
      أو بخدمة Philly311 قبل أن تذهب. والمكتبة أو المركز الترفيهي الذي هو أيضًا موقع يظهر مرة
      واحدة.
    settings:
      kind:
        label: مواقع من أجل
        options:
          any:
            label: الحر أو البرد
          cooling:
            label: التبريد في الطقس الحار
          warming:
            label: التدفئة في الطقس البارد
      show:
        label: أظهر
        options:
          all:
            label: كلها، مفتوحة أو مغلقة كما هو مُدرج
          open:
            label: المُدرجة على أنها مفتوحة فقط
  dumping:
    label: إلقاء النفايات بصورة غير قانونية المُبلَّغ عنه إلى 311
    description: >-
      مقاطع سأل فيها أحد Philly311 عن إلقاء نفايات بصورة غير قانونية في آخر 90 يومًا، مع عدد
      الطلبات وهل ما زال أي منها مفتوحًا. تُعدّ بحسب المقطع، وليس بحسب العنوان، ولا يظهر شيء عمّن
      بلّغ. يدل الطلب على أن أحدًا لاحظ وطلب المساعدة؛ وبعض المقاطع تطلب أكثر من غيرها، لذلك فقلة
      الطلبات لا تعني مقطعًا نظيفًا.
    settings:
      show:
        label: أظهر المقاطع التي فيها
        options:
          any:
            label: أي طلب في آخر 90 يومًا
          open:
            label: طلب ما زال مفتوحًا
  dark_lights:
    label: أضواء الشوارع والأزقة المُبلَّغ عن إطفائها
    description: >-
      مقاطع سأل فيها أحد Philly311 إصلاح ضوء شارع أو ضوء زقاق مطفأ في آخر 90 يومًا، مع عدد الطلبات
      وهل ما زال أي منها مفتوحًا، بجانب الأعمدة والمصابيح التي تُدرجها المدينة على امتداد المقطع.
      تُعدّ بحسب المقطع، وليس بحسب العنوان، ولا يظهر شيء عمّن بلّغ.
    settings:
      show:
        label: أظهر المقاطع التي فيها
        options:
          any:
            label: أي طلب في آخر 90 يومًا
          open:
            label: طلب ما زال مفتوحًا
  graffiti:
    label: كتابات الجدران المُبلَّغ عنها إلى 311
    description: >-
      مقاطع سأل فيها أحد Philly311 إزالة كتابات على الجدران في آخر 90 يومًا، مع عدد الطلبات وهل ما
      زال أي منها مفتوحًا. تُعدّ بحسب المقطع، وليس بحسب العنوان، ولا يظهر شيء عمّن بلّغ.
    settings:
      show:
        label: أظهر المقاطع التي فيها
        options:
          any:
            label: أي طلب في آخر 90 يومًا
          open:
            label: طلب ما زال مفتوحًا
  public_art:
    label: الفن العام
    description: >-
      جداريات ومنحوتات وتماثيل وفسيفساء وفنون عامة أخرى، من قائمة المدينة Percent for Art
      وOpenStreetMap وWikidata. وحين يُدرج اثنان أو ثلاثة منها العمل نفسه، تعرضه الخريطة مرة واحدة
      وتربطه بكل منها. والأعمال الفنية التي تُخلّد ذكرى شخص تُعرض على أنها أعمال تذكارية فقط، بلا
      أسماء. وتحتفظ Mural Arts Philadelphia بأكبر قائمة لجداريات المدينة على موقعها؛ ولا تسمح
      شروطها بنسخها، لذلك تربط الخريطة بها بدلًا من ذلك. وإن كان عمل ناقصًا، فأضفه إلى
      OpenStreetMap فيظهر هنا خلال نحو أسبوع.
    settings:
      murals:
        label: جداريات ورسوم على الجدران
      sculptures:
        label: منحوتات وتماثيل
      mosaics:
        label: فسيفساء
      other:
        label: أنواع أخرى من الفن
      inside:
        label: أعمال داخل المباني
  playgrounds:
    label: ملاعب الأطفال
    description: >-
      ملاعب الأطفال التي تُدرجها إدارة الحدائق والترفيه في فيلادلفيا، مع الأعمار التي صُمم لها كل
      منها وسنة تركيبه حين تذكرها المدينة. وكثيرًا ما يكون في الحديقة ملعبان، أحدهما للأطفال
      الأصغر والآخر للأكبر. وتذكر صفحة القطعة أقرب ملعب ومدى بُعده في خط مستقيم.
  walkability:
    label: مدى صلاحية كل منطقة للمشي (EPA)
    description: >-
      المؤشر الوطني لصلاحية المشي لدى وكالة حماية البيئة الأمريكية لكل مجموعة كتل تعداد، وهي منطقة
      من بضعة مقاطع شوارع، من قاعدة بياناتها الذكية للمواقع (Smart Location Database، 2021، من
      بيانات نحو 2017 إلى 2019). يعطي درجة من 1 إلى 20 لمدى دعم المنطقة للمشي، من أربعة مقاييس: كم
      زاوية شارع فيها، ومدى قرب أقرب موقف نقل عام، ومقياسان لمدى تنوع المنازل والوظائف والمتاجر.
      وتُظلَّل المناطق بحسب أخماس مجموعات كتل فيلادلفيا، أو بحسب فئات EPA نفسها التي تقارن البلد
      كله. ويمكن عرض كل مقياس على حدة من الإعدادات. وقد قُصّت مجموعات الكتل لتناسب أرض المدينة،
      فتبقى الأنهار فارغة.
    settings:
      measure:
        label: ظلّل المناطق بحسب
        options:
          index:
            label: "مؤشر صلاحية المشي: المقاييس الأربعة معًا"
          corners:
            label: "زوايا الشوارع: مدى ترابط الشوارع"
          transit:
            label: "النقل العام: مدى قرب أقرب موقف"
          mix:
            label: تنوع المنازل والوظائف والمتاجر
      compare:
        label: قارن مع
        options:
          city:
            label: "فيلادلفيا: أخماس مجموعات كتل المدينة"
          nation:
            label: "البلد كله: فئات EPA نفسها"
  walking_distance:
    label: السكان والأماكن على مسافة مشي
    description: >-
      لكل شكل سداسي بعرض شارعين تقريبًا: كم شخصًا يعيش على بعد مشي 5 دقائق من منتصفه، من تعداد
      2020؛ أو كم نوعًا من سبعة أنواع من الأماكن اليومية على بعد مشي 10 دقائق (مكتبة، ومركز
      ترفيهي، ومسبح أو منطقة ألعاب مائية، ونافورة شرب في حديقة، ومدرسة، ومتجر بقالة أو سوق يقبل
      SNAP، وموقف حافلة أو ترام أو قطار)؛ أو كم زاوية شارع على بعد مشي 5 دقائق. يُحسب مشي 5 دقائق
      على أنه 400 متر ومشي 10 دقائق على أنه 800 متر في خط مستقيم، وهذا يصل أبعد قليلًا من المشي
      على الشوارع ويعبر خطوط السكك الحديدية والطرق السريعة والأنهار التي لا يستطيع من يمشي على
      قدميه عبورها.
    settings:
      measure:
        label: ظلّل الأشكال السداسية بحسب
        options:
          people:
            label: السكان الذين يعيشون على بعد مشي 5 دقائق
          places:
            label: أنواع الأماكن اليومية على بعد مشي 10 دقائق
          corners:
            label: زوايا الشوارع على بعد مشي 5 دقائق
  traffic_stress:
    label: ضغط حركة المرور على راكبي الدراجات (DVRPC)
    description: >-
      مدى الضغط الذي يسببه كل شارع لمن يركب دراجة فيه، كما تقيّمه لجنة التخطيط الإقليمي لوادي
      ديلاوير من عدد المسارات وسرعة المرور ونوع مسار الدراجات، إن وُجد: المستوى 1 يناسب معظم الناس
      من كل الأعمار، والمستوى 2 معظم البالغين، والمستوى 3 الراكبين الواثقين فقط، والمستوى 4 أجرأ
      الراكبين فقط. وحيث يختلف اتجاها الشارع، يُعرض الأكثر ضغطًا. وتأتي التقييمات من نماذج DVRPC
      وحدود السرعة المعلنة، وليس من ركوب الدراجة في كل شارع.
    settings:
      show:
        label: أظهر
        options:
          all:
            label: كل شارع تقيّمه DVRPC
          stressful:
            label: "الشوارع المجهدة فقط: المستويان 3 و4"
          calm:
            label: "الشوارع الهادئة فقط: المستويان 1 و2"
  displacement_watch:
    label: "رصد التهجير السكني: مؤشرات على أن الأسعار ترتفع"
    description: >-
      مناطق (مناطق تعداد) فيها مؤشران على الأقل من هذه المؤشرات، أحدهما على الأقل عن الأسعار نفسها
      (الثلاثة الأولى): منازل تُباع بأكثر بكثير مما قبل خمس سنوات، بوتيرة أسرع من المدينة ككل؛
      وقيم المدينة المقدّرة ترتفع أسرع بكثير من قيم المدينة ككل؛ وتحليل قيمة السوق لدى المدينة
      (Market Value Analysis) يجد أن الأسعار ترتفع فوق قدرة السكان المقيمين منذ زمن طويل؛ وشركات
      تشتري كثيرًا من المنازل المباعة؛ وثلاثة من كل خمسة منازل على الأقل مؤجَّرة؛ أو كثير من
      المستأجرين يدفعون نصف دخلهم أو أكثر على الإيجار (أضافه المالك في 9 أكتوبر 2026). وقد يرفع
      التخضير وغيره من التحسينات الأسعار أكثر، لذلك حين يقع اقتراح لتخضير قطعة أرض أو غرس أشجار أو
      تهيئة مكان للجلوس أو بدء حديقة أو طلب فن، أو قطعة تُدرجها المدينة على أنها متاحة، في إحدى
      هذه المناطق، تضيف بطاقته طرقًا لحماية الجيران. وهذا يعرض مؤشرات في السجلات العامة، وليس
      توقعًا، ولا يقول شيئًا عمن يسكن هنا. اضغط على منطقة لترى مؤشراتها وما قِيس لكل منها، وكسياق،
      الإيجار الوسيط ودخل الأسرة الوسيط وكم منزلًا فارغًا، من مسح مكتب الإحصاء الأمريكي؛ وكل رقم
      من المسح يأتي مع هامش الخطأ فيه.
    settings:
      shade:
        label: ظلّل المناطق (إيقافه يعرض حدودها فقط)
  historic_districts:
    label: الأحياء التاريخية
    description: >-
      الأحياء التاريخية المحلية لدى لجنة فيلادلفيا للآثار التاريخية. قد تحتاج التغييرات في المباني
      وقطع الأراضي في الحي إلى مراجعة اللجنة، حتى الجدارية أو السور أو الحديقة: اسأل اللجنة أولًا
      (215 686 7660). وتطلب المدينة من الجميع تأكيد الوضع التاريخي للعقار مع اللجنة. اضغط على حي
      لترى اسمه واليوم الذي صُنّف فيه.
  historic_properties:
    label: عقارات في السجل التاريخي
    description: >-
      عقارات في سجل فيلادلفيا للأماكن التاريخية، كل منها قطعة مستقلة، مُدرجة وحدها أو كجزء من حي
      تاريخي (تُعرض من قريب). قد تحتاج التغييرات هنا إلى مراجعة لجنة الآثار التاريخية: اسألها
      أولًا (215 686 7660).
  zoning_overlays:
    label: النطاقات الإضافية لتقسيم المناطق
    description: >-
      مناطق يضيف فيها قانون تقسيم المناطق قواعده الخاصة فوق التقسيم الأساسي: حماية الأحياء،
      والشوارع التجارية، وحماية من الفيضان والمنحدرات الشديدة، وحدود على التبليط قرب Wissahickon،
      وارتفاعات قرب المطار، واللافتات وغيرها. كثير منها متداخل، وبعضها يغطي معظم المدينة. اضغط على
      موضع لترى كل نطاق عنده، مع مادته في قانون تقسيم المناطق. وقد تغيّر النطاقات ما هو مسموح؛
      فتحقق من المدينة قبل أن تخطط.
    settings:
      show:
        label: أظهر
        options:
          all:
            label: نطاقات التقسيم الإضافية والقواعد الخاصة الأخرى
          districts:
            label: نطاقات التقسيم الإضافية فقط
  hearings:
    label: جلسات الاستماع القادمة
    description: >-
      جلسات استماع محددة أمام مجلس تعديلات تقسيم المناطق ومجلس مراجعة L&I ومجلس معايير البناء
      ومجالس المدينة الأخرى بشأن عقار، من سجلات الطعون لدى المدينة، مع اليوم والوقت ونوع الطعن.
      يستطيع أي شخص المشاركة في جلسة استماع بشأن تقسيم المناطق؛ اضغط على واحدة لترى كيف، ولتفتح
      صفحة القطعة. ومن قدّم الطعن لا يظهر إلا في صفحة تلك القطعة، ولا يظهر أبدًا على الخريطة.
    settings:
      boards:
        label: أظهر
        options:
          all:
            label: كل مجلس
          zoning:
            label: مجلس تعديلات تقسيم المناطق فقط
  brownfields:
    label: مواقع البراونفيلد (EPA)
    description: >-
      عقارات دفعت منحة براونفيلد فيدرالية ثمن تقييم أو أعمال تنظيف فيها، من سجلات EPA. وليست خريطة
      لكل الأراضي الملوّثة، ولا تقول ما إذا كان الموقع ملوّثًا اليوم. افحص التربة قبل زراعة الغذاء
      في أحدها أو بالقرب منه.
  aerial_photos:
    label: صور جوية بحسب السنة
    description: >-
      صور جوية للمدينة كلها، التُقطت من طائرة: صور المدينة نفسها عن كل سنة لديها منذ 1996 (كل
      ربيع، في معظم السنوات من مارس إلى مايو)، وصور أقدم تستضيفها المدينة، من لجنة التخطيط
      الإقليمي لوادي ديلاوير (1959 و1975) وهيئة المسح الجيولوجي الأمريكية (1999). مرّر بين السنوات
      لترى ما كان قائمًا في مقطع شارع من قبل: منازل هُدمت، وقطع أراضٍ أُزيلت منها الأنقاض، وحدائق
      نمت. تأتي الصور مباشرة من خوادم المدينة حين تكون هذه الطبقة مشغّلة، وتُرسم تحت كل شيء آخر
      على الخريطة. والسنوات الأقدم أقل وضوحًا، والصور حتى 2000 بالأبيض والأسود.
