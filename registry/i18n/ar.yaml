  atlas_1860:
    label: أطلس 1860 (Hexamer وLocher)
    description: >-
      أطلس Hexamer وLocher لفيلادلفيا لعام 1860، مرسوم مقطعًا بعد مقطع بمبانيه وقطعه، ومضبوط على
      خريطة اليوم بواسطة Greater Philadelphia GeoHistory Network ومستضاف لدى المدينة. ويغطي Center
      City وNorthern Liberties فقط. خفّض قوته لترى شوارع اليوم من خلاله. ويأتي مباشرة من خوادم
      المدينة حين تكون هذه الطبقة مشغّلة.
    settings:
      opacity:
        label: مدى ظهور الأطلس، بالنسبة المئوية
  redlining_1937:
    label: "خريطة \"الخط الأحمر\" لعام 1937 (تصنيفات HOLC)"
    description: >-
      في عام 1937 صنّفت جهة اتحادية، هي Home Owners' Loan Corporation (HOLC)، أحياء فيلادلفيا من A
      إلى D بحسب ما رأته من أمان الإقراض العقاري فيها. واعتمدت التصنيفات على من يسكن كل منطقة:
      فالمناطق التي تسكنها عائلات سوداء وعائلات مهاجرة كثيرة صُنّفت عادة D وأُحيطت بخط أحمر، ومن
      هنا جاءت كلمة redlining. تعرض هذه الطبقة مناطق 1937 وتصنيفاتها كما رسمها Mapping Inequality.
      والتصنيفات سجلّ لكيفية حكم الجهة على الأماكن في 1937؛ ولا تقول شيئًا عن الناس الذين يسكنون
      هناك اليوم. اضغط على منطقة لتعرف تصنيفها وتجد رابطًا لوصفها في 1937 لدى Mapping Inequality.
      للاستخدام غير التجاري فقط.
    settings:
      shade:
        label: ظلّل المناطق (إيقافه يعرض حدودها وتصنيفاتها فقط)

options:
  live_city_data:
    label: جلب بيانات المدينة الحية
    description: >-
      حين تفتح صفحة قطعة أو تبحث عن عنوان، يطلب متصفحك أحدث السجلات من الخوادم العامة لمدينة
      فيلادلفيا: المالك والمبيعات والتقييمات والتفتيشات والطعون. تذهب هذه الطلبات مباشرة من جهازك
      إلى المدينة، ولا تمر أبدًا عبر Placekeepers، وترى خوادم المدينة هذه الطلبات كما سترى زيارة
      لموقع العقارات الخاص بالمدينة. وتأتي الصور الجوية للمدينة وأطلس 1860، تحت "الماضي والحاضر"،
      مباشرة من خوادم المدينة أيضًا، لكن فقط بعد أن تشغّل إحداهما. أوقف هذا الخيار لتستخدم فقط
      النسخة الأسبوعية من البيانات التي ينشرها Placekeepers. ويلزم تشغيله للبحث عن العناوين، ولفتح
      قطعة ليست في قائمتنا، وللصور القديمة والأطلس.
