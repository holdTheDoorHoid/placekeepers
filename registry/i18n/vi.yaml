  atlas_1860:
    label: "Bản đồ atlas năm 1860 (Hexamer và Locher)"
    description: "Bản đồ atlas Philadelphia năm 1860 của Hexamer và Locher, vẽ từng dãy phố cùng các tòa nhà và lô đất, được Greater Philadelphia GeoHistory Network ghép khớp với bản đồ ngày nay và do Thành phố lưu trữ. Nó chỉ bao phủ Center City và Northern Liberties. Hãy giảm độ đậm của nó để nhìn thấy các đường phố ngày nay xuyên qua nó. Nó đến thẳng từ máy chủ của Thành phố khi lớp này được bật."
    settings:
      opacity:
        label: "Độ đậm của bản đồ atlas, theo phần trăm"
  redlining_1937:
    label: "Bản đồ redlining năm 1937 (các xếp loại HOLC)"
    description: "Năm 1937, một cơ quan liên bang, Home Owners' Loan Corporation (HOLC), xếp loại các khu dân cư của Philadelphia từ A đến D theo mức an toàn mà họ cho là có khi cho vay mua nhà ở đó. Các xếp loại này dựa vào việc ai sống trong mỗi khu: các khu có các gia đình người Da đen và nhiều gia đình nhập cư sinh sống thường bị xếp loại D và khoanh viền đỏ, đó là nguồn gốc của từ redlining. Lớp này hiện các khu và xếp loại năm 1937 như Mapping Inequality đã vẽ lại. Các xếp loại là bản ghi về cách cơ quan đó đánh giá các nơi vào năm 1937; chúng không nói gì về những người đang sống ở đó ngày nay. Hãy chạm vào một khu để xem xếp loại của nó và liên kết đến bản mô tả năm 1937 tại Mapping Inequality. Chỉ dùng phi thương mại."
    settings:
      shade:
        label: "Tô đậm nhạt các khu (tắt thì chỉ hiện đường viền và xếp loại)"

