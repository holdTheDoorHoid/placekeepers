  atlas_1860:
    label: "Atlas de 1860 (Hexamer y Locher)"
    description: "El atlas de Filadelfia de 1860 de Hexamer y Locher, dibujado cuadra por cuadra con sus edificios y lotes, ajustado al mapa de hoy por la Greater Philadelphia GeoHistory Network y alojado por la Ciudad. Cubre solo Center City y Northern Liberties. Baje su intensidad para ver a través de él las calles de hoy. Viene directo de los servidores de la Ciudad cuando esta capa está activada."
    settings:
      opacity:
        label: "Qué tan fuerte se ve el atlas, en porcentaje"
  redlining_1937:
    label: "Mapa de redlining de 1937 (calificaciones de la HOLC)"
    description: "En 1937 una agencia federal, la Home Owners' Loan Corporation (HOLC), calificó los vecindarios de Filadelfia de la A a la D según qué tan seguro juzgaba que era prestar dinero para hipotecas allí. Las calificaciones dependían de quién vivía en cada área: las áreas donde vivían familias negras y muchas familias inmigrantes casi siempre recibían una D y se delineaban en rojo, de donde viene la palabra redlining. Esta capa muestra las áreas y calificaciones de 1937 tal como las trazó Mapping Inequality. Las calificaciones son un registro de cómo la agencia juzgó los lugares en 1937; no dicen nada sobre las personas que viven allí hoy. Toque un área para ver su calificación y un enlace a su descripción de 1937 en Mapping Inequality. Solo para uso no comercial."
    settings:
      shade:
        label: "Sombrear las áreas (apagado muestra solo sus contornos y calificaciones)"


lenses:
  violence:
    label: "Reducción de la violencia"
    description: "Dónde limpiar, reverdecer o sellar probablemente reduciría más la violencia con armas de fuego en los alrededores, según ensayos aleatorizados en Filadelfia."
    factors:
      untreated_vacancy:
        label: "Lote vacío o edificio abandonado abierto, sin atender"
        explain: "Ensayos aleatorizados en Filadelfia encontraron que reverdecer lotes vacíos y poner puertas y ventanas que funcionen en casas abandonadas redujo la violencia con armas de fuego en los alrededores. Los lugares que ya recibieron ese tratamiento tienen puntaje 0: los lotes que mantiene PHS LandCare y los edificios cuyo dueño arregló las puertas y ventanas después de una notificación de L&I. Cualquier otro lote o edificio vacío tiene puntaje 100."
      shootings_nearby:
        label: "Tiroteos cercanos en los últimos tres años"
        explain: "Personas baleadas en los últimos tres años a un cuarto de milla más o menos (el hexágono del lugar y los seis que lo rodean), según los registros de víctimas de disparos del Departamento de Policía. La posición es la parte de los lugares del mapa con menos. Los ensayos midieron menos tiroteos alrededor de los lugares tratados, así que el cuidado ayuda más donde ocurren los tiroteos."
      poverty:
        label: "Tasa de pobreza del vecindario"
        explain: "La parte de las personas que viven por debajo de la línea de pobreza en el sector censal del lugar (encuesta de la Oficina del Censo, 2020 a 2024). La posición es la parte de los lugares del mapa en sectores con una tasa menor. En el ensayo de toda la ciudad, la baja de la violencia con armas de fuego se encontró en vecindarios por debajo de la línea de pobreza."
      canopy_gap:
        label: "Pocos árboles cerca"
        explain: "Copa de los árboles en el terreno a un cuarto de milla más o menos, según el estudio de la Ciudad sobre las copas de los árboles de 2018. La posición es la parte de los lugares del mapa con más árboles a su alrededor, así que menos árboles dan una posición más alta. Los árboles de las calles se relacionan con menos delitos, pero la evidencia es mixta y depende de dónde estén."
    presets:
      research:
        label: "Basado en investigación"
      vacancy_only:
        label: "Solo vacancia"
  heat:
    label: "Calor y sombra"
    description: "Dónde plantar árboles o reverdecer un lote vacío refrescaría más a las personas: lotes en vecindarios donde el calor del verano golpea más fuerte, con poca sombra alrededor, y con muchas personas que notarían la diferencia."
    factors:
      heat_vulnerability:
        label: "Vulnerabilidad al calor del vecindario"
        explain: "Qué tan fuerte golpea el calor del verano a las personas del sector censal del lote, según el Índice de Vulnerabilidad al Calor de la Ciudad (Departamento de Salud Pública y Oficina de Sostenibilidad, datos de 2017 a 2019): qué tan caluroso se pone el sector en los días de verano, según lo miden los satélites, junto con cuántas de las personas que viven allí corren más riesgo con el calor, por edad, salud, ingresos y más. La posición es la parte de los lugares del mapa en sectores con un puntaje menor."
      few_trees:
        label: "Pocos árboles cerca"
        explain: "Copa de los árboles en el terreno a un cuarto de milla más o menos, según el estudio de la Ciudad sobre las copas de los árboles de 2018, la misma medida que usa el lente de reducción de la violencia. La posición es la parte de los lugares del mapa con más árboles a su alrededor, así que menos árboles dan una posición más alta. Los árboles refrescan las calles con su sombra y con el agua que sueltan sus hojas. Los estudios coinciden en que refrescan de día, más donde la copa cubre más de un 40 por ciento de una cuadra, y menos de noche."
      few_street_trees:
        label: "Pocos árboles de la Ciudad en la cuadra"
        explain: "Árboles a 100 metros o menos del lote en el inventario de árboles de Parques y Recreación de 2025, los árboles que la Ciudad cuida en sus calles y parques, no los árboles de patios privados. La posición es la parte de los lugares del mapa con más de estos árboles a su alrededor, así que menos árboles dan una posición más alta. Los árboles de las calles dan sombra a las aceras por donde la gente camina y espera."
      people_nearby:
        label: "Personas a las que esto llegaría"
        explain: "Residentes por kilómetro cuadrado de terreno en el sector censal del lote (encuesta de la Oficina del Censo, 2020 a 2024). La posición es la parte de los lugares del mapa en sectores con menos personas. Más personas notarían el efecto de refrescar. La población solo cuenta a quiénes llegaría una mejora; nunca es por sí sola una medida de necesidad."
    presets:
      balanced:
        label: "Equilibrado"
      people_at_risk:
        label: "Personas en mayor riesgo"
      fewest_trees:
        label: "Menos árboles"
  placemaking:
    label: "Creación de lugares"
    description: "Dónde un lote vacío probablemente se convertiría en un lugar público que la gente use todos los días, como un jardín, un parque pequeño, un lugar para sentarse a la sombra o un espacio para arte: lotes con muchos vecinos y lugares de todos los días a poca distancia a pie, lejos de un parque y de arte público. Se trata de uso y de acogida, no de delincuencia."
    factors:
      neighbors:
        label: "Personas a 5 minutos a pie"
        explain: "Cuántas personas viven a 5 minutos a pie del lote, contados como 400 metros en línea recta, según el censo de 2020. La posición es la parte de los lugares del mapa con menos personas a su alrededor. Más vecinos significa más personas a las que serviría un jardín, un banco o un mural. La población solo cuenta a quiénes llegaría un proyecto."
      everyday_places:
        label: "Lugares de todos los días a 10 minutos a pie"
        explain: "Cuántos de siete tipos de lugares de todos los días están a 10 minutos a pie, contados como 800 metros en línea recta: una biblioteca, un centro recreativo, una piscina o zona de juegos de agua, una fuente de agua potable en un parque, una escuela, una tienda de comestibles o un mercado que acepta SNAP, y una parada de autobús, tranvía o tren. La posición es la parte de los lugares del mapa con menos. Las personas que van a esos lugares pasan caminando por el lote. Cuánto ayudan los transeúntes a un lugar público nuevo depende de la calle y del lugar, así que la evidencia es mixta."
      walkability:
        label: "Caminabilidad"
        explain: "El Índice Nacional de Caminabilidad de la EPA del grupo de bloques del lote: esquinas, qué tan cerca está el transporte público, y qué tan bien se mezclan viviendas, empleos y tiendas (datos de más o menos 2017 a 2019). La posición es la parte de los lugares del mapa en zonas menos caminables. Donde la gente camina, más personas usarían un lugar en el lote. Los estudios de lugares caminables encuentran correlaciones cuyo significado depende del lugar, así que la evidencia es mixta."
      far_from_park:
        label: "Lejos de un parque"
        explain: "La distancia en línea recta del lote al borde del terreno de parque más cercano de Parques y Recreación: parques, parques infantiles, centros recreativos, plazas, corredores verdes y áreas naturales, pero no sus patios de trabajo, campos de golf ni camellones plantados. La posición es la parte de los lugares del mapa que están más cerca de uno, así que más lejos da una posición más alta. Un lote lejos de un parque podría darles a los vecinos el espacio abierto que les falta."
      no_art_nearby:
        label: "Sin arte público cerca"
        explain: "La distancia en línea recta del lote a la obra de arte público más cercana de la lista Percent for Art de la Ciudad o de Wikidata, sin contar las obras dentro de edificios. La posición es la parte de los lugares del mapa que están más cerca de una, así que más lejos da una posición más alta. Estas dos listas tienen solo una parte del arte de la ciudad: los murales de Mural Arts y las obras que solo OpenStreetMap tiene en el mapa no están en ellas, así que mire también la capa de Arte público. El arte es bienvenido por su belleza y por el orgullo que da; ningún estudio lo relaciona con menos violencia."
      commercial_corridor:
        label: "En un corredor comercial o cerca de uno"
        explain: "Puntaje completo, 100, cuando el lote está en uno de los corredores comerciales de la Ciudad, las calles y centros de compras que la Comisión de Planificación estudió de 2011 a 2017, o a 50 metros o menos de uno, y 0 en los demás casos. Las tiendas traen gente que pasa por el lote todos los días. Las calles comerciales muy concurridas también pueden traer problemas, así que la evidencia es mixta."
    presets:
      balanced:
        label: "Equilibrado"
      most_neighbors:
        label: "Más vecinos"
      where_people_walk:
        label: "Donde la gente ya camina"
      far_from_a_park:
        label: "Lejos de un parque"
  street_safety:
    label: "Seguridad en la calle"
    description: "Cuadras donde las personas que caminan y andan en bicicleta corren más riesgo, según los registros de choques, la Red de Lesiones Graves de la Ciudad y las escuelas cercanas."
    factors:
      high_injury_network:
        label: "En la Red de Lesiones Graves"
        explain: "La Ciudad encontró que la mayoría de las muertes y lesiones graves de tránsito ocurren en estas calles, que son más o menos 12 por ciento de todas las calles de Filadelfia."
      walking_cycling_harm:
        label: "Personas que murieron o resultaron gravemente heridas al caminar o andar en bicicleta, últimos 5 años"
        explain: "Cuenta a las personas que murieron o resultaron gravemente heridas al caminar o andar en bicicleta en esta cuadra o en sus esquinas, en los cinco años más recientes de los registros de choques de PennDOT. La posición es la parte de las cuadras de toda la ciudad con menos."
      recent_death:
        label: "Alguien murió aquí en los últimos 2 años"
        explain: "Una muerte en esta cuadra o en sus esquinas en los últimos dos años, según los registros de choques mortales del Departamento de Policía, que se actualizan cada noche."
      school_nearby:
        label: "Escuela a 400 metros o menos"
        explain: "Los niños caminan hacia la escuela y de regreso por aquí. 400 metros son más o menos cinco minutos a pie."
    presets:
      research:
        label: "Basado en investigación"
      recorded_harm:
        label: "Solo daño registrado"
  transit_comfort:
    label: "Comodidad del transporte público"
    description: "Paradas de autobús y tranvía donde un refugio, un banco o sombra ayudarían más a los pasajeros: paradas muy concurridas, paradas donde una revisión no encontró nada bajo lo que sentarse ni donde sentarse, paradas con poca sombra en vecindarios calurosos, paradas en la Red de Lesiones Graves, y paradas con esperas largas. Donde nadie ha revisado todavía una parada, su refugio y su banco cuentan a medias."
    factors:
      riders:
        label: "Personas que suben cada día de semana"
        explain: "Cuántas personas suben aquí en un día de semana promedio, según el conteo propio de SEPTA. La posición es la parte de las paradas con menos pasajeros. Más pasajeros significa más personas ayudadas por un refugio o un banco; la Ciudad se propone poner refugios en el 15 por ciento de las paradas de autobús más concurridas. Las paradas que SEPTA todavía no ha contado se dejan fuera de este factor."
      no_shelter:
        label: "Sin refugio"
        explain: "100 donde una revisión no encontró refugio, 0 donde hay un refugio, toda la parada está bajo techo, o la lista propia de la Ciudad de refugios de autobús tiene uno allí (diga lo que diga OpenStreetMap). Donde nadie ha revisado todavía la parada cuenta como 50, a medias, para que una parada nunca se califique como sin un refugio que quizás tiene; revísela para averiguarlo. En un estudio en Minneapolis y Saint Paul, los pasajeros en paradas sin banco ni refugio sentían que sus esperas eran más largas de lo que eran."
      no_bench:
        label: "Sin banco"
        explain: "100 donde una revisión no encontró banco, 0 donde hay uno, y 50, a medias, donde nadie ha revisado todavía la parada. El mismo estudio encontró que un banco hace que una espera se sienta más corta."
      little_shade:
        label: "Poca sombra cerca"
        explain: "Copa de los árboles en el terreno alrededor de la parada, en un área de unas dos cuadras de ancho, según el estudio de la Ciudad sobre las copas de los árboles de 2018. La posición es la parte de las paradas con más árboles a su alrededor, así que menos árboles dan una posición más alta. La sombra refresca a las personas que esperan al sol, pero cuánto ayuda depende del clima y de lo que da la sombra."
      heat:
        label: "Vecindario caluroso en verano"
        explain: "Qué tan caluroso se pone el sector censal de la parada en los días de verano, según la parte de exposición al calor del Índice de Vulnerabilidad al Calor de la Ciudad (temperaturas de la superficie medidas por satélite y cuánto del sector es pavimento, construcción o verde). La posición es la parte de las paradas en sectores más frescos."
      high_injury_network:
        label: "En la Red de Lesiones Graves"
        explain: "La parada está en una de las calles donde ocurren la mayoría de las muertes y lesiones graves de tránsito en Filadelfia, o en su esquina, así que muchos pasajeros cruzan esa calle para llegar a la parada o para irse de ella. Estudios de otros lugares encontraron que los choques con personas a pie se concentran en paradas de autobús concurridas en calles anchas, donde un cruce seguro importa más."
      long_wait:
        label: "Esperas largas al mediodía"
        explain: "El tiempo típico entre autobuses o tranvías de 10 a 2 en días de semana, según los horarios de SEPTA. La posición es la parte de las paradas con esperas más cortas. Una espera larga es cuando más importan un asiento y un techo. Las paradas sin servicio al mediodía se dejan fuera de este factor."
    presets:
      balanced:
        label: "Equilibrado"
      busiest_first:
        label: "Primero las paradas más concurridas"
      heat_and_shade:
        label: "Calor y sombra"


suggestions:
  clean_and_green:
    label: "Limpiar y reverdecer este lote"
    summary: "Recoger la basura, nivelar el terreno, plantar pasto y unos pocos árboles, poner una cerca baja de postes y travesaños, y cortar el pasto con regularidad."
    cost: "Unos $1,100 a $1,500 al principio y $150 a $300 al año (por confirmar con PHS)"
  seal_abandoned_building:
    label: "Conseguir que se selle este edificio"
    summary: "Reporte un edificio abandonado abierto para que la Ciudad selle sus puertas y ventanas."
    cost: "Reportarlo es gratis"
  plant_shade_trees:
    label: "Plantar árboles de sombra en este lote y a lo largo de él"
    summary: "Menos árboles dan sombra a esta área que en los alrededores de al menos la mitad de los lugares de este mapa (el estudio de la Ciudad sobre las copas de los árboles de 2018). Los árboles refrescan una cuadra con su sombra y con el agua que sueltan sus hojas. La Ciudad planta árboles gratis en la acera de la calle cuando el dueño de una propiedad lo pide, y TreePhilly regala árboles gratis para plantar en el suelo de terrenos privados. Elija árboles que crezcan altos, para que den sombra a la calle y los vecinos puedan seguir viendo a través del lote."
    cost: "Árboles gratis de la Ciudad y de TreePhilly. Los árboles jóvenes necesitan unos 20 galones de agua por semana de marzo a diciembre"
  cool_green_lot:
    label: "Reverdecer este lote para refrescar la cuadra"
    summary: "Según el índice de vulnerabilidad al calor de la Ciudad, el calor del verano golpea aquí a las personas más fuerte que en los alrededores de al menos la mitad de los lugares de este mapa. La tierra desnuda, la grava y los escombros absorben el sol, mientras que el pasto, los canteros de jardín y sobre todo los árboles mantienen un lote más fresco y dan sombra a la acera de al lado. Sea lo que sea que este lote llegue a ser, un jardín, un lote limpio y verde o un patio lateral, plante árboles de sombra en él, y manténgalos altos para que el lote siga abierto a la vista."
    cost: "Desde árboles gratis (TreePhilly) hasta unos $1,100 a $1,500 al principio para un lote limpio y verde completo (por confirmar con PHS)"
  seating_and_shade:
    label: "Hacer un lugar para sentarse a la sombra"
    summary: "Más personas viven a 5 minutos a pie de este lote que en los alrededores de al menos la mitad de los lugares de este mapa. Unos pocos bancos o una mesa de picnic bajo árboles de sombra pueden convertirlo en un lugar donde los vecinos se detienen, descansan y se encuentran. Pregunte a los vecinos qué usarían, elija asientos resistentes y plante árboles que crezcan altos para que el lote siga abierto a la vista. Planifique quién lo mantendrá limpio."
    cost: "Desde árboles gratis (TreePhilly) y un banco hecho con un diseño abierto hasta unos pocos miles de dólares. Los mini subsidios para espacios públicos de Feet First Philly dan de $500 a $2,500"
  community_garden:
    label: "Empezar un jardín comunitario"
    summary: "Este lote está más lejos de un parque que al menos la mitad de los lugares de este mapa, y al menos 1,000 personas viven a 5 minutos a pie de él. Un jardín comunitario les da a los vecinos espacio verde, comida y flores, y una razón para encontrarse. Necesita jardineros que vuelvan cada semana, agua y permiso para usar el terreno. Cuando un jardín ya funciona, el Neighborhood Gardens Trust puede ayudar a que siga siendo un jardín para siempre."
    cost: "Desde unas pocas camas elevadas hasta unos pocos miles de dólares con tierra, una cerca y agua. El Acuerdo de Jardín Urbano (Urban Garden Agreement) del Land Bank cuesta $1"
  art_request:
    label: "Preguntar por un mural u otro arte"
    summary: "Mucha gente vive alrededor de este lote, y ninguna obra de la lista Percent for Art de la Ciudad ni de Wikidata está a 5 minutos a pie. Esas listas no incluyen muchos murales, así que mire primero la capa de Arte público y la lista propia de murales de Mural Arts. Una pared en blanco frente al lote podría tener un mural: Mural Arts recibe solicitudes de los dueños de paredes en su propio sitio. El arte es bienvenido por su belleza y por el orgullo que da; ningún estudio lo relaciona con menos violencia."
    cost: "Preguntar a Mural Arts es gratis"
  report_dumping:
    label: "Reportar la basura tirada ilegalmente a Philly311"
    summary: "Alguien le preguntó a Philly311 por basura tirada ilegalmente en una cuadra frente a la que está este lote en los últimos 90 días, y la solicitud sigue abierta. Si la basura sigue allí, haga su propia solicitud, con una foto, para que la Ciudad la retire. Un reporte trata de la basura, nunca de quién la dejó."
    cost: "Reportarlo es gratis"
  report_dark_light:
    label: "Reportar la luz de calle apagada a Philly311"
    summary: "Alguien le pidió a Philly311 que arreglara una luz de calle o de callejón que está apagada en una cuadra frente a la que está este lote, en los últimos 90 días, y la solicitud sigue abierta. Si la luz sigue apagada, haga su propia solicitud, con el número del poste si lo tiene. Una calle iluminada ayuda a los vecinos a usar la calle y el lote después de oscurecer."
    cost: "Reportarlo es gratis"
  report_graffiti:
    label: "Reportar el grafiti a Philly311"
    summary: "Alguien le pidió a Philly311 que quitara grafiti en una cuadra frente a la que está este lote en los últimos 90 días, y la solicitud sigue abierta. Si sigue allí, haga su propia solicitud, con una foto, para que la Ciudad lo limpie. Si los vecinos prefieren tener arte en esa pared, pregunte a su dueño por un mural."
    cost: "Reportarlo es gratis"
  memorial_or_ghost_bike:
    label: "Un memorial o una bicicleta blanca (ghost bike)"
    summary: "Un memorial honra a la persona que murió y les recuerda a todos los que pasan que vayan más despacio. Para una persona que murió al andar en bicicleta, la Bicycle Coalition puede colocar una bicicleta blanca (ghost bike), una bicicleta pintada de blanco."
    cost: "Bajo; pedir una bicicleta blanca es gratis"
  traffic_calming_petition:
    label: "Pedir medidas para calmar el tránsito en esta calle residencial"
    summary: "Los vecinos pueden pedirle a la Ciudad reductores de velocidad (cojines) en una calle residencial. La Ciudad califica las solicitudes tres veces al año con datos de choques, y si se elige esta calle, el 60 por ciento de la cuadra firma una petición. Las arterias, las carreteras estatales y las calles cortas, empinadas y con curvas no califican."
    cost: "Pedirlo es gratis"
  daylighting_check:
    label: "Comprobar que esta esquina esté despejada por 20 pies"
    summary: "La ley de Pensilvania ya prohíbe estacionar a menos de 20 pies de un cruce peatonal en una intersección, y a menos de 30 pies de una señal de alto o un semáforo, para que los conductores y las personas que cruzan puedan verse. Si hay autos estacionados allí, pregunte a la Ciudad por despejar la esquina con pintura, postes o macetas. Reporte una luz de calle apagada aquí a Philly311."
    cost: "Preguntar es gratis"
  asphalt_art_check:
    label: "Arte en el asfalto en esta esquina, consulte primero con la Ciudad"
    summary: "Un estudio de intersecciones pintadas encontró menos choques con personas que caminaban y andaban en bicicleta, pero no tenía grupo de comparación y lo pagó el patrocinador del programa. En 2025 el gobierno federal empezó a pedir a los estados que quiten el arte de los cruces peatonales, y Filadelfia no tiene un proceso de permisos para eso. Consulte con la Ciudad antes de pintar cualquier cosa."
    cost: "No se sabe; no hay un proceso de la Ciudad para ponerle precio"
  stop_survey:
    label: "Revisar esta parada con StreetComplete"
    summary: "Nadie ha registrado todavía si esta parada tiene un refugio o un banco, o OpenStreetMap y la lista de refugios de autobús de la Ciudad no coinciden sobre su refugio. Cualquiera puede averiguarlo en unos minutos con la aplicación de teléfono gratuita StreetComplete, y las respuestas llegan a este mapa en más o menos una semana. Si la aplicación no tiene ninguna pregunta aquí, la parada todavía no está en OpenStreetMap: agréguela con la capa Things de la aplicación, o deje una nota."
    cost: "Gratis; unos tres minutos por parada"
  stop_shelter_request:
    label: "Pedir a la Ciudad un refugio en esta parada"
    summary: "Una revisión no encontró refugio aquí, y la lista de refugios de autobús de la Ciudad tampoco tiene ninguno aquí. El programa de refugios de autobús de la Ciudad, a cargo de su oficina de transporte (OTIS), construye refugios pagados con la publicidad que llevan y se propone ponerlos en el 15 por ciento de las paradas de autobús más concurridas. No hay un formulario público de solicitud, así que escriba a OTIS con el número de la parada y cuántas personas suben aquí."
    cost: "Pedirlo es gratis"
  stop_bench_request:
    label: "Pedir a la Ciudad un banco en esta parada"
    summary: "Una revisión no encontró banco aquí. Los bancos en las paradas pertenecen al programa de mobiliario urbano de la Ciudad, a cargo de OTIS, y no encontramos una forma pública de pedir uno, así que escriba a OTIS con el número de la parada. Un banco que usted mismo construya necesita permiso, y el trámite de permisos de la Ciudad para un banco en una acera todavía no está confirmado."
    cost: "Pedirlo es gratis"
  stop_streetlight_report:
    label: "Reportar una luz de calle apagada en esta parada"
    summary: "OpenStreetMap dice que esta parada no tiene luz. Si una luz de calle de aquí está apagada, repórtela a Philly311. El programa actual de alumbrado público de la Ciudad reemplaza luces pero no agrega nuevas, así que una parada sin ninguna luz es una pregunta para OTIS."
    cost: "Reportarlo es gratis"
  stop_shade_trees:
    label: "Plantar árboles de sombra junto a esta parada"
    summary: "Pocos árboles dan sombra a esta parada. La Ciudad planta árboles gratis en la acera frente a una casa o un negocio cuando su dueño lo pide, y los riega el primer año. Pida a los dueños de los edificios junto a la parada que soliciten uno; los vecinos pueden ayudar a regarlo después."
    cost: "Árboles de calle gratis para los dueños de propiedades"


routes:
  land_bank_garden_agreement:
    label: "Acuerdo o licencia de jardín del Land Bank"
    who: "Cualquier persona, con un Acuerdo de Jardín Urbano (Urban Garden Agreement) de $1; grupos con un patrocinador sin fines de lucro, con una Licencia de Jardín Comunitario (Community Garden License)"
    steps:
      - "Compruebe que el Land Bank o la Ciudad sea dueño del lote."
      - "Lea la guía de Grounded in Philly sobre cómo obtener permiso para usar terrenos de la Ciudad."
      - "Presente su solicitud al Land Bank, o primero participe en uno de sus seminarios web gratuitos."
    cost: "$1 (Acuerdo de Jardín Urbano), $25 al año (Acuerdo de Jardín Individual), o seguro y un patrocinador (Licencia de Jardín Comunitario)"
    timeline: "Semanas para los acuerdos cortos; meses para una licencia"
    links:
      "https://phillylandbank.org/":
        label: "Philadelphia Land Bank"
      "https://groundedinphilly.org/get-permission-to-use-land-city/":
        label: "Grounded in Philly: permiso para usar terrenos de la Ciudad"
  ask_the_owner:
    label: "Pedir permiso al dueño"
    who: "Cualquier persona"
    steps:
      - "Busque la dirección postal del dueño en la página del lote."
      - "Escríbale para pedir permiso para limpiar y reverdecer el lote, y ofrezca un acuerdo escrito sencillo."
      - "Pida a la Garden Justice Legal Initiative que revise cualquier acuerdo antes de que lo firme."
    cost: "Gratis"
    timeline: "Depende del dueño"
    links:
      "https://www.pubintlaw.org/cases-and-advocacy/garden-justice-legal-initiative/":
        label: "Garden Justice Legal Initiative"
  community_landcare:
    label: "Cuidar un lote con PHS Community LandCare"
    who: "Grupos de residentes"
    steps:
      - "Comuníquese con PHS sobre Community LandCare."
    cost: "Por confirmar con PHS"
    timeline: "Por confirmar con PHS"
    links:
      "https://phsonline.org/":
        label: "Pennsylvania Horticultural Society"
  report_to_311:
    label: "Reportarlo a Philly311"
    who: "Cualquier persona"
    steps:
      - "Reporte el edificio abierto, la basura tirada ilegalmente, el grafiti, o la luz de calle o de callejón apagada a Philly311 por internet, con la aplicación o llamando al 311."
      - "Guarde el número de la solicitud de servicio y vuelva a revisar."
    cost: "Gratis"
    timeline: "De días a semanas"
    links:
      "https://www.phila.gov/services/property-lots-housing/submit-a-service-request-with-311/":
        label: "Philly311"
  ghost_bike_request:
    label: "Pedir a la Bicycle Coalition una bicicleta blanca (ghost bike) o un memorial"
    who: "La familia, o amigos con la bendición de la familia"
    steps:
      - "Hable primero con la familia. Un memorial se coloca solo con su bendición."
      - "Para una persona que murió al andar en bicicleta, llene el formulario de solicitud de ghost bike de la Bicycle Coalition. El mismo formulario sirve para pedir que se repare o se reemplace una ghost bike."
      - "Families for Safe Streets, dirigido por la Bicycle Coalition, apoya a las familias después de un choque y comparte una guía de recursos para después del choque."
      - "Planifique quién cuidará el memorial con el tiempo."
    cost: "Pedirla es gratis"
    timeline: "No se indica"
    links:
      "https://bicyclecoalition.org/what-is-a-ghost-bike/":
        label: "Bicycle Coalition: qué es una ghost bike"
      "https://forms.gle/HBtY1hG4xcdVJKNb8":
        label: "Formulario de solicitud de ghost bike"
      "https://bicyclecoalition.org/programs/families-for-safe-streets/":
        label: "Families for Safe Streets Greater Philadelphia"
  traffic_calming_request:
    label: "Pedir medidas para calmar el tránsito en una calle residencial"
    who: "Residentes de la cuadra, sobre todo de la calle donde viven"
    steps:
      - "Compruebe si la calle califica en el mapa de medidas para calmar el tránsito de la Ciudad, o llamando al 311."
      - "Envíe la solicitud en línea de la Ciudad para calmar el tránsito."
      - "Si la Ciudad elige la solicitud, reúna las firmas del 60 por ciento de los hogares de la cuadra, una por hogar."
    cost: "Pedirlo es gratis"
    timeline: "La Ciudad califica las solicitudes tres veces al año y por lo general instala los reductores de velocidad (cojines) de mayo a octubre"
    links:
      "https://www.phila.gov/services/streets-sidewalks-alleys/request-traffic-calming-for-a-residential-street/":
        label: "Ciudad de Filadelfia: pedir medidas para calmar el tránsito"
  otis_contact:
    label: "Preguntar a la oficina de transporte de la Ciudad (OTIS)"
    who: "Cualquier persona"
    steps:
      - "Escriba a la Oficina de Transporte y Sistemas de Infraestructura a otis@phila.gov, nombrando la esquina y lo que ve allí."
      - "Pregunte qué permite la Ciudad en esta esquina y cómo pedirlo."
    cost: "Gratis"
    timeline: "No se indica"
    links:
      "https://visionzerophl.com/":
        label: "Vision Zero Philadelphia"
  treephilly_yard_trees:
    label: "Conseguir árboles gratis en un reparto de TreePhilly"
    who: "Residentes de Filadelfia, para árboles plantados en el suelo de propiedades privadas, como un lote que usted posee o un lote privado cuyo dueño esté de acuerdo por escrito"
    steps:
      - "Inscríbase en el boletín de TreePhilly para saber cuándo abre el registro. Los repartos son en primavera (de marzo a mayo) y en otoño (de septiembre a diciembre) en códigos postales prioritarios."
      - "Regístrese con el grupo comunitario que hace un reparto cerca de usted. El registro abre de dos semanas a un mes antes del reparto y cierra cuando se acaban los árboles."
      - "Recoja el árbol, de 2 a 10 pies de alto en un balde de 5 galones, con una bolsa gratis de mantillo, y plántelo en el suelo. Los árboles del reparto no pueden ir en una maceta, en la acera ni en ningún otro lugar del derecho de paso público."
    cost: "Gratis"
    timeline: "El próximo reparto de primavera o de otoño"
    links:
      "https://treephilly.org/yard-trees/":
        label: "TreePhilly: árboles para patios"
  mural_arts_wall_request:
    label: "Pedir a Mural Arts un mural en una pared"
    who: "El dueño de la pared, con vecinos que lo apoyen. Cualquiera puede empezar preguntándole al dueño"
    steps:
      - "Busque una pared que dé al lote y se vea fácilmente desde la calle, y pregunte a su dueño si le daría la bienvenida a un mural."
      - "Con el acuerdo del dueño, llene el formulario de solicitud de pared en la página de contacto de Mural Arts Philadelphia. Pregunta por la pared, el apoyo de los vecinos y por qué un mural importa allí."
      - "Todo lo que esté en la calle o en la acera, el derecho de paso público, también va a la Comisión de Arte de la Ciudad."
    cost: "Solicitarlo es gratis"
    timeline: "Meses"
    links:
      "https://muralarts.org/contact/":
        label: "Mural Arts Philadelphia: página de contacto, con el formulario para un mural en su pared"
  public_space_mini_grant:
    label: "Solicitar un mini subsidio para espacios públicos de Feet First Philly"
    who: "Vecinos y grupos comunitarios. El programa favorece a las comunidades que han recibido menos inversión en sus calles y servicios de la Ciudad"
    steps:
      - "Lea la solicitud de propuestas en la página de mini subsidios de Feet First Philly. Los proyectos deben hacer el vecindario más seguro y fácil para caminar y rodar; pregunte a Feet First Philly si un lugar para sentarse en un lote califica."
      - "Presente su solicitud mientras la ronda esté abierta. Las solicitudes abren en agosto y vencen en octubre."
      - "Prepárese para enviar un informe corto a la mitad y otro al final."
    cost: "Subsidios de $500 a $2,500, financiados en parte por el Departamento de Salud Pública"
    timeline: "Las solicitudes abren en agosto y vencen en octubre de cada año"
    links:
      "https://feetfirstphilly.org/public-space-enhancement-mini-grant-2/":
        label: "Feet First Philly: mini subsidio para mejorar espacios públicos"
  land_bank_side_yard:
    label: "Conseguirlo como patio lateral o trasero (solo dueños de la casa de al lado)"
    who: "El dueño de la casa de al lado, y solo cuando la lista de la Ciudad marca el lote como elegible para un patio lateral"
    steps:
      - "Compruebe que usted es dueño de la casa de al lado y que el lote está marcado como elegible para un patio lateral."
      - "Lea la página de patios laterales y traseros del Land Bank y presente su solicitud."
      - "Prepárese para una espera larga. Después de la revisión del personal, la junta del Land Bank y el Concejo Municipal deben aprobarlo."
    cost: "Un precio simbólico. El lote debe seguir siendo un patio lateral para siempre, con una hipoteca a 30 años por su valor tasado que se perdona si se cumplen las reglas; la Ciudad puede recuperarlo si no se cumplen"
    timeline: "El personal se propone responder en 120 días, y luego deciden la junta del Land Bank y el Concejo Municipal. Solo se transfirieron 67 lotes de esta manera en toda la ciudad de 2020 a 2023"
    links:
      "https://phillylandbank.org/side-or-rear-yards/":
        label: "Philadelphia Land Bank: patios laterales o traseros"
  contact_phdc:
    label: "Preguntar a PHDC por esta parcela"
    who: "Cualquier persona"
    steps:
      - "Comuníquese con PHDC e indique la dirección de la parcela y su número de cuenta de la OPA."
      - "Pregunte quién administra la parcela, si está disponible y cómo podrían cuidarla los vecinos."
      - "Si no está seguro de a quién preguntar, empiece por el Land Bank (land@phdc.phila.gov, 215 448 3034)."
    cost: "Preguntar es gratis"
    timeline: "No se sabe. Los lotes de la Autoridad de Redesarrollo todavía no tienen una vía publicada para los vecinos"
    links:
      "https://phdcphila.org/":
        label: "PHDC"
      "https://phillylandbank.org/":
        label: "Philadelphia Land Bank"
  garden_adverse_possession:
    label: "Posesión adversa de un jardín (ley de 2024)"
    who: "Residentes de Filadelfia, grupos u organizaciones sin fines de lucro que han cultivado un jardín en un lote de propiedad privada"
    steps:
      - "Revise las condiciones de la ley de 2024 (53 Pa.C.S. sección 1143, en vigor desde el 6 de septiembre de 2024): terreno de propiedad privada de media acre o menos, 10 años de uso con al menos 5 de ellos como jardín, y sin edificios permanentes (se permiten cercas y cobertizos)."
      - "Lea la guía de Grounded in Philly sobre la posesión adversa."
      - "Pida un abogado a la Garden Justice Legal Initiative. Esta vía necesita una demanda para aclarar el título (quiet title)."
    cost: "Un abogado y costos del tribunal. Cualquier gravamen sobre el terreno se queda con él"
    timeline: "Al menos 10 años de uso, y luego una demanda"
    links:
      "https://groundedinphilly.org/how-to-obtain-land-adverse-possession/":
        label: "Grounded in Philly: posesión adversa"
      "https://www.pubintlaw.org/cases-and-advocacy/garden-justice-legal-initiative/":
        label: "Garden Justice Legal Initiative"
  conservatorship:
    label: "Administración judicial (conservatorship, Ley 135)"
    who: "Una organización sin fines de lucro o una persona que presenta una petición al tribunal"
    warning: "La administración judicial (conservatorship) puede quitarle una propiedad a su dueño. Investigadores encontraron que se usa de forma desproporcionada en vecindarios que enfrentan gentrificación. Hable con la Garden Justice Legal Initiative antes de considerarla."
    steps:
      - "Hable con la Garden Justice Legal Initiative antes que nada."
      - "Pregunte primero si escribirle al dueño, o ayudar a una familia a conservar la propiedad, satisfaría la misma necesidad."
      - "Conozca las condiciones de la ley: un tribunal puede nombrar a un administrador judicial (conservator) solo para una propiedad que no ha estado ocupada legalmente por 12 meses, que no se está ofreciendo en el mercado, que no está en ejecución hipotecaria y que no se compró en los últimos 6 meses."
    cost: "Costos del tribunal y de reparación. Desde 2014, a quien presenta la petición se le puede pagar lo que sea mayor entre $2,500, el 20% de los costos o el 20% del precio de venta"
    timeline: "Un caso judicial; pregunte a la ayuda legal cuánto tardaría"
    links:
      "https://www.pubintlaw.org/cases-and-advocacy/garden-justice-legal-initiative/":
        label: "Garden Justice Legal Initiative"
  tangled_title_help:
    label: "Ayudar a una familia a conservar una casa heredada (Tangled Title Fund)"
    who: "Familias cuya casa sigue a nombre de un familiar que falleció, con ingresos del hogar de hasta el 80% de la mediana del área; la propiedad debe ser la vivienda de quien solicita"
    steps:
      - "Comuníquese con el Tangled Title Fund de Philadelphia VIP (tangledtitlefund@gmail.com, 215 523 9553)."
      - "El fondo paga hasta $6,500 del costo legal de aclarar el título, y hasta $3,500 más del impuesto de transferencia, caso por caso."
    cost: "Gratis para la familia hasta los límites del fondo; la familia cubre lo que pase de ellos"
    timeline: "Por orden de llegada"
    links:
      "https://phillyvip.org/tangled-title-fund/":
        label: "Philadelphia VIP: Tangled Title Fund"
  fraud_guard:
    label: "Inscribirse en las alertas gratuitas de Fraud Guard de la Ciudad"
    who: "Dueños de propiedades y sus familias"
    steps:
      - "Inscríbase en Fraud Guard con un nombre y una dirección de correo electrónico."
      - "La Ciudad envía un correo electrónico cuando se registra un documento que lo nombra, para que una escritura falsa se detecte pronto."
      - "Las preguntas van al Departamento de Registros (215 686 2290, records.info@phila.gov)."
    cost: "Gratis"
    timeline: "Una alerta llega unos 30 días después de que se registra un documento"
    links:
      "https://www.phila.gov/2022-09-06-own-property-in-philadelphia-get-free-deed-fraud-protection-with-fraud-guard/":
        label: "Ciudad de Filadelfia: Fraud Guard"
  bus_shelter_request:
    label: "Pedir a la Ciudad un refugio de autobús"
    who: "Cualquier persona"
    steps:
      - "Anote el número de SEPTA de la parada (en el letrero y en este mapa), la esquina y cuántas personas suben allí cada día de semana."
      - "Escriba a la Oficina de Transporte y Sistemas de Infraestructura (OTIS) de la Ciudad a otis@phila.gov, o llame al 215-686-9003. OTIS maneja el programa de refugios de autobús de la Ciudad; no hay un formulario público de solicitud."
      - "Envíe copia a la oficina del distrito de su Concejo Municipal, e infórmelo también a SEPTA, por su formulario de comentarios en línea o al 215-580-7800."
    cost: "Preguntar es gratis"
    timeline: "No se indica. OTIS envía las ubicaciones de refugios nuevos a la Comisión de Arte de la Ciudad para su revisión (ocho en diciembre de 2025)"
    links:
      "https://www.phila.gov/media/20240521160603/RFI-OTIS-street-furniture-20240521.pdf":
        label: "Solicitud de información de OTIS sobre mobiliario urbano (mayo de 2024), con la meta de refugios de la Ciudad"
      "https://www.phila.gov/media/20251205094032/Bus-Shelter-Upgrades-submission.pdf":
        label: "Ocho refugios de autobús nuevos enviados a la Comisión de Arte (diciembre de 2025)"
      "https://wwww.septa.org/customer-service/comment-form/":
        label: "Formulario de comentarios de SEPTA"
      "https://phlcouncil.com/council-members/":
        label: "Concejo Municipal de Filadelfia: el concejal de cada distrito y su oficina"
  stop_bench_request:
    label: "Pedir a la Ciudad un banco en una parada"
    who: "Cualquier persona"
    steps:
      - "Anote el número de SEPTA de la parada (en el letrero y en este mapa) y la esquina."
      - "Escriba a OTIS a otis@phila.gov, o llame al 215-686-9003, y pida un banco en la parada. Los bancos en las paradas pertenecen al programa de mobiliario urbano de la Ciudad; no encontramos un formulario público de solicitud."
      - "Envíe copia a la oficina del distrito de su Concejo Municipal."
    cost: "Preguntar es gratis"
    timeline: "No se indica"
    links:
      "https://www.phila.gov/media/20240521160603/RFI-OTIS-street-furniture-20240521.pdf":
        label: "Solicitud de información de OTIS sobre mobiliario urbano (mayo de 2024)"
      "https://phlcouncil.com/council-members/":
        label: "Concejo Municipal de Filadelfia: el concejal de cada distrito y su oficina"
  street_tree_request:
    label: "Pedir un árbol de calle gratis"
    who: "El dueño de la casa, el negocio, el lote u otra propiedad frente a la cual estaría el árbol; los vecinos pueden pedírselo al dueño"
    steps:
      - "Los árboles de calle se plantan en la acera frente a una propiedad cuando su dueño lo pide. Hable con los dueños de los edificios junto al lugar. Para un lote vacío, pregunte al dueño que nombra su página del lote, o al Land Bank si el lote es de la Ciudad o del Land Bank."
      - "El dueño pide un árbol de calle gratis a la División de Manejo de Árboles de Calle de Parques y Recreación, en línea, por correo electrónico a StreetTree.Info@phila.gov, o por teléfono al 215-685-4363."
      - "Un arborista de la Ciudad visita el lugar para decidir qué árbol conviene. La Ciudad lo planta gratis en una temporada de plantación (de mediados de abril a mediados de junio, o de mediados de octubre a mediados de noviembre) y lo riega y le pone mantillo el primer año. Después de eso, TreePhilly pide unos 20 galones de agua por semana de marzo a diciembre."
    cost: "Gratis"
    timeline: "La próxima temporada de plantación después de la visita del arborista"
    links:
      "https://www.phila.gov/services/trees-parks-the-environment/tree-related-services/get-a-street-tree/":
        label: "Ciudad de Filadelfia: conseguir un árbol de calle"
      "https://treephilly.org/street-trees/":
        label: "TreePhilly: árboles de calle"
  streetcomplete_survey:
    label: "Revisar la parada con StreetComplete"
    who: "Cualquier persona con un teléfono Android (en septiembre de 2026 apareció una primera versión de prueba para iPhone)"
    steps:
      - "Instale la aplicación gratuita StreetComplete y cree una cuenta gratuita de OpenStreetMap para que se publiquen sus respuestas."
      - "En la parada, toque el marcador de la aplicación y responda sus preguntas sobre el refugio, el banco, la luz y el número de la parada."
      - "Si la aplicación no tiene ninguna pregunta en la parada, agréguela con la capa Things de la aplicación, o deje una nota para que otro mapeador pueda hacerlo."
    cost: "Gratis"
    timeline: "Las respuestas llegan a este mapa en más o menos una semana"
    links:
      "https://holdthedoorhoid.github.io/placekeepers/streetcomplete/":
        label: "Placekeepers: revisar paradas de autobús"
      "https://streetcomplete.app/":
        label: "StreetComplete"
  neighborhood_gardens_trust:
    label: "Conservar un jardín comunitario para siempre (Neighborhood Gardens Trust)"
    who: "Jardineros cuyo jardín comunitario lleva al menos tres temporadas"
    steps:
      - "Revise los criterios del trust: un jardín activo por al menos tres temporadas de cultivo, jardineros capaces de mantenerlo, lazos con grupos como una corporación de desarrollo comunitario, una iglesia o una escuela, y el apoyo de los vecinos y del miembro del Concejo Municipal del distrito."
      - "Presente la solicitud de jardín en línea del trust, o su formulario imprimible. El trust responde en unas dos semanas, luego visita el jardín y lo lleva a su junta."
      - "Una vez aprobado, el trust trabaja con la Ciudad para adquirir el terreno y lo conserva para que los vecinos puedan seguir cultivando, con seguro de responsabilidad civil y ayuda con el agua y el mantenimiento. Las preguntas van al 215 988 1630 o a ngtrust@pennhort.org."
    cost: "Solicitarlo es gratis"
    timeline: "Una respuesta en unas dos semanas; adquirir el terreno toma más tiempo"
    links:
      "https://ngtrust.org/preservation/":
        label: "Neighborhood Gardens Trust: preservación de jardines"
  community_land_trust:
    label: "Mantener asequibles las casas y el terreno para siempre (fideicomisos comunitarios de tierras)"
    who: "Vecinos, grupos comunitarios y organizaciones sin fines de lucro"
    steps:
      - "Aprenda cómo funciona un fideicomiso comunitario de tierras: una organización sin fines de lucro es dueña del terreno para siempre, las familias compran o alquilan las casas que hay en él, y un arrendamiento largo del terreno mantiene cada casa asequible cuando se vende otra vez."
      - "Hable con un fideicomiso de tierras que ya trabaje en Filadelfia, como el Community Justice Land Trust del Women's Community Revitalization Project, que tiene casas en Point Breeze, Grays Ferry, Mantua, Germantown, Port Richmond y Haddington."
      - "Pregunte a la Garden Justice Legal Initiative cómo un fideicomiso de tierras podría tener un jardín o un lote que su grupo ya cuida."
    cost: "Preguntar es gratis"
    timeline: "Largo; los proyectos de un fideicomiso de tierras toman años"
    links:
      "https://groundedsolutions.org/strengthening-neighborhoods/community-land-trusts":
        label: "Grounded Solutions Network: fideicomisos comunitarios de tierras"
      "https://www.wcrpphila.org/cjlt":
        label: "Women's Community Revitalization Project: Community Justice Land Trust"
  homestead_exemption:
    label: "Bajar la factura de impuestos de un propietario (la exención por vivienda familiar, Homestead, de la Ciudad)"
    who: "Cualquier persona que sea dueña de su casa en Filadelfia y viva en ella como su vivienda principal, incluso con una hipoteca o deuda de impuestos; no las casas con una reducción de impuestos de 10 años"
    steps:
      - "Presente la solicitud en el Philadelphia Tax Center (tax-services.phila.gov), donde una solicitud combinada cubre los programas de alivio de impuestos de la Ciudad, o llame a la línea de Homestead al 215 686 9200, o envíe el formulario por correo al Departamento de Ingresos, P.O. Box 52817, Philadelphia, PA 19115."
      - "La exención resta $100,000 del valor tasado de la casa para la factura de impuestos, y ahorra hasta $1,399 al año."
      - "Presente la solicitud antes del 1 de diciembre (antes del 1 de octubre para verlo en la próxima factura). Una vez aceptada, no hace falta volver a solicitarla a menos que cambie la escritura."
    cost: "Gratis"
    timeline: "Vence el 1 de diciembre de cada año"
    links:
      "https://www.phila.gov/services/payments-assistance-taxes/taxes/property-and-real-estate-taxes/get-real-estate-tax-relief/get-the-homestead-exemption/":
        label: "Ciudad de Filadelfia: obtenga la exención por vivienda familiar (Homestead)"
  longtime_owner_occupants:
    label: "Limitar el avalúo de un propietario de muchos años (el Programa para Propietarios Ocupantes de Muchos Años de la Ciudad, LOOP)"
    who: "Propietarios que han vivido en su casa al menos 10 años, cuyo avalúo subió al menos 50 por ciento en un año o 75 por ciento en cinco años, con ingresos del hogar por debajo del límite de la Ciudad (como $103,050 para una persona o $147,200 para cuatro en 2026), al día con sus impuestos o con un acuerdo de pago"
    steps:
      - "Presente la solicitud en el Philadelphia Tax Center (tax-services.phila.gov) con la solicitud combinada de la Ciudad, o llame al 215 686 9200, escriba a revenue@phila.gov, o envíe el formulario por correo al Departamento de Ingresos, P.O. Box 53190, Philadelphia, PA 19105."
      - "LOOP limita el avalúo que usa la factura de impuestos, a 1.5 veces el del año anterior o 1.75 veces el valor más bajo de los últimos cinco años, mientras el propietario siga siendo elegible."
      - "Presente la solicitud antes de la fecha límite anual de la Ciudad (el 30 de septiembre en los últimos años); la página de la Ciudad da la fecha actual."
    cost: "Gratis"
    timeline: "Una fecha límite anual, el 30 de septiembre en los últimos años"
    links:
      "https://www.phila.gov/services/payments-assistance-taxes/payment-plans-and-assistance-programs/income-based-programs-for-residents/apply-for-the-longtime-owner-occupants-program-loop/":
        label: "Ciudad de Filadelfia: solicite LOOP"

