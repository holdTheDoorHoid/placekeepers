  atlas_1860:
    label: "Atlas de 1860 (Hexamer y Locher)"
    description: "El atlas de Filadelfia de 1860 de Hexamer y Locher, dibujado cuadra por cuadra con sus edificios y lotes, ajustado al mapa de hoy por la Greater Philadelphia GeoHistory Network y alojado por la Ciudad. Cubre solo Center City y Northern Liberties. Baje su intensidad para ver a través de él las calles de hoy. Viene directo de los servidores de la Ciudad cuando esta capa está activada."
    settings:
      opacity:
        label: "Qué tan fuerte se ve el atlas, en porcentaje"
  redlining_1937:
    label: "Mapa de redlining de 1937 (calificaciones de la HOLC)"
    description: "En 1937 una agencia federal, la Home Owners' Loan Corporation (HOLC), calificó los vecindarios de Filadelfia de la A a la D según qué tan seguro juzgaba que era prestar dinero para hipotecas allí. Las calificaciones dependían de quién vivía en cada área: las áreas donde vivían familias negras y muchas familias inmigrantes casi siempre recibían una D y se delineaban en rojo, de donde viene la palabra redlining. Esta capa muestra las áreas y calificaciones de 1937 tal como las trazó Mapping Inequality. Las calificaciones son un registro de cómo la agencia juzgó los lugares en 1937; no dicen nada sobre las personas que viven allí hoy. Toque un área para ver su calificación y un enlace a su descripción de 1937 en Mapping Inequality. Solo para uso no comercial."
    settings:
      shade:
        label: "Sombrear las áreas (apagado muestra solo sus contornos y calificaciones)"

