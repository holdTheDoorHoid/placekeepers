layers:
  vacant_parcels:
    label: "Lotes y edificios vacíos"
    description: "Parcelas que probablemente están vacías, con qué tan seguros estamos y por qué. Combina el indicador de vacancia de la Ciudad con los registros de la Oficina de Evaluación de Propiedades, las huellas de edificios, las demoliciones, los casos de L&I y el mapa de uso del suelo, así que ninguna fuente por sí sola puede echarlo a perder."
    settings:
      min_confidence:
        label: "Mostrar las parcelas de las que estamos al menos así de seguros"
        options:
          "1":
            label: "Cualquier señal de que está vacía"
          "2":
            label: "Probable o muy probablemente vacías"
          "3":
            label: "Solo las muy probablemente vacías"
      kinds:
        label: "Mostrar"
        options:
          both:
            label: "Lotes y edificios"
          lots:
            label: "Solo lotes"
          buildings:
            label: "Solo edificios"
      listed:
        label: "Indicados como disponibles por las agencias de tierras de la Ciudad"
        options:
          any:
            label: "Cualquier parcela"
          available:
            label: "Solo las indicadas como disponibles"
      lens:
        label: "Colorear los lotes según"
        options:
          violence:
            label: "El lente de reducción de la violencia"
          heat:
            label: "El lente de calor y sombra"
          placemaking:
            label: "El lente de creación de lugares"
  hin_2025:
    label: "Red de Lesiones Graves"
    description: "Las calles donde ocurren la mayoría de las muertes y lesiones graves de tránsito en Filadelfia, según las trazó el programa Vision Zero de la Ciudad en 2025."
  shootings_hex:
    label: "Tiroteos, contados por zona"
    description: "Personas baleadas en el período elegido, contadas por hexágono de unas dos cuadras de ancho. Se muestra para dirigir el cuidado adonde más ayuda, no para etiquetar lugares como peligrosos."
    settings:
      window:
        label: "Período"
        options:
          m12:
            label: "Últimos 12 meses"
          m36:
            label: "Últimos 3 años"
  landcare_lots:
    label: "Lotes mantenidos por PHS LandCare"
    description: "Lotes vacíos que la Pennsylvania Horticultural Society ha limpiado y reverdecido, y que sigue cortando, mediante LandCare y Community LandCare. Es el cuidado que probaron los ensayos de Filadelfia."
  gardens:
    label: "Jardines comunitarios"
    description: "Jardines y granjas comunitarios apoyados por PHS o por el Neighborhood Gardens Trust, y jardines registrados en Parques y Recreación. La gente ya cuida estos lugares, así que nunca se muestran como vacíos."
  council_districts:
    label: "Distritos del Concejo Municipal"
    description: "Los diez distritos del Concejo Municipal como se trazaron en 2024, para que vea a qué oficina acudir."
    settings:
      names:
        label: "Mostrar los nombres"
  community_organizations:
    label: "Organizaciones comunitarias registradas (RCO)"
    description: "Grupos de vecinos registrados en la Ciudad, que se enteran de los cambios de zonificación en su área. Sus áreas a menudo se traslapan."
    settings:
      names:
        label: "Mostrar los nombres"
  neighborhoods:
    label: "Vecindarios"
    description: "Nombres y límites de los vecindarios, del mapa de vecindarios de OpenDataPhilly hecho por Abaca Labs."
    settings:
      names:
        label: "Mostrar los nombres"
  segments:
    label: "Seguridad en la calle, cuadra por cuadra"
    description: "Cada cuadra coloreada según el lente de seguridad en la calle: si está en la Red de Lesiones Graves, cuántas personas murieron o resultaron gravemente heridas allí al caminar o andar en bicicleta en los cinco años más recientes de los registros de PennDOT, si alguien murió allí en los últimos dos años, y si hay una escuela a 400 metros o menos. Mueva los controles deslizantes del lente para cambiar la mezcla. Una cuadra también dice cuántos postes incluye la Ciudad a lo largo de ella y cuántas de sus lámparas son LED, y las medidas para calmar el tránsito que la Ciudad incluye allí."
    settings:
      min_score:
        label: "Mostrar las cuadras con un puntaje de al menos"
        options:
          "1":
            label: "Cualquier puntaje mayor que cero"
          "20":
            label: "20 de 100"
          "40":
            label: "40 de 100"
          "60":
            label: "60 de 100"
  crashes:
    label: "Choques"
    description: "Choques reportados a PennDOT en Filadelfia de 2015 a 2024, coloreados según la gravedad de las lesiones. Elija los años, la gravedad de las lesiones y quiénes estaban involucrados. Los registros de PennDOT llegan casi un año después de los choques, así que las muertes más recientes aparecen como memoriales."
    settings:
      years:
        label: "Años"
        options:
          latest:
            label: "El año más reciente de los registros"
          recent:
            label: "Los cinco años más recientes"
          all:
            label: "Todos los años desde 2015"
      severity:
        label: "Gravedad de las lesiones"
        options:
          "3":
            label: "Alguien murió"
          "2":
            label: "Alguien murió o resultó gravemente herido"
          "1":
            label: "Alguien resultó herido"
          "0":
            label: "Todos los choques"
      mode:
        label: "Quiénes estaban involucrados"
        options:
          all:
            label: "Todos"
          walk_cycle:
            label: "Personas caminando o en bicicleta"
          walk:
            label: "Personas caminando"
          cycle:
            label: "Personas en bicicleta"
          motorcycle:
            label: "Personas en motocicleta"
  memorials:
    label: "Memoriales"
    description: "Personas que murieron en nuestras calles al caminar, andar en bicicleta o ir en un scooter, según los registros del Departamento de Policía sobre muertes en choques de tránsito desde 2019, cada una marcada con discreción donde ocurrió. Un nombre aparece solo cuando una lista pública de memoriales ya lo comparte, y cualquiera puede pedir que se retire un nombre o un marcador."
    settings:
      show_names:
        label: "Mostrar los nombres"
      all_fatal:
        label: "Recordar también a las personas que murieron en autos y en motocicletas"
  parking_reports:
    label: "Problemas de estacionamiento reportados (Laser Vision)"
    description: "Dónde las personas que usan la aplicación Laser Vision de Philly Bike Action reportaron vehículos que bloqueaban aceras, cruces peatonales, esquinas, rampas de la acera y carriles para bicicletas durante los 12 meses hasta la fecha de la leyenda, contados por zona de aproximadamente una cuadra de ancho. Muestra dónde las personas que usan una sola aplicación reportaron problemas, no todos los problemas. Una zona con menos de 5 reportes se deja fuera, para que nunca se vea un reporte individual. Muchos reportes en un mismo lugar son evidencia a favor de arreglos físicos: extensiones de la acera, bolardos, esquinas despejadas, carriles protegidos para bicicletas y zonas de carga."
    settings:
      kind:
        label: "Mostrar reportes de vehículos"
        options:
          all:
            label: "Que bloquean el paso de cualquiera de estas maneras"
          sidewalk:
            label: "En una acera"
          bike_lane:
            label: "En un carril para bicicletas"
          crosswalk:
            label: "En un cruce peatonal"
          corner:
            label: "En una esquina"
          ramp:
            label: "Bloqueando una rampa de la acera"
  street_poles:
    label: "Postes de la calle y las lámparas que la Ciudad incluye en su lista"
    description: "Cada poste de la calle que el Departamento de Calles incluye en su lista, con las lámparas que indica en ellos: LED, las más viejas de vapor de sodio de alta presión, o una lámpara de un tipo que no nombra. Muchos postes, como los de PECO y los de los semáforos, no indican ninguna lámpara. Esto es lo que la Ciudad ha instalado, no si una lámpara funciona esta noche: reporte una luz apagada a Philly311 con el número del poste. Se muestra de cerca, a unas pocas cuadras de ancho."
    settings:
      show:
        label: "Mostrar"
        options:
          all:
            label: "Todos los postes"
          lamps:
            label: "Postes con una lámpara que la Ciudad incluye en su lista"
          not_led:
            label: "Lámparas que la Ciudad no indica como LED"
  traffic_calming:
    label: "Medidas para calmar el tránsito que la Ciudad incluye en su lista"
    description: "Reductores de velocidad (cojines, lomos y mesas) que el Departamento de Calles ha puesto para que los conductores vayan más despacio en calles residenciales, con el día en que se puso cada uno. Los vecinos pueden pedírselos a la Ciudad para una calle residencial; las arterias y las carreteras estatales no califican. Una cuadra muestra cuántos tiene y desde cuándo, y una cuadra de la Red de Lesiones Graves donde hubo personas heridas dice si todavía no hay ninguno registrado."
  crossing_guards:
    label: "Puestos de guardias de cruce escolar"
    description: "Las esquinas donde la Ciudad pone a un guardia de cruce escolar, un servicio de seguridad que ayuda a los niños y a todos los demás a cruzar cerca de las escuelas al comienzo y al final del día escolar. Cada puesto nombra su esquina y la escuela más cercana a 400 metros o menos."
  basemap:
    label: "Mapa base"
    description: "Calles, edificios, parques, agua y nombres de lugares de OpenStreetMap, debajo de todo lo demás. Elija el aspecto gris para que los datos resalten, o apague el mapa base."
    settings:
      look:
        label: "Aspecto"
        options:
          light:
            label: "Claro, en color"
          muted:
            label: "Gris, para que los datos resalten"
  transit_stops:
    label: "Paradas de autobús y tranvía"
    description: "Cada parada de autobús y tranvía de SEPTA en Filadelfia, según los horarios actuales de SEPTA: las rutas que paran allí, cada cuánto pasa un autobús o tranvía en un día de semana, un sábado y un domingo típicos, cuándo empieza y termina el servicio, y cuántas personas suben allí en un día de semana promedio, según los conteos propios de SEPTA. Cada parada muestra lo que encuentran allí los pasajeros donde OpenStreetMap lo sabe, un refugio donde la lista de la propia Ciudad tiene uno, su prioridad según el lente de comodidad del transporte público, y lo que los vecinos pueden hacer al respecto. Las estaciones del metro, del El y de Regional Rail se pueden agregar en los ajustes."
    settings:
      service:
        label: "Mostrar paradas con"
        options:
          all:
            label: "Cualquier servicio"
          frequent:
            label: "Servicio frecuente: cada 15 minutos o menos al mediodía"
          long_wait:
            label: "Esperas largas: con menos frecuencia que cada 30 minutos al mediodía"
      color:
        label: "Colorear las paradas según"
        options:
          lens:
            label: "Prioridad según el lente de comodidad del transporte público"
          wait:
            label: "Cada cuánto pasa un autobús o tren al mediodía"
          boardings:
            label: "Cuántas personas suben cada día de semana"
      stations:
        label: "Mostrar también las estaciones del metro, del El y de Regional Rail"
  transit_routes:
    label: "Rutas de autobús, tranvía y tren"
    description: "Las calles y vías que sigue cada ruta de SEPTA en Filadelfia, según los horarios actuales de SEPTA, coloreadas según el tipo de vehículo. Elija las rutas frecuentes para ver dónde pasa un autobús o tren al menos cada 15 minutos al mediodía."
    settings:
      service:
        label: "Mostrar rutas"
        options:
          all:
            label: "Todas las rutas"
          frequent:
            label: "Rutas frecuentes: cada 15 minutos o menos al mediodía"
  stop_amenities:
    label: "Refugios y bancos en las paradas"
    description: "Lo que encuentran los pasajeros en las paradas de autobús y tranvía que OpenStreetMap conoce: un refugio o un techo, un banco pero ningún refugio, ninguno de los dos, o todavía sin revisar. \"Todavía sin revisar\" significa que nadie lo ha registrado aún; no significa que la parada no tenga nada. OpenStreetMap tiene hasta ahora solo más o menos una de cada diez paradas (la lista completa de paradas de SEPTA es su propia capa). Los vecinos pueden revisar paradas con la aplicación de teléfono StreetComplete, y sus respuestas aparecen aquí en más o menos una semana."
    settings:
      show:
        label: "Mostrar"
        options:
          all:
            label: "Todas las paradas"
          surveyed:
            label: "Paradas que alguien ha revisado"
          unsurveyed:
            label: "Paradas todavía sin revisar"
  city_shelters:
    label: "Refugios de autobús que la Ciudad incluye en su lista"
    description: "Los refugios de autobús de la lista propia de la Ciudad, que instala y mantiene con su socio de publicidad, con la parada de SEPTA a la que sirve cada uno. Una parada con un refugio de la Ciudad cuenta como protegida en el lente de comodidad del transporte público. Donde OpenStreetMap dice que una parada no tiene refugio pero la Ciudad indica uno, la página de la parada dice que los dos no coinciden, y una revisión en persona lo aclara. La lista se cambió por última vez en enero de 2025, así que puede faltar un refugio que se haya puesto o quitado desde entonces."
  heat_tracts:
    label: "Vulnerabilidad al calor por vecindario"
    description: "Qué tan fuerte golpea el calor del verano a las personas de cada sector censal, según el Índice de Vulnerabilidad al Calor de la Ciudad (Departamento de Salud Pública y Oficina de Sostenibilidad, datos de 2017 a 2019). Reúne la exposición al calor, qué tan caluroso se pone el sector en los días de verano según lo miden los satélites, y la sensibilidad al calor, cuántas de las personas que viven allí corren más riesgo con el calor (doce medidas de edad, salud, ingresos, educación, idioma y raza, tal como la Ciudad armó el índice). Los sectores se sombrean por quintos de la ciudad, y el quinto más oscuro es el de más riesgo. La exposición y la sensibilidad se pueden mostrar por separado en los ajustes."
    settings:
      measure:
        label: "Sombrear los sectores según"
        options:
          vulnerability:
            label: "Vulnerabilidad al calor: el calor y las personas en riesgo juntos"
          exposure:
            label: "Exposición al calor: qué tanto calor hace"
          sensitivity:
            label: "Sensibilidad al calor: cuántas personas están en riesgo con el calor"
      priority:
        label: "Delinear los sectores que la Ciudad califica como muy altos"
  city_trees:
    label: "Árboles de calles y parques"
    description: "Cada árbol del inventario de árboles de Parques y Recreación (2025): los árboles que la Ciudad cuida en sus aceras y en sus parques, no los árboles de patios privados, con el tipo de cada árbol y el tamaño de su tronco. Se muestra de cerca, a unas pocas cuadras de ancho. Los árboles pequeños, con un tronco de menos de 4 pulgadas de ancho, suelen ser jóvenes, y TreePhilly pide que los árboles jóvenes reciban unos 20 galones de agua por semana de marzo a diciembre."
    settings:
      show:
        label: "Mostrar"
        options:
          all:
            label: "Todos los árboles"
          big:
            label: "Árboles grandes de sombra: un tronco de al menos 12 pulgadas de ancho"
          small:
            label: "Árboles pequeños: un tronco de menos de 4 pulgadas de ancho, a menudo jóvenes"
  floodplain:
    label: "Llanura aluvial"
    description: "Dónde los mapas de inundación de la FEMA esperan inundaciones, como los publica la Ciudad (2023): la llanura aluvial con 1 por ciento de probabilidad anual, donde una inundación tiene al menos 1 probabilidad en 100 cada año, y la zona con 0.2 por ciento de probabilidad anual junto a ella (a menudo llamadas llanuras aluviales de 100 años y de 500 años). Todo lo que se construya allí debe seguir las reglas de la Ciudad para llanuras aluviales. El reverdecimiento que absorbe la lluvia ayuda allí, con plantas que aguantan el suelo mojado."
    settings:
      zones:
        label: "Mostrar"
        options:
          both:
            label: "Las zonas con 1 por ciento y con 0.2 por ciento de probabilidad anual"
          high:
            label: "Solo la llanura aluvial con 1 por ciento de probabilidad anual"
  benches:
    label: "Bancos, tal como están en OpenStreetMap"
    description: "Lugares para sentarse: los bancos que la gente ha agregado a OpenStreetMap, el mapa libre que cualquiera puede mejorar, con si cada uno tiene respaldo donde el mapa lo dice. A OpenStreetMap le faltan muchos bancos, así que una calle sin ninguno en el mapa puede tener algunos. Cualquiera puede agregar un banco con la aplicación de teléfono StreetComplete, y aparece aquí en más o menos una semana."
  picnic_tables:
    label: "Mesas de picnic, tal como están en OpenStreetMap"
    description: "Mesas de picnic que la gente ha agregado a OpenStreetMap, sobre todo en parques, con si cada una está bajo techo donde el mapa lo dice. A OpenStreetMap le faltan muchas. Cualquiera puede agregar una con la aplicación de teléfono StreetComplete, y aparece aquí en más o menos una semana."
  drinking_water:
    label: "Agua potable, tal como está en OpenStreetMap"
    description: "Fuentes de agua potable y grifos que la gente ha agregado a OpenStreetMap, con si se puede llenar una botella donde el mapa lo dice. OpenStreetMap conoce solo unas pocas docenas en la ciudad, así que las fuentes de agua potable que enumera Parques y Recreación son su propia capa. Cualquiera puede agregar una fuente con la aplicación de teléfono StreetComplete, y aparece aquí en más o menos una semana."
  toilets:
    label: "Baños públicos, tal como están en OpenStreetMap"
    description: "Baños que la gente ha agregado a OpenStreetMap, con quién puede usarlos, si hay un costo y el acceso en silla de ruedas donde el mapa lo dice. Los baños cerrados al público se dejan fuera. OpenStreetMap conoce menos de cien en la ciudad. Cualquiera puede agregar uno con la aplicación de teléfono StreetComplete, y aparece aquí en más o menos una semana."
  bookcases:
    label: "Little Free Libraries, tal como están en OpenStreetMap"
    description: "Estantes públicos de libros, a menudo llamados Little Free Libraries, donde cualquiera puede tomar o dejar un libro, tal como la gente los ha agregado a OpenStreetMap. Faltan muchos. Cualquiera puede agregar uno con la aplicación de teléfono StreetComplete, y aparece aquí en más o menos una semana."
  park_water:
    label: "Fuentes de agua potable en parques"
    description: "Fuentes de agua potable y estaciones para llenar botellas en parques y centros recreativos, como las enumera Parques y Recreación de Filadelfia. Una dentro de un centro recreativo se puede usar cuando el centro está abierto."
  libraries:
    label: "Sucursales de la Free Library"
    description: "Cada sucursal de la Free Library of Philadelphia que la Ciudad incluye en su lista, con su dirección, su teléfono y un enlace a su página con el horario. Las bibliotecas son gratuitas y están abiertas a todos."
  recreation_centers:
    label: "Centros recreativos"
    description: "Dónde Parques y Recreación de Filadelfia tiene programas: centros recreativos, centros para adultos mayores y centros de educación ambiental, con si cada uno tiene un gimnasio, como los enumera la Ciudad."
  pools:
    label: "Piscinas y zonas de juegos de agua"
    description: "Piscinas, zonas de juegos de agua y rociadores de la Ciudad, lugares para refrescarse en los días de calor, con si cada uno está en servicio este año según lo enumera Parques y Recreación de Filadelfia. Las piscinas abren solo en la temporada de verano; pregunte a Parques y Recreación por los horarios de esta semana."
    settings:
      show:
        label: "Mostrar"
        options:
          in_service:
            label: "Solo los que están en servicio este año"
          all:
            label: "Todos, también los que no están en servicio"
  cooling_centers:
    label: "Centros para refrescarse y para calentarse"
    description: "Lugares que la Oficina de Manejo de Emergencias de la Ciudad indica como sitios para calentarse o refrescarse: bibliotecas, centros recreativos, socios comunitarios y centros comunitarios de la Autoridad de Vivienda de Filadelfia, con si cada uno figuraba como abierto, su horario y lo que ofrece, según estaba indicado el día en que este mapa copió la lista por última vez. No es en vivo: los sitios abren y cierran según el clima, así que llame al sitio o a Philly311 antes de ir. Una biblioteca o un centro recreativo que también es un sitio aparece una sola vez."
    settings:
      kind:
        label: "Sitios para"
        options:
          any:
            label: "Calor o frío"
          cooling:
            label: "Refrescarse en tiempo caluroso"
          warming:
            label: "Calentarse en tiempo frío"
      show:
        label: "Mostrar"
        options:
          all:
            label: "Todos, abiertos o cerrados según la lista"
          open:
            label: "Solo los indicados como abiertos"
  dumping:
    label: "Basura tirada ilegalmente reportada al 311"
    description: "Cuadras donde alguien le preguntó a Philly311 por basura tirada ilegalmente en los últimos 90 días, con cuántas solicitudes y si alguna sigue abierta. Contado por cuadra, nunca por dirección, y sin nada sobre quién reportó. Una solicitud muestra que alguien lo notó y pidió ayuda; algunas cuadras piden con más frecuencia que otras, así que pocas solicitudes no significan una cuadra limpia."
    settings:
      show:
        label: "Mostrar cuadras con"
        options:
          any:
            label: "Cualquier solicitud en los últimos 90 días"
          open:
            label: "Una solicitud todavía abierta"
  dark_lights:
    label: "Luces de calle y de callejón reportadas como apagadas"
    description: "Cuadras donde alguien le pidió a Philly311 que arreglara una luz de calle o de callejón que estaba apagada en los últimos 90 días, con cuántas solicitudes y si alguna sigue abierta, junto a los postes y las lámparas que la Ciudad incluye en su lista a lo largo de la cuadra. Contado por cuadra, nunca por dirección, y sin nada sobre quién reportó."
    settings:
      show:
        label: "Mostrar cuadras con"
        options:
          any:
            label: "Cualquier solicitud en los últimos 90 días"
          open:
            label: "Una solicitud todavía abierta"
  graffiti:
    label: "Grafiti reportado al 311"
    description: "Cuadras donde alguien le pidió a Philly311 que quitara grafiti en los últimos 90 días, con cuántas solicitudes y si alguna sigue abierta. Contado por cuadra, nunca por dirección, y sin nada sobre quién reportó."
    settings:
      show:
        label: "Mostrar cuadras con"
        options:
          any:
            label: "Cualquier solicitud en los últimos 90 días"
          open:
            label: "Una solicitud todavía abierta"
  public_art:
    label: "Arte público"
    description: "Murales, esculturas y estatuas, mosaicos y otro arte público, de la lista Percent for Art de la Ciudad, OpenStreetMap y Wikidata. Cuando dos o tres de ellas incluyen la misma obra, el mapa la muestra una vez y enlaza a cada una. Las obras de arte que recuerdan a alguien se muestran solo como obras conmemorativas, sin nombres. Mural Arts Philadelphia tiene la lista más grande de los murales de la ciudad en su propio sitio; sus condiciones no permiten copiarla, así que el mapa enlaza a ella. Si falta una obra, agréguela a OpenStreetMap y aparece aquí en más o menos una semana."
    settings:
      murals:
        label: "Murales y pinturas de pared"
      sculptures:
        label: "Esculturas y estatuas"
      mosaics:
        label: "Mosaicos"
      other:
        label: "Otros tipos de arte"
      inside:
        label: "Obras dentro de edificios"
  playgrounds:
    label: "Parques infantiles"
    description: "Los parques infantiles que enumera Parques y Recreación de Filadelfia, con las edades a las que está destinado cada uno y el año en que se instaló cuando la Ciudad lo dice. Un parque a menudo tiene dos, uno para niños más chicos y otro para más grandes. La página de un lote nombra el parque infantil más cercano y qué tan lejos está en línea recta."
  walkability:
    label: "Qué tan caminable es cada zona (EPA)"
    description: "El Índice Nacional de Caminabilidad de la Agencia de Protección Ambiental de EE. UU. (EPA) para cada grupo de bloques censales, un área de unas pocas cuadras, según su Smart Location Database (2021, con datos de más o menos 2017 a 2019). Califica de 1 a 20 qué tan bien una zona favorece caminar, según cuatro medidas: cuántas esquinas hay, qué tan cerca está la parada de transporte público más cercana, y dos medidas de qué tan bien se mezclan viviendas, empleos y tiendas. Las áreas se sombrean por quintos de los grupos de bloques de Filadelfia, o según las clases propias de la EPA, que comparan con todo el país. Cada medida se puede mostrar por separado en los ajustes. Los grupos de bloques se recortan a la tierra de la ciudad, así que los ríos quedan despejados."
    settings:
      measure:
        label: "Sombrear las áreas según"
        options:
          index:
            label: "El índice de caminabilidad: las cuatro medidas juntas"
          corners:
            label: "Esquinas: qué tan conectadas están las calles"
          transit:
            label: "Transporte público: qué tan cerca está la parada más cercana"
          mix:
            label: "Una mezcla de viviendas, empleos y tiendas"
      compare:
        label: "Comparar con"
        options:
          city:
            label: "Filadelfia: quintos de los grupos de bloques de la ciudad"
          nation:
            label: "Todo el país: las clases propias de la EPA"
  walking_distance:
    label: "Personas y lugares a poca distancia a pie"
    description: "Para cada hexágono de unas dos cuadras de ancho: cuántas personas viven a 5 minutos a pie de su centro, según el censo de 2020; cuántos de siete tipos de lugares de todos los días están a 10 minutos a pie (una biblioteca, un centro recreativo, una piscina o zona de juegos de agua, una fuente de agua potable en un parque, una escuela, una tienda de comestibles o un mercado que acepta SNAP, y una parada de autobús, tranvía o tren); o cuántas esquinas hay a 5 minutos a pie. Una caminata de 5 minutos se cuenta como 400 metros y una de 10 minutos como 800 metros en línea recta, lo que llega un poco más lejos que caminar por las calles y cruza vías de tren, autopistas y ríos que las personas a pie no pueden cruzar."
    settings:
      measure:
        label: "Sombrear los hexágonos según"
        options:
          people:
            label: "Personas que viven a 5 minutos a pie"
          places:
            label: "Tipos de lugares de todos los días a 10 minutos a pie"
          corners:
            label: "Esquinas a 5 minutos a pie"
  traffic_stress:
    label: "Estrés del tráfico para personas en bicicleta (DVRPC)"
    description: "Qué tan estresante es andar en bicicleta por cada calle, según la califica la Comisión Regional de Planificación del Valle del Delaware a partir del número de carriles, qué tan rápido va el tráfico y el tipo de carril para bicicletas, si lo hay: el nivel 1 sirve para la mayoría de las personas de todas las edades, el nivel 2 para la mayoría de los adultos, el nivel 3 solo para ciclistas con confianza, y el nivel 4 solo para los más intrépidos. Donde los dos sentidos de una calle difieren, se muestra el que causa más estrés. Las calificaciones vienen de los modelos de DVRPC y de los límites de velocidad señalizados, no de andar en bicicleta por cada calle."
    settings:
      show:
        label: "Mostrar"
        options:
          all:
            label: "Todas las calles que califica DVRPC"
          stressful:
            label: "Solo calles con estrés: niveles 3 y 4"
          calm:
            label: "Solo calles tranquilas: niveles 1 y 2"
  displacement_watch:
    label: "Observación del desplazamiento: señales de que los precios están subiendo"
    description: "Áreas (sectores censales) con al menos dos de estas señales, al menos una de ellas sobre los precios mismos (las primeras tres): casas que se venden por mucho más que cinco años antes, más rápido que en toda la ciudad; avalúos de la Ciudad que suben mucho más rápido que los de la ciudad; el Análisis del Valor de Mercado de la Ciudad que halla precios que se alejan de lo que pueden pagar los residentes de muchos años; empresas que compran muchas de las casas que se venden; al menos tres de cada cinco casas alquiladas; o muchos inquilinos que pagan la mitad de sus ingresos o más en alquiler (agregado por el responsable del proyecto el 2026-10-09). El reverdecimiento y otras mejoras pueden subir aún más los precios, así que donde una sugerencia de reverdecer un lote, plantar árboles, hacer un lugar para sentarse, empezar un jardín o pedir arte, o un lote que la Ciudad indica como disponible, está en una de estas áreas, su tarjeta agrega maneras de proteger a los vecinos. Esto muestra señales en registros públicos, no un pronóstico, y no dice nada sobre quién vive aquí. Toque un área para ver sus señales y lo que se midió para cada una y, como contexto, el alquiler mediano, el ingreso mediano del hogar y cuántas casas están vacías, según la encuesta de la Oficina del Censo; cada número de la encuesta viene con su margen de error."
    settings:
      shade:
        label: "Sombrear las áreas (apagado muestra solo sus contornos)"
  historic_districts:
    label: "Distritos históricos"
    description: "Los distritos históricos locales de la Comisión Histórica de Filadelfia. Los cambios en los edificios y lotes de un distrito pueden necesitar la revisión de la Comisión, incluso un mural, una cerca o un jardín: pregunte primero a la Comisión (215 686 7660). La Ciudad pide a todos que confirmen con la Comisión el estado histórico de una propiedad. Toque un distrito para ver su nombre y el día en que se designó."
  historic_properties:
    label: "Propiedades en el registro histórico"
    description: "Propiedades del Registro de Lugares Históricos de Filadelfia, cada una su propia parcela, incluidas por sí solas o como parte de un distrito histórico (se muestran de cerca). Los cambios aquí pueden necesitar la revisión de la Comisión Histórica: pregúnteles primero (215 686 7660)."
  zoning_overlays:
    label: "Zonificación superpuesta"
    description: "Áreas donde el Código de Zonificación agrega sus propias reglas encima de la zonificación base: conservación de vecindarios, calles comerciales, protección contra inundaciones y laderas empinadas, límites a la pavimentación cerca del Wissahickon, alturas cerca del aeropuerto, letreros y más. Muchas se traslapan, y unas pocas cubren la mayor parte de la ciudad. Toque un punto para ver cada zona superpuesta que hay allí, con su sección del Código de Zonificación. Las zonas superpuestas pueden cambiar lo que se permite; consulte con la Ciudad antes de planear."
    settings:
      show:
        label: "Mostrar"
        options:
          all:
            label: "Distritos superpuestos y otras reglas especiales"
          districts:
            label: "Solo distritos superpuestos"
  hearings:
    label: "Audiencias por venir"
    description: "Audiencias fijadas ante la Junta de Ajuste de Zonificación, la Junta de Revisión de L&I, la Junta de Normas de Construcción y las otras juntas de la Ciudad sobre una propiedad, según los registros de apelaciones de la Ciudad, con el día, la hora y el tipo de apelación. Cualquiera puede participar en una audiencia de zonificación; toque una para ver cómo, y para abrir la página del lote. Quién presentó una apelación se muestra solo en la página de ese lote, nunca en el mapa."
    settings:
      boards:
        label: "Mostrar"
        options:
          all:
            label: "Todas las juntas"
          zoning:
            label: "Solo la Junta de Ajuste de Zonificación"
  brownfields:
    label: "Sitios brownfield (EPA)"
    description: "Un brownfield es un terreno que pudo haber tenido contaminación. Aquí se muestran propiedades donde una subvención federal para brownfields pagó una evaluación o una limpieza, según los registros de la EPA. No es un mapa de todo el suelo contaminado, y no dice si un sitio está contaminado hoy. Haga analizar el suelo antes de cultivar alimentos en uno de estos sitios o cerca de él."
  aerial_photos:
    label: "Fotos aéreas por año"
    description: "Fotografías aéreas de toda la ciudad, tomadas desde un avión: las de la propia Ciudad de cada año del que las tiene desde 1996 (cada primavera, casi todos los años de marzo a mayo), y otras más antiguas que aloja la Ciudad, de la Comisión Regional de Planificación del Valle del Delaware (1959 y 1975) y del Servicio Geológico de EE. UU. (1999). Pase por los años para ver qué había antes en una cuadra: casas que se derribaron, lotes que se despejaron, jardines que crecieron. Las fotos vienen directo de los servidores de la Ciudad cuando esta capa está activada, y se dibujan debajo de todo lo demás en el mapa. Los años más antiguos son menos nítidos, y las fotos hasta 2000 son en blanco y negro."
