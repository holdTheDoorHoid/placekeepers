lenses:
  violence:
    label: "减少暴力"
    description: "根据在费城进行的随机试验，清理、绿化或封闭哪里最有可能减少附近的枪支暴力。"
    factors:
      untreated_vacancy:
        label: "尚未处理的空地或敞开的废弃建筑"
        explain: "费城的随机试验发现，把空地绿化，并让废弃房屋装上能用的门窗，减少了附近的枪支暴力。已经按这种方式处理过的地方得 0 分：PHS LandCare 维护的地块，以及业主在 L&I 发出通知后修好了门窗的建筑。其他每一块空地或每一栋空置建筑，都得 100 分。"
      shootings_nearby:
        label: "最近三年附近的枪击事件"
        explain: "过去三年内，大约四分之一英里范围内（这个地点所在的六边形，以及周围的六个六边形）中枪的人数，来自警察局的枪击受害者记录。排名是地图上枪击较少的地点所占的比例。试验测得，处理过的地点周围枪击减少，所以在发生枪击的地方，关怀的帮助最大。"
      poverty:
        label: "社区的贫困率"
        explain: "这个地点所在人口普查区里，生活在贫困线以下的人所占的比例（人口普查局调查，2020 年到 2024 年）。排名是地图上位于贫困率较低的人口普查区中的地点所占的比例。在全市范围的试验中，枪支暴力的下降出现在低于贫困线的社区。"
      canopy_gap:
        label: "附近树木很少"
        explain: "大约四分之一英里范围内土地上的树冠，来自市政府 2018 年的树冠调查。排名是地图上周围树木更多的地点所占的比例，所以树木越少排名越高。行道树与较少的犯罪有关，但证据不一，而且取决于树种植的位置。"
    presets:
      research:
        label: "依据研究"
      vacancy_only:
        label: "只看空置"
  heat:
    label: "高温和树荫"
    description: "种树或把空地绿化，在哪里最能让人凉快：夏天高温对人冲击最大的社区里的地块，周围树荫很少，而且有很多人能感受到差别。"
    factors:
      heat_vulnerability:
        label: "社区的高温脆弱度"
        explain: "夏天的高温对这个地块所在人口普查区的人冲击有多大，依据市政府的高温脆弱性指数（公共卫生部和可持续发展办公室，2017 年到 2019 年的数据）：这个人口普查区在夏天有多热（用卫星测量），以及住在那里的人当中，有多少人因年龄、健康、收入等原因，在高温中面临更大的风险。排名是地图上位于分数较低的人口普查区的地点所占的比例。"
      few_trees:
        label: "附近树木很少"
        explain: "大约四分之一英里范围内土地上的树冠，来自市政府 2018 年的树冠调查，与“减少暴力”视角用的是同一个衡量方法。排名是地图上周围树木更多的地点所占的比例，所以树木越少排名越高。树木靠树荫和叶子散发的水分，让街道凉快下来。研究一致认为它们在白天降温，在树冠覆盖一个街区大约 40% 以上的地方降温最多，夜间则较少。"
      few_street_trees:
        label: "街区上的市政府树木很少"
        explain: "在公园与休闲部 2025 年树木清单里，这个地块 100 米范围内的树，也就是市政府在街道和公园里养护的树，不包括私人院子里的树。排名是地图上周围这类树更多的地点所占的比例，所以树木越少排名越高。行道树为人们行走和等候的人行道遮阴。"
      people_nearby:
        label: "这样做能惠及的人"
        explain: "这个地块所在人口普查区每平方公里土地上的居民人数（人口普查局调查，2020 年到 2024 年）。排名是地图上位于人口较少的人口普查区的地点所占的比例。人越多，感受到降温的人就越多。人口只是衡量改善能惠及多少人；它本身从来不是需求的衡量标准。"
    presets:
      balanced:
        label: "均衡"
      people_at_risk:
        label: "风险最高的人群"
      fewest_trees:
        label: "树木最少"
  placemaking:
    label: "场所营造"
    description: "一块空地最有可能变成人们每天使用的公共场所，例如菜园、小型公园、树荫下可以坐的地方，或者展示艺术的地方：步行很短的距离内有很多邻居和日常场所、离公园和公共艺术都很远的地块。这关乎使用和欢迎，与犯罪无关。"
    factors:
      neighbors:
        label: "步行 5 分钟范围内的人口"
        explain: "有多少人住在这个地块步行 5 分钟的范围内，按直线距离 400 米计算，来自 2020 年人口普查。排名是地图上周围人口较少的地点所占的比例。邻居越多，菜园、长椅或壁画能服务的人就越多。人口只是衡量一个项目能惠及多少人。"
      everyday_places:
        label: "步行 10 分钟范围内的日常场所"
        explain: "七类日常场所中，有几类在步行 10 分钟的范围内，按直线距离 800 米计算：图书馆、休闲中心、游泳池或喷水游乐区、公园里的饮水器、学校、接受 SNAP 的杂货店或市场，以及公交、有轨电车或火车站。排名是地图上日常场所较少的地点所占的比例。前往这些地方的人会路过这个地块。路过的人对一个新的公共场所有多大帮助，取决于街道和场所本身，所以证据不一。"
      walkability:
        label: "步行便利度"
        explain: "EPA 的全国步行指数，按这个地块所在的街区组计算：街角、公共交通有多近，以及住宅、工作和商店的混合程度（大约 2017 年到 2019 年的数据）。排名是地图上位于步行较不便利地区的地点所占的比例。人们走路的地方，会有更多人使用地块上的场所。对适合步行的地方所做的研究，发现的是相关性，其含义取决于具体的地方，所以证据不一。"
      far_from_park:
        label: "离公园很远"
        explain: "从这个地块到公园与休闲部最近的公园用地边缘的直线距离：公园、游乐场、休闲中心、广场、绿道和自然区，但不包括它的作业场、高尔夫球场或种了植物的道路中央分隔带。排名是地图上离公园更近的地点所占的比例，所以越远排名越高。离公园很远的地块，可以给邻居提供他们缺少的开放空间。"
      no_art_nearby:
        label: "附近没有公共艺术"
        explain: "从这个地块到市政府“艺术百分比”名单或 Wikidata 上最近一件公共艺术作品的直线距离，不包括建筑物内的作品。排名是地图上离作品更近的地点所占的比例，所以越远排名越高。这两份名单只包含费城艺术作品的一部分：Mural Arts 的壁画和只在 OpenStreetMap 上标注的作品都不在其中，所以也请看看“公共艺术”图层。艺术因为美和自豪感而受欢迎；没有研究把它与暴力减少联系起来。"
      commercial_corridor:
        label: "在商业走廊上或附近"
        explain: "当地块位于市政府的某条商业走廊上，也就是规划委员会在 2011 年到 2017 年调查过的购物街和购物中心，或者距离它不到 50 米时，得满分 100，否则得 0。商店每天都会把人带到这个地块旁边。繁忙的购物街也可能带来问题，所以证据不一。"
    presets:
      balanced:
        label: "均衡"
      most_neighbors:
        label: "邻居最多"
      where_people_walk:
        label: "人们已经在步行的地方"
      far_from_a_park:
        label: "离公园很远"
  street_safety:
    label: "街道安全"
    description: "步行和骑自行车的人风险最大的街道路段，依据事故记录、市政府的高伤害路网和附近的学校。"
    factors:
      high_injury_network:
        label: "位于高伤害路网上"
        explain: "市政府发现，大多数交通死亡和重伤事故都发生在这些街道上，它们约占费城所有街道的 12%。"
      walking_cycling_harm:
        label: "最近 5 年步行或骑车时遇难或受重伤的人"
        explain: "在 PennDOT 事故记录最近的五年里，在这个路段或其路口步行或骑车时遇难或受重伤的人数。排名是全市路段中人数更少的所占的比例。"
      recent_death:
        label: "最近 2 年这里有人遇难"
        explain: "最近两年内，在这个路段或其路口有人遇难，来自警察局的致命事故记录，每晚更新。"
      school_nearby:
        label: "400 米内有学校"
        explain: "孩子们在这里步行上学和放学。400 米大约是步行五分钟。"
    presets:
      research:
        label: "依据研究"
      recorded_harm:
        label: "只看有记录的伤害"
  transit_comfort:
    label: "公交舒适度"
    description: "公交车站和有轨电车站里，哪里的候车亭、长椅或树荫最能帮到乘客：乘客多的车站、调查发现没有可坐、可遮蔽之处的车站、在炎热社区里几乎没有树荫的车站、位于高伤害路网上的车站，以及等候时间长的车站。还没有人调查过的车站，它的候车亭和长椅各算一半。"
    factors:
      riders:
        label: "每个工作日上车的人数"
        explain: "平均每个工作日有多少人在这里上车，来自 SEPTA 自己的统计。排名是乘客较少的车站所占的比例。乘客越多，从候车亭或长椅得到帮助的人就越多；市政府的目标是在最繁忙的 15% 的公交站设置候车亭。SEPTA 还没有统计过的车站，不计入这个因素。"
      no_shelter:
        label: "没有候车亭"
        explain: "调查发现没有候车亭的，得 100；有候车亭、整个车站在屋顶下，或市政府自己的公交候车亭名单上这里有一个的，得 0（不管 OpenStreetMap 怎么说）。还没有人调查过的车站算 50，也就是一半，所以绝不会把一个车站评为缺少候车亭，而它其实可能有；请去调查一下，就能知道。在明尼阿波利斯和圣保罗的一项研究中，在没有长椅或候车亭的车站等车的乘客，觉得等待的时间比实际更长。"
      no_bench:
        label: "没有长椅"
        explain: "调查发现没有长椅的，得 100；有的，得 0；还没有人调查过的，得 50，也就是一半。同一项研究发现，有长椅会让等待感觉更短。"
      little_shade:
        label: "附近树荫很少"
        explain: "车站周围大约两个街区范围内土地上的树冠，来自市政府 2018 年的树冠调查。排名是周围树木更多的车站所占的比例，所以树木越少排名越高。树荫能让在太阳下等车的人凉快，但帮助有多大，取决于气候和提供树荫的是什么。"
      heat:
        label: "夏天炎热的社区"
        explain: "这个车站所在人口普查区在夏天有多热，来自市政府高温脆弱性指数中的高温暴露部分（卫星测得的地表温度，以及这个人口普查区有多少面积是铺装、建筑或绿地）。排名是位于较凉爽人口普查区的车站所占的比例。"
      high_injury_network:
        label: "位于高伤害路网上"
        explain: "这个车站位于费城大多数交通死亡和重伤事故发生的街道上或路口，所以很多乘客要穿过那条街才能到达车站或离开车站。其他地方的研究发现，行人参与的事故集中发生在宽阔道路上繁忙的公交站，所以在这些地方，安全的过街设施最重要。"
      long_wait:
        label: "中午等候时间长"
        explain: "工作日上午 10 点到下午 2 点，公交车或有轨电车的典型间隔时间，来自 SEPTA 的时刻表。排名是等候时间较短的车站所占的比例。等候时间长的时候，座位和屋顶最重要。中午没有服务的车站，不计入这个因素。"
    presets:
      balanced:
        label: "均衡"
      busiest_first:
        label: "先看最繁忙的车站"
      heat_and_shade:
        label: "高温和树荫"

suggestions:
  clean_and_green:
    label: "清理并绿化这个地块"
    summary: "清除垃圾、平整土地、种草和几棵树、装一圈低矮的立柱和横杆围栏，并定期割草。"
    cost: "前期约 1,100 到 1,500 美元，之后每年 150 到 300 美元（待向 PHS 确认）"
  seal_abandoned_building:
    label: "请市政府封闭这栋建筑"
    summary: "报告一栋敞开的废弃建筑，让市政府把它的门窗封起来。"
    cost: "报告免费"
  plant_shade_trees:
    label: "在这个地块上和沿地块种植遮阴树"
    summary: "这一带的树荫，比这张地图上至少一半的地点周围都少（市政府 2018 年的树冠调查）。树木用树荫和叶子散发的水分，让一个街区凉快下来。业主提出请求时，市政府会在人行道上免费种植行道树；TreePhilly 则免费赠送树木，可以种在私人土地的地里。请选择会长高的树，这样既能给街道遮阴，邻居又仍然能看到地块的另一边。"
    cost: "市政府和 TreePhilly 提供免费的树。幼树从 3 月到 12 月，每周大约需要 20 加仑水"
  cool_green_lot:
    label: "把这个地块绿化，给街区降温"
    summary: "按市政府的高温脆弱性指数，夏天高温对这里的人的冲击，比这张地图上至少一半的地点周围都大。裸露的泥土、碎石和瓦砾会吸收阳光，而草地、花圃，尤其是树木，能让地块凉快得多，并为旁边的人行道遮阴。不管这个地块将来变成什么，菜园、清理并绿化的地块，还是侧院，都请在里面种遮阴树，并选择会长高的树，让地块依然看得通透。"
    cost: "从免费的树（TreePhilly）到完整的清理并绿化，前期约 1,100 到 1,500 美元（待向 PHS 确认）"
  seating_and_shade:
    label: "营造一个树荫下可以坐的地方"
    summary: "住在这个地块步行 5 分钟范围内的人，比这张地图上至少一半的地点周围都多。在遮阴树下放几条长椅或一张野餐桌，可以让它变成邻居们停下来、歇一歇、碰面的地方。请问问邻居们会用什么，选结实的座椅，并种会长高的树，让地块依然看得通透。还要计划好谁来保持清洁。"
    cost: "从免费的树（TreePhilly）和用开放式设计自己做的一条长椅，到几千美元。Feet First Philly 的公共空间小额资助提供 500 到 2,500 美元"
  community_garden:
    label: "开办一个社区菜园"
    summary: "这个地块比这张地图上至少一半的地点离公园更远，而且步行 5 分钟范围内至少住着 1,000 人。社区菜园给邻居们带来绿色空间、食物和花，也给他们一个碰面的理由。它需要每周都回来的园丁、水，以及使用这块土地的许可。菜园运转起来之后，Neighborhood Gardens Trust 可以帮助让它永远是一个菜园。"
    cost: "从几个种植箱，到加上土壤、围栏和水的几千美元。土地银行的 Urban Garden Agreement（城市菜园协议）费用是 1 美元"
  art_request:
    label: "询问壁画或其他艺术"
    summary: "很多人住在这个地块周围，而在步行 5 分钟范围内，市政府“艺术百分比”名单或 Wikidata 上没有任何一件作品。这些名单漏掉了许多壁画，所以请先看看“公共艺术”图层和 Mural Arts 自己的壁画名单。面对地块的一面空白墙壁可以画一幅壁画：Mural Arts 在自己的网站上接受墙壁业主的申请。艺术因为美和自豪感而受欢迎；没有研究把它与暴力减少联系起来。"
    cost: "向 Mural Arts 询问是免费的"
  report_dumping:
    label: "向 Philly311 报告非法倾倒垃圾"
    summary: "过去 90 天内，有人就这个地块所面对的一个街区上的非法倾倒垃圾问题，向 Philly311 提出了请求，而且这个请求仍未办结。如果垃圾还在，请附上照片，再提出您自己的请求，让市政府把它清走。报告针对的是垃圾，绝不是针对丢垃圾的人。"
    cost: "报告免费"
  report_dark_light:
    label: "向 Philly311 报告不亮的路灯"
    summary: "过去 90 天内，有人就这个地块所面对的一个街区上不亮的街灯或小巷灯，请 Philly311 修理，而且这个请求仍未办结。如果灯还是不亮，请再提出您自己的请求；如果灯杆有编号，请附上编号。有灯的街道，有助于邻居在天黑后使用街道和这个地块。"
    cost: "报告免费"
  report_graffiti:
    label: "向 Philly311 报告涂鸦"
    summary: "过去 90 天内，有人请 Philly311 清除这个地块所面对的一个街区上的涂鸦，而且这个请求仍未办结。如果涂鸦还在，请附上照片，再提出您自己的请求，让市政府把它清除。如果邻居们更希望那面墙上有艺术作品，请向墙的业主询问壁画的事。"
    cost: "报告免费"
  memorial_or_ghost_bike:
    label: "纪念物或幽灵单车"
    summary: "纪念物向逝者致敬，并提醒每一个路过的人放慢速度。对于骑车时遇难的人，Bicycle Coalition 可以设置一辆幽灵单车，也就是漆成白色的自行车。"
    cost: "费用低；申请幽灵单车是免费的"
  traffic_calming_petition:
    label: "请求在这条住宅街道上设置交通减速措施"
    summary: "邻居可以请求市政府在住宅街道上设置减速垫。市政府每年三次根据事故数据给请求打分；如果这条街被选中，这个街区的 60% 住户要签署请愿书。主干道、州公路，以及短、陡、弯的街道都不符合条件。"
    cost: "请求免费"
  daylighting_check:
    label: "检查这个路口 20 英尺内是否畅通"
    summary: "宾夕法尼亚州法律已经禁止在十字路口的人行横道 20 英尺内停车，也禁止在停车标志或信号灯 30 英尺内停车，这样驾驶人和过马路的人才能互相看见。如果有车停在那里，请向市政府询问，能否用油漆、立柱或花盆来让路口保持视野通畅（daylighting）。如果这里的路灯不亮，请报告给 Philly311。"
    cost: "询问免费"
  asphalt_art_check:
    label: "这个路口的路面艺术：请先向市政府核实"
    summary: "一项对彩绘路口的研究发现，涉及步行和骑车者的事故减少了，但它没有对照组，而且经费由该项目的赞助方提供。2025 年，联邦政府开始敦促各州拆除人行横道上的艺术作品，而费城对此没有许可程序。在画任何东西之前，请先向市政府核实。"
    cost: "不清楚；市政府没有可以给它定价的程序"
  stop_survey:
    label: "用 StreetComplete 调查这个车站"
    summary: "还没有人记录这个车站有没有候车亭或长椅，或者 OpenStreetMap 和市政府的公交候车亭名单对它有没有候车亭说法不一。任何人用免费的 StreetComplete 手机应用，几分钟就能弄清楚，答案大约一周内会出现在这张地图上。如果应用在这里没有问题，说明这个车站还没有在 OpenStreetMap 里：请用应用里的 Things 图层添加它，或者留一条备注。"
    cost: "免费；每个车站大约三分钟"
  stop_shelter_request:
    label: "请市政府在这个车站设置候车亭"
    summary: "调查发现这里没有候车亭，市政府的公交候车亭名单上这里也没有。市政府的公交候车亭计划由它的交通办公室（OTIS）负责，建造的候车亭由候车亭上的广告出资，目标是把它们设在最繁忙的 15% 的公交站。没有公开的申请表，所以请写信给 OTIS，附上车站编号，以及有多少人在这里上车。"
    cost: "询问免费"
  stop_bench_request:
    label: "请市政府在这个车站设置长椅"
    summary: "调查发现这里没有长椅。车站的长椅属于市政府的街道设施计划，由 OTIS 负责，而我们没有找到公开的申请方式，所以请写信给 OTIS，附上车站编号。自己造一条长椅需要得到许可，而市政府对人行道上的长椅走什么许可途径，目前还没有确认。"
    cost: "询问免费"
  stop_streetlight_report:
    label: "报告这个车站不亮的路灯"
    summary: "OpenStreetMap 说这个车站没有照明。如果这里的路灯不亮，请报告给 Philly311。市政府目前的路灯计划是更换灯，而不增加新的灯，所以完全没有灯的车站，要问 OTIS。"
    cost: "报告免费"
  stop_shade_trees:
    label: "在这个车站旁种遮阴树"
    summary: "这个车站的树荫很少。住宅或商家的业主提出请求时，市政府会在它前面的人行道上免费种行道树，并在第一年浇水。请车站旁边建筑的业主去申请；之后，邻居可以帮忙浇水。"
    cost: "为房产业主提供免费的行道树"

routes:
  land_bank_garden_agreement:
    label: "土地银行的菜园协议或许可"
    who: "任何人都可以申请 1 美元的 Urban Garden Agreement（城市菜园协议）；有非营利组织担保的团体，可以申请 Community Garden License（社区菜园许可）"
    cost: "1 美元（Urban Garden Agreement），每年 25 美元（Individual Garden Agreement，个人菜园协议），或需要保险和一位担保人（Community Garden License）"
    timeline: "短期协议需要几周；许可需要几个月"
    steps:
      - "请先确认这个地块归土地银行或市政府所有。"
      - "请阅读 Grounded in Philly 关于获得许可使用市政府土地的指南。"
      - "向土地银行申请，或者先参加它的免费网络研讨会。"
    links:
      https://phillylandbank.org/:
        label: "费城土地银行"
      https://groundedinphilly.org/get-permission-to-use-land-city/:
        label: "Grounded in Philly：获得许可使用市政府土地"
  ask_the_owner:
    label: "向业主征求许可"
    who: "任何人"
    cost: "免费"
    timeline: "取决于业主"
    steps:
      - "在地块页面上找到业主的邮寄地址。"
      - "写信征求许可，允许您清理并绿化这个地块，并提出一份简单的书面协议。"
      - "在您签署任何协议之前，请 Garden Justice Legal Initiative 审阅。"
    links:
      https://www.pubintlaw.org/cases-and-advocacy/garden-justice-legal-initiative/:
        label: "Garden Justice Legal Initiative"
  community_landcare:
    label: "通过 PHS Community LandCare 管理一个地块"
    who: "居民团体"
    cost: "待向 PHS 确认"
    timeline: "待向 PHS 确认"
    steps:
      - "就 Community LandCare 联系 PHS。"
    links:
      https://phsonline.org/:
        label: "宾夕法尼亚园艺协会（Pennsylvania Horticultural Society）"
  report_to_311:
    label: "向 Philly311 报告"
    who: "任何人"
    cost: "免费"
    timeline: "几天到几周"
    steps:
      - "通过网上、手机应用或拨打 311，向 Philly311 报告敞开的建筑、非法倾倒垃圾、涂鸦，或不亮的街灯或小巷灯。"
      - "保留服务请求编号，并过一阵子回来查看。"
    links:
      https://www.phila.gov/services/property-lots-housing/submit-a-service-request-with-311/:
        label: "Philly311"
  ghost_bike_request:
    label: "向 Bicycle Coalition 询问幽灵单车或纪念物"
    who: "家属，或得到家属同意的朋友"
    cost: "申请免费"
    timeline: "没有说明"
    steps:
      - "请先和家属谈。只有得到他们的同意，才能设置纪念物。"
      - "对于骑车时遇难的人，请填写 Bicycle Coalition 的幽灵单车申请表。同一份表格也可以用来申请修复或更换幽灵单车。"
      - "Families for Safe Streets 由 Bicycle Coalition 运作，在事故发生后支持家属，并提供一份事故后的资源指南。"
      - "请计划好今后由谁来照看这个纪念物。"
    links:
      https://bicyclecoalition.org/what-is-a-ghost-bike/:
        label: "Bicycle Coalition：什么是幽灵单车"
      https://forms.gle/HBtY1hG4xcdVJKNb8:
        label: "幽灵单车申请表"
      https://bicyclecoalition.org/programs/families-for-safe-streets/:
        label: "Families for Safe Streets Greater Philadelphia"
  traffic_calming_request:
    label: "请求在住宅街道上设置交通减速措施"
    who: "这个街区的居民，主要是为他们居住的那条街"
    cost: "请求免费"
    timeline: "市政府每年三次给请求打分，通常在 5 月到 10 月安装减速垫"
    steps:
      - "在市政府的交通减速地图上，或拨打 311，查看这条街是否符合条件。"
      - "提交市政府的网上交通减速请求。"
      - "如果市政府选中了这个请求，就要收集这个街区 60% 的住户的签名，每户一个。"
    links:
      https://www.phila.gov/services/streets-sidewalks-alleys/request-traffic-calming-for-a-residential-street/:
        label: "费城市政府：请求交通减速措施"
  otis_contact:
    label: "询问市政府的交通办公室（OTIS）"
    who: "任何人"
    cost: "免费"
    timeline: "没有说明"
    steps:
      - "写信给交通与基础设施系统办公室（otis@phila.gov），说明是哪个路口，以及您在那里看到了什么。"
      - "询问市政府在这个路口允许做什么，以及如何申请。"
    links:
      https://visionzerophl.com/:
        label: "Vision Zero Philadelphia"
  treephilly_yard_trees:
    label: "通过 TreePhilly 的赠树活动获得免费的树"
    who: "费城居民，用于种在私人土地的地里，例如您拥有的地块，或业主书面同意的私人地块"
    cost: "免费"
    timeline: "下一次春季或秋季的赠树活动"
    steps:
      - "订阅 TreePhilly 的电子通讯，了解什么时候开放登记。赠树活动在春季（3 月到 5 月）和秋季（9 月到 12 月）举行，面向优先邮政编码地区。"
      - "向您附近举办赠树活动的社区团体登记。登记在赠树活动前大约两周到一个月开放，树发完就截止。"
      - "领取装在 5 加仑桶里、2 到 10 英尺高的树，附一袋免费的覆盖物（mulch），并把它种在地里。赠送的树不能放在容器里，不能种在人行道上，也不能种在公共路权范围内的任何其他地方。"
    links:
      https://treephilly.org/yard-trees/:
        label: "TreePhilly：院子里的树"
  mural_arts_wall_request:
    label: "请 Mural Arts 在一面墙上画壁画"
    who: "墙的业主，以及支持这件事的邻居。任何人都可以先从询问业主开始"
    cost: "申请免费"
    timeline: "几个月"
    steps:
      - "找一面面对地块、从街上容易看到的墙，问问它的业主是否欢迎一幅壁画。"
      - "得到业主同意后，填写 Mural Arts Philadelphia 联系页面上的墙面申请表。表格会问到墙壁的情况、邻居的支持，以及为什么在那里画壁画很重要。"
      - "街道上或人行道上的任何东西，也就是公共路权范围内的，还要提交给市政府的艺术委员会（Art Commission）。"
    links:
      https://muralarts.org/contact/:
        label: "Mural Arts Philadelphia：联系页面，上面有在您的墙上画壁画的申请表"
  public_space_mini_grant:
    label: "申请 Feet First Philly 的公共空间小额资助"
    who: "邻居和社区团体。这个计划优先考虑街道和市政服务得到的投入较少的社区"
    cost: "500 到 2,500 美元的资助，部分由公共卫生部出资"
    timeline: "每年 8 月开放申请，10 月截止"
    steps:
      - "请阅读 Feet First Philly 小额资助页面上的征求方案书。项目必须让社区更安全，更便于步行和轮椅通行；请询问 Feet First Philly，在地块上设置座位是否符合条件。"
      - "趁这一轮开放时申请。每年 8 月开放申请，10 月截止。"
      - "要准备在中途提交一份简短报告，结束时再提交一份。"
    links:
      https://feetfirstphilly.org/public-space-enhancement-mini-grant-2/:
        label: "Feet First Philly：公共空间改善小额资助"
  land_bank_side_yard:
    label: "作为侧院或后院取得（仅限隔壁的业主）"
    who: "隔壁房屋的业主，并且只有市政府名单标明这个地块符合侧院条件时才可以"
    cost: "象征性的价格。地块必须永远作为侧院，依据按评估价值计算的 30 年抵押贷款，只要遵守规则就会免除；如果不遵守，市政府可以收回"
    timeline: "工作人员的目标是在 120 天内答复，然后由土地银行的董事会和市议会决定。2020 年到 2023 年，全市只有 67 个地块通过这种方式转让"
    steps:
      - "请确认您拥有隔壁的房子，并且这个地块被标为符合侧院条件。"
      - "请阅读土地银行的侧院和后院页面，并提出申请。"
      - "请预期会等很久。工作人员审查之后，土地银行的董事会和市议会还必须批准。"
    links:
      https://phillylandbank.org/side-or-rear-yards/:
        label: "费城土地银行：侧院或后院"
  contact_phdc:
    label: "就这个地块询问 PHDC"
    who: "任何人"
    cost: "询问免费"
    timeline: "不清楚。重建管理局的地块，目前还没有公布给邻居的途径"
    steps:
      - "联系 PHDC，说明这个地块的地址和它的 OPA 账号。"
      - "询问谁管理这个地块、它是否可用，以及邻居可以怎样照看它。"
      - "如果您不确定该问谁，请先从土地银行开始（land@phdc.phila.gov，215 448 3034）。"
    links:
      https://phdcphila.org/:
        label: "PHDC"
      https://phillylandbank.org/:
        label: "费城土地银行"
  garden_adverse_possession:
    label: "菜园逆权占有（2024 年的法律）"
    who: "在私人拥有的地块上种过菜园的费城居民、团体或非营利组织"
    cost: "律师和法庭费用。土地上的任何留置权会跟着土地走"
    timeline: "至少 10 年的使用，然后提起诉讼"
    steps:
      - "请核对 2024 年法律的条件（53 Pa.C.S. 第 1143 条，自 2024 年 9 月 6 日起生效）：半英亩或更小的私人土地，使用满 10 年，其中至少 5 年作为菜园，并且没有永久性建筑（围栏和棚屋允许）。"
      - "请阅读 Grounded in Philly 关于逆权占有的指南。"
      - "请向 Garden Justice Legal Initiative 询问律师。这条途径需要提起确认产权（quiet title）的诉讼。"
    links:
      https://groundedinphilly.org/how-to-obtain-land-adverse-possession/:
        label: "Grounded in Philly：逆权占有"
      https://www.pubintlaw.org/cases-and-advocacy/garden-justice-legal-initiative/:
        label: "Garden Justice Legal Initiative"
  conservatorship:
    label: "财产托管（Act 135）"
    who: "向法院提出申请的非营利组织或个人"
    warning: "财产托管（conservatorship）可能让业主失去自己的房产。研究人员发现，它在面临绅士化的社区中被不成比例地使用。在您考虑这条途径之前，请先与 Garden Justice Legal Initiative 谈一谈。"
    cost: "法庭和修缮费用。自 2014 年起，申请人可以获得 2,500 美元、费用的 20% 或出售价格的 20% 三者中最高的一项作为报酬"
    timeline: "这是一场诉讼；请向法律援助机构询问大约需要多久"
    steps:
      - "在做任何其他事情之前，请先和 Garden Justice Legal Initiative 谈一谈。"
      - "请先问问：写信给业主，或者帮助一个家庭保住房产，能不能满足同样的需要。"
      - "请了解这部法律的条件：只有对满足这些条件的房产，法院才能指定托管人：已有 12 个月没有合法居住、没有在对外出售、没有在被止赎，并且最近 6 个月内没有被买下。"
    links:
      https://www.pubintlaw.org/cases-and-advocacy/garden-justice-legal-initiative/:
        label: "Garden Justice Legal Initiative"
  tangled_title_help:
    label: "帮助一个家庭保住继承的房子（Tangled Title Fund）"
    who: "房子仍登记在已故亲属名下的家庭，家庭收入不超过地区收入中位数的 80%；这处房产必须是申请人的住所"
    cost: "在基金的限额内，对家庭免费；超出限额的部分由家庭承担"
    timeline: "先到先得"
    steps:
      - "请联系 Philadelphia VIP 的 Tangled Title Fund（tangledtitlefund@gmail.com，215 523 9553）。"
      - "基金最多支付 6,500 美元，用于理清产权的法律费用，另外视个案最多再支付 3,500 美元，用于转让税。"
    links:
      https://phillyvip.org/tangled-title-fund/:
        label: "Philadelphia VIP：Tangled Title Fund"
  fraud_guard:
    label: "注册市政府免费的 Fraud Guard 提醒"
    who: "房产业主及其家人"
    cost: "免费"
    timeline: "文件登记后大约 30 天，会收到提醒"
    steps:
      - "用姓名和电子邮件地址注册 Fraud Guard。"
      - "每当有文件登记了您的姓名，市政府就会发一封电子邮件，这样伪造的契据就能及早被发现。"
      - "有问题请联系记录部（215 686 2290，records.info@phila.gov）。"
    links:
      https://www.phila.gov/2022-09-06-own-property-in-philadelphia-get-free-deed-fraud-protection-with-fraud-guard/:
        label: "费城市政府：Fraud Guard"
  bus_shelter_request:
    label: "请市政府设置公交候车亭"
    who: "任何人"
    cost: "询问免费"
    timeline: "没有说明。OTIS 会把新候车亭的位置提交给市政府的艺术委员会审查（2025 年 12 月提交了八个）"
    steps:
      - "记下车站的 SEPTA 编号（在站牌上，也在这张地图上）、路口，以及每个工作日有多少人在那里上车。"
      - "写信给市政府的交通与基础设施系统办公室（OTIS），邮箱 otis@phila.gov，或拨打 215-686-9003。OTIS 负责市政府的公交候车亭计划；没有公开的申请表。"
      - "把邮件抄送给您所在的市议会选区办公室，并通过 SEPTA 的网上意见表或拨打 215-580-7800，也告诉 SEPTA。"
    links:
      https://www.phila.gov/media/20240521160603/RFI-OTIS-street-furniture-20240521.pdf:
        label: "OTIS 街道设施信息征询书（2024 年 5 月），其中有市政府的候车亭目标"
      https://www.phila.gov/media/20251205094032/Bus-Shelter-Upgrades-submission.pdf:
        label: "提交给艺术委员会的八个新公交候车亭（2025 年 12 月）"
      https://wwww.septa.org/customer-service/comment-form/:
        label: "SEPTA 意见表"
      https://phlcouncil.com/council-members/:
        label: "费城市议会：各选区的议员和办公室"
  stop_bench_request:
    label: "请市政府在车站设置长椅"
    who: "任何人"
    cost: "询问免费"
    timeline: "没有说明"
    steps:
      - "记下车站的 SEPTA 编号（在站牌上，也在这张地图上）和路口。"
      - "写信给 OTIS（otis@phila.gov），或拨打 215-686-9003，请求在这个车站设置长椅。车站的长椅属于市政府的街道设施计划；我们没有找到公开的申请表。"
      - "把邮件抄送给您所在的市议会选区办公室。"
    links:
      https://www.phila.gov/media/20240521160603/RFI-OTIS-street-furniture-20240521.pdf:
        label: "OTIS 街道设施信息征询书（2024 年 5 月）"
      https://phlcouncil.com/council-members/:
        label: "费城市议会：各选区的议员和办公室"
  street_tree_request:
    label: "申请免费的行道树"
    who: "树要种在其前面的住宅、商家、地块或其他房产的业主；邻居可以请业主去申请"
    cost: "免费"
    timeline: "树木医生来访之后的下一个种植季"
    steps:
      - "行道树是在业主提出请求时，种在房产前面的人行道上。请和这个位置旁边建筑的业主谈谈。如果是空地，请问地块页面上列出的业主，或者对于市政府或土地银行拥有的地块，请问土地银行。"
      - "业主向公园与休闲部的行道树管理处（Street Tree Management Division）申请免费的行道树，可以在网上申请，也可以发邮件到 StreetTree.Info@phila.gov，或打电话 215-685-4363。"
      - "市政府的树木医生（arborist）会来看，决定适合种哪种树。市政府在种植季（4 月中旬到 6 月中旬，或 10 月中旬到 11 月中旬）免费种植，并在第一年浇水和覆盖。之后，TreePhilly 要求从 3 月到 12 月，每周大约浇 20 加仑水。"
    links:
      https://www.phila.gov/services/trees-parks-the-environment/tree-related-services/get-a-street-tree/:
        label: "费城市政府：申请行道树"
      https://treephilly.org/street-trees/:
        label: "TreePhilly：行道树"
  streetcomplete_survey:
    label: "用 StreetComplete 调查这个车站"
    who: "任何有 Android 手机的人（2026 年 9 月出现了第一个 iPhone 测试版）"
    cost: "免费"
    timeline: "答案大约一周内会出现在这张地图上"
    steps:
      - "安装免费的 StreetComplete 应用，并注册一个免费的 OpenStreetMap 账户，这样您的答案才会发布。"
      - "在车站，点按应用里的标记，回答它关于候车亭、长椅、照明和车站编号的问题。"
      - "如果应用在车站没有问题，请用它的 Things 图层添加这个车站，或留一条备注，让别的地图编辑者去添加。"
    links:
      https://holdthedoorhoid.github.io/placekeepers/streetcomplete/:
        label: "Placekeepers：调查公交站"
      https://streetcomplete.app/:
        label: "StreetComplete"
  neighborhood_gardens_trust:
    label: "让社区菜园永久保留（Neighborhood Gardens Trust）"
    who: "社区菜园已经运转至少三个种植季的园丁"
    cost: "申请免费"
    timeline: "大约两周内答复；取得土地需要更长时间"
    steps:
      - "请核对信托的标准：菜园已活跃至少三个种植季、有能够维持它的园丁、与社区发展公司、教会或学校等团体有联系，并得到邻居和选区市议员的支持。"
      - "用信托的网上菜园申请表或可打印的表格申请。信托大约两周内答复，然后会去菜园看看，并提交给它的董事会。"
      - "一旦获批，信托会与市政府合作取得这块土地并持有它，让邻居可以继续种菜，并提供责任保险，以及浇水和维护方面的帮助。有问题请联系 215 988 1630 或 ngtrust@pennhort.org。"
    links:
      https://ngtrust.org/preservation/:
        label: "Neighborhood Gardens Trust：菜园保护"
  community_land_trust:
    label: "让住房和土地永久保持平价（社区土地信托）"
    who: "邻居、社区团体和非营利组织"
    cost: "询问免费"
    timeline: "很长；土地信托的项目需要好几年"
    steps:
      - "了解社区土地信托是怎么运作的：由一个非营利组织永久拥有土地，家庭购买或租用土地上的房屋，一份长期的土地租约让每一套房屋再次出售时仍然保持平价。"
      - "请与已经在费城开展工作的土地信托谈谈，例如 Women’s Community Revitalization Project 的 Community Justice Land Trust，它在 Point Breeze、Grays Ferry、Mantua、Germantown、Port Richmond 和 Haddington 持有住房。"
      - "请向 Garden Justice Legal Initiative 询问，土地信托如何能持有您的团体已经在照看的菜园或地块。"
    links:
      https://groundedsolutions.org/strengthening-neighborhoods/community-land-trusts:
        label: "Grounded Solutions Network：社区土地信托"
      https://www.wcrpphila.org/cjlt:
        label: "Women’s Community Revitalization Project：Community Justice Land Trust"
  homestead_exemption:
    label: "降低房主的税单（市政府的宅基地豁免，Homestead Exemption）"
    who: "拥有自己在费城的住房，并把它作为主要住所居住的人，即使有抵押贷款或欠税也可以；享受 10 年税收减免（abatement）的住房除外"
    cost: "免费"
    timeline: "每年 12 月 1 日截止"
    steps:
      - "在 Philadelphia Tax Center（tax-services.phila.gov）上申请，一份合并的申请表涵盖市政府的各项税收减免计划；也可以拨打 Homestead 热线 215 686 9200，或把表格邮寄到税务局（Department of Revenue），P.O. Box 52817, Philadelphia, PA 19115。"
      - "这项豁免会从税单用的房屋评估价值中扣除 100,000 美元，每年最多可节省 1,399 美元。"
      - "请在 12 月 1 日之前申请（10 月 1 日之前申请，才能在下一张税单上看到）。一旦获批，除非契据发生变化，就不需要再申请。"
    links:
      https://www.phila.gov/services/payments-assistance-taxes/taxes/property-and-real-estate-taxes/get-real-estate-tax-relief/get-the-homestead-exemption/:
        label: "费城市政府：获得宅基地豁免"
  longtime_owner_occupants:
    label: "为长期居住的业主限定评估价值上限（市政府的长期业主居住者计划，LOOP）"
    who: "在自己的住房里已经居住至少 10 年、评估价值在一年内上涨至少 50% 或五年内上涨至少 75%、家庭收入低于市政府规定的上限（例如 2026 年一人 103,050 美元或四人 147,200 美元）、税款已缴清或有付款协议的房主"
    cost: "免费"
    timeline: "每年有截止日期，近几年是 9 月 30 日"
    steps:
      - "在 Philadelphia Tax Center（tax-services.phila.gov）上用市政府的合并申请表申请，或拨打 215 686 9200，发邮件到 revenue@phila.gov，或把表格邮寄到税务局，P.O. Box 53190, Philadelphia, PA 19105。"
      - "LOOP 为税单使用的评估价值设定上限：只要业主继续符合条件，上限就是上一年的 1.5 倍，或最近五年最低值的 1.75 倍。"
      - "请在市政府每年的截止日期之前申请（近几年是 9 月 30 日）；市政府的页面上有当前的日期。"
    links:
      https://www.phila.gov/services/payments-assistance-taxes/payment-plans-and-assistance-programs/income-based-programs-for-residents/apply-for-the-longtime-owner-occupants-program-loop/:
        label: "费城市政府：申请 LOOP"

layers:
  vacant_parcels:
    label: "空地和空置建筑"
    description: "很可能是空置的地块，附有我们有多确定以及为什么。它结合了市政府的空置指标、评估办公室的记录、建筑轮廓、拆除记录、L&I 的案件和土地用途地图，所以不会因为某一个来源出问题而失效。"
    settings:
      min_confidence:
        label: "显示我们至少有这样把握的地块"
        options:
          "1":
            label: "只要有任何空置迹象"
          "2":
            label: "大概或很有可能是空置的"
          "3":
            label: "只显示很有可能是空置的"
      kinds:
        label: "显示"
        options:
          both:
            label: "空地和建筑"
          lots:
            label: "只显示空地"
          buildings:
            label: "只显示建筑"
      listed:
        label: "被市政府的土地机构列为“可用”"
        options:
          any:
            label: "任何地块"
          available:
            label: "只显示列为可用的"
      lens:
        label: "给地块着色的依据"
        options:
          violence:
            label: "“减少暴力”视角"
          heat:
            label: "“高温和树荫”视角"
          placemaking:
            label: "“场所营造”视角"
  hin_2025:
    label: "高伤害路网"
    description: "费城大多数交通死亡和重伤事故发生的街道，由市政府的 Vision Zero 计划在 2025 年绘制。"
  shootings_hex:
    label: "枪击事件，按区域统计"
    description: "所选时间范围内的枪击受害者，按每个约两个街区宽的六边形统计。显示它是为了把关怀引向最有帮助的地方，而不是给某些地方贴上危险的标签。"
    settings:
      window:
        label: "时间范围"
        options:
          m12:
            label: "最近 12 个月"
          m36:
            label: "最近 3 年"
  landcare_lots:
    label: "PHS LandCare 维护的地块"
    description: "宾夕法尼亚园艺协会通过 LandCare 和 Community LandCare 清理、绿化并持续割草的空地。这就是费城的试验所检验的那种照看。"
  gardens:
    label: "社区菜园"
    description: "由 PHS 或 Neighborhood Gardens Trust 支持的社区菜园和农场，以及在公园与休闲部登记的菜园。人们已经在照看这些地方，所以它们绝不会显示为空置。"
  council_districts:
    label: "市议会选区"
    description: "2024 年划定的十个市议会选区，这样您就能看出该联系哪位议员的办公室。"
    settings:
      names:
        label: "显示名称"
  community_organizations:
    label: "注册社区组织"
    description: "在市政府注册的社区团体，它们会得知所在地区的分区变更。它们的辖区常常相互重叠。"
    settings:
      names:
        label: "显示名称"
  neighborhoods:
    label: "社区"
    description: "社区的名称和边界，来自 Abaca Labs 制作的 OpenDataPhilly 社区地图。"
    settings:
      names:
        label: "显示名称"
  segments:
    label: "街道安全，逐个路段"
    description: "每个街道路段按“街道安全”视角着色：它是否位于高伤害路网上、在 PennDOT 记录最近的五年里，有多少人在那里步行或骑车时遇难或受重伤、最近两年里那里是否有人遇难，以及 400 米内是否有学校。移动视角滑块，可以改变组合方式。路段还会说明市政府列出沿线有多少根灯杆、其中多少根灯是 LED，以及市政府列出的那里的交通减速措施。"
    settings:
      min_score:
        label: "显示评分至少达到以下的路段"
        options:
          "1":
            label: "任何高于零的评分"
          "20":
            label: "100 分中的 20 分"
          "40":
            label: "100 分中的 40 分"
          "60":
            label: "100 分中的 60 分"
  crashes:
    label: "交通事故"
    description: "2015 年到 2024 年向 PennDOT 报告的费城交通事故，按人员受伤的严重程度着色。可以选择年份、受伤严重程度，以及涉及的人。PennDOT 的记录在事故发生约一年后才到，所以最近的死亡事故改以纪念点的方式出现。"
    settings:
      years:
        label: "年份"
        options:
          latest:
            label: "最近一年的记录"
          recent:
            label: "最近五年"
          all:
            label: "2015 年以来的每一年"
      severity:
        label: "人员受伤的严重程度"
        options:
          "0":
            label: "每一起事故"
          "1":
            label: "有人受伤"
          "2":
            label: "有人遇难或受重伤"
          "3":
            label: "有人遇难"
      mode:
        label: "涉及的人"
        options:
          all:
            label: "所有人"
          walk_cycle:
            label: "步行或骑车的人"
          walk:
            label: "步行的人"
          cycle:
            label: "骑自行车的人"
          motorcycle:
            label: "骑摩托车的人"
  memorials:
    label: "纪念点"
    description: "在我们的街道上步行、骑车或骑滑板车时遇难的人，依据警察局 2019 年以来的交通事故死亡记录，每一位都在事发地点安静地标出。只有在已有公开的纪念名单提供姓名时，才会显示姓名；任何人都可以请求撤下姓名或标记。"
    settings:
      show_names:
        label: "显示姓名"
      all_fatal:
        label: "同时纪念在汽车里和骑摩托车时遇难的人"
  parking_reports:
    label: "已报告的停车问题（Laser Vision）"
    description: "在图例所示日期之前的 12 个月里，使用 Philly Bike Action 的 Laser Vision 应用的人报告车辆挡住人行道、人行横道、路口转角、路缘坡道和自行车道的地方，按每个约一个街区大小的区域统计。它显示的是使用同一个应用的人报告问题的地方，并不是所有的问题。报告少于 5 份的区域不显示，所以绝不会露出任何一份单独的报告。同一个地方有很多报告，就是需要做实体改善的证据：缘石外扩、护柱、路口留出视野、受保护的自行车道和装卸区。"
    settings:
      kind:
        label: "显示这些车辆的报告"
        options:
          all:
            label: "以上任何一种方式挡路"
          sidewalk:
            label: "停在人行道上"
          bike_lane:
            label: "停在自行车道上"
          crosswalk:
            label: "停在人行横道上"
          corner:
            label: "停在路口转角"
          ramp:
            label: "挡住路缘坡道"
  street_poles:
    label: "街道灯杆和市政府名单上的灯"
    description: "街道部名单上的每一根街道灯杆，以及名单上列在它们上面的灯：LED 灯、较旧的高压钠灯，或市政府没有注明类型的灯。许多灯杆，例如 PECO 的灯杆和交通信号灯杆，没有列出灯。这是市政府已经安装的，并不说明今晚哪盏灯是亮的：灯不亮时，请把灯杆编号报告给 Philly311。放大到几个街区的范围才会显示。"
    settings:
      show:
        label: "显示"
        options:
          all:
            label: "每一根灯杆"
          lamps:
            label: "名单上有灯的灯杆"
          not_led:
            label: "名单上不是 LED 的灯"
  traffic_calming:
    label: "市政府名单上的交通减速措施"
    description: "街道部为了让住宅街道上的驾驶人减速而设置的减速垫、减速丘和减速台，附有每一处设置的日期。邻居可以请求市政府在住宅街道上设置；主干道和州公路不符合条件。街道路段会显示它有多少处、从什么时候开始有，而在高伤害路网上有人受伤的路段，会说明目前还没有记录。"
  crossing_guards:
    label: "学校过街协管员岗位"
    description: "市政府设有学校过街协管员的路口。这是一项安全服务，在上学和放学时，帮助学校附近的孩子和所有人过马路。每个岗位都标明它所在的路口，以及 400 米内最近的学校。"
  basemap:
    label: "底图"
    description: "来自 OpenStreetMap 的街道、建筑、公园、水域和地名，位于其他一切的下面。可以选择灰色外观让数据更突出，或者关闭底图。"
    settings:
      look:
        label: "外观"
        options:
          light:
            label: "浅色，彩色"
          muted:
            label: "灰色，让数据更突出"
  transit_stops:
    label: "公交车站和有轨电车站"
    description: "SEPTA 在费城的每一个公交车站和有轨电车站，依据 SEPTA 当前的时刻表：在那里停靠的线路、典型的工作日、星期六和星期日公交车或有轨电车多久来一班、服务几点开始和结束，以及平均每个工作日有多少人在那里上车（来自 SEPTA 自己的统计）。每个车站会显示：在 OpenStreetMap 已知的情况下，乘客在那里能看到什么；市政府自己的名单上有候车亭时，显示候车亭；它在公交舒适度视角下的优先度；以及邻居可以做些什么。地铁、El 高架线和 Regional Rail 车站可以在设置中添加。"
    settings:
      service:
        label: "显示符合以下条件的车站"
        options:
          all:
            label: "任何班次"
          frequent:
            label: "班次频繁：中午每 15 分钟或更频繁一班"
          long_wait:
            label: "等候时间长：中午不到每 30 分钟一班"
      color:
        label: "车站按以下依据着色"
        options:
          lens:
            label: "公交舒适度视角下的优先度"
          wait:
            label: "中午公交车或火车多久来一班"
          boardings:
            label: "每个工作日有多少人上车"
      stations:
        label: "同时显示地铁、El 高架线和 Regional Rail 车站"
  transit_routes:
    label: "公交、有轨电车和火车线路"
    description: "SEPTA 的每条线路在费城走过的街道和轨道，依据 SEPTA 当前的时刻表，按车辆类型着色。选择“班次频繁的线路”，可以看到哪里在中午至少每 15 分钟有一班公交车或火车。"
    settings:
      service:
        label: "显示线路"
        options:
          all:
            label: "每条线路"
          frequent:
            label: "班次频繁的线路：中午每 15 分钟或更频繁一班"
  stop_amenities:
    label: "车站的候车亭和长椅"
    description: "OpenStreetMap 已知的公交车站和有轨电车站上，乘客能看到什么：候车亭或屋顶、有长椅但没有候车亭、两者都没有，或尚未调查。“尚未调查”是指还没有人记录，并不表示这个车站什么都没有。到目前为止，OpenStreetMap 只有大约十分之一的车站（SEPTA 完整的车站名单是它自己的图层）。邻居可以用 StreetComplete 手机应用调查车站，他们的答案大约一周内就会出现在这里。"
    settings:
      show:
        label: "显示"
        options:
          all:
            label: "每一个车站"
          surveyed:
            label: "有人调查过的车站"
          unsurveyed:
            label: "尚未调查的车站"
  city_shelters:
    label: "市政府名单上的公交候车亭"
    description: "市政府自己名单上的公交候车亭，由市政府与其广告合作伙伴安装和维护，并标明每一个所服务的 SEPTA 车站。有市政府候车亭的车站，在公交舒适度视角中算作有遮蔽。如果 OpenStreetMap 说某个车站没有候车亭而市政府名单上有，车站页面会说明两者不一致，实地调查可以确定。这份名单最近一次更改是在 2025 年 1 月，所以之后新建或拆除的候车亭可能没有反映。"
  heat_tracts:
    label: "按社区统计的高温脆弱度"
    description: "夏天的高温对每个人口普查区的人冲击有多大，依据市政府的高温脆弱性指数（公共卫生部和可持续发展办公室，2017 年到 2019 年的数据）。它把高温暴露度（这个人口普查区在夏天有多热，由卫星测量）和高温敏感度（住在那里的人当中，有多少人在高温中面临更大的风险，包括年龄、健康、收入、教育、语言和种族等十二项指标，按市政府编制这项指数的方式）放在一起。人口普查区按全市的五分之一来着色，最深的五分之一风险最高。暴露度和敏感度可以在设置中单独显示。"
    settings:
      measure:
        label: "人口普查区按以下依据着色"
        options:
          vulnerability:
            label: "高温脆弱度：高温和面临风险的人合在一起"
          exposure:
            label: "高温暴露度：有多热"
          sensitivity:
            label: "高温敏感度：有多少人在高温中面临风险"
      priority:
        label: "用轮廓标出市政府评为非常高的人口普查区"
  city_trees:
    label: "街道和公园里的树"
    description: "公园与休闲部树木清单（2025 年）里的每一棵树：市政府在人行道上和公园里养护的树，不包括私人院子里的树，附有每棵树的种类和树干粗细。放大到几个街区的范围才会显示。树干直径不到 4 英寸的小树，往往是幼树，TreePhilly 要求幼树从 3 月到 12 月，每周大约浇 20 加仑水。"
    settings:
      show:
        label: "显示"
        options:
          all:
            label: "每一棵树"
          big:
            label: "大型遮阴树：树干直径至少 12 英寸"
          small:
            label: "小树：树干直径不到 4 英寸，往往是幼树"
  floodplain:
    label: "洪泛区"
    description: "FEMA 的洪水地图预计会发洪水的地方，按市政府公布的内容（2023 年）：年概率 1% 的洪泛区，那里每年至少有百分之一的可能发生洪水；以及它旁边年概率 0.2% 的区域（常被称为百年一遇和五百年一遇洪泛区）。在那里建造的任何东西，都必须遵守市政府的洪泛区规定。能吸收雨水的绿化在那里有帮助，要选用耐得住潮湿土地的植物。"
    settings:
      zones:
        label: "显示"
        options:
          both:
            label: "年概率 1% 和 0.2% 的区域"
          high:
            label: "只显示年概率 1% 的洪泛区"
  benches:
    label: "长椅，按 OpenStreetMap 上的标注"
    description: "可以坐的地方：人们添加到 OpenStreetMap（任何人都能改进的免费地图）上的长椅，地图上有标注时，还会说明每张长椅有没有靠背。OpenStreetMap 缺少很多长椅，所以地图上没有显示长椅的街道，也可能有一些。任何人都可以用 StreetComplete 手机应用添加长椅，大约一周内就会出现在这里。"
  picnic_tables:
    label: "野餐桌，按 OpenStreetMap 上的标注"
    description: "人们添加到 OpenStreetMap 上的野餐桌，大多在公园里，地图上有标注时，还会说明每张桌子是否在屋顶下。OpenStreetMap 缺少很多野餐桌。任何人都可以用 StreetComplete 手机应用添加，大约一周内就会出现在这里。"
  drinking_water:
    label: "饮用水，按 OpenStreetMap 上的标注"
    description: "人们添加到 OpenStreetMap 上的饮水器和水龙头，地图上有标注时，还会说明能否灌水瓶。OpenStreetMap 只知道费城的几十处，所以公园与休闲部名单上的饮水器是它们自己的图层。任何人都可以用 StreetComplete 手机应用添加饮水器，大约一周内就会出现在这里。"
  toilets:
    label: "公共厕所，按 OpenStreetMap 上的标注"
    description: "人们添加到 OpenStreetMap 上的厕所，地图上有标注时，还会说明谁可以使用、是否收费，以及轮椅能否通行。不对公众开放的厕所不包括在内。OpenStreetMap 只知道费城不到一百处。任何人都可以用 StreetComplete 手机应用添加，大约一周内就会出现在这里。"
  bookcases:
    label: "社区小型图书亭（Little Free Library），按 OpenStreetMap 上的标注"
    description: "公共书架，常被称为 little free library，任何人都可以在那里拿书或放书，是人们添加到 OpenStreetMap 上的。缺少很多。任何人都可以用 StreetComplete 手机应用添加，大约一周内就会出现在这里。"
  park_water:
    label: "公园里的饮水器"
    description: "公园和休闲中心的饮水器和水瓶灌水站，按费城公园与休闲部的名单。休闲中心里面的饮水器，在中心开放时可以使用。"
  libraries:
    label: "Free Library 分馆"
    description: "市政府列出的费城 Free Library 的每一个地点，附有地址、电话，以及指向其页面的链接，可查看开放时间。图书馆免费，向所有人开放。"
  recreation_centers:
    label: "休闲中心"
    description: "费城公园与休闲部举办活动的地方：休闲中心、长者中心和环境教育中心，按市政府的名单，并说明每个中心有没有健身房。"
  pools:
    label: "游泳池和喷水游乐区"
    description: "市政府的游泳池、喷水游乐区和洒水器，是天热时纳凉的地方，按费城公园与休闲部的名单，说明每个今年是否开放。游泳池只在夏季开放；本周的开放时间，请向公园与休闲部查询。"
    settings:
      show:
        label: "显示"
        options:
          in_service:
            label: "只显示今年开放的"
          all:
            label: "全部，也包括今年不开放的"
  cooling_centers:
    label: "纳凉和取暖中心"
    description: "市政府应急管理办公室列为取暖或纳凉场所的地方：图书馆、休闲中心、社区合作伙伴和费城住房管理局的社区中心，按这张地图最近一次复制名单那天的内容，说明每个场所是否被列为开放、它的开放时间和提供什么。这不是实时信息：场所会随天气开放或关闭，所以出发前请先打电话问问该场所或拨打 Philly311。同时也是场所的图书馆或休闲中心，只显示一次。"
    settings:
      kind:
        label: "场所类型"
        options:
          any:
            label: "天热或天冷"
          cooling:
            label: "天热时纳凉"
          warming:
            label: "天冷时取暖"
      show:
        label: "显示"
        options:
          all:
            label: "全部，开放或关闭按名单所列"
          open:
            label: "只显示列为开放的"
  dumping:
    label: "向 311 报告的非法倾倒垃圾"
    description: "过去 90 天内有人就非法倾倒垃圾问题询问过 Philly311 的街区，说明有多少请求，以及是否还有未办结的。按街区统计，绝不按地址统计，也不显示任何关于报告人的信息。一项请求表明有人注意到了问题，并请求帮助；有些街区提出请求比别的街区更频繁，所以请求少，并不表示这个街区很干净。"
    settings:
      show:
        label: "显示有以下情况的街区"
        options:
          any:
            label: "过去 90 天内有任何请求"
          open:
            label: "有请求仍未办结"
  dark_lights:
    label: "已报告不亮的街灯和小巷灯"
    description: "过去 90 天内有人请 Philly311 修理不亮的街灯或小巷灯的街区，说明有多少请求，以及是否还有未办结的，同时列出市政府名单上沿这个街区的灯杆和灯。按街区统计，绝不按地址统计，也不显示任何关于报告人的信息。"
    settings:
      show:
        label: "显示有以下情况的街区"
        options:
          any:
            label: "过去 90 天内有任何请求"
          open:
            label: "有请求仍未办结"
  graffiti:
    label: "向 311 报告的涂鸦"
    description: "过去 90 天内有人请 Philly311 清除涂鸦的街区，说明有多少请求，以及是否还有未办结的。按街区统计，绝不按地址统计，也不显示任何关于报告人的信息。"
    settings:
      show:
        label: "显示有以下情况的街区"
        options:
          any:
            label: "过去 90 天内有任何请求"
          open:
            label: "有请求仍未办结"
  public_art:
    label: "公共艺术"
    description: "壁画、雕塑和雕像、马赛克镶嵌画和其他公共艺术，来自市政府的“艺术百分比”名单、OpenStreetMap 和 Wikidata。当其中两三个来源列出同一件作品时，地图只显示一次，并链接到每个来源。纪念某个人的艺术作品，只显示为纪念性艺术作品，不带姓名。Mural Arts Philadelphia 在自己的网站上保存着费城最大的壁画名单；它的条款不允许复制，所以地图改为链接到它。如果缺少某件作品，请把它添加到 OpenStreetMap，大约一周内就会出现在这里。"
    settings:
      murals:
        label: "壁画和墙面绘画"
      sculptures:
        label: "雕塑和雕像"
      mosaics:
        label: "马赛克镶嵌画"
      other:
        label: "其他类型的艺术"
      inside:
        label: "建筑物内的作品"
  playgrounds:
    label: "儿童游乐场"
    description: "费城公园与休闲部列出的儿童游乐场，说明每个适合的年龄，以及市政府注明时的设置年份。一个公园往往有两个，一个给较小的孩子，一个给较大的孩子。地块页面会说明最近的游乐场，以及它的直线距离。"
  walkability:
    label: "每个地区的步行便利程度（EPA）"
    description: "美国环境保护署（EPA）为每个人口普查街区组（几个街区大小的区域）制定的全国步行指数，来自它的 Smart Location Database（2021 年，依据大约 2017 年到 2019 年的数据）。它用四项指标，给一个地区对步行的支持程度打 1 到 20 分：有多少个街角、最近的公共交通站点有多近，以及住宅、工作和商店混合程度的两项指标。地区按费城街区组的五分之一着色，或按 EPA 自己的分类着色，后者是与全国比较。每项指标都可以在设置中单独显示。街区组已经裁剪到城市的陆地范围，所以河流保持空白。"
    settings:
      measure:
        label: "地区按以下依据着色"
        options:
          index:
            label: "步行指数：四项指标合在一起"
          corners:
            label: "街角：街道的连通程度"
          transit:
            label: "公共交通：最近的站点有多近"
          mix:
            label: "住宅、工作和商店的混合"
      compare:
        label: "与以下比较"
        options:
          city:
            label: "费城：全市街区组的五分之一"
          nation:
            label: "全国：EPA 自己的分类"
  walking_distance:
    label: "步行距离内的人口和场所"
    description: "对每个约两个街区宽的六边形：有多少人住在它中心步行 5 分钟的范围内，来自 2020 年人口普查；七类日常场所中有几类在步行 10 分钟范围内（图书馆、休闲中心、游泳池或喷水游乐区、公园里的饮水器、学校、接受 SNAP 的杂货店或市场，以及公交、有轨电车或火车站）；或者有多少个街角在步行 5 分钟范围内。步行 5 分钟按 400 米、步行 10 分钟按 800 米的直线距离计算，这比沿街道步行稍微远一点，而且会越过步行的人无法越过的铁路线、高速公路和河流。"
    settings:
      measure:
        label: "六边形按以下依据着色"
        options:
          people:
            label: "步行 5 分钟范围内居住的人口"
          places:
            label: "步行 10 分钟范围内有几类日常场所"
          corners:
            label: "步行 5 分钟范围内的街角数"
  traffic_stress:
    label: "骑自行车的交通压力（DVRPC）"
    description: "每条街道骑自行车有多大压力，依据特拉华河谷区域规划委员会从车道数、车速和自行车道类型（如果有的话）做出的评定：第 1 级适合大多数各年龄的人，第 2 级适合大多数成年人，第 3 级只适合有信心的骑行者，第 4 级只适合最无所畏惧的骑行者。一条街两个方向不同时，显示压力较大的那个。评级来自 DVRPC 的模型和标示的限速，而不是骑遍每一条街道。"
    settings:
      show:
        label: "显示"
        options:
          all:
            label: "DVRPC 评级的每一条街道"
          stressful:
            label: "只显示压力大的街道：第 3 级和第 4 级"
          calm:
            label: "只显示平静的街道：第 1 级和第 2 级"
  displacement_watch:
    label: "迁离关注区：价格上涨的迹象"
    description: "至少有以下两项迹象的地区（人口普查区），并且其中至少一项与价格本身有关（前三项）：房屋的售价比五年前高出很多，涨得比全市快；市政府的评估价值涨得比全市快得多；市政府的市场价值分析发现房价攀升，已超出长期居民的负担能力；公司买下了所售房屋中的很大一部分；至少五分之三的住房是出租的；或者许多租户的房租占了收入的一半或以上（由项目所有者于 2026 年 10 月 9 日添加）。绿化和其他改善可能让价格进一步上涨，所以当一条给地块绿化、种树、营造可以坐的地方、开办菜园或请人创作艺术作品的建议，或者一个市政府列为可用的地块，位于这些地区之一时，它的卡片会加上保护邻居的办法。这里显示的是公开记录里的迹象，不是预测，也不说明住在这里的是谁。点按一个地区，可以查看它的迹象和为每一项测量了什么，并且作为背景资料，查看租金中位数、家庭收入中位数和空置住房的数量，来自人口普查局的调查；每一个调查数字都附有它的误差范围。"
    settings:
      shade:
        label: "给这些地区着色（关闭则只显示它们的轮廓）"
  historic_districts:
    label: "历史街区"
    description: "费城历史委员会（Philadelphia Historical Commission）的地方历史街区。对街区内的建筑和地块做改动，即使是一幅壁画、一道围栏或一个菜园，也可能需要委员会审查：请先询问委员会（215 686 7660）。市政府要求每个人都向委员会确认房产的历史保护状态。点按一个街区，可以查看它的名称和指定的日期。"
  historic_properties:
    label: "列入历史名录的房产"
    description: "列入费城历史名胜名录的房产，每一处都是自己的地块，有的单独列入，有的作为历史街区的一部分（放大后才显示）。这里的改动可能需要历史委员会审查：请先询问他们（215 686 7660）。"
  zoning_overlays:
    label: "分区叠加区"
    description: "《分区法规》在基础分区之上增加自己规定的区域：社区保护、商业街、防洪和陡坡保护、Wissahickon 附近的铺装限制、机场附近的高度、招牌等等。许多叠加区相互重叠，有几个覆盖了费城的大部分地区。点按一个位置，可以查看那里的每个叠加区，以及它在《分区法规》中的章节。叠加区可能改变允许做什么；请在做计划之前向市政府核实。"
    settings:
      show:
        label: "显示"
        options:
          all:
            label: "叠加区和其他特别规定"
          districts:
            label: "只显示叠加区"
  hearings:
    label: "即将举行的听证会"
    description: "关于某处房产，在分区调整委员会、执照和检查复审委员会、建筑标准委员会和市政府其他委员会面前定下的听证会，来自市政府的申诉记录，附有日期、时间和申诉的类型。任何人都可以参加分区听证会；点按一场听证会，可以查看如何参加，并打开这个地块的页面。提出申诉的人，只显示在那个地块自己的页面上，绝不显示在地图上。"
    settings:
      boards:
        label: "显示"
        options:
          all:
            label: "每个委员会"
          zoning:
            label: "只显示分区调整委员会"
  brownfields:
    label: "棕地场址（EPA）"
    description: "联邦棕地资助曾为评估或清理出资的房产，来自 EPA 的记录。这不是所有污染土地的地图，也不说明某个场址今天是否受到污染。在棕地上或附近种植食物之前，请先检测土壤。"
  aerial_photos:
    label: "按年份的航拍照片"
    description: "整个城市的航拍照片，从飞机上拍摄：市政府自己从 1996 年以来每一个有照片的年份（每年春季，大多数年份在 3 月到 5 月），以及市政府托管的较早照片，来自特拉华河谷区域规划委员会（1959 年和 1975 年）和美国地质调查局（1999 年）。拖动滑块浏览各个年份，可以看到一个街区以前有什么：拆掉的房子、清理过的地块、长出来的菜园。图层打开时，照片直接来自市政府的服务器，并画在地图上其他一切的下面。较早的年份不太清晰，而且 2000 年以前的照片是黑白的。"
    settings:
      year:
        label: "年份"
        options:
          "1959":
            label: "1959 年"
          "1975":
            label: "1975 年"
          "1996":
            label: "1996 年"
          "1999":
            label: "1999 年"
          "2000":
            label: "2000 年"
          "2004":
            label: "2004 年"
          "2005":
            label: "2005 年"
          "2008":
            label: "2008 年"
          "2009":
            label: "2009 年"
          "2010":
            label: "2010 年"
          "2011":
            label: "2011 年"
          "2012":
            label: "2012 年"
          "2014":
            label: "2014 年"
          "2015":
            label: "2015 年"
          "2016":
            label: "2016 年"
          "2017":
            label: "2017 年"
          "2018":
            label: "2018 年"
          "2019":
            label: "2019 年"
          "2020":
            label: "2020 年"
          "2022":
            label: "2022 年"
          "2023":
            label: "2023 年"
          "2024":
            label: "2024 年"
          "2025":
            label: "2025 年"
      opacity:
        label: "照片的显示强度（百分比）"
  atlas_1860:
    label: "1860 年地图集（Hexamer 和 Locher）"
    description: "Hexamer 和 Locher 绘制的 1860 年费城地图集，逐个街区画出了建筑和地块，由 Greater Philadelphia GeoHistory Network 对齐到今天的地图，并由市政府托管。它只涵盖中心城和 Northern Liberties。把强度调低，就能透过它看到今天的街道。图层打开时，它直接来自市政府的服务器。"
    settings:
      opacity:
        label: "地图集的显示强度（百分比）"
  redlining_1937:
    label: "1937 年红线地图（HOLC 评级）"
    description: "1937 年，联邦机构“房主贷款公司”（Home Owners’ Loan Corporation，HOLC）按照它判断在各个社区发放抵押贷款有多安全，把费城的社区从 A 到 D 评级。评级在很大程度上取决于每个区域住着什么人：黑人家庭和许多移民家庭居住的区域，通常被评为 D，并用红线圈出，“红线”（redlining）一词就是这么来的。这个图层显示 1937 年的区域和评级，由 Mapping Inequality 描绘。这些评级只是记录了该机构在 1937 年如何评判各个地方；它们不说明今天住在那里的人。点按一个区域，可以查看它的评级，以及指向 Mapping Inequality 上它 1937 年描述的链接。仅限非商业用途。"
    settings:
      shade:
        label: "给这些区域着色（关闭则只显示它们的轮廓和评级）"
