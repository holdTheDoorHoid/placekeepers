# Chinese, simplified characters (zh-Hans): translations of the visitor facing words in
# registry/*.yaml, by id. English in registry/*.yaml is the source; anything left out here shows the
# English. Which fields may be translated, and the shape of this file, are in docs/TRANSLATING.md
# and web/src/i18n/registry-text.ts. Terms are fixed in docs/i18n/glossary-zh-Hans.md.

groups:
  lots:
    label: 地块和建筑
    description: 空地和废弃建筑，以及可以拿它们做些什么。
  care:
    label: 已有人照看的地方
    description: 已经有人维护的地块、菜园、公园，以及其他人们已经在照料的地方。
  displacement:
    label: 价格与保护措施
    description: 哪些地方的价格在上涨，这样在绿化和做其他改善的同时，可以配套保护措施，保护现在住在那里的邻居。
  rules:
    label: 土地规定和听证会
    description: 历史街区和历史房产、分区叠加区、即将举行的关于地块和建筑的听证会，以及联邦棕地场址。
  streets:
    label: 街道和纪念点
    description: 高伤害路网、交通事故、在我们街道上遇难的人，以及市政府列出的街道灯杆、交通减速措施和学校过街协管员。
  transit:
    label: 公交和火车
    description: SEPTA 的车站和线路、班次有多频繁、有多少人上车，以及哪些车站有候车亭或长椅（依据市政府的候车亭名单和 OpenStreetMap）。
  heat:
    label: 高温、树木和洪水
    description: 夏天的高温对每个社区的冲击有多大、市政府在街道和公园里养护的树，以及 FEMA 预计哪里会发洪水。
  amenities:
    label: 长椅、饮水、厕所等
    description: 可以坐下、喝水、上厕所或借书的地方（依据 OpenStreetMap 上的标注），以及公园里的饮水器。
  public_places:
    label: 图书馆、休闲中心和游泳池
    description: Free Library 的各个分馆、公园与休闲部的休闲中心、游泳池和喷水游乐区，以及市政府列出的取暖和纳凉场所。
  conditions:
    label: 向 311 报告的问题
    description: 过去 90 天内人们向 Philly311 报告的非法倾倒垃圾、路灯不亮和涂鸦，按街区统计。
  placemaking:
    label: 艺术和场所营造
    description: 壁画、雕塑、马赛克镶嵌画和其他公共艺术（来自市政府、OpenStreetMap 和 Wikidata），以及市政府的儿童游乐场。
  walking:
    label: 步行、骑车和人口
    description: 每个地区步行有多方便、步行很短的距离内有多少人和日常场所，以及每条街道对骑自行车的人来说压力有多大。
  then_and_now:
    label: 过去与现在
    description: 一个街区以前有什么，以及过去还剩下什么。1959 年以来的航拍照片和 1860 年的地图集，只有在打开时才会从市政府的服务器加载；1937 年的红线地图来自本网站。
  safety_context:
    label: 最需要关怀的地方
    description: 显示哪里的改善最可能有帮助的背景资料。
  boundaries:
    label: 边界
    description: 市议会选区、社区组织和社区。
  basemap:
    label: 底图
    description: 在其他一切下面的街道、建筑和地名。

options:
  live_city_data:
    label: 获取市政府实时数据
    description: >-
      当您打开一个地块页面或搜索地址时，您的浏览器会向费城市政府的公共服务器查询最新的记录：业主、出售、评估、检查和申诉。这些请求直接从您的设备发到市政府，从不经过 Placekeepers，市政府的服务器会把它们当作对市政府自己房产网站的一次访问。“过去与现在”下的市政府航拍照片和 1860 年地图集，也直接来自市政府的服务器，但只有在您打开其中一项时才会如此。关闭此选项，就只使用 Placekeepers 发布的每周数据副本。地址搜索、打开不在我们名单上的地块，以及旧照片和地图集，都需要保持打开。

partners:
  phs:
    one_line: LandCare、Community LandCare 和 Philly Spring Cleanup。
  gjli:
    one_line: 免费的法律帮助，以及使用空地的指南。
  ngt:
    one_line: 永久保护社区菜园。
  land_bank:
    one_line: 市政府针对空地的各项计划，包括侧院和菜园。
  bike_coalition:
    one_line: Vision Zero 倡导、幽灵单车（ghost bike）和 Families for Safe Streets。
  feet_first:
    one_line: 倡导行人权益、步行环境审查，以及公共空间小额资助。
  treephilly:
    one_line: 公园与休闲部的植树计划：免费的行道树和院子里的树。
  mural_arts:
    one_line: 全市各处的壁画；墙壁的业主可以申请一幅。

