options:
  live_city_data:
    label: "Buscar dados ao vivo da Prefeitura"
    description: "Quando você abre a página de um lote ou busca um endereço, o seu navegador pede aos servidores públicos da Prefeitura da Filadélfia os registros mais recentes: o proprietário, as vendas, as avaliações, as inspeções e os recursos. Esses pedidos vão direto do seu aparelho para a Prefeitura, nunca passam pelo Placekeepers, e os servidores da Prefeitura os veem como veriam uma visita ao próprio site de imóveis da Prefeitura. As fotos aéreas da Prefeitura e o atlas de 1860 dela, em \"Antes e agora\", também vêm direto dos servidores da Prefeitura, mas só quando você ativa uma delas. Desative esta opção para usar só a cópia semanal dos dados que o Placekeepers publica. A busca de endereços, a abertura de um lote que não está na nossa lista e as fotos e o atlas antigos precisam dela ativada."
