        label: "Com que intensidade a foto aparece, em porcentagem"
  atlas_1860:
    label: "Atlas de 1860 (Hexamer e Locher)"
    description: "O atlas de 1860 da Filadélfia de Hexamer e Locher, desenhado quarteirão por quarteirão com seus prédios e lotes, ajustado ao mapa de hoje pela Greater Philadelphia GeoHistory Network e hospedado pela Prefeitura. Cobre só o Center City e o Northern Liberties. Diminua a intensidade dele para ver as ruas de hoje através dele. Ele vem direto dos servidores da Prefeitura quando esta camada está ativada."
    settings:
      opacity:
        label: "Com que intensidade o atlas aparece, em porcentagem"
  redlining_1937:
    label: "Mapa de redlining de 1937 (classificações do HOLC)"
    description: "Em 1937, uma agência federal, a Home Owners' Loan Corporation (HOLC), classificou os bairros da Filadélfia de A a D conforme o quanto considerava seguro conceder financiamento imobiliário ali. As classificações se apoiavam em quem morava em cada área: as áreas onde moravam famílias negras e muitas famílias imigrantes costumavam receber D e ser contornadas em vermelho, e daí vem a palavra redlining. Esta camada mostra as áreas e classificações de 1937 como o Mapping Inequality as traçou. As classificações são um registro de como a agência julgava os lugares em 1937; elas não dizem nada sobre as pessoas que moram lá hoje. Toque em uma área para ver a classificação dela e um link para a descrição de 1937 no Mapping Inequality. Somente para uso não comercial."
    settings:
      shade:
        label: "Colorir as áreas (desligado mostra só os contornos e as classificações)"

  projects:
    label: "Projetos concluídos pelos vizinhos"
    description: "Limpezas, jardins, lugares para sentar, murais, árvores, bancos e abrigos da Prefeitura e soluções via 311 que os vizinhos concluíram e nos contaram. Cada relato é lido e aprovado pelo Placekeepers antes de aparecer. Toque em um para ver o que foi feito, quando e o que foi preciso, com um link para o relato e as fotos dele no GitHub. O mapa nunca mostra quem enviou um relato, só o nome de um grupo que a pessoa escolheu."

lenses:
  violence:
    label: "Redução da violência"
    description: "Onde limpar, criar áreas verdes ou lacrar mais provavelmente reduziria a violência com armas de fogo por perto, com base em ensaios randomizados na Filadélfia."
    factors:
      untreated_vacancy:
        label: "Lote vazio ou prédio abandonado aberto, ainda sem tratamento"
        explain: "Ensaios randomizados na Filadélfia constataram que transformar lotes vazios em áreas verdes e dar a casas abandonadas portas e janelas em bom estado reduziu a violência com armas de fogo por perto. Lugares que já receberam esse tratamento têm nota 0: lotes que o PHS LandCare mantém e prédios cujo proprietário consertou portas e janelas depois de uma notificação do L&I. Todos os outros lotes ou prédios vazios têm nota 100."
      shootings_nearby:
        label: "Pessoas baleadas por perto nos últimos três anos"
        explain: "Pessoas baleadas nos últimos três anos a cerca de um quarto de milha (o hexágono do lugar e os seis em volta), segundo os registros do Departamento de Polícia sobre pessoas baleadas. A posição é a parcela de lugares do mapa com menos casos. Os ensaios mediram menos tiroteios em volta dos lugares tratados, então o cuidado ajuda mais onde acontecem tiroteios."
      poverty:
        label: "Taxa de pobreza do bairro"
        explain: "A parcela de pessoas que vivem abaixo da linha de pobreza no setor censitário do lugar (pesquisa do Departamento do Censo, 2020 a 2024). A posição é a parcela de lugares do mapa em setores com taxa menor. No ensaio na cidade toda, a queda na violência com armas de fogo foi encontrada em bairros abaixo da linha de pobreza."
      canopy_gap:
        label: "Poucas árvores por perto"
        explain: "Cobertura de copas de árvores no terreno a cerca de um quarto de milha, segundo o levantamento de cobertura de árvores de 2018 da Prefeitura. A posição é a parcela de lugares do mapa com mais árvores em volta, então menos árvores ficam em posição mais alta. Árvores de rua estão ligadas a menos crimes, mas a evidência é mista e depende de onde elas ficam."
    presets:
      research:
        label: "Baseado em pesquisa"
      vacancy_only:
        label: "Só vacância"
  heat:
    label: "Calor e sombra"
    description: "Onde plantar árvores ou criar áreas verdes em um lote vazio mais refrescaria as pessoas: lotes em bairros onde o calor do verão atinge mais as pessoas, com pouca sombra em volta e muita gente para sentir a diferença."
    factors:
      heat_vulnerability:
        label: "Vulnerabilidade ao calor do bairro"
        explain: "O quanto o calor do verão atinge as pessoas do setor censitário do lote, segundo o Índice de Vulnerabilidade ao Calor da Prefeitura (Departamento de Saúde Pública e Escritório de Sustentabilidade, dados de 2017 a 2019): quão quente o setor fica nos dias de verão, como os satélites medem, junto com quantas das pessoas que moram ali correm mais risco no calor, por idade, saúde, renda e mais. A posição é a parcela de lugares do mapa em setores com pontuação menor."
      few_trees:
        label: "Poucas árvores por perto"
        explain: "Cobertura de copas de árvores no terreno a cerca de um quarto de milha, segundo o levantamento de cobertura de árvores de 2018 da Prefeitura, a mesma medida que a lente de redução da violência usa. A posição é a parcela de lugares do mapa com mais árvores em volta, então menos árvores ficam em posição mais alta. As árvores refrescam as ruas com a sombra e com a água que as folhas liberam. Os estudos concordam que elas refrescam durante o dia, mais onde a copa cobre mais de cerca de 40 por cento de um quarteirão, e menos à noite."
      few_street_trees:
        label: "Poucas árvores da Prefeitura no quarteirão"
        explain: "Árvores a até 100 metros do lote no inventário de árvores de 2025 de Parques e Recreação, as árvores que a Prefeitura mantém em suas ruas e parques, não as de quintais particulares. A posição é a parcela de lugares do mapa com mais dessas árvores em volta, então menos árvores ficam em posição mais alta. As árvores de rua dão sombra às calçadas em que as pessoas andam e esperam."
      people_nearby:
        label: "Pessoas que isso alcançaria"
        explain: "Moradores por quilômetro quadrado de terra no setor censitário do lote (pesquisa do Departamento do Censo, 2020 a 2024). A posição é a parcela de lugares do mapa em setores com menos pessoas. Mais pessoas sentiriam o alívio do calor. A população só conta quem uma melhoria alcançaria; nunca é, sozinha, uma medida de necessidade."
    presets:
      balanced:
        label: "Equilibrado"
      people_at_risk:
        label: "Pessoas em maior risco"
      fewest_trees:
        label: "Menos árvores"
  placemaking:
    label: "Espaços de convivência"
    description: "Onde um lote vazio mais provavelmente viraria um lugar público que as pessoas usam todo dia, como um jardim, um parque pequeno, um lugar para sentar à sombra ou um espaço para arte: lotes com muitos vizinhos e lugares do dia a dia a uma curta caminhada, longe de um parque e de arte pública. É sobre uso e acolhimento, não sobre crime."
    factors:
      neighbors:
        label: "Pessoas a até 5 minutos a pé"
        explain: "Quantas pessoas moram a até 5 minutos a pé do lote, contados como 400 metros em linha reta, segundo o censo de 2020. A posição é a parcela de lugares do mapa com menos pessoas em volta. Mais vizinhos significa mais gente que um jardim, um banco ou um mural serviria. A população só conta quem um projeto alcançaria."
      everyday_places:
        label: "Lugares do dia a dia a até 10 minutos a pé"
        explain: "Quantos de sete tipos de lugares do dia a dia ficam a até 10 minutos a pé, contados como 800 metros em linha reta: uma biblioteca, um centro recreativo, uma piscina ou área de jogos de água, um bebedouro em um parque, uma escola, um mercado ou feira que aceita SNAP, e um ponto de ônibus, de bonde ou de trem. A posição é a parcela de lugares do mapa com menos. Quem vai a esses lugares passa pelo lote. O quanto quem passa ajuda um novo lugar público depende da rua e do lugar, então a evidência é mista."
      walkability:
        label: "Caminhabilidade"
        explain: "O Índice Nacional de Caminhabilidade da EPA do grupo de quarteirões do lote: esquinas, quão perto fica o transporte e quão bem se misturam casas, empregos e lojas (dados de cerca de 2017 a 2019). A posição é a parcela de lugares do mapa em áreas menos caminháveis. Onde as pessoas caminham, mais delas usariam um lugar no lote. Estudos de lugares caminháveis encontram correlações cujo significado depende do lugar, então a evidência é mista."
      far_from_park:
        label: "Longe de um parque"
        explain: "A distância em linha reta do lote até a borda do parque de Parques e Recreação mais próximo: parques, parquinhos, centros recreativos, praças, corredores verdes e áreas naturais, mas não os seus pátios de serviço, campos de golfe ou canteiros plantados no meio de vias. A posição é a parcela de lugares do mapa mais perto de um, então mais longe fica em posição mais alta. Um lote longe de um parque poderia dar aos vizinhos o espaço aberto que lhes falta."
      no_art_nearby:
        label: "Sem arte pública por perto"
        explain: "A distância em linha reta do lote até a obra de arte pública mais próxima na lista Percent for Art da Prefeitura ou no Wikidata, sem contar obras dentro de prédios. A posição é a parcela de lugares do mapa mais perto de uma, então mais longe fica em posição mais alta. Essas duas listas têm só parte da arte da cidade: os murais do Mural Arts e as obras que só o OpenStreetMap mapeia não estão nelas, então veja também a camada Arte pública. A arte é bem-vinda pela beleza e pelo orgulho; nenhum estudo a liga a menos violência."
      commercial_corridor:
        label: "Em um corredor comercial ou perto dele"
        explain: "Nota máxima, 100, quando o lote fica em um dos corredores comerciais da Prefeitura, as ruas e centros de compras que a Comissão de Planejamento levantou de 2011 a 2017, ou a até 50 metros de um, e 0 nos outros casos. As lojas trazem pessoas passando pelo lote todo dia. Ruas comerciais movimentadas também podem trazer problemas, então a evidência é mista."
    presets:
      balanced:
        label: "Equilibrado"
      most_neighbors:
        label: "Mais vizinhos"
      where_people_walk:
        label: "Onde as pessoas já caminham"
      far_from_a_park:
        label: "Longe de um parque"
  street_safety:
    label: "Segurança das ruas"
    description: "Quarteirões de rua onde pessoas que caminham e andam de bicicleta correm mais risco, a partir dos registros de colisões, da Rede de Lesões Graves da Prefeitura e das escolas por perto."
    factors:
      high_injury_network:
        label: "Na Rede de Lesões Graves"
        explain: "A Prefeitura constatou que a maior parte das mortes e lesões graves no trânsito acontece nestas ruas, cerca de 12 por cento de todas as ruas da Filadélfia."
      walking_cycling_harm:
        label: "Pessoas que morreram ou ficaram gravemente feridas ao caminhar ou andar de bicicleta, últimos 5 anos"
        explain: "Conta as pessoas que morreram ou ficaram gravemente feridas ao caminhar ou andar de bicicleta neste quarteirão ou nas esquinas dele, nos cinco anos mais recentes de registros de colisões do PennDOT. A posição é a parcela de quarteirões da cidade toda com menos casos."
      recent_death:
        label: "Alguém morreu aqui nos últimos 2 anos"
        explain: "Uma morte neste quarteirão ou nas esquinas dele nos últimos dois anos, segundo os registros de colisões fatais do Departamento de Polícia, atualizados toda noite."
      school_nearby:
        label: "Escola a menos de 400 metros"
        explain: "Crianças vão e voltam a pé da escola por aqui. 400 metros são cerca de cinco minutos a pé."
    presets:
      research:
        label: "Baseado em pesquisa"
      recorded_harm:
        label: "Só danos registrados"
  transit_comfort:
    label: "Conforto no transporte"
    description: "Pontos de ônibus e de bonde onde um abrigo, um banco ou uma sombra ajudariam mais os passageiros: pontos movimentados, pontos onde uma verificação não achou nada para se sentar embaixo ou em cima, pontos com pouca sombra em bairros quentes, pontos na Rede de Lesões Graves e pontos com esperas longas. Onde ninguém verificou um ponto ainda, o abrigo e o banco dele contam pela metade."
    factors:
      riders:
        label: "Pessoas que embarcam em cada dia útil"
        explain: "Quantas pessoas embarcam aqui em um dia útil médio, segundo a contagem da própria SEPTA. A posição é a parcela de pontos com menos passageiros. Mais passageiros significa mais pessoas ajudadas por um abrigo ou um banco; a Prefeitura pretende pôr abrigos nos 15 por cento de pontos de ônibus mais movimentados. Os pontos que a SEPTA ainda não contou ficam de fora deste fator."
      no_shelter:
        label: "Sem abrigo"
        explain: "100 onde uma verificação não achou abrigo, 0 onde há um abrigo, o ponto inteiro está debaixo de um teto, ou a lista de abrigos de ônibus da própria Prefeitura tem um ali (seja o que for que o OpenStreetMap diga). Onde ninguém verificou o ponto ainda, vale 50, a metade, para que um ponto nunca seja pontuado como sem um abrigo que talvez tenha; verifique-o para descobrir. Em um estudo em Minneapolis e Saint Paul, os passageiros em pontos sem banco nem abrigo sentiam que as esperas eram mais longas do que eram."
      no_bench:
        label: "Sem banco"
        explain: "100 onde uma verificação não achou banco, 0 onde há um, e 50, a metade, onde ninguém verificou o ponto ainda. O mesmo estudo constatou que um banco faz a espera parecer mais curta."
      little_shade:
        label: "Pouca sombra por perto"
        explain: "Cobertura de copas de árvores no terreno em volta do ponto, em uma área de cerca de dois quarteirões de largura, segundo o levantamento de cobertura de árvores de 2018 da Prefeitura. A posição é a parcela de pontos com mais árvores em volta, então menos árvores ficam em posição mais alta. A sombra refresca quem espera ao sol, mas o quanto ela ajuda depende do clima e do que dá a sombra."
      heat:
        label: "Bairro quente no verão"
        explain: "O quanto o setor censitário do ponto esquenta nos dias de verão, segundo a parte de exposição ao calor do Índice de Vulnerabilidade ao Calor da Prefeitura (temperaturas de superfície medidas por satélite e quanto do setor é pavimentado, construído ou verde). A posição é a parcela de pontos em setores mais frescos."
      high_injury_network:
        label: "Na Rede de Lesões Graves"
        explain: "O ponto fica em uma das ruas onde acontece a maior parte das mortes e lesões graves no trânsito da Filadélfia, ou ao lado dela, então muitos passageiros atravessam essa rua para chegar ao ponto ou para sair dele. Estudos de outros lugares constataram que as colisões com pessoas a pé se concentram em pontos de ônibus movimentados em vias largas, onde uma travessia segura importa mais."
      long_wait:
        label: "Esperas longas ao meio-dia"
        explain: "O tempo típico entre ônibus ou bondes das 10h às 14h em dias úteis, segundo os horários da SEPTA. A posição é a parcela de pontos com esperas mais curtas. Uma espera longa é quando um assento e um teto mais importam. Pontos sem serviço ao meio-dia ficam de fora deste fator."
    presets:
      balanced:
        label: "Equilibrado"
      busiest_first:
        label: "Pontos mais movimentados primeiro"
      heat_and_shade:
        label: "Calor e sombra"

suggestions:
  clean_and_green:
    label: "Limpar e criar uma área verde neste lote"
    summary: "Retire o lixo, nivele o terreno, plante grama e algumas árvores, coloque uma cerca baixa de postes e trilhos, e corte a grama com regularidade."
    cost: "Cerca de US$ 1.100 a US$ 1.500 no início e US$ 150 a US$ 300 por ano (a confirmar com o PHS)"
  seal_abandoned_building:
    label: "Pedir que este prédio seja lacrado"
    summary: "Informe um prédio abandonado aberto para que a Prefeitura lacre as portas e janelas dele."
    cost: "Informar é grátis"
  plant_shade_trees:
    label: "Plantar árvores de sombra neste lote e ao longo dele"
    summary: "Menos árvores dão sombra a esta área do que em volta de pelo menos metade dos lugares deste mapa (o levantamento de cobertura de árvores de 2018 da Prefeitura). As árvores refrescam um quarteirão com a sombra e com a água que as folhas liberam. A Prefeitura planta árvores de rua grátis na calçada quando o proprietário de um imóvel pede, e o TreePhilly distribui árvores grátis para plantar no chão em terrenos particulares. Escolha árvores que cresçam altas, para dar sombra à rua e para que os vizinhos ainda possam enxergar do outro lado do lote."
    cost: "Árvores grátis da Prefeitura e do TreePhilly. Árvores jovens precisam de cerca de 20 galões de água por semana, de março a dezembro"
  cool_green_lot:
    label: "Criar uma área verde neste lote para refrescar o quarteirão"
    summary: "Pelo índice de vulnerabilidade ao calor da Prefeitura, o calor do verão atinge as pessoas daqui mais do que em volta de pelo menos metade dos lugares deste mapa. Terra nua, cascalho e entulho absorvem o sol, enquanto grama, canteiros e, acima de tudo, árvores mantêm um lote mais fresco e dão sombra à calçada ao lado. O que quer que este lote vire, um jardim, um lote limpo e verde ou um quintal lateral, plante árvores de sombra nele e mantenha-as altas para que o lote continue aberto à vista."
    cost: "De árvores grátis (TreePhilly) a cerca de US$ 1.100 a US$ 1.500 no início para um lote limpo e verde completo (a confirmar com o PHS)"
  seating_and_shade:
    label: "Fazer um lugar para sentar à sombra"
    summary: "Mais pessoas moram a até 5 minutos a pé deste lote do que em volta de pelo menos metade dos lugares deste mapa. Alguns bancos ou uma mesa de piquenique sob árvores de sombra podem fazer dele um lugar onde os vizinhos param, descansam e se encontram. Pergunte aos vizinhos o que eles usariam, escolha assentos resistentes e plante árvores que cresçam altas para que o lote continue aberto à vista. Planeje quem vai mantê-lo limpo."
    cost: "De árvores grátis (TreePhilly) e um banco feito a partir de um projeto aberto a alguns milhares de dólares. As mini verbas de espaço público do Feet First Philly dão de US$ 500 a US$ 2.500"
  community_garden:
    label: "Começar um jardim comunitário"
    summary: "Este lote fica mais longe de um parque do que pelo menos metade dos lugares deste mapa, e pelo menos 1.000 pessoas moram a até 5 minutos a pé dele. Um jardim comunitário dá aos vizinhos área verde, alimentos e flores, e um motivo para se encontrar. Precisa de jardineiros que voltem toda semana, de água e de permissão para usar o terreno. Quando um jardim está funcionando, o Neighborhood Gardens Trust pode ajudar a mantê-lo como jardim para sempre."
    cost: "De alguns canteiros elevados a alguns milhares de dólares com terra, cerca e água. O Urban Garden Agreement do Land Bank custa US$ 1"
  art_request:
    label: "Perguntar sobre um mural ou outra arte"
    summary: "Muitas pessoas moram em volta deste lote, e nenhuma obra da lista Percent for Art da Prefeitura ou do Wikidata fica a até 5 minutos a pé. Essas listas deixam de fora muitos murais, então veja primeiro a camada Arte pública e a lista de murais do próprio Mural Arts. Uma parede em branco de frente para o lote poderia receber um mural: o Mural Arts aceita pedidos dos proprietários de paredes no próprio site. A arte é bem-vinda pela beleza e pelo orgulho; nenhum estudo a liga a menos violência."
    cost: "Perguntar ao Mural Arts é grátis"
  report_dumping:
    label: "Informar o descarte ilegal de lixo ao Philly311"
    summary: "Alguém perguntou ao Philly311 sobre descarte ilegal de lixo em um quarteirão para o qual este lote dá de frente nos últimos 90 dias, e o pedido ainda está aberto. Se o lixo ainda está lá, faça o seu próprio pedido, com uma foto, para que a Prefeitura o recolha. Um relato é sobre o lixo, nunca sobre quem o deixou."
    cost: "Informar é grátis"
  report_dark_light:
    label: "Informar a luz de rua apagada ao Philly311"
    summary: "Alguém pediu ao Philly311 que consertasse uma luz de rua ou de beco apagada em um quarteirão para o qual este lote dá de frente, nos últimos 90 dias, e o pedido ainda está aberto. Se a luz continua apagada, faça o seu próprio pedido, com o número do poste se ele tiver um. Uma rua iluminada ajuda os vizinhos a usar a rua e o lote depois de escurecer."
    cost: "Informar é grátis"
  report_graffiti:
    label: "Informar a pichação ao Philly311"
    summary: "Alguém pediu ao Philly311 que removesse pichação em um quarteirão para o qual este lote dá de frente nos últimos 90 dias, e o pedido ainda está aberto. Se ela continua lá, faça o seu próprio pedido, com uma foto, para que a Prefeitura possa limpá-la. Se os vizinhos preferirem ter arte naquela parede, pergunte ao proprietário dela sobre um mural."
    cost: "Informar é grátis"
  memorial_or_ghost_bike:
    label: "Um memorial ou uma ghost bike"
    summary: "Um memorial homenageia a pessoa que morreu e lembra todos que passam de reduzir a velocidade. Para uma pessoa que morreu andando de bicicleta, a Bicycle Coalition pode colocar uma ghost bike, uma bicicleta pintada de branco."
    cost: "Baixo; pedir uma ghost bike é grátis"
  traffic_calming_petition:
    label: "Pedir moderação de tráfego nesta rua residencial"
    summary: "Os vizinhos podem pedir à Prefeitura almofadas de velocidade em uma rua residencial. A Prefeitura pontua os pedidos três vezes por ano usando dados de colisões e, se esta rua for escolhida, 60 por cento do quarteirão assina um abaixo-assinado. Avenidas principais, rodovias estaduais e ruas curtas, íngremes e sinuosas não se qualificam."
    cost: "Pedir é grátis"
  daylighting_check:
    label: "Conferir se esta esquina está livre por 20 pés"
    summary: "A lei da Pensilvânia já proíbe estacionar a menos de 20 pés de uma faixa de pedestres em um cruzamento, e a menos de 30 pés de uma placa de pare ou de um semáforo, para que motoristas e pessoas atravessando possam se ver. Se carros estacionam ali, pergunte à Prefeitura sobre liberar a visibilidade da esquina com tinta, balizadores ou jardineiras. Informe ao Philly311 uma luz de rua apagada aqui."
    cost: "Perguntar é grátis"
  asphalt_art_check:
    label: "Arte no asfalto nesta esquina: consulte antes a Prefeitura"
    summary: "Um estudo de cruzamentos pintados encontrou menos colisões com pessoas a pé e de bicicleta, mas não tinha grupo de comparação e foi pago pelo patrocinador do programa. Em 2025 o governo federal começou a pedir que os estados removam arte em faixas de pedestres, e a Filadélfia não tem processo de licença para isso. Consulte a Prefeitura antes de pintar qualquer coisa."
    cost: "Não se sabe; não há processo da Prefeitura para estimar o preço"
  stop_survey:
    label: "Verificar este ponto com o StreetComplete"
    summary: "Ninguém registrou ainda se este ponto tem abrigo ou banco, ou o OpenStreetMap e a lista de abrigos de ônibus da Prefeitura discordam sobre o abrigo dele. Qualquer pessoa pode descobrir em poucos minutos com o aplicativo de celular gratuito StreetComplete, e as respostas chegam a este mapa em cerca de uma semana. Se o aplicativo não tiver pergunta aqui, o ponto ainda não está no OpenStreetMap: adicione-o com a camada Things do aplicativo, ou deixe uma nota."
    cost: "Grátis; cerca de três minutos por ponto"
  stop_shelter_request:
    label: "Pedir à Prefeitura um abrigo neste ponto"
    summary: "Uma verificação não achou abrigo aqui, e a lista de abrigos de ônibus da Prefeitura também não tem nenhum aqui. O programa de abrigos de ônibus da Prefeitura, administrado pelo seu escritório de transportes (OTIS), constrói abrigos pagos pela publicidade que eles exibem e pretende pô-los nos 15 por cento de pontos de ônibus mais movimentados. Não há formulário público de pedido, então escreva ao OTIS com o número do ponto e quantas pessoas embarcam aqui."
    cost: "Perguntar é grátis"
  stop_bench_request:
    label: "Pedir à Prefeitura um banco neste ponto"
    summary: "Uma verificação não achou banco aqui. Os bancos nos pontos fazem parte do programa de mobiliário urbano da Prefeitura, administrado pelo OTIS, e não achamos uma forma pública de pedir um, então escreva ao OTIS com o número do ponto. Um banco que você mesmo construa precisa de permissão, e o caminho de licença da Prefeitura para um banco em uma calçada ainda não está confirmado."
    cost: "Perguntar é grátis"
  stop_streetlight_report:
    label: "Informar uma luz de rua apagada neste ponto"
    summary: "O OpenStreetMap diz que este ponto não é iluminado. Se uma luz de rua aqui estiver apagada, informe ao Philly311. O programa atual de iluminação da Prefeitura troca luzes, mas não acrescenta novas, então um ponto sem nenhuma luz é uma pergunta para o OTIS."
    cost: "Informar é grátis"
  stop_shade_trees:
    label: "Plantar árvores de sombra perto deste ponto"
    summary: "Poucas árvores dão sombra a este ponto. A Prefeitura planta árvores de rua grátis na calçada em frente a uma casa ou comércio quando o proprietário pede, e as rega no primeiro ano. Peça aos proprietários dos prédios ao lado do ponto que solicitem uma; depois disso os vizinhos podem ajudar a regá-la."
    cost: "Árvores de rua grátis para proprietários de imóveis"

routes:
  land_bank_garden_agreement:
    label: "Acordo ou licença de jardim do Land Bank"
    who: "Qualquer pessoa, para um Urban Garden Agreement de US$ 1; grupos com um patrocinador sem fins lucrativos, para uma Community Garden License"
    steps:
      - "Confira se o lote pertence ao Land Bank ou à Prefeitura."
      - "Leia o guia do Grounded in Philly sobre como obter permissão para usar terras da Prefeitura."
      - "Candidate-se ao Land Bank, ou participe antes de um dos webinars gratuitos dele."
    cost: "US$ 1 (Urban Garden Agreement), US$ 25 por ano (Individual Garden Agreement), ou seguro e um patrocinador (Community Garden License)"
    timeline: "Semanas para acordos curtos; meses para uma licença"
    links:
      "https://phillylandbank.org/":
        label: "Philadelphia Land Bank"
      "https://groundedinphilly.org/get-permission-to-use-land-city/":
        label: "Grounded in Philly: permissão para usar terras da Prefeitura"
  ask_the_owner:
    label: "Pedir permissão ao proprietário"
    who: "Qualquer pessoa"
    steps:
      - "Encontre o endereço de correspondência do proprietário na página do lote."
      - "Escreva pedindo permissão para limpar e criar uma área verde no lote, e ofereça um acordo escrito simples."
      - "Peça à Garden Justice Legal Initiative que revise qualquer acordo antes de você assinar."
    cost: "Grátis"
    timeline: "Depende do proprietário"
    links:
      "https://www.pubintlaw.org/cases-and-advocacy/garden-justice-legal-initiative/":
        label: "Garden Justice Legal Initiative"
  community_landcare:
    label: "Cuidar de um lote com o PHS Community LandCare"
    who: "Grupos de moradores"
    steps:
      - "Entre em contato com o PHS sobre o Community LandCare."
    cost: "A confirmar com o PHS"
    timeline: "A confirmar com o PHS"
    links:
      "https://phsonline.org/":
        label: "Pennsylvania Horticultural Society"
  report_to_311:
    label: "Informar ao Philly311"
    who: "Qualquer pessoa"
    steps:
      - "Informe o prédio aberto, o descarte ilegal de lixo, a pichação ou a luz de rua ou de beco apagada ao Philly311 pela internet, pelo aplicativo ou ligando para o 311."
      - "Guarde o número do pedido de serviço e volte para conferir."
    cost: "Grátis"
    timeline: "De dias a semanas"
    links:
      "https://www.phila.gov/services/property-lots-housing/submit-a-service-request-with-311/":
        label: "Philly311"
  ghost_bike_request:
    label: "Perguntar à Bicycle Coalition sobre uma ghost bike ou um memorial"
    who: "A família, ou amigos com a bênção da família"
    steps:
      - "Converse primeiro com a família. Um memorial só é instalado com a bênção dela."
      - "Para uma pessoa que morreu andando de bicicleta, preencha o formulário de pedido de ghost bike da Bicycle Coalition. O mesmo formulário serve para pedir que uma ghost bike seja consertada ou substituída."
      - "O Families for Safe Streets, administrado pela Bicycle Coalition, apoia as famílias depois de uma colisão e compartilha um guia de recursos para depois da colisão."
      - "Planeje quem vai cuidar do memorial ao longo do tempo."
    cost: "Pedir é grátis"
    timeline: "Não informado"
    links:
      "https://bicyclecoalition.org/what-is-a-ghost-bike/":
        label: "Bicycle Coalition: o que é uma ghost bike"
      "https://forms.gle/HBtY1hG4xcdVJKNb8":
        label: "Formulário de pedido de ghost bike"
      "https://bicyclecoalition.org/programs/families-for-safe-streets/":
        label: "Families for Safe Streets Greater Philadelphia"
  traffic_calming_request:
    label: "Pedir moderação de tráfego em uma rua residencial"
    who: "Moradores do quarteirão, principalmente da rua onde moram"
    steps:
      - "Confira se a rua se qualifica no mapa de moderação de tráfego da Prefeitura, ou ligando para o 311."
      - "Envie o pedido on-line de moderação de tráfego da Prefeitura."
      - "Se a Prefeitura selecionar o pedido, colete assinaturas de 60 por cento dos domicílios do quarteirão, uma por domicílio."
    cost: "Pedir é grátis"
    timeline: "A Prefeitura pontua os pedidos três vezes por ano e costuma instalar almofadas de velocidade de maio a outubro"
    links:
      "https://www.phila.gov/services/streets-sidewalks-alleys/request-traffic-calming-for-a-residential-street/":
        label: "Prefeitura da Filadélfia: pedir moderação de tráfego"
  otis_contact:
    label: "Perguntar ao escritório de transportes da Prefeitura (OTIS)"
    who: "Qualquer pessoa"
    steps:
      - "Escreva ao Escritório de Transporte e Sistemas de Infraestrutura em otis@phila.gov, dizendo a esquina e o que você vê ali."
      - "Pergunte o que a Prefeitura permite nesta esquina e como pedir."
    cost: "Grátis"
    timeline: "Não informado"
    links:
      "https://visionzerophl.com/":
        label: "Vision Zero Philadelphia"
  treephilly_yard_trees:
    label: "Receber árvores grátis em uma distribuição do TreePhilly"
    who: "Moradores da Filadélfia, para árvores plantadas no chão em propriedade particular, como um lote que você possui ou um lote particular cujo proprietário concorda por escrito"
    steps:
      - "Inscreva-se na newsletter do TreePhilly para saber quando as inscrições abrem. As distribuições acontecem na primavera (de março a maio) e no outono (de setembro a dezembro) em CEPs prioritários."
      - "Inscreva-se no grupo comunitário que organiza uma distribuição perto de você. As inscrições abrem de duas semanas a um mês antes da distribuição e fecham quando as árvores acabam."
      - "Retire a árvore, de 2 a 10 pés de altura em um balde de 5 galões, com um saco grátis de cobertura morta (mulch), e plante-a no chão. As árvores da distribuição não podem ir em um vaso, na calçada nem em nenhum outro lugar da área pública de passagem."
    cost: "Grátis"
    timeline: "A próxima distribuição de primavera ou de outono"
    links:
      "https://treephilly.org/yard-trees/":
        label: "TreePhilly: árvores para quintais"
  mural_arts_wall_request:
    label: "Pedir um mural em uma parede ao Mural Arts"
    who: "O proprietário da parede, com vizinhos que apoiem. Qualquer pessoa pode começar perguntando ao proprietário"
    steps:
      - "Ache uma parede de frente para o lote e fácil de ver da rua, e pergunte ao proprietário dela se ele gostaria de receber um mural."
      - "Com o acordo do proprietário, preencha o formulário de pedido de parede na página de contato do Mural Arts Philadelphia. Ele pergunta sobre a parede, o apoio dos vizinhos e por que um mural importa ali."
      - "Qualquer coisa na rua ou na calçada, a área pública de passagem, também vai para a Comissão de Arte (Art Commission) da Prefeitura."
    cost: "Candidatar-se é grátis"
    timeline: "Meses"
    links:
      "https://muralarts.org/contact/":
        label: "Mural Arts Philadelphia: página de contato, com o formulário para um mural na sua parede"
  public_space_mini_grant:
    label: "Candidatar-se a uma mini verba de espaço público do Feet First Philly"
    who: "Vizinhos e grupos comunitários. O programa favorece comunidades que receberam menos investimento em suas ruas e nos serviços da Prefeitura"
    steps:
      - "Leia o pedido de propostas na página de mini verbas do Feet First Philly. Os projetos devem tornar o bairro mais seguro e mais fácil de percorrer a pé e sobre rodas; pergunte ao Feet First Philly se um lugar para sentar em um lote se qualifica."
      - "Candidate-se enquanto a rodada está aberta. As candidaturas abrem em agosto e vencem em outubro."
      - "Espere enviar um relatório curto na metade do projeto e outro no fim."
    cost: "Verbas de US$ 500 a US$ 2.500, financiadas em parte pelo Departamento de Saúde Pública"
    timeline: "As candidaturas abrem em agosto e vencem em outubro de cada ano"
    links:
      "https://feetfirstphilly.org/public-space-enhancement-mini-grant-2/":
        label: "Feet First Philly: mini verba de melhoria de espaço público"
  land_bank_side_yard:
    label: "Obter como quintal lateral ou dos fundos (só para quem é proprietário da casa ao lado)"
    who: "O proprietário da casa ao lado, e só quando a lista da Prefeitura marca o lote como elegível para quintal lateral"
    steps:
      - "Confira se você é proprietário da casa ao lado e se o lote está marcado como elegível para quintal lateral."
      - "Leia a página do Land Bank sobre quintais laterais e dos fundos e candidate-se."
      - "Espere demorar bastante. Depois da análise da equipe, o conselho do Land Bank e a Câmara Municipal precisam aprovar."
    cost: "Um preço simbólico. O lote deve continuar sendo um quintal lateral para sempre, sob uma hipoteca de 30 anos pelo valor avaliado dele, que é perdoada se as regras forem cumpridas; a Prefeitura pode retomá-lo se não forem"
    timeline: "A equipe pretende responder em 120 dias, e depois o conselho do Land Bank e a Câmara Municipal decidem. Só 67 lotes foram transferidos assim na cidade toda de 2020 a 2023"
    links:
      "https://phillylandbank.org/side-or-rear-yards/":
        label: "Philadelphia Land Bank: quintais laterais ou dos fundos"
  contact_phdc:
    label: "Perguntar à PHDC sobre este lote"
    who: "Qualquer pessoa"
    steps:
      - "Entre em contato com a PHDC e informe o endereço do lote e o número da conta dele na OPA."
      - "Pergunte quem administra o lote, se ele está disponível e como os vizinhos poderiam cuidar dele."
      - "Se você não tem certeza de a quem perguntar, comece pelo Land Bank (land@phdc.phila.gov, 215 448 3034)."
    cost: "Perguntar é grátis"
    timeline: "Não se sabe. Os lotes da Autoridade de Redesenvolvimento ainda não têm caminho publicado para os vizinhos"
    links:
      "https://phdcphila.org/":
        label: "PHDC"
      "https://phillylandbank.org/":
        label: "Philadelphia Land Bank"
  garden_adverse_possession:
    label: "Usucapião de jardim (lei de 2024)"
    who: "Moradores da Filadélfia, grupos ou organizações sem fins lucrativos que cultivaram um jardim em um lote de propriedade particular"
    steps:
      - "Confira as condições da lei de 2024 (53 Pa.C.S. seção 1143, em vigor desde 6 de setembro de 2024): terreno de propriedade particular de meio acre ou menos, 10 anos de uso com pelo menos 5 deles como jardim, e nenhum prédio permanente (cercas e galpões são permitidos)."
      - "Leia o guia do Grounded in Philly sobre usucapião (adverse possession)."
      - "Peça um advogado à Garden Justice Legal Initiative. Este caminho exige uma ação judicial para regularizar o título (quiet title)."
    cost: "Um advogado e custas judiciais. Quaisquer dívidas registradas sobre o terreno continuam com ele"
    timeline: "Pelo menos 10 anos de uso, e depois uma ação judicial"
    links:
      "https://groundedinphilly.org/how-to-obtain-land-adverse-possession/":
        label: "Grounded in Philly: usucapião (adverse possession)"
      "https://www.pubintlaw.org/cases-and-advocacy/garden-justice-legal-initiative/":
        label: "Garden Justice Legal Initiative"
  conservatorship:
    label: "Administração judicial, o conservatorship (Lei 135)"
    who: "Uma organização sem fins lucrativos ou uma pessoa que faz uma petição ao tribunal"
    warning: "A administração judicial (conservatorship) pode tirar um imóvel do seu proprietário. Pesquisadores constataram que ela é usada de forma desproporcional em bairros que enfrentam gentrificação. Converse com a Garden Justice Legal Initiative antes de considerá-la."
    steps:
      - "Converse com a Garden Justice Legal Initiative antes de qualquer outra coisa."
      - "Pergunte primeiro se escrever ao proprietário, ou ajudar uma família a ficar com o imóvel, atenderia à mesma necessidade."
      - "Conheça as condições da lei: um tribunal só pode nomear um administrador (conservator) para um imóvel que não foi legalmente ocupado por 12 meses, não está sendo anunciado, não está em execução hipotecária (foreclosure) e não foi comprado nos últimos 6 meses."
    cost: "Custas judiciais e de reparos. Desde 2014, quem faz a petição pode receber o maior valor entre US$ 2.500, 20% dos custos ou 20% do preço de venda"
    timeline: "Um processo judicial; pergunte à assistência jurídica quanto tempo levaria"
    links:
      "https://www.pubintlaw.org/cases-and-advocacy/garden-justice-legal-initiative/":
        label: "Garden Justice Legal Initiative"
  tangled_title_help:
    label: "Ajudar uma família a ficar com uma casa herdada (Tangled Title Fund)"
    who: "Famílias cuja casa ainda está no nome de um parente que morreu, com renda familiar de até 80% da mediana da região; o imóvel deve ser a casa de quem se candidata"
    steps:
      - "Entre em contato com o Tangled Title Fund na Philadelphia VIP (tangledtitlefund@gmail.com, 215 523 9553)."
      - "O fundo paga até US$ 6.500 do custo jurídico para regularizar o título, e até US$ 3.500 a mais para o imposto de transferência, caso a caso."
    cost: "Grátis para a família até os limites do fundo; a família cobre o que passar deles"
    timeline: "Por ordem de chegada"
    links:
      "https://phillyvip.org/tangled-title-fund/":
        label: "Philadelphia VIP: Tangled Title Fund"
  fraud_guard:
    label: "Inscrever-se nos alertas gratuitos do Fraud Guard da Prefeitura"
    who: "Proprietários de imóveis e suas famílias"
    steps:
      - "Inscreva-se no Fraud Guard com um nome e um endereço de e-mail."
      - "A Prefeitura envia um e-mail quando um documento com o seu nome é registrado, para que uma escritura falsa seja descoberta cedo."
      - "Dúvidas vão para o Departamento de Registros (215 686 2290, records.info@phila.gov)."
    cost: "Grátis"
    timeline: "Um alerta chega cerca de 30 dias depois que um documento é registrado"
    links:
      "https://www.phila.gov/2022-09-06-own-property-in-philadelphia-get-free-deed-fraud-protection-with-fraud-guard/":
        label: "Prefeitura da Filadélfia: Fraud Guard"
  bus_shelter_request:
    label: "Pedir um abrigo de ônibus à Prefeitura"
    who: "Qualquer pessoa"
    steps:
      - "Anote o número do ponto na SEPTA (na placa e neste mapa), a esquina e quantas pessoas embarcam ali em cada dia útil."
      - "Escreva ao Escritório de Transporte e Sistemas de Infraestrutura (OTIS) da Prefeitura em otis@phila.gov, ou ligue para 215-686-9003. O OTIS administra o programa de abrigos de ônibus da Prefeitura; não há formulário público de pedido."
      - "Envie cópia ao gabinete do seu distrito na Câmara Municipal e avise também a SEPTA, pelo formulário de comentários on-line dela ou pelo 215-580-7800."
    cost: "Perguntar é grátis"
    timeline: "Não informado. O OTIS envia os novos locais de abrigo à Comissão de Arte (Art Commission) da Prefeitura para análise (oito em dezembro de 2025)"
    links:
      "https://www.phila.gov/media/20240521160603/RFI-OTIS-street-furniture-20240521.pdf":
        label: "Pedido de informações do OTIS sobre mobiliário urbano (maio de 2024), com a meta da Prefeitura para os abrigos"
      "https://www.phila.gov/media/20251205094032/Bus-Shelter-Upgrades-submission.pdf":
        label: "Oito novos abrigos de ônibus enviados à Comissão de Arte (dezembro de 2025)"
      "https://wwww.septa.org/customer-service/comment-form/":
        label: "Formulário de comentários da SEPTA"
      "https://phlcouncil.com/council-members/":
        label: "Câmara Municipal da Filadélfia: o vereador e o gabinete de cada distrito"
  stop_bench_request:
    label: "Pedir um banco em um ponto à Prefeitura"
    who: "Qualquer pessoa"
    steps:
      - "Anote o número do ponto na SEPTA (na placa e neste mapa) e a esquina."
      - "Escreva ao OTIS em otis@phila.gov, ou ligue para 215-686-9003, e peça um banco no ponto. Os bancos nos pontos fazem parte do programa de mobiliário urbano da Prefeitura; não achamos um formulário público de pedido."
      - "Envie cópia ao gabinete do seu distrito na Câmara Municipal."
    cost: "Perguntar é grátis"
    timeline: "Não informado"
    links:
      "https://www.phila.gov/media/20240521160603/RFI-OTIS-street-furniture-20240521.pdf":
        label: "Pedido de informações do OTIS sobre mobiliário urbano (maio de 2024)"
      "https://phlcouncil.com/council-members/":
        label: "Câmara Municipal da Filadélfia: o vereador e o gabinete de cada distrito"
  street_tree_request:
    label: "Pedir uma árvore de rua grátis"
    who: "O proprietário da casa, do comércio, do lote ou de outro imóvel em frente ao qual a árvore ficaria; os vizinhos podem pedir ao proprietário que faça o pedido"
    steps:
      - "As árvores de rua são plantadas na calçada em frente a um imóvel quando o proprietário pede. Converse com os proprietários dos prédios ao lado do local. Para um lote vazio, pergunte ao proprietário que a página do lote nomeia, ou ao Land Bank no caso de um lote que a Prefeitura ou o Land Bank possui."
      - "O proprietário pede uma árvore de rua grátis à Divisão de Gestão de Árvores de Rua de Parques e Recreação (Street Tree Management Division), pela internet, por e-mail em StreetTree.Info@phila.gov ou por telefone no 215-685-4363."
      - "Um arborista da Prefeitura faz uma visita para decidir qual árvore serve. A Prefeitura a planta de graça em uma época de plantio (de meados de abril a meados de junho, ou de meados de outubro a meados de novembro) e a rega e cobre a terra com cobertura morta no primeiro ano. Depois disso, o TreePhilly pede cerca de 20 galões de água por semana, de março a dezembro."
    cost: "Grátis"
    timeline: "A próxima época de plantio depois da visita do arborista"
    links:
      "https://www.phila.gov/services/trees-parks-the-environment/tree-related-services/get-a-street-tree/":
        label: "Prefeitura da Filadélfia: pedir uma árvore de rua"
      "https://treephilly.org/street-trees/":
        label: "TreePhilly: árvores de rua"
  streetcomplete_survey:
    label: "Verificar o ponto com o StreetComplete"
    who: "Qualquer pessoa com um celular Android (uma primeira versão de teste para iPhone apareceu em setembro de 2026)"
    steps:
      - "Instale o aplicativo gratuito StreetComplete e crie uma conta gratuita do OpenStreetMap para que as suas respostas sejam publicadas."
      - "No ponto, toque no marcador do aplicativo e responda às perguntas dele sobre o abrigo, o banco, a iluminação e o número do ponto."
      - "Se o aplicativo não tiver pergunta no ponto, adicione o ponto com a camada Things dele, ou deixe uma nota para que outro mapeador possa fazê-lo."
    cost: "Grátis"
    timeline: "As respostas chegam a este mapa em cerca de uma semana"
    links:
      "https://holdthedoorhoid.github.io/placekeepers/streetcomplete/":
        label: "Placekeepers: verificar pontos de ônibus"
      "https://streetcomplete.app/":
        label: "StreetComplete"
  neighborhood_gardens_trust:
    label: "Manter um jardim comunitário para sempre (Neighborhood Gardens Trust)"
    who: "Jardineiros cujo jardim comunitário já cresce há pelo menos três temporadas"
    steps:
      - "Confira os critérios do trust: um jardim ativo há pelo menos três temporadas de cultivo, jardineiros capazes de mantê-lo, ligações com grupos como uma corporação de desenvolvimento comunitário, uma igreja ou uma escola, e apoio dos vizinhos e do vereador do distrito na Câmara Municipal."
      - "Candidate-se com o formulário on-line de jardim do trust, ou com o formulário para imprimir. O trust responde em cerca de duas semanas, depois visita o jardim e o leva à sua diretoria."
      - "Depois de aprovado, o trust trabalha com a Prefeitura para adquirir o terreno e o mantém para que os vizinhos possam continuar a cultivar, com seguro de responsabilidade civil e ajuda com água e manutenção. Dúvidas vão para o 215 988 1630 ou ngtrust@pennhort.org."
    cost: "Candidatar-se é grátis"
    timeline: "Uma resposta em cerca de duas semanas; adquirir o terreno leva mais tempo"
    links:
      "https://ngtrust.org/preservation/":
        label: "Neighborhood Gardens Trust: preservação de jardins"
  community_land_trust:
    label: "Manter moradias e terras acessíveis para sempre (fundos de terra comunitários)"
    who: "Vizinhos, grupos comunitários e organizações sem fins lucrativos"
    steps:
      - "Saiba como funciona um fundo de terra comunitário (community land trust): uma organização sem fins lucrativos é dona do terreno para sempre, as famílias compram ou alugam as casas nele, e um arrendamento longo do terreno mantém cada casa acessível quando ela é vendida de novo."
      - "Converse com um fundo de terra que já atua na Filadélfia, como o Community Justice Land Trust do Women's Community Revitalization Project, que mantém casas em Point Breeze, Grays Ferry, Mantua, Germantown, Port Richmond e Haddington."
      - "Pergunte à Garden Justice Legal Initiative como um fundo de terra poderia manter um jardim ou um lote de que o seu grupo já cuida."
    cost: "Perguntar é grátis"
    timeline: "Longo; os projetos de um fundo de terra levam anos"
    links:
      "https://groundedsolutions.org/strengthening-neighborhoods/community-land-trusts":
        label: "Grounded Solutions Network: fundos de terra comunitários"
      "https://www.wcrpphila.org/cjlt":
        label: "Women's Community Revitalization Project: Community Justice Land Trust"
  homestead_exemption:
    label: "Reduzir a conta de impostos de quem tem casa própria (a isenção Homestead da Prefeitura)"
    who: "Quem é proprietário da sua casa na Filadélfia e mora nela como moradia principal, mesmo com hipoteca ou dívida de impostos; não vale para casas com uma isenção de impostos (tax abatement) de 10 anos"
    steps:
      - "Candidate-se no Philadelphia Tax Center (tax-services.phila.gov), onde um único pedido combinado cobre os programas de alívio de impostos da Prefeitura, ou ligue para a Homestead Hotline no 215 686 9200, ou envie o formulário pelo correio ao Departamento de Receita (Department of Revenue), P.O. Box 52817, Philadelphia, PA 19115."
      - "A isenção tira US$ 100.000 do valor avaliado da casa para a conta de impostos, economizando até US$ 1.399 por ano."
      - "Candidate-se até 1º de dezembro (até 1º de outubro para ver na próxima conta). Depois de aceita, não é preciso se candidatar de novo, a menos que a escritura mude."
    cost: "Grátis"
    timeline: "Vence em 1º de dezembro de cada ano"
    links:
      "https://www.phila.gov/services/payments-assistance-taxes/taxes/property-and-real-estate-taxes/get-real-estate-tax-relief/get-the-homestead-exemption/":
        label: "Prefeitura da Filadélfia: obter a isenção Homestead"
  longtime_owner_occupants:
    label: "Limitar a avaliação de um proprietário de longa data (Programa de Ocupantes Proprietários de Longa Duração, LOOP, da Prefeitura)"
    who: "Proprietários que moram na casa há pelo menos 10 anos, cuja avaliação subiu pelo menos 50 por cento em um ano ou 75 por cento em cinco anos, com renda familiar abaixo do limite da Prefeitura (como US$ 103.050 para uma pessoa ou US$ 147.200 para quatro em 2026), em dia com os impostos ou em um acordo de pagamento"
    steps:
      - "Candidate-se no Philadelphia Tax Center (tax-services.phila.gov) com o pedido combinado da Prefeitura, ou ligue para o 215 686 9200, envie e-mail para revenue@phila.gov ou envie o formulário pelo correio ao Departamento de Receita (Department of Revenue), P.O. Box 53190, Philadelphia, PA 19105."
      - "O LOOP limita a avaliação que a conta de impostos usa, a 1,5 vez a do ano anterior ou 1,75 vez o menor valor dos últimos cinco anos, enquanto o proprietário continuar elegível."
      - "Candidate-se até o prazo anual da Prefeitura (30 de setembro nos últimos anos); a página da Prefeitura informa o prazo atual."
    cost: "Grátis"
    timeline: "Um prazo anual, 30 de setembro nos últimos anos"
    links:
      "https://www.phila.gov/services/payments-assistance-taxes/payment-plans-and-assistance-programs/income-based-programs-for-residents/apply-for-the-longtime-owner-occupants-program-loop/":
        label: "Prefeitura da Filadélfia: candidatar-se ao LOOP"

