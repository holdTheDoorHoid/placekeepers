  atlas_1860:
    label: "Atlas de 1860 (Hexamer e Locher)"
    description: "O atlas de 1860 da Filadélfia de Hexamer e Locher, desenhado quarteirão por quarteirão com seus prédios e lotes, ajustado ao mapa de hoje pela Greater Philadelphia GeoHistory Network e hospedado pela Prefeitura. Cobre só o Center City e o Northern Liberties. Diminua a intensidade dele para ver as ruas de hoje através dele. Ele vem direto dos servidores da Prefeitura quando esta camada está ativada."
    settings:
      opacity:
        label: "Com que intensidade o atlas aparece, em porcentagem"
  redlining_1937:
    label: "Mapa de redlining de 1937 (classificações do HOLC)"
    description: "Em 1937, uma agência federal, a Home Owners' Loan Corporation (HOLC), classificou os bairros da Filadélfia de A a D conforme o quanto considerava seguro conceder financiamento imobiliário ali. As classificações se apoiavam em quem morava em cada área: as áreas onde moravam famílias negras e muitas famílias imigrantes costumavam receber D e ser contornadas em vermelho, e daí vem a palavra redlining. Esta camada mostra as áreas e classificações de 1937 como o Mapping Inequality as traçou. As classificações são um registro de como a agência julgava os lugares em 1937; elas não dizem nada sobre as pessoas que moram lá hoje. Toque em uma área para ver a classificação dela e um link para a descrição de 1937 no Mapping Inequality. Somente para uso não comercial."
    settings:
      shade:
        label: "Colorir as áreas (desligado mostra só os contornos e as classificações)"

