    description: "សម្រាប់​ប្រអប់​ឆ​កោន​នី​មួយៗ​ទំហំ​ប្រហែល​ពីរ​ប្លុក៖ មនុស្ស​ប៉ុន្មាន​នាក់​រស់នៅ​ក្នុង​ចម្ងាយ​ដើរ 5 នាទី​ពី​កណ្តាល​របស់​វា ពី​ជំរឿន​ឆ្នាំ 2020 ឬ​ប្រភេទ​កន្លែង​ប្រចាំថ្ងៃ​ប៉ុន្មាន​ក្នុងចំណោម​ប្រាំពីរ ស្ថិត​ក្នុង​ចម្ងាយ​ដើរ 10 នាទី (បណ្ណាល័យ មជ្ឈមណ្ឌល​កម្សាន្ត អាងហែលទឹក ឬ​កន្លែង​បាញ់​ទឹក​លេង ទឹកផឹក​ក្នុង​សួន សាលារៀន ហាង​លក់​ម្ហូបអាហារ ឬ​ផ្សារ​ដែល​ទទួល SNAP និង​ចំណត​ឡានក្រុង ត្រូលី ឬ​រថភ្លើង) ឬ​មាន​ជ្រុង​ផ្លូវ​ប៉ុន្មាន​ក្នុង​ចម្ងាយ​ដើរ 5 នាទី។ ការ​ដើរ 5 នាទី​ត្រូវ​បាន​រាប់​ជា 400 ម៉ែត្រ ហើយ​ការ​ដើរ 10 នាទី​ជា 800 ម៉ែត្រ​តាម​បន្ទាត់ត្រង់ ដែល​ដល់​ឆ្ងាយ​ជាង​ការ​ដើរតាម​ផ្លូវ​បន្តិច ហើយ​ឆ្លងកាត់​ផ្លូវ​រថភ្លើង ផ្លូវ​ល្បឿន​លឿន និង​ទន្លេ​ដែល​មនុស្ស​ដើរ​ជើង​មិន​អាច​ឆ្លង​បាន។"
