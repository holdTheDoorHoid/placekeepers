    description: "សវនាការ​ដែល​បាន​កំណត់​នៅ​ចំពោះ Zoning Board of Adjustment, L&I Review Board, Board of Building Standards និង​ក្រុមប្រឹក្សា​ផ្សេងទៀត​របស់​ទីក្រុង​អំពី​ទ្រព្យសម្បត្តិ​មួយ ពី​កំណត់ត្រា​ពាក្យ​ប្តឹង​ឧទ្ធរណ៍​របស់​ទីក្រុង ជាមួយ​ថ្ងៃ ម៉ោង និង​ប្រភេទ​ពាក្យ​ប្តឹង​ឧទ្ធរណ៍។ អ្នកណា​ក៏អាច​ចូលរួម​ក្នុង​សវនាការ​កំណត់​តំបន់​បាន៖ សូម​ប៉ះ​មួយ ដើម្បី​មើល​របៀប និង​បើក​ទំព័រ​របស់​ដី​ឡូត៍។ អ្នក​ដែល​ដាក់ពាក្យ​ប្តឹង​ឧទ្ធរណ៍​ត្រូវ​បាន​បង្ហាញ​លើ​ទំព័រ​របស់​ដី​ឡូត៍​នោះ​ប៉ុណ្ណោះ មិនដែល​នៅ​លើ​ផែនទី​ទេ។"
