        explain: "100 កន្លែង​ដែល​ការ​ស្ទង់​មើល​រក​មិនឃើញ​កៅអីវែង 0 កន្លែង​ដែល​មាន និង 50 ពាក់កណ្តាល កន្លែង​ដែល​មិនទាន់​មាន​នរណា​ស្ទង់​មើល​ចំណត។ ការសិក្សា​ដូចគ្នា​រក​ឃើញថា កៅអីវែង​ធ្វើ​ឱ្យ​ការ​រង់ចាំ​មាន​អារម្មណ៍​ខ្លី​ជាង។"
      little_shade:
        label: "ម្លប់​តិច​នៅ​ក្បែរ"
        explain: "ម្លប់​ដើមឈើ​លើ​ដី​ជុំវិញ​ចំណត ក្នុង​តំបន់​ទំហំ​ប្រហែល​ពីរ​ប្លុក ពី​ការស្ទង់មតិ​ម្លប់​ដើមឈើ​ឆ្នាំ 2018 របស់​ទីក្រុង។ ចំណាត់ថ្នាក់​គឺជា​ចំណែក​នៃ​ចំណត​ដែល​មាន​ដើមឈើ​ច្រើនជាង​នៅ​ជុំវិញ ដូច្នេះ​ដើមឈើ​តិច​ជាង​មាន​ចំណាត់ថ្នាក់​ខ្ពស់​ជាង។ ម្លប់​ធ្វើ​ឱ្យ​មនុស្ស​ដែល​រង់ចាំ​ក្នុង​កម្តៅថ្ងៃ​ត្រជាក់ ប៉ុន្តែ​វា​ជួយ​បាន​ប៉ុណ្ណា អាស្រ័យ​លើ​អាកាសធាតុ និង​អ្វី​ដែល​ផ្តល់​ម្លប់។"
      heat:
        label: "សង្កាត់​ក្តៅ​ក្នុង​រដូវ​ក្តៅ"
        explain: "តំបន់​ជំរឿន​របស់​ចំណត​ក្តៅ​ប៉ុណ្ណា​ក្នុង​ថ្ងៃ​រដូវ​ក្តៅ ពី​ផ្នែកការ​ប៉ះពាល់​នឹង​កម្តៅ​នៃ​សន្ទស្សន៍​ភាព​ងាយ​រងគ្រោះ​ពី​កម្តៅ​របស់​ទីក្រុង (សីតុណ្ហភាព​ផ្ទៃ​ពី​ផ្កាយរណប និង​ចំនួន​តំបន់​ជំរឿន​ដែល​ត្រូវ​បាន​គ្រប​ដោយ​បេតុង សាងសង់ ឬ​បៃតង)។ ចំណាត់ថ្នាក់​គឺជា​ចំណែក​នៃ​ចំណត​ក្នុង​តំបន់​ជំរឿន​ដែល​ត្រជាក់​ជាង។"
      high_injury_network:
        label: "នៅ​លើ​បណ្តាញ​ផ្លូវ​រង​របួស​ខ្ពស់ (High Injury Network)"
        explain: "ចំណត​នេះ​ឈរ​នៅ​លើ ឬ​ត្រង់​ផ្លូវ​មួយ​ក្នុងចំណោម​ផ្លូវ​ដែល​ការ​ស្លាប់ និង​របួសធ្ងន់​ដោយសារ​ចរាចរណ៍​ភាគច្រើន​នៅ Philadelphia កើតឡើង ដូច្នេះ​អ្នក​ជិះ​ជាច្រើន​ឆ្លងផ្លូវ​នោះ​ដើម្បី​ទៅដល់​ចំណត ឬចា​ក​ចេញពី​វា។ ការសិក្សា​នៅកន្លែង​ផ្សេង​រក​ឃើញថា គ្រោះថ្នាក់​ដែល​ពាក់ព័ន្ធ​នឹង​អ្នកដើរ​ជើង​ប្រមូល​ផ្តុំ​នៅ​ចំណត​ឡានក្រុង​ដែល​មមាញឹក​លើ​ផ្លូវ​ធំ ដែល​កន្លែង​ឆ្លងផ្លូវ​ដែល​មាន​សុវត្ថិភាព​មាន​សារៈសំខាន់​បំផុត។"
      long_wait:
        label: "ការ​រង់ចាំ​យូរ​នៅពេល​ថ្ងៃត្រង់"
        explain: "ពេលវេលា​ធម្មតា​រវាង​ឡានក្រុង ឬ​ត្រូលី​ពី​ម៉ោង 10 ព្រឹក ដល់ 2 រសៀល​ក្នុង​ថ្ងៃធ្វើការ ពី​តារាង​ម៉ោង​របស់ SEPTA។ ចំណាត់ថ្នាក់​គឺជា​ចំណែក​នៃ​ចំណត​ដែល​មានការ​រង់ចាំ​ខ្លី​ជាង។ ការ​រង់ចាំ​យូរ​គឺជា​ពេល​ដែល​កៅអី និង​ដំបូល​សំខាន់​បំផុត។ ចំណត​ដែល​គ្មាន​សេវា​ពេលថ្ងៃត្រង់​ត្រូវ​បាន​ទុកចោល​ពីក​ត្តា​នេះ។"
    presets:
