    label: "សុំ​ដើមឈើ​តាមផ្លូវ​ឥតគិតថ្លៃ"
    who: "ម្ចាស់ផ្ទះ អាជីវកម្ម ដី​ឡូត៍ ឬ​ទ្រព្យសម្បត្តិ​ផ្សេងទៀត​ដែល​ដើមឈើ​នឹង​ឈរ​នៅមុខ៖ អ្នកជិតខាង​អាច​សុំ​ម្ចាស់​ឱ្យ​សុំ"
    cost: "ឥតគិតថ្លៃ"
