    summary: "សម្អាត​សំរាម ស្មើ​ដី ដាំ​ស្មៅ និង​ដើមឈើ​ពីរបី​ដើម ដាក់​របង​បង្គោល​ទាប និង​របៀង ហើយ​កាត់​ស្មៅ​ជាប្រចាំ។"
    cost: "ប្រហែល $1,100 ដល់ $1,500 ជាមុន និង $150 ដល់ $300 ក្នុង​មួយឆ្នាំ (ត្រូវ​បញ្ជាក់​ជាមួយ PHS)"
  seal_abandoned_building:
    label: "ឱ្យ​អគារ​នេះ​ត្រូវ​បាន​បិទ​ជិត"
    summary: "រាយការណ៍​អគារ​បោះបង់ចោល​ដែល​បើកចំហ ដើម្បី​ឱ្យ​ទីក្រុង​បិទទ្វារ និង​បង្អួច​របស់​វា។"
    cost: "រាយការណ៍​ឥតគិតថ្លៃ"
  plant_shade_trees:
    label: "ដាំ​ដើមឈើ​ផ្តល់​ម្លប់​នៅ​លើ និង​តាម​បណ្តោយ​ដី​ឡូត៍​នេះ"
    summary: "មាន​ដើមឈើ​ផ្តល់​ម្លប់​តិច​ជាង​នៅ​តំបន់​នេះ ធៀប​នឹង​ជុំវិញ​យ៉ាងតិច​ពាក់កណ្តាល​នៃ​កន្លែងនៅ​លើ​ផែនទី​នេះ (ការស្ទង់មតិ​ម្លប់​ដើមឈើ​ឆ្នាំ 2018 របស់​ទីក្រុង)។ ដើមឈើ​ធ្វើ​ឱ្យ​ប្លុក​ត្រជាក់​ដោយ​ម្លប់​របស់​វា និង​ទឹកដែល​ស្លឹក​របស់​វា​បញ្ចេញ។ ទីក្រុង​ដាំ​ដើមឈើ​តាមផ្លូវ​ដែល​មិន​គិតថ្លៃ​ក្នុង​ចិញ្ចើម​ផ្លូវ នៅពេល​ម្ចាស់ទ្រព្យ​សម្បត្តិ​សុំ ហើយ TreePhilly ចែក​ដើមឈើ​ឥតគិតថ្លៃ​សម្រាប់​ដាំ​ក្នុង​ដី​នៅ​លើ​ដី​ឯកជន។ សូម​ជ្រើសរើស​ដើមឈើ​ដែល​នឹង​ដុះ​ខ្ពស់ ដើម្បី​ឱ្យ​វា​ផ្តល់​ម្លប់​ដល់​ផ្លូវ ហើយ​អ្នកជិតខាង​នៅតែ​អាច​មើលឃើញ​ឆ្លងកាត់​ដី​ឡូត៍។"
    cost: "ដើមឈើ​ឥតគិតថ្លៃ​ពីទី​ក្រុង និង TreePhilly។ ដើមឈើ​វ័យក្មេង​ត្រូវការ​ទឹក​ប្រហែល 20 ហ្គា​ឡុង​ក្នុង​មួយ​សប្តាហ៍ ចាប់ពី​ខែមីនា ដល់​ខែធ្នូ"
  cool_green_lot:
    label: "ធ្វើ​ឱ្យ​ដី​ឡូត៍​នេះ​បៃតង ដើម្បី​ធ្វើ​ឱ្យ​ប្លុក​ត្រជាក់"
    summary: "តាម​សន្ទស្សន៍​ភាព​ងាយ​រងគ្រោះ​ពី​កម្តៅ​របស់​ទីក្រុង កម្តៅ​រដូវ​ក្តៅ​ប៉ះពាល់​មនុស្ស​នៅ​ទីនេះ​ខ្លាំង​ជាង​ជុំវិញ​យ៉ាងតិច​ពាក់កណ្តាល​នៃ​កន្លែងនៅ​លើ​ផែនទី​នេះ។ ដី​ទទេ ក្រួស និង​សំណល់​ស្រូប​ពន្លឺថ្ងៃ ខណៈ​ដែល​ស្មៅ ផ្កា​រ និង​ជាពិសេស​ដើមឈើ រក្សា​ដី​ឡូត៍​ឱ្យ​ត្រជាក់​ជាង ហើយ​ផ្តល់​ម្លប់​ដល់​ចិញ្ចើម​ផ្លូវ​ក្បែរ​នោះ។ មិនថា​ដី​ឡូត៍​នេះ​ក្លាយជា​អ្វី សួនច្បារ ដី​ឡូត៍​សម្អាត និង​បៃតង ឬ​ទីធ្លា​ក្បែរ​ផ្ទះ សូម​ដាំ​ដើមឈើ​ផ្តល់​ម្លប់​ក្នុង​វា ហើយ​រក្សា​វា​ឱ្យ​ខ្ពស់ ដើម្បី​ឱ្យ​ដី​ឡូត៍​នៅតែ​បើក​ឱ្យ​មើលឃើញ។"
    cost: "ពីដើម​ឈើ​ឥតគិតថ្លៃ (TreePhilly) ដល់​ប្រហែល $1,100 ដល់ $1,500 ជាមុន​សម្រាប់​ការ​សម្អាត និង​ធ្វើ​ឱ្យ​បៃតង​ពេញលេញ (ត្រូវ​បញ្ជាក់​ជាមួយ PHS)"
