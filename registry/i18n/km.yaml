        label: "ដី​ទំនេរ​ដែល​មិនទាន់​បាន​ធ្វើអ្វី ឬ​អគារ​បោះបង់ចោល​ដែល​បើកចំហ"
        explain: "ការសាកល្បង​ដោយចៃដន្យ​នៅ Philadelphia បាន​រក​ឃើញថា ការ​ធ្វើ​ឱ្យ​ដី​ទំនេរ​បៃតង និង​ការ​ដាក់​ទ្វារ និង​បង្អួច​ដែល​អាច​ប្រើ​បាន​លើ​ផ្ទះ​បោះបង់ចោល បាន​កាត់បន្ថយ​អំពើ​ហិង្សា​ដោយ​កាំភ្លើង​នៅ​ក្បែរ​នោះ។ កន្លែង​ដែល​ត្រូវ​បាន​ធ្វើបែប​នោះ​រួចហើយ​ទទួល​បាន​ពិន្ទុ 0៖ ដី​ឡូត៍​ដែល PHS LandCare ថែរក្សា និង​អគារ​ដែល​ម្ចាស់​បាន​ជួសជុល​ទ្វារ និង​បង្អួច​បន្ទាប់ពី​ការ​ជូនដំណឹង​អំពី​ការបំពាន​ពី L&I។ ដី​ទំនេរ ឬ​អគារ​ទំនេរ​ផ្សេងទៀត​ទាំងអស់​ទទួល​បាន​ពិន្ទុ 100។"
      shootings_nearby:
        label: "ការ​បាញ់​នៅ​ក្បែរ​ក្នុងរយៈពេល​បី​ឆ្នាំ​ចុងក្រោយ"
        explain: "មនុស្ស​ដែល​ត្រូវ​បាន​បាញ់​ក្នុងរយៈពេល​បី​ឆ្នាំ​ចុងក្រោយ ក្នុងរង្វង់​ប្រហែល​មួយ​ភាគ​បួន​ម៉ែ​ល (ប្រអប់​ឆ​កោន​របស់​កន្លែង​នោះ និង​ប្រអប់​ទាំង​ប្រាំមួយ​ជុំវិញ) ពី​កំណត់ត្រា​ជនរងគ្រោះ​ដោយ​ការ​បាញ់​របស់ Police Department។ ចំណាត់ថ្នាក់​គឺជា​ចំណែក​នៃ​កន្លែងនៅ​លើ​ផែនទី​ដែល​មាន​តិច​ជាង។ ការសាកល្បង​បាន​វាស់​ការ​បាញ់​តិច​ជាង​នៅ​ជុំវិញ​កន្លែង​ដែល​បាន​ធ្វើអ្វី​មួយ ដូច្នេះ​ការ​ថែរក្សា​ជួយ​បាន​ច្រើន​បំផុត​នៅកន្លែង​ដែល​មានការ​បាញ់។"
      poverty:
