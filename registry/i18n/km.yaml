  conservatorship:
    label: "ការតែងតាំង​អ្នកថែរក្សា​តាម​តុលាការ (conservatorship) (Act 135)"
    who: "អង្គការ​មិន​ស្វែងរក​ប្រាក់ចំណេញ ឬ​មនុស្សម្នាក់​ដែល​ដាក់​ញត្តិ​ទៅ​តុលាការ"
    warning: "ការតែងតាំង​អ្នកថែរក្សា​តាម​តុលាការ (conservatorship) អាច​ដក​យក​ទ្រព្យសម្បត្តិ​ពី​ម្ចាស់​របស់​វា។ អ្នកស្រាវជ្រាវ​បាន​រក​ឃើញថា វា​ត្រូវ​បាន​ប្រើ​មិន​សមាមាត្រ​នៅក្នុង​សង្កាត់​ដែល​កំពុង​ប្រឈម​នឹង gentrification (តម្លៃ​កើនឡើង ហើយ​អ្នក​រស់នៅ​យូរអង្វែង​ត្រូវ​ចាកចេញ)។ សូម​និយាយ​ជាមួយ Garden Justice Legal Initiative មុន​ពេល​អ្នក​ពិចារណា​វា។"
    cost: "ថ្លៃ​តុលាការ និង​ថ្លៃ​ជួសជុល។ តាំងពី​ឆ្នាំ 2014 អ្នក​ដាក់​ញត្តិ​អាច​ទទួល​បាន​ប្រាក់​ដែល​ធំ​បំផុត​ក្នុងចំណោម $2,500, 20% នៃ​ថ្លៃ​ចំណាយ ឬ 20% នៃ​តម្លៃ​លក់"
    timeline: "ករណី​តុលាការ​មួយ៖ សូម​សួរ​ជំនួយ​ផ្នែក​ច្បាប់​ថា​វា​នឹង​ចំណាយពេល​ប៉ុន្មាន"
    steps:
      - "សូម​និយាយ​ជាមួយ Garden Justice Legal Initiative មុន​អ្វីៗ​ទាំងអស់។"
      - "សូម​សួរ​ជាមុន​ថា​តើ​ការ​សរសេរ​ទៅ​ម្ចាស់ ឬ​ការ​ជួយ​គ្រួសារ​មួយ​ឱ្យ​រក្សាទ្រព្យ​សម្បត្តិ នឹង​បំពេញ​តម្រូវការ​ដូចគ្នា​ឬ​អត់។"
      - "សូម​ដឹង​លក្ខខណ្ឌ​នៃ​ច្បាប់៖ តុលាការ​អាច​តែងតាំង​អ្នកថែរក្សា (conservator) បានតែ​សម្រាប់​ទ្រព្យសម្បត្តិ​ដែល​មិន​ត្រូវ​បាន​មនុស្ស​រស់នៅ​ស្របច្បាប់​ក្នុងរយៈពេល 12 ខែ មិន​កំពុង​ត្រូវ​បាន​ដាក់​លក់ មិន​ស្ថិត​ក្នុង​ការ​រឹបអូស​បំណុល (foreclosure) និង​មិន​ត្រូវ​បាន​ទិញ​ក្នុង 6 ខែ​ចុងក្រោយ។"
    links:
      https://www.pubintlaw.org/cases-and-advocacy/garden-justice-legal-initiative/:
        label: "Garden Justice Legal Initiative"
