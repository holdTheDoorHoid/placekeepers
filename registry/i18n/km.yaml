      - "អ្នកជំនាញ​ដើមឈើ​របស់​ទីក្រុង​មកលេង​ដើម្បី​សម្រេច​ថា​ដើមឈើ​ណា​សមរម្យ។ ទីក្រុង​ដាំ​វា​ដោយ​ឥតគិតថ្លៃ​ក្នុង​រដូវ​ដាំ (ពាក់កណ្តាល​ខែមេសា ដល់​ពាក់កណ្តាល​ខែមិថុនា ឬ​ពាក់កណ្តាល​ខែតុលា ដល់​ពាក់កណ្តាល​ខែវិច្ឆិកា) ហើយ​ស្រោចទឹក និង​ដាក់​ដី​ចំបើង​ឱ្យ​វា​ក្នុង​ឆ្នាំ​ដំបូង។ បន្ទាប់ពី​នោះ TreePhilly សុំ​ទឹក​ប្រហែល 20 ហ្គា​ឡុង​ក្នុង​មួយ​សប្តាហ៍ ចាប់ពី​ខែមីនា ដល់​ខែធ្នូ។"
