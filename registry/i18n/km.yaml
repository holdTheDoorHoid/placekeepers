    description: "តំបន់ (តំបន់​ជំរឿន) ដែល​មាន​យ៉ាងតិច​ពីរ​នៃ​សញ្ញា​ទាំងនេះ ហើយ​យ៉ាងតិច​មួយ​អំពី​តម្លៃ​ផ្ទាល់ (បី​ដំបូង)៖ ផ្ទះ​លក់​បាន​ថ្លៃជាង​ច្រើន​ធៀប​នឹង​ប្រាំ​ឆ្នាំមុន លឿន​ជាង​ទូទាំង​ទីក្រុង តម្លៃ​ដែល​ទីក្រុង​វាយតម្លៃ​កំពុង​ឡើង​លឿន​ជាង​ទីក្រុង​ច្រើន Market Value Analysis របស់​ទីក្រុង​រក​ឃើញថា​តម្លៃ​កំពុង​ឡើង​ហួសពី​សមត្ថភាព​របស់​អ្នក​រស់នៅ​យូរអង្វែង ក្រុមហ៊ុន​កំពុង​ទិញ​ផ្ទះ​ជាច្រើន​ដែល​បាន​លក់ យ៉ាងតិច​បី​ក្នុង​ប្រាំ​នៃ​ផ្ទះ​ត្រូវ​បាន​ជួល ឬ​អ្នកជួល​ជាច្រើន​បង់​ពាក់កណ្តាល​នៃ​ប្រាក់ចំណូល​របស់​ខ្លួន ឬ​ច្រើនជាង​នេះ ទៅលើ​ថ្លៃ​ជួល (បន្ថែម​ដោយ​ម្ចាស់​នៅ​ថ្ងៃទី 9 ខែតុលា ឆ្នាំ 2026)។ ការ​ធ្វើ​ឱ្យ​បៃតង និង​ការ​កែ​លម្អ​ផ្សេងទៀត​អាច​ធ្វើ​ឱ្យ​តម្លៃ​កើនឡើង​ថែមទៀត ដូច្នេះ​កន្លែង​ដែល​យោបល់​ឱ្យធ្វើ​ដី​ឡូត៍​ឱ្យ​បៃតង ដាំ​ដើមឈើ បង្កើត​កន្លែង​អង្គុយ ចាប់ផ្តើម​សួនច្បារ ឬ​សុំ​សិល្បៈ ឬ​ដី​ឡូត៍​ដែល​ទីក្រុង​ចុះបញ្ជី​ថា​អាច​សុំ​បាន ស្ថិតនៅ​ក្នុង​តំបន់​មួយ​នេះ កាត​របស់​វា​បន្ថែម​វិធីការ​ពារ​អ្នកជិតខាង។ នេះ​បង្ហាញ​សញ្ញា​ក្នុង​កំណត់ត្រា​សាធារណៈ មិនមែន​ជា​ការព្យាករណ៍​ទេ ហើយ​វា​មិន​ប្រាប់​អ្វី​អំពី​អ្នក​ដែល​រស់នៅ​ទីនេះ​ទេ។ សូម​ប៉ះ​តំបន់​មួយ ដើម្បី​មើល​សញ្ញា​របស់​វា និង​អ្វី​ដែល​ត្រូវ​បាន​វាស់​សម្រាប់​នី​មួយៗ ហើយ​ជា​បរិបទ ថ្លៃ​ជួល​កណ្តាល និង​ប្រាក់ចំណូល​គ្រួសារ និង​ចំនួន​ផ្ទះ​ដែល​ទំនេរ ពី​ការស្ទង់មតិ​របស់ Census Bureau៖ គ្រប់​លេខ​នៃ​ការស្ទង់មតិ​មក​ជាមួយ​រឹម​នៃ​កំហុស​របស់​វា។"
