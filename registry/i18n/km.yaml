      - "សូម​អាន​មគ្គុទ្ទេសក៍​របស់ Grounded in Philly អំពី​ការ​ទទួល​បានការ​អនុញ្ញាត​ប្រើ​ដី​របស់​ទីក្រុង។"
      - "ដាក់ពាក្យសុំ​ទៅ Land Bank ឬ​ចូលរួម​ក្នុង webinar ឥតគិតថ្លៃ​មួយ​របស់​វា​ជាមុន។"
