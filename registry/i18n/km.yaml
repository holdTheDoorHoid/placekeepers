      - "រំពឹង​ថាត្រូវ​រង់ចាំ​យូរ។ បន្ទាប់ពី​ការពិនិត្យ​របស់​បុគ្គលិក ក្រុមប្រឹក្សា​ភិបាល Land Bank និង City Council ត្រូវតែ​អនុម័ត​វា។"
