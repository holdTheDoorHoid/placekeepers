options:
  live_city_data:
    label: "ទាញ​យក​ទិន្នន័យ​ផ្ទាល់​របស់​ទីក្រុង"
    description: "នៅពេល​អ្នក​បើក​ទំព័រ​ដី​ឡូត៍ ឬ​ស្វែងរក​អាសយដ្ឋាន កម្មវិធី​រុករក​របស់​អ្នក​សួរ​ម៉ាស៊ីន​មេសា​ធា​រណៈ​របស់​ទីក្រុង Philadelphia សម្រាប់​កំណត់ត្រា​ថ្មី​បំផុត៖ ម្ចាស់ ការ​លក់ ការវាយតម្លៃ ការ​ត្រួតពិនិត្យ និង​ពាក្យ​ប្តឹង​ឧទ្ធរណ៍។ សំណើ​ទាំងនេះ​ទៅ​ដោយ​ផ្ទាល់​ពី​ឧបករណ៍​របស់​អ្នក​ទៅ​ទីក្រុង មិនដែល​ឆ្លងកាត់ Placekeepers ទេ ហើយ​ម៉ាស៊ីន​មេ​របស់​ទីក្រុង​ឃើញ​វា​ដូចជា​ឃើញ​ការ​ចូល​មើល​គេហទំព័រ​ទ្រព្យសម្បត្តិ​របស់​ទីក្រុង​ដែរ។ រូបថត​ពីលើ​អាកាស​របស់​ទីក្រុង និង​អា​ត្លាស​ឆ្នាំ 1860 របស់​វា ក្រោម \"ពីមុន និង​ឥឡូវនេះ\" ក៏​មក​ពី​ម៉ាស៊ីន​មេ​របស់​ទីក្រុង​ដោយ​ផ្ទាល់​ដែរ ប៉ុន្តែ​តែ​នៅពេល​អ្នក​បើក​មួយ​ក្នុងចំណោម​ពួកវា​ប៉ុណ្ណោះ។ សូម​បិទ​ជម្រើស​នេះ ដើម្បី​ប្រើ​តែ​ច្បាប់​ចម្លង​ប្រចាំ​សប្តាហ៍​នៃ​ទិន្នន័យ​ដែល Placekeepers ផ្សព្វផ្សាយ។ ការស្វែងរក​អាសយដ្ឋាន ការ​បើក​ក្បាលដី​ដែល​មិន​មាននៅ​ក្នុង​បញ្ជី​របស់​យើងខ្ញុំ និង​រូបថត និង​អា​ត្លាស​ចាស់ៗ ត្រូវការ​វា​បើក។"
