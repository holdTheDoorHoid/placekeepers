    description: "គ្រប់​ចំណត​ឡានក្រុង និង​ត្រូលី SEPTA នៅ Philadelphia ពី​តារាង​ម៉ោង​បច្ចុប្បន្ន​របស់ SEPTA៖ ខ្សែ​ដែល​ឈប់​នៅ​ទីនោះ ឡានក្រុង ឬ​ត្រូលី​មក​ញឹកញាប់​ប៉ុណ្ណា​នៅ​ថ្ងៃធ្វើការ​ធម្មតា ថ្ងៃសៅរ៍ និង​ថ្ងៃអាទិត្យ នៅពេល​សេវា​ចាប់ផ្តើម និង​បញ្ចប់ និង​មនុស្ស​ប៉ុន្មាន​នាក់​ឡើង​នៅ​ទីនោះ​ក្នុង​ថ្ងៃធ្វើការ​ជាមធ្យម ពី​ការរាប់​របស់ SEPTA ផ្ទាល់។ ចំណត​នី​មួយៗ​បង្ហាញ​អ្វី​ដែល​អ្នក​ជិះ​ឃើញ​នៅ​ទីនោះ ក្នុងករណី​ដែល OpenStreetMap ដឹង ជម្រក​ក្នុងករណី​ដែល​បញ្ជី​របស់​ទីក្រុង​ផ្ទាល់​មាន អាទិភាព​របស់​វា​ក្រោម​កែវ​មើល​ភាព​ស្រួល​នៃ​ការ​ដឹកជញ្ជូន​សាធារណៈ និង​អ្វី​ដែល​អ្នកជិតខាង​អាច​ធ្វើ​បាន។ ស្ថានី​រថភ្លើង​ក្រោម​ដី El និង Regional Rail អាច​ត្រូវ​បាន​បន្ថែម​នៅក្នុង​ការកំណត់។"
