    who: "អ្នក​រស់នៅ Philadelphia ក្រុម ឬ​អង្គការ​មិន​ស្វែងរក​ប្រាក់ចំណេញ​ដែល​បាន​ធ្វើ​សួនច្បារ​លើ​ដី​ឡូត៍​ដែល​ជា​កម្មសិទ្ធិ​ឯកជន"
    cost: "មេធាវី និង​ថ្លៃ​តុលាការ។ បំណុល​ណាមួយ​លើ​ដី (liens) នៅជា​មួយ​វា"
