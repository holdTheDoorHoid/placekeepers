    description: "ទ្រព្យសម្បត្តិ​នៅ​លើ Philadelphia Register of Historic Places ក្បាលដី​នី​មួយៗ​ជា​ដាច់ដោយឡែក ចុះបញ្ជី​ដោយឡែក ឬ​ជាផ្នែក​នៃ​ស្រុក​ប្រវត្តិសាស្ត្រ (បង្ហាញ​ពេល​ពង្រីក​ជិត)។ ការ​ផ្លាស់​ប្តូរ​នៅ​ទីនេះ​ប្រហែលជា​ត្រូវការ​ការពិនិត្យ​ពី Historical Commission៖ សូម​សួរ​ពួកគេ​ជាមុន (215 686 7660)។"
