routes:
  land_bank_garden_agreement:
    label: "កិច្ច​ព្រមព្រៀង ឬ​អាជ្ញាប័ណ្ណ​សួនច្បារ​ពី Land Bank"
    who: "អ្នកណា​ក៏បាន​សម្រាប់ Urban Garden Agreement តម្លៃ $1។ ក្រុម​ដែល​មាន​អ្នកឧបត្ថម្ភ​ជា​អង្គការ​មិន​ស្វែងរក​ប្រាក់ចំណេញ សម្រាប់ Community Garden License"
    cost: "$1 (Urban Garden Agreement), $25 ក្នុង​មួយឆ្នាំ (Individual Garden Agreement) ឬ​ធានារ៉ាប់រង និង​អ្នកឧបត្ថម្ភ (Community Garden License)"
    timeline: "ពីរបី​សប្តាហ៍​សម្រាប់​កិច្ច​ព្រមព្រៀង​ខ្លី ពីរបី​ខែ​សម្រាប់​អាជ្ញាប័ណ្ណ"
    steps:
