  homestead_exemption:
    label: "បន្ថយ​វិក្កយបត្រ​ពន្ធ​របស់​ម្ចាស់ផ្ទះ (Homestead Exemption របស់​ទីក្រុង)"
    who: "អ្នកណា​ក៏​ដែល​ជា​ម្ចាស់ផ្ទះ Philadelphia របស់​ខ្លួន ហើយ​រស់នៅ​ក្នុង​វា​ជា​ផ្ទះ​ចម្បង សូម្បីតែ​មាន​កិច្ចសន្យា​បញ្ចាំ (mortgage) ឬ​បំណុល​ពន្ធ ប៉ុន្តែ​មិនមែន​ផ្ទះ​ដែល​ស្ថិត​ក្រោម​ការ​បន្ធូរបន្ថយ​ពន្ធ 10 ឆ្នាំ​ទេ"
    cost: "ឥតគិតថ្លៃ"
    timeline: "ផុតកំណត់​ថ្ងៃទី 1 ខែធ្នូ រាល់​ឆ្នាំ"
    steps:
      - "ដាក់ពាក្យ​នៅ Philadelphia Tax Center (tax-services.phila.gov) ដែល​ពាក្យសុំ​រួម​តែមួយ​គ្រប​ដណ្តប់​កម្មវិធី​បន្ធូរបន្ថយ​ពន្ធ​របស់​ទីក្រុង ឬ​ទូរស័ព្ទ​ទៅ Homestead Hotline តាម 215 686 9200 ឬ​ផ្ញើ​ទម្រង់​បែបបទ​តាម​ប្រៃសណីយ៍​ទៅ Department of Revenue, P.O. Box 52817, Philadelphia, PA 19115។"
      - "ការលើកលែង​ដកចេញ $100,000 ពី​តម្លៃ​ដែល​បាន​វាយតម្លៃ​របស់​ផ្ទះ​សម្រាប់​វិក្កយបត្រ​ពន្ធ ដែល​សន្សំ​បាន​រហូតដល់ $1,399 ក្នុង​មួយឆ្នាំ។"
      - "ដាក់ពាក្យ​ត្រឹម​ថ្ងៃទី 1 ខែធ្នូ (ត្រឹម​ថ្ងៃទី 1 ខែតុលា ដើម្បី​ឃើញ​វា​នៅ​លើ​វិក្កយបត្រ​បន្ទាប់)។ នៅពេល​ត្រូវ​បាន​ទទួលយក មិន​ចាំបាច់​ដាក់ពាក្យ​ម្តង​ទៀត​ទេ លុះត្រាតែ​លិខិត​ផ្ទេរ​កម្មសិទ្ធិ​ប្តូរ។"
    links:
      https://www.phila.gov/services/payments-assistance-taxes/taxes/property-and-real-estate-taxes/get-real-estate-tax-relief/get-the-homestead-exemption/:
        label: "ទីក្រុង Philadelphia៖ ទទួល​បាន Homestead Exemption"
  longtime_owner_occupants:
    label: "កំណត់​ពិ​ដាន​ការវាយតម្លៃ​របស់​ម្ចាស់​ដែល​រស់នៅ​យូរអង្វែង (កម្មវិធី Longtime Owner Occupants របស់​ទីក្រុង LOOP)"
    who: "ម្ចាស់ផ្ទះ​ដែល​បាន​រស់នៅ​ក្នុង​ផ្ទះ​របស់​ខ្លួន​យ៉ាងតិច 10 ឆ្នាំ ដែល​ការវាយតម្លៃ​របស់​ពួកគេ​បាន​កើនឡើង​យ៉ាងតិច 50 ភាគរយ​ក្នុង​មួយឆ្នាំ ឬ 75 ភាគរយ​ក្នុងរយៈពេល​ប្រាំ​ឆ្នាំ ជាមួយ​ប្រាក់ចំណូល​គ្រួសារ​ក្រោម​ដែន​កំណត់​របស់​ទីក្រុង (ដូចជា $103,050 សម្រាប់​មនុស្សម្នាក់ ឬ $147,200 សម្រាប់​បួន​នាក់​ក្នុង​ឆ្នាំ 2026) ដែល​បាន​បង់ពន្ធ​ទាន់សម័យ ឬ​ស្ថិត​ក្នុង​កិច្ច​ព្រមព្រៀង​បង់ប្រាក់"
    cost: "ឥតគិតថ្លៃ"
    timeline: "ថ្ងៃ​ផុតកំណត់​ប្រចាំឆ្នាំ ថ្ងៃទី 30 ខែកញ្ញា​ក្នុង​ឆ្នាំ​ថ្មីៗ​នេះ"
    steps:
      - "ដាក់ពាក្យ​នៅ Philadelphia Tax Center (tax-services.phila.gov) ជាមួយ​ពាក្យសុំ​រួម​របស់​ទីក្រុង ឬ​ទូរស័ព្ទ​ទៅ 215 686 9200 អ៊ីមែល revenue@phila.gov ឬ​ផ្ញើ​ទម្រង់​បែបបទ​តាម​ប្រៃសណីយ៍​ទៅ Department of Revenue, P.O. Box 53190, Philadelphia, PA 19105។"
      - "LOOP កំណត់​ពិ​ដាន​ការវាយតម្លៃ​ដែល​វិក្កយបត្រ​ពន្ធ​ប្រើ ត្រឹម 1.5 ដង​នៃ​ឆ្នាំមុន ឬ 1.75 ដង​នៃ​តម្លៃ​ទាប​បំផុត​ក្នុង​ប្រាំ​ឆ្នាំ​ចុងក្រោយ ដរាបណា​ម្ចាស់​នៅតែ​មាន​សិទ្ធិ។"
      - "ដាក់ពាក្យ​ត្រឹម​ថ្ងៃ​ផុតកំណត់​ប្រចាំឆ្នាំ​របស់​ទីក្រុង (ថ្ងៃទី 30 ខែកញ្ញា​ក្នុង​ឆ្នាំ​ថ្មីៗ​នេះ)៖ ទំព័រ​របស់​ទីក្រុង​ផ្តល់​ថ្ងៃ​បច្ចុប្បន្ន។"
    links:
      https://www.phila.gov/services/payments-assistance-taxes/payment-plans-and-assistance-programs/income-based-programs-for-residents/apply-for-the-longtime-owner-occupants-program-loop/:
        label: "ទីក្រុង Philadelphia៖ ដាក់ពាក្យសុំ LOOP"
