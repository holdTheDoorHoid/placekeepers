    description: "កម្តៅ​រដូវ​ក្តៅ​ប៉ះពាល់​មនុស្ស​ក្នុង​តំបន់​ជំរឿន​នី​មួយៗ​ខ្លាំង​ប៉ុណ្ណា ពី​សន្ទស្សន៍​ភាព​ងាយ​រងគ្រោះ​ពី​កម្តៅ​របស់​ទីក្រុង (Department of Public Health និង Office of Sustainability ទិន្នន័យ​ឆ្នាំ 2017 ដល់ 2019)។ វា​ដាក់បញ្ចូល​គ្នា​នូវ​ការ​ប៉ះពាល់​នឹង​កម្តៅ គឺ​តំបន់​ជំរឿន​ក្តៅ​ប៉ុណ្ណា​ក្នុង​ថ្ងៃ​រដូវ​ក្តៅ ដូចដែល​ផ្កាយរណប​វាស់ និង​ភាព​រងគ្រោះ​ដោយ​កម្តៅ គឺ​មនុស្ស​ប៉ុន្មាន​នាក់​ដែល​រស់នៅ​ទីនោះ​ប្រឈម​នឹង​ហានិភ័យ​ច្រើនជាង​ក្នុង​កម្តៅ (រង្វាស់​ដប់ពីរ​អំពី​អាយុ សុខភាព ប្រាក់ចំណូល ការអប់រំ ភាសា និង​ពូជសាសន៍ ដូចដែល​ទីក្រុង​បាន​បង្កើត​សន្ទស្សន៍)។ តំបន់​ជំរឿន​ត្រូវ​បាន​ដាក់​ស្រមោល​តាម​មួយ​ភាគ​ប្រាំ​នៃ​ទីក្រុង មួយ​ភាគ​ប្រាំ​ដែល​ងងឹត​បំផុត​គឺ​ប្រឈម​នឹង​ហានិភ័យ​ច្រើន​បំផុត។ ការ​ប៉ះពាល់ និង​ភាព​រងគ្រោះ​អាច​ត្រូវ​បាន​បង្ហាញ​ដាច់ដោយឡែក​នៅក្នុង​ការកំណត់។"
