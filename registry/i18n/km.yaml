    label: "ភាព​តានតឹង​ចរាចរណ៍​សម្រាប់​អ្នក​ជិះកង់ (DVRPC)"
    description: "ផ្លូវ​នី​មួយៗ​តានតឹង​ប៉ុណ្ណា​ក្នុង​ការ​ជិះកង់ ដូចដែល Delaware Valley Regional Planning Commission វាយតម្លៃ​ពី​ចំនួន​គន្លង ល្បឿន​ចរាចរណ៍ និង​ប្រភេទ​គន្លង​កង់ បើ​មាន៖ កម្រិត 1 សមស្រប​សម្រាប់​មនុស្ស​ភាគច្រើន​គ្រប់​វ័យ កម្រិត 2 សម្រាប់​មនុស្ស​ពេញវ័យ​ភាគច្រើន កម្រិត 3 សម្រាប់​តែ​អ្នក​ជិះ​ដែល​មានទំនុក​ចិត្ត និង​កម្រិត 4 សម្រាប់​តែ​អ្នក​ជិះ​ដែល​ក្លាហាន​បំផុត។ កន្លែង​ដែល​ទិស​ទាំងពីរ​នៃ​ផ្លូវ​មួយ​ខុសគ្នា ទិស​ដែល​តានតឹង​ជាង​ត្រូវ​បាន​បង្ហាញ។ ការវាយតម្លៃ​មក​ពី​គំរូ​របស់ DVRPC និង​កំណត់​ល្បឿន​ដែល​បាន​បិទផ្សាយ មិនមែន​ដោយ​ជិះ​គ្រប់ផ្លូវ​ទេ។"
