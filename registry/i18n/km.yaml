    description: "តំបន់​ដែល Zoning Code បន្ថែម​ច្បាប់​ផ្ទាល់ខ្លួន​ពីលើ​ការកំណត់​តំបន់​មូលដ្ឋាន៖ ការ​អភិរក្ស​សង្កាត់ ផ្លូវ​ពាណិជ្ជកម្ម ការ​ការពារ​ទឹកជំនន់ និង​ជម្រាល​ចោត ដែន​កំណត់​លើ​ការ​គ្រប​ដី​នៅ​ជិត Wissahickon កម្ពស់​នៅ​ជិត​អាកាសយាន​ដ្ឋាន ផ្ទាំង​សញ្ញា និង​អ្វីៗ​ជាច្រើន​ទៀត។ ច្រើន​ត្រួត​គ្នា ហើយ​ខ្លះ​គ្រប​ដណ្តប់​ភាគច្រើន​នៃ​ទីក្រុង។ សូម​ប៉ះ​ចំណុច​មួយ ដើម្បី​មើល​ស្រទាប់​ត្រួត​លើ​ទាំងអស់​នៅ​ទីនោះ ជាមួយ​ផ្នែក​នៃ Zoning Code របស់​វា។ ស្រទាប់​ត្រួត​លើ​អាច​ផ្លាស់​ប្តូរ​អ្វី​ដែល​ត្រូវ​បាន​អនុញ្ញាត៖ សូម​ពិនិត្យ​ជាមួយ​ទីក្រុង​មុន​ពេល​អ្នក​រៀបចំផែនការ។"
