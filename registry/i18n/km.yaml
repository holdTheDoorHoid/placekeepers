    steps:
      - "ដើមឈើ​តាមផ្លូវ​ត្រូវ​បាន​ដាំ​ក្នុង​ចិញ្ចើម​ផ្លូវ​មុខ​ទ្រព្យសម្បត្តិ​នៅពេល​ម្ចាស់​របស់​វា​សុំ។ សូម​និយាយ​ជាមួយ​ម្ចាស់​អគារ​ក្បែរ​ចំណុច​នោះ។ សម្រាប់​ដី​ទំនេរ សូម​សួរ​ម្ចាស់​ដែល​ទំព័រ​ដី​ឡូត៍​របស់​វា​ដាក់ឈ្មោះ ឬ​សួរ Land Bank សម្រាប់​ដី​ឡូត៍​ដែល​ទីក្រុង ឬ Land Bank ជា​ម្ចាស់។"
