    description: "ទ្រព្យសម្បត្តិ​ដែល​ជំនួយ brownfield របស់​សហព័ន្ធ​បាន​បង់​សម្រាប់​ការវាយតម្លៃ ឬ​ការ​សម្អាត ពី​កំណត់ត្រា​របស់ EPA។ វា​មិនមែន​ជា​ផែនទី​នៃ​ដី​បំពុល​ទាំងអស់​ទេ ហើយ​វា​មិន​ប្រាប់​ថា​តើ​ទីតាំង​មួយ​បំពុល​សព្វថ្ងៃ​ឬ​អត់ទេ។ សូម​ធ្វើតេស្ត​ដី​មុន​ពេល​ដាំដំណាំ​អាហារ​នៅ​លើ ឬ​ក្បែរ​មួយ។"
  aerial_photos:
    label: "រូបថត​ពីលើ​អាកាស​តាម​ឆ្នាំ"
    description: "រូបថត​ពីលើ​អាកាស​នៃ​ទីក្រុង​ទាំងមូល ថត​ពី​យន្តហោះ៖ របស់​ទីក្រុង​ផ្ទាល់​សម្រាប់​រាល់​ឆ្នាំ​ដែល​វា​មាន​តាំងពី​ឆ្នាំ 1996 (រាល់​និទាឃរដូវ ភាគច្រើន​ឆ្នាំ​ពី​ខែមីនា ដល់​ខែឧសភា) និង​រូបថត​ចាស់​ជាង​ដែល​ទីក្រុង​ផ្ទុក ពី Delaware Valley Regional Planning Commission (1959 និង 1975) និង U.S. Geological Survey (1999)។ សូម​រំកិល​តាម​ឆ្នាំ ដើម្បី​មើល​អ្វី​ដែល​ធ្លាប់​ឈរ​នៅ​លើ​ប្លុក​មួយ​ពីមុន៖ ផ្ទះ​ដែល​បាន​រុះរើ ដី​ឡូត៍​ដែល​បាន​សម្អាត សួនច្បារ​ដែល​បាន​ដុះឡើង។ រូបថត​មក​ពី​ម៉ាស៊ីន​មេ​របស់​ទីក្រុង​ដោយ​ផ្ទាល់ នៅពេល​ស្រទាប់​នេះ​បើក ហើយ​ត្រូវ​បាន​គូស​នៅ​ក្រោម​អ្វីៗ​ផ្សេងទៀត​ទាំងអស់​នៅ​លើ​ផែនទី។ ឆ្នាំ​ចាស់ៗ​មិនសូវ​ច្បាស់ ហើយ​រូបថត​រហូតដល់​ឆ្នាំ 2000 ជា​ពណ៌ស​ខ្មៅ។"
