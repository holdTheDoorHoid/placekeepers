        label: "ដាក់​ស្រមោល​តំបន់ (បិទ បង្ហាញ​តែ​គែម និង​ថ្នាក់​របស់​វា)"
lenses:
  violence:
    label: "ការកាត់បន្ថយ​អំពើ​ហិង្សា"
    description: "កន្លែង​ដែល​ការ​សម្អាត ការ​ធ្វើ​ឱ្យ​បៃតង ឬ​ការ​បិទ​ជិត​ទំនងជា​កាត់បន្ថយ​អំពើ​ហិង្សា​ដោយ​កាំភ្លើង​នៅ​ក្បែរ​នោះ​បាន​ច្រើន​បំផុត ផ្អែកលើ​ការសាកល្បង​ដោយចៃដន្យ​នៅ Philadelphia។"
    factors:
