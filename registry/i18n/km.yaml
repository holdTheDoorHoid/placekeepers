    timeline: "បុគ្គលិក​មាន​គោលដៅ​ឆ្លើយ​ក្នុងរយៈពេល 120 ថ្ងៃ បន្ទាប់មក​ក្រុមប្រឹក្សា​ភិបាល Land Bank និង City Council សម្រេចចិត្ត។ មានតែ​ដី​ឡូត៍ 67 ប៉ុណ្ណោះ​ដែល​ត្រូវ​បាន​ផ្ទេរ​តាមរបៀប​នេះ​ទូទាំង​ទីក្រុង​ពីឆ្នាំ 2020 ដល់ 2023"
    steps:
      - "ពិនិត្យ​ថា​អ្នកជា​ម្ចាស់ផ្ទះ​ជាប់គ្នា ហើយ​ដី​ឡូត៍​ត្រូវ​បាន​សម្គាល់ថា​មាន​សិទ្ធិ​សម្រាប់​ទីធ្លា​ក្បែរ​ផ្ទះ។"
