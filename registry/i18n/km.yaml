  redlining_1937:
    label: "ផែនទី​គូសបន្ទាត់​ក្រហម (redlining) ឆ្នាំ 1937 (ថ្នាក់ HOLC)"
    description: "ក្នុង​ឆ្នាំ 1937 ទីភ្នាក់ងាររដ្ឋបាល​សហព័ន្ធ​មួយ គឺ Home Owners' Loan Corporation (HOLC) បាន​វាយតម្លៃ​សង្កាត់​នានា​របស់ Philadelphia ពី A ដល់ D តាម​ការ​គិត​របស់​វា​ថា​ការ​ផ្តល់​ប្រាក់កម្ចី​ទិញ​ផ្ទះនៅ​ទីនោះ​មាន​សុវត្ថិភាព​ប៉ុណ្ណា។ ការវាយតម្លៃ​ទាំងនោះ​ពឹង​លើ​អ្នក​ដែល​រស់នៅ​ក្នុង​តំបន់​នី​មួយៗ៖ តំបន់​ដែល​គ្រួសារ​ស្បែក​ខ្មៅ និង​គ្រួសារ​អន្តោប្រវេសន៍​ជាច្រើន​រស់នៅ ភាគច្រើន​ត្រូវ​បាន​វាយតម្លៃ D ហើយ​គូស​គែម​ពណ៌ក្រហម ដែល​ជា​កន្លែង​ដែល​ពាក្យ redlining មក​ពី។ ស្រទាប់​នេះ​បង្ហាញ​តំបន់ និង​ថ្នាក់​ឆ្នាំ 1937 ដូចដែល Mapping Inequality បាន​តាមដាន។ ថ្នាក់​ទាំងនោះ​គឺជា​កំណត់ត្រា​នៃ​របៀប​ដែល​ទីភ្នាក់ងារ​វិនិច្ឆ័យ​កន្លែង​នានា​ក្នុង​ឆ្នាំ 1937៖ វា​មិន​ប្រាប់​អ្វី​អំពី​អ្នក​ដែល​រស់នៅ​ទីនោះ​សព្វថ្ងៃ​ទេ។ សូម​ប៉ះ​តំបន់​មួយ ដើម្បី​មើល​ថ្នាក់​របស់​វា និង​តំណ​ភ្ជាប់​ទៅ​ការ​ពិពណ៌នា​ឆ្នាំ 1937 របស់​វា​នៅ Mapping Inequality។ សម្រាប់​ការប្រើ​ប្រាស់​មិនមែន​ពាណិជ្ជកម្ម​ប៉ុណ្ណោះ។"
    settings:
