      - "សូម​ពិនិត្យ​លក្ខខណ្ឌ​នៃ​ច្បាប់​ឆ្នាំ 2024 (53 Pa.C.S. section 1143 មាន​អានុភាព​តាំងពី​ថ្ងៃទី 6 ខែកញ្ញា ឆ្នាំ 2024)៖ ដី​ជា​កម្មសិទ្ធិ​ឯកជន​ទំហំ​ពាក់កណ្តាល​អេក​ឬ​តិច​ជាង​នេះ ការប្រើ​ប្រាស់ 10 ឆ្នាំ​ដែល​យ៉ាងតិច 5 ឆ្នាំ​ជា​សួនច្បារ និង​គ្មាន​អគារ​អចិន្ត្រៃយ៍ (របង និង​ជង្រុក​ត្រូវ​បាន​អនុញ្ញាត)។"
