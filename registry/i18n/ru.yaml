  atlas_1860:
    label: "Атлас 1860 года (Hexamer и Locher)"
    description: "Атлас Филадельфии 1860 года Hexamer и Locher, нарисованный по кварталам со зданиями и участками, совмещённый с сегодняшней картой организацией Greater Philadelphia GeoHistory Network и размещённый городом. Охватывает только Center City и Northern Liberties. Уменьшите его непрозрачность, чтобы сквозь него были видны сегодняшние улицы. Он приходит прямо с серверов города, когда этот слой включён."
    settings:
      opacity:
        label: "Насколько ярко виден атлас, в процентах"
  redlining_1937:
    label: "Карта редлайнинга 1937 года (оценки HOLC)"
    description: "В 1937 году федеральное агентство Home Owners' Loan Corporation (HOLC) оценило районы Филадельфии от A до D по тому, насколько безопасной оно считало там выдачу ипотечных кредитов. Оценки опирались на то, кто жил в каждом районе: районы, где жили афроамериканские семьи и многие семьи иммигрантов, обычно получали D и обводились красным, отсюда и слово «редлайнинг». Этот слой показывает районы и оценки 1937 года так, как их обвёл проект Mapping Inequality. Оценки отражают то, как агентство судило о местах в 1937 году; они ничего не говорят о людях, которые живут там сегодня. Нажмите на район, чтобы увидеть его оценку и ссылку на его описание 1937 года на Mapping Inequality. Только для некоммерческого использования."
    settings:
      shade:
        label: "Закрашивать области (если выключено, видны только их контуры и оценки)"

  projects:
    label: "Проекты, завершённые соседями"
    description: "Уборки, сады, места для сидения, муралы, деревья, городские скамейки и навесы и исправления по обращениям в 311, которые соседи завершили и о которых нам рассказали. Placekeepers читает и одобряет каждый отчёт, прежде чем он появится. Нажмите на проект, чтобы увидеть, что было сделано, когда и что для этого потребовалось, со ссылкой на отчёт и его фотографии на GitHub. Карта никогда не показывает, кто прислал отчёт, только название группы, которое отправитель выбрал."

lenses:
  violence:
    label: "Снижение насилия"
    description: "Где очистка, озеленение или закрытие, скорее всего, снизят насилие с применением оружия поблизости, по данным рандомизированных испытаний в Филадельфии."
    factors:
      untreated_vacancy:
        label: "Необработанный пустующий участок или открытое заброшенное здание"
        explain: "Рандомизированные испытания в Филадельфии показали, что озеленение пустующих участков и установка рабочих дверей и окон в заброшенных домах снизили насилие с применением оружия поблизости. Места, которые уже обработаны таким образом, получают 0: участки, за которыми ухаживает PHS LandCare, и здания, чей владелец починил двери и окна после предписания L&I. Любой другой пустующий участок или здание получает 100."
      shootings_nearby:
        label: "Стрельба поблизости за последние три года"
        explain: "Люди, пострадавшие от стрельбы за последние три года примерно в четверти мили (шестиугольник этого места и шесть вокруг него), по записям полицейского управления о пострадавших от стрельбы. Место в рейтинге это доля мест на карте, где таких случаев меньше. Испытания измерили меньше случаев стрельбы вокруг обработанных мест, поэтому забота помогает больше всего там, где происходит стрельба."
      poverty:
        label: "Уровень бедности в районе"
        explain: "Доля людей, которые живут ниже черты бедности в переписном участке этого места (опрос Бюро переписи населения, с 2020 по 2024 год). Место в рейтинге это доля мест на карте в участках с более низким уровнем. В испытании по всему городу снижение насилия с применением оружия обнаружили в районах ниже черты бедности."
      canopy_gap:
        label: "Мало деревьев поблизости"
        explain: "Кроны деревьев на земле примерно в четверти мили, по городскому обследованию крон деревьев 2018 года. Место в рейтинге это доля мест на карте, вокруг которых деревьев больше, поэтому чем меньше деревьев, тем выше место. Уличные деревья связывают с меньшей преступностью, но данные неоднозначны и зависят от расположения."
    presets:
      research:
        label: "На основе исследований"
      vacancy_only:
        label: "Только пустование"
  heat:
    label: "Жара и тень"
    description: "Где посадка деревьев или озеленение пустующего участка охладят людей сильнее всего: участки в районах, где летняя жара бьёт по людям сильнее всего, с малым количеством тени вокруг и многими людьми, которые почувствуют разницу."
    factors:
      heat_vulnerability:
        label: "Уязвимость района к жаре"
        explain: "Насколько сильно летняя жара бьёт по людям в переписном участке этого участка земли, по Индексу уязвимости к жаре, который ведёт город (Департамент общественного здравоохранения и Управление устойчивого развития, данные с 2017 по 2019 год): насколько жарко становится участку в летние дни по измерениям со спутников, вместе с тем, сколько из живущих там людей в большей группе риска при жаре, по возрасту, здоровью, доходу и другому. Место в рейтинге это доля мест на карте в участках с более низкой оценкой."
      few_trees:
        label: "Мало деревьев поблизости"
        explain: "Кроны деревьев на земле примерно в четверти мили, по городскому обследованию крон деревьев 2018 года, это тот же показатель, который использует ракурс «Снижение насилия». Место в рейтинге это доля мест на карте, вокруг которых деревьев больше, поэтому чем меньше деревьев, тем выше место. Деревья охлаждают улицы своей тенью и водой, которую отдают их листья. Исследования сходятся в том, что они охлаждают днём, сильнее всего там, где кроны закрывают больше примерно 40 процентов квартала, и слабее ночью."
      few_street_trees:
        label: "Мало городских деревьев вокруг"
        explain: "Деревья в пределах 100 метров от участка по перечню деревьев «Парков и зон отдыха» за 2025 год, то есть деревья, о которых город заботится на улицах и в парках, а не деревья на частных дворах. Место в рейтинге это доля мест на карте, вокруг которых таких деревьев больше, поэтому чем меньше деревьев, тем выше место. Уличные деревья дают тень тротуарам, по которым люди ходят и на которых ждут."
      people_nearby:
        label: "Сколько людей это охватит"
        explain: "Жителей на квадратный километр земли в переписном участке этого места (опрос Бюро переписи населения, с 2020 по 2024 год). Место в рейтинге это доля мест на карте в участках с меньшим числом людей. Больше людей почувствуют охлаждение. Население показывает только то, кого охватит улучшение; само по себе оно никогда не является мерой нужды."
    presets:
      balanced:
        label: "Сбалансированный"
      people_at_risk:
        label: "Люди в наибольшей группе риска"
      fewest_trees:
        label: "Меньше всего деревьев"
  placemaking:
    label: "Обустройство общественных мест"
    description: "Где пустующий участок, скорее всего, станет общественным местом, которым люди пользуются каждый день, например садом, небольшим парком, местом для сидения в тени или местом для искусства: участки с многими соседями и повседневными местами в пределах короткой прогулки, далеко от парка и от публичного искусства. Речь об использовании и гостеприимстве, а не о преступности."
    factors:
      neighbors:
        label: "Люди в пяти минутах ходьбы"
        explain: "Сколько людей живёт в пяти минутах ходьбы от участка, считая 400 метров по прямой, по переписи 2020 года. Место в рейтинге это доля мест на карте, вокруг которых людей меньше. Больше соседей означает больше людей, которым послужат сад, скамейка или мурал. Население показывает только то, кого охватит проект."
      everyday_places:
        label: "Повседневные места в десяти минутах ходьбы"
        explain: "Сколько из семи видов повседневных мест находится в десяти минутах ходьбы, считая 800 метров по прямой: библиотека, центр отдыха, бассейн или водная игровая площадка, питьевой фонтанчик в парке, школа, продуктовый магазин или рынок, принимающий SNAP, и остановка автобуса, трамвая или поезда. Место в рейтинге это доля мест на карте, где их меньше. Люди, которые идут в эти места, проходят мимо участка. Насколько прохожие помогают новому общественному месту, зависит от улицы и места, поэтому данные неоднозначны."
      walkability:
        label: "Пешая доступность"
        explain: "Национальный индекс пешей доступности EPA для группы кварталов участка: перекрёстки, как близок транспорт и насколько хорошо сочетаются жильё, работа и магазины (данные примерно с 2017 по 2019 год). Место в рейтинге это доля мест на карте в областях, где ходить пешком менее удобно. Где люди ходят пешком, больше людей стали бы пользоваться местом на участке. Исследования мест, удобных для ходьбы, находят корреляции, смысл которых зависит от места, поэтому данные неоднозначны."
      far_from_park:
        label: "Далеко от парка"
        explain: "Расстояние по прямой от участка до края ближайшей парковой земли «Парков и зон отдыха»: парки, игровые площадки, центры отдыха, скверы, зелёные коридоры и природные территории, но не его хозяйственные дворы, поля для гольфа и озеленённые разделительные полосы дорог. Место в рейтинге это доля мест на карте, ближе к которым есть парк, поэтому чем дальше, тем выше место. Участок вдали от парка мог бы дать соседям открытое пространство, которого им не хватает."
      no_art_nearby:
        label: "Нет публичного искусства поблизости"
        explain: "Расстояние по прямой от участка до ближайшего произведения публичного искусства из городского списка Percent for Art или из Wikidata, без работ внутри зданий. Место в рейтинге это доля мест на карте, ближе к которым есть такое произведение, поэтому чем дальше, тем выше место. В этих двух списках только часть городского искусства: муралов Mural Arts и работ, которые отмечены только в OpenStreetMap, в них нет, поэтому посмотрите ещё и слой «Публичное искусство». Искусство приветствуется ради красоты и гордости; ни одно исследование не связывает его с меньшим насилием."
      commercial_corridor:
        label: "На торговом коридоре или рядом с ним"
        explain: "Полные 100 баллов, если участок лежит на одном из городских торговых коридоров, то есть торговых улиц и центров, которые Градостроительная комиссия обследовала с 2011 по 2017 год, или в пределах 50 метров от него, и 0 в остальных случаях. Магазины приводят людей мимо участка каждый день. Оживлённые торговые улицы могут приносить и проблемы, поэтому данные неоднозначны."
    presets:
      balanced:
        label: "Сбалансированный"
      most_neighbors:
        label: "Больше всего соседей"
      where_people_walk:
        label: "Где люди уже ходят пешком"
      far_from_a_park:
        label: "Далеко от парка"
  street_safety:
    label: "Безопасность улиц"
    description: "Отрезки улиц, где пешеходы и велосипедисты подвергаются наибольшему риску, по записям об авариях, Сети с высоким уровнем травматизма (High Injury Network) и ближайшим школам."
    factors:
      high_injury_network:
        label: "В Сети с высоким уровнем травматизма"
        explain: "Город обнаружил, что на этих улицах происходит большинство смертей и тяжёлых травм в дорожном движении, а это около 12 процентов всех улиц Филадельфии."
      walking_cycling_harm:
        label: "Люди, погибшие или тяжело травмированные при ходьбе или езде на велосипеде, за последние 5 лет"
        explain: "Считает людей, которые погибли или получили тяжёлые травмы, когда шли пешком или ехали на велосипеде, на этом отрезке улицы или на его углах, за последние пять лет записей PennDOT об авариях. Место в рейтинге это доля отрезков улиц по всему городу, где таких случаев меньше."
      recent_death:
        label: "Здесь погиб человек за последние 2 года"
        explain: "Гибель на этом отрезке улицы или на его углах за последние два года по записям полицейского управления об авариях со смертельным исходом, которые обновляются каждую ночь."
      school_nearby:
        label: "Школа в пределах 400 метров"
        explain: "Дети ходят здесь в школу и из школы. 400 метров это примерно пять минут ходьбы."
    presets:
      research:
        label: "На основе исследований"
      recorded_harm:
        label: "Только зафиксированный вред"
  transit_comfort:
    label: "Комфорт на остановках"
    description: "Остановки автобусов и трамваев, где навес, скамейка или тень больше всего помогли бы пассажирам: загруженные остановки, остановки, где проверка не нашла ничего, под чем или на чём можно сесть, остановки с малым количеством тени в жарких районах, остановки на улицах из Сети с высоким уровнем травматизма и остановки с долгим ожиданием. Если остановку ещё никто не проверял, её навес и скамейка учитываются наполовину."
    factors:
      riders:
        label: "Сколько людей садится каждый будний день"
        explain: "Сколько людей садится здесь в обычный будний день, по собственному подсчёту SEPTA. Место в рейтинге это доля остановок с меньшим числом пассажиров. Больше пассажиров означает больше людей, которым помогут навес или скамейка; город стремится ставить навесы на самых загруженных 15 процентах автобусных остановок. Остановки, которые SEPTA ещё не считала, в этот фактор не входят."
      no_shelter:
        label: "Нет навеса"
        explain: "100, если проверка не нашла навеса, 0, если навес есть, вся остановка под крышей или в собственном городском списке автобусных навесов там есть навес (что бы ни говорил OpenStreetMap). Если остановку ещё никто не проверял, она получает 50, то есть наполовину, чтобы остановка никогда не оценивалась как лишённая навеса, который у неё, возможно, есть; проверьте её, чтобы узнать. В исследовании в Миннеаполисе и Сент-Поле пассажиры на остановках без скамейки или навеса считали, что ждут дольше, чем на самом деле."
      no_bench:
        label: "Нет скамейки"
        explain: "100, если проверка не нашла скамейки, 0, если она есть, и 50, то есть наполовину, если остановку ещё никто не проверял. То же исследование показало, что скамейка делает ожидание короче на вид."
      little_shade:
        label: "Мало тени поблизости"
        explain: "Кроны деревьев на земле вокруг остановки, на участке шириной примерно в два квартала, по городскому обследованию крон деревьев 2018 года. Место в рейтинге это доля остановок, вокруг которых деревьев больше, поэтому чем меньше деревьев, тем выше место. Тень охлаждает людей, которые ждут на солнце, но насколько она помогает, зависит от климата и от того, что даёт тень."
      heat:
        label: "Жаркий район летом"
        explain: "Насколько жарко становится в переписном участке остановки в летние дни, по части воздействия жары в городском Индексе уязвимости к жаре (температура поверхности по спутникам и то, какая часть участка покрыта асфальтом, застроена или озеленена). Место в рейтинге это доля остановок в более прохладных участках."
      high_injury_network:
        label: "В Сети с высоким уровнем травматизма"
        explain: "Остановка стоит на одной из улиц, где в Филадельфии происходит большинство смертей и тяжёлых травм в дорожном движении, или у неё, поэтому многие пассажиры переходят эту улицу, чтобы дойти до остановки или уйти от неё. Исследования в других местах показали, что аварии с участием пешеходов собираются на оживлённых автобусных остановках на широких дорогах, где безопасный переход важнее всего."
      long_wait:
        label: "Долгое ожидание в середине дня"
        explain: "Типичное время между автобусами или трамваями с 10:00 до 14:00 по будням, по расписаниям SEPTA. Место в рейтинге это доля остановок с более коротким ожиданием. Долгое ожидание это когда сиденье и крыша важнее всего. Остановки, где нет движения в середине дня, в этот фактор не входят."
    presets:
      balanced:
        label: "Сбалансированный"
      busiest_first:
        label: "Сначала самые загруженные остановки"
      heat_and_shade:
        label: "Жара и тень"

suggestions:
  clean_and_green:
    label: "Очистить и озеленить этот участок"
    summary: "Убрать мусор, спланировать землю, посадить траву и несколько деревьев, поставить невысокий забор из столбиков и перекладины и регулярно косить."
    cost: "Примерно от $1100 до $1500 сразу и от $150 до $300 в год (нужно уточнить в PHS)"
  seal_abandoned_building:
    label: "Добиться, чтобы это здание закрыли"
    summary: "Сообщите об открытом заброшенном здании, чтобы город закрыл его двери и окна."
    cost: "Сообщить можно бесплатно"
  plant_shade_trees:
    label: "Посадить деревья, дающие тень, на этом участке и вдоль него"
    summary: "Здесь тень дают меньше деревьев, чем вокруг не менее половины мест на этой карте (городское обследование крон деревьев 2018 года). Деревья охлаждают квартал своей тенью и водой, которую отдают их листья. Город сажает бесплатные уличные деревья в тротуаре, когда об этом просит владелец недвижимости, а TreePhilly раздаёт бесплатные деревья для посадки в землю на частной земле. Выбирайте деревья, которые вырастут высокими, чтобы они давали тень улице, а соседи по-прежнему видели участок насквозь."
    cost: "Бесплатные деревья от города и TreePhilly. Молодым деревьям нужно примерно 20 галлонов воды в неделю с марта по декабрь"
  cool_green_lot:
    label: "Озеленить этот участок, чтобы охладить квартал"
    summary: "По городскому индексу уязвимости к жаре летняя жара бьёт по людям здесь сильнее, чем вокруг не менее половины мест на этой карте. Голая земля, гравий и строительный мусор впитывают солнце, а трава, клумбы и прежде всего деревья держат участок прохладнее и дают тень тротуару рядом. Чем бы ни стал этот участок, садом, очищенным и озеленённым участком или боковым двором, посадите на нём деревья, дающие тень, и держите их высокими, чтобы участок оставался открытым для взгляда."
    cost: "От бесплатных деревьев (TreePhilly) до суммы примерно от $1100 до $1500 сразу за полную очистку и озеленение (нужно уточнить в PHS)"
  seating_and_shade:
    label: "Сделать место для сидения в тени"
    summary: "В пяти минутах ходьбы от этого участка живёт больше людей, чем вокруг не менее половины мест на этой карте. Несколько скамеек или стол для пикника под деревьями, дающими тень, могут сделать его местом, где соседи останавливаются, отдыхают и встречаются. Спросите соседей, чем они стали бы пользоваться, выбирайте прочные сиденья и сажайте деревья, которые вырастут высокими, чтобы участок оставался открытым для взгляда. Продумайте, кто будет поддерживать чистоту."
    cost: "От бесплатных деревьев (TreePhilly) и скамейки, сделанной по открытому проекту, до нескольких тысяч долларов. Небольшие гранты Feet First Philly на общественные пространства составляют от $500 до $2500"
  community_garden:
    label: "Завести общественный сад"
    summary: "Этот участок дальше от парка, чем не менее половины мест на этой карте, и в пяти минутах ходьбы от него живёт не меньше 1000 человек. Общественный сад даёт соседям зелёное пространство, еду и цветы и повод встречаться. Ему нужны садоводы, которые приходят каждую неделю, вода и разрешение пользоваться землёй. Когда сад заработает, Neighborhood Gardens Trust может помочь сохранить его садом навсегда."
    cost: "От нескольких приподнятых грядок до нескольких тысяч долларов с землёй, забором и водой. Urban Garden Agreement от Land Bank стоит $1"
  art_request:
    label: "Спросить о мурале или другом искусстве"
    summary: "Вокруг этого участка живёт много людей, и ни одной работы из городского списка Percent for Art или из Wikidata нет в пределах 5 минут ходьбы. В этих списках нет многих муралов, поэтому сначала посмотрите слой «Публичное искусство» и собственный список муралов Mural Arts. Пустая стена, обращённая к участку, могла бы нести мурал: Mural Arts принимает просьбы от владельцев стен на своём сайте. Искусство приветствуется ради красоты и гордости; ни одно исследование не связывает его с меньшим насилием."
    cost: "Спросить у Mural Arts можно бесплатно"
  report_dumping:
    label: "Сообщить о незаконном сбросе мусора в Philly311"
    summary: "За последние 90 дней кто-то обратился в Philly311 по поводу незаконного сброса мусора на отрезке улицы, к которому обращён этот участок, и обращение ещё открыто. Если мусор всё ещё там, подайте своё обращение с фотографией, чтобы город убрал его. Сообщение касается мусора, а не того, кто его оставил."
    cost: "Сообщить можно бесплатно"
  report_dark_light:
    label: "Сообщить о неработающем уличном фонаре в Philly311"
    summary: "За последние 90 дней кто-то обратился в Philly311, чтобы починить уличный фонарь или фонарь в переулке, который не горит, на отрезке улицы, к которому обращён этот участок, и обращение ещё открыто. Если фонарь всё ещё не горит, подайте своё обращение с номером столба, если он есть. Освещённая улица помогает соседям пользоваться улицей и участком после наступления темноты."
    cost: "Сообщить можно бесплатно"
  report_graffiti:
    label: "Сообщить о граффити в Philly311"
    summary: "За последние 90 дней кто-то обратился в Philly311, чтобы убрали граффити на отрезке улицы, к которому обращён этот участок, и обращение ещё открыто. Если граффити всё ещё там, подайте своё обращение с фотографией, чтобы город мог его смыть. Если соседи предпочли бы видеть на этой стене искусство, спросите у её владельца о мурале."
    cost: "Сообщить можно бесплатно"
  memorial_or_ghost_bike:
    label: "Мемориал или белый велосипед (ghost bike)"
    summary: "Мемориал чтит человека, который погиб, и напоминает всем проходящим мимо ехать медленнее. Для человека, погибшего на велосипеде, Bicycle Coalition может поставить ghost bike, велосипед, окрашенный в белый цвет."
    cost: "Невысокая; просьба о ghost bike бесплатна"
  traffic_calming_petition:
    label: "Попросить о мерах успокоения движения на этой жилой улице"
    summary: "Соседи могут попросить город установить скоростные подушки на жилой улице. Город оценивает просьбы три раза в год по данным об авариях, и если выбрана эта улица, 60 процентов квартала подписывают петицию. Магистрали, государственные шоссе, короткие, крутые и извилистые улицы не подходят."
    cost: "Попросить можно бесплатно"
  daylighting_check:
    label: "Проверить, что этот угол свободен на 20 футов"
    summary: "Закон Пенсильвании уже запрещает парковку в пределах 20 футов от пешеходного перехода на перекрёстке и в пределах 30 футов от знака «Стоп» или светофора, чтобы водители и пешеходы видели друг друга. Если там паркуются машины, спросите город об улучшении обзора на углу с помощью краски, столбиков или кашпо. О неработающем фонаре здесь сообщите в Philly311."
    cost: "Спросить можно бесплатно"
  asphalt_art_check:
    label: "Искусство на асфальте на этом углу: сначала уточните в городе"
    summary: "Одно исследование раскрашенных перекрёстков показало меньше аварий с участием пешеходов и велосипедистов, но в нём не было группы сравнения, и его оплатил спонсор программы. В 2025 году федеральное правительство начало призывать штаты убирать рисунки на пешеходных переходах, а в Филадельфии нет порядка выдачи разрешений на них. Уточните в городе, прежде чем что-либо раскрашивать."
    cost: "Неизвестно; у города нет порядка, по которому можно оценить стоимость"
  stop_survey:
    label: "Проверить эту остановку с помощью StreetComplete"
    summary: "Пока никто не записал, есть ли на этой остановке навес или скамейка, или OpenStreetMap и городской список автобусных навесов расходятся насчёт её навеса. Любой может выяснить это за несколько минут с бесплатным приложением StreetComplete на телефоне, и ответы попадут на эту карту примерно через неделю. Если в приложении здесь нет вопроса, этой остановки ещё нет в OpenStreetMap: добавьте её через слой Things в приложении или оставьте заметку."
    cost: "Бесплатно; около трёх минут на остановку"
  stop_shelter_request:
    label: "Попросить город о навесе на этой остановке"
    summary: "Проверка не нашла здесь навеса, и в городском списке автобусных навесов его тоже нет. Городская программа автобусных навесов, которую ведёт его транспортное управление (OTIS), строит навесы, оплаченные рекламой на них, и стремится ставить их на самых загруженных 15 процентах автобусных остановок. Публичной формы запроса нет, поэтому напишите в OTIS, указав номер остановки и сколько людей здесь садится."
    cost: "Спросить можно бесплатно"
  stop_bench_request:
    label: "Попросить город о скамейке на этой остановке"
    summary: "Проверка не нашла здесь скамейки. Скамейки на остановках относятся к городской программе уличной мебели, которую ведёт OTIS, и публичного способа подать запрос мы не нашли, поэтому напишите в OTIS, указав номер остановки. Скамейка, которую вы делаете сами, требует разрешения, а порядок получения разрешения на скамейку на тротуаре у города пока не подтверждён."
    cost: "Спросить можно бесплатно"
  stop_streetlight_report:
    label: "Сообщить о неработающем уличном фонаре на этой остановке"
    summary: "OpenStreetMap говорит, что эта остановка не освещена. Если здесь не горит уличный фонарь, сообщите об этом в Philly311. Действующая городская программа уличного освещения заменяет фонари, но не добавляет новые, поэтому остановка совсем без света это вопрос к OTIS."
    cost: "Сообщить можно бесплатно"
  stop_shade_trees:
    label: "Посадить деревья, дающие тень, у этой остановки"
    summary: "Эту остановку затеняет мало деревьев. Город сажает бесплатные уличные деревья в тротуаре перед домом или предприятием, когда об этом просит его владелец, и поливает их первый год. Попросите владельцев зданий рядом с остановкой подать просьбу; соседи потом могут помочь поливать."
    cost: "Бесплатные уличные деревья для владельцев недвижимости"

routes:
  land_bank_garden_agreement:
    label: "Договор или лицензия на сад от Land Bank"
    who: "Любой человек, для Urban Garden Agreement за $1; группы с некоммерческим спонсором, для Community Garden License"
    cost: "$1 (Urban Garden Agreement), $25 в год (Individual Garden Agreement) или страховка и спонсор (Community Garden License)"
    timeline: "Недели для коротких договоров; месяцы для лицензии"
    steps:
      - "Проверьте, что участок принадлежит Land Bank или городу."
      - "Прочитайте руководство Grounded in Philly о том, как получить разрешение на использование городской земли."
      - "Подайте заявку в Land Bank или сначала подключитесь к одному из его бесплатных вебинаров."
    links:
      "https://phillylandbank.org/":
        label: "Philadelphia Land Bank"
      "https://groundedinphilly.org/get-permission-to-use-land-city/":
        label: "Grounded in Philly: разрешение на использование городской земли"
  ask_the_owner:
    label: "Попросить разрешение у владельца"
    who: "Любой человек"
    cost: "Бесплатно"
    timeline: "Зависит от владельца"
    steps:
      - "Найдите почтовый адрес владельца на странице участка."
      - "Напишите, чтобы попросить разрешение очистить и озеленить участок, и предложите простое письменное соглашение."
      - "Попросите Garden Justice Legal Initiative проверить любое соглашение, прежде чем вы его подпишете."
    links:
      "https://www.pubintlaw.org/cases-and-advocacy/garden-justice-legal-initiative/":
        label: "Garden Justice Legal Initiative"
  community_landcare:
    label: "Ухаживать за участком вместе с PHS Community LandCare"
    who: "Группы жителей"
    cost: "Нужно уточнить в PHS"
    timeline: "Нужно уточнить в PHS"
    steps:
      - "Свяжитесь с PHS насчёт Community LandCare."
    links:
      "https://phsonline.org/":
        label: "Pennsylvania Horticultural Society"
  report_to_311:
    label: "Сообщить в Philly311"
    who: "Любой человек"
    cost: "Бесплатно"
    timeline: "От нескольких дней до нескольких недель"
    steps:
      - "Сообщите об открытом здании, незаконном сбросе мусора, граффити или неработающем уличном фонаре или фонаре в переулке в Philly311 онлайн, через приложение или по телефону 311."
      - "Сохраните номер обращения и проверяйте, как оно продвигается."
    links:
      "https://www.phila.gov/services/property-lots-housing/submit-a-service-request-with-311/":
        label: "Philly311"
  ghost_bike_request:
    label: "Спросить у Bicycle Coalition о ghost bike или мемориале"
    who: "Семья или друзья с согласия семьи"
    cost: "Просьба бесплатна"
    timeline: "Не указано"
    steps:
      - "Сначала поговорите с семьёй. Мемориал ставится только с её согласия."
      - "Для человека, погибшего на велосипеде, заполните форму просьбы Bicycle Coalition о ghost bike. Той же формой просят отремонтировать или заменить ghost bike."
      - "Families for Safe Streets, которую ведёт Bicycle Coalition, поддерживает семьи после аварии и делится руководством с ресурсами для тех, кто пережил аварию."
      - "Продумайте, кто будет заботиться о мемориале со временем."
    links:
      "https://bicyclecoalition.org/what-is-a-ghost-bike/":
        label: "Bicycle Coalition: что такое ghost bike"
      "https://forms.gle/HBtY1hG4xcdVJKNb8":
        label: "Форма просьбы о ghost bike"
      "https://bicyclecoalition.org/programs/families-for-safe-streets/":
        label: "Families for Safe Streets Greater Philadelphia"
  traffic_calming_request:
    label: "Попросить о мерах успокоения движения на жилой улице"
    who: "Жители квартала, главным образом для улицы, на которой они живут"
    cost: "Просьба бесплатна"
    timeline: "Город оценивает просьбы три раза в год и обычно устанавливает скоростные подушки с мая по октябрь"
    steps:
      - "Проверьте, подходит ли улица, на городской карте мер успокоения движения или по телефону 311."
      - "Отправьте через интернет городскую просьбу о мерах успокоения движения."
      - "Если город выберет просьбу, соберите подписи 60 процентов домохозяйств квартала, по одной от каждого домохозяйства."
    links:
      "https://www.phila.gov/services/streets-sidewalks-alleys/request-traffic-calming-for-a-residential-street/":
        label: "Город Филадельфия: просьба о мерах успокоения движения"
  otis_contact:
    label: "Спросить городское транспортное управление (OTIS)"
    who: "Любой человек"
    cost: "Бесплатно"
    timeline: "Не указано"
    steps:
      - "Напишите в Управление транспорта и инфраструктурных систем (Office of Transportation and Infrastructure Systems, OTIS) на otis@phila.gov, назвав угол и то, что вы там видите."
      - "Спросите, что город разрешает на этом углу и как об этом попросить."
    links:
      "https://visionzerophl.com/":
        label: "Vision Zero Philadelphia"
  treephilly_yard_trees:
    label: "Получить бесплатные деревья на раздаче TreePhilly"
    who: "Жители Филадельфии, для деревьев, которые сажают в землю на частной собственности, например на участке, который вам принадлежит, или на частном участке, чей владелец согласен письменно"
    cost: "Бесплатно"
    timeline: "Следующая весенняя или осенняя раздача"
    steps:
      - "Подпишитесь на рассылку TreePhilly, чтобы узнать, когда откроется регистрация. Раздачи проходят весной (с марта по май) и осенью (с сентября по декабрь) в приоритетных почтовых индексах (ZIP)."
      - "Зарегистрируйтесь через общественную группу, которая проводит раздачу рядом с вами. Регистрация открывается примерно за две недели или за месяц до раздачи и закрывается, когда деревья заканчиваются."
      - "Заберите дерево высотой от 2 до 10 футов в ведре на 5 галлонов с бесплатным мешком мульчи и посадите его в землю. Деревья с раздачи нельзя сажать в контейнер, в тротуар или в любое другое место на общественной полосе отвода (public right of way)."
    links:
      "https://treephilly.org/yard-trees/":
        label: "TreePhilly: деревья для дворов"
  mural_arts_wall_request:
    label: "Попросить Mural Arts о мурале на стене"
    who: "Владелец стены вместе с соседями, которые это поддерживают. Любой может начать с просьбы к владельцу"
    cost: "Подать заявку можно бесплатно"
    timeline: "Месяцы"
    steps:
      - "Найдите стену, которая обращена к участку и хорошо видна с улицы, и спросите её владельца, был бы он рад муралу."
      - "С согласия владельца заполните форму запроса стены на странице контактов Mural Arts Philadelphia. В ней спрашивают о стене, поддержке соседей и о том, почему мурал там важен."
      - "Всё, что находится на улице или на тротуаре, то есть на общественной полосе отвода, также направляется в городской Art Commission."
    links:
      "https://muralarts.org/contact/":
        label: "Mural Arts Philadelphia: страница контактов с формой для мурала на вашей стене"
  public_space_mini_grant:
    label: "Подать заявку на небольшой грант Feet First Philly на общественное пространство"
    who: "Соседи и общественные группы. Программа отдаёт предпочтение сообществам, в улицы и городские услуги которых вкладывали меньше"
    cost: "Гранты от $500 до $2500, частично финансируются Департаментом общественного здравоохранения"
    timeline: "Заявки открываются в августе и принимаются до октября каждый год"
    steps:
      - "Прочитайте запрос предложений на странице небольших грантов Feet First Philly. Проекты должны делать район безопаснее и удобнее для ходьбы и передвижения на колёсах; спросите Feet First Philly, подходит ли место для сидения на участке."
      - "Подавайте заявку, пока раунд открыт. Заявки открываются в августе и принимаются до октября."
      - "Будьте готовы отправить короткий отчёт на полпути и ещё один в конце."
    links:
      "https://feetfirstphilly.org/public-space-enhancement-mini-grant-2/":
        label: "Feet First Philly: небольшой грант на обустройство общественного пространства"
  land_bank_side_yard:
    label: "Получить как боковой или задний двор (только для владельцев соседнего дома)"
    who: "Владелец дома по соседству, и только когда в городском списке участок отмечен как подходящий для бокового двора"
    cost: "Символическая цена. Участок должен навсегда остаться боковым двором, по закладной на 30 лет на сумму его стоимости по оценке (appraised value), которая прощается, если правила соблюдаются; город может забрать участок обратно, если они не соблюдаются"
    timeline: "Сотрудники стремятся ответить за 120 дней, затем решают совет Land Bank и городской совет. С 2020 по 2023 год по всему городу таким путём передано только 67 участков"
    steps:
      - "Проверьте, что вам принадлежит дом по соседству и что участок отмечен как подходящий для бокового двора."
      - "Прочитайте страницу Land Bank о боковых и задних дворах и подайте заявку."
      - "Готовьтесь к долгому ожиданию. После рассмотрения сотрудниками его должны одобрить совет Land Bank и городской совет."
    links:
      "https://phillylandbank.org/side-or-rear-yards/":
        label: "Philadelphia Land Bank: боковые и задние дворы"
  contact_phdc:
    label: "Спросить PHDC об этом земельном участке"
    who: "Любой человек"
    cost: "Спросить можно бесплатно"
    timeline: "Неизвестно. Для участков Redevelopment Authority пока нет опубликованного пути для соседей"
    steps:
      - "Свяжитесь с PHDC, назвав адрес земельного участка и номер его счёта OPA."
      - "Спросите, кто управляет участком, доступен ли он и как соседи могли бы ухаживать за ним."
      - "Если вы не уверены, у кого спрашивать, начните с Land Bank (land@phdc.phila.gov, 215 448 3034)."
    links:
      "https://phdcphila.org/":
        label: "PHDC"
      "https://phillylandbank.org/":
        label: "Philadelphia Land Bank"
  garden_adverse_possession:
    label: "Приобретательная давность для сада (adverse possession, закон 2024 года)"
    who: "Жители Филадельфии, группы или некоммерческие организации, которые выращивали сад на участке в частной собственности"
    cost: "Юрист и судебные расходы. Любые обременения на земле остаются с ней"
    timeline: "Не менее 10 лет использования, затем судебный иск"
    steps:
      - "Проверьте условия закона 2024 года (53 Pa.C.S. раздел 1143, действует с 6 сентября 2024 года): земля в частной собственности площадью не более половины акра, 10 лет использования, из них не менее 5 лет как сад, и никаких постоянных построек (заборы и сараи разрешены)."
      - "Прочитайте руководство Grounded in Philly о приобретательной давности (adverse possession)."
      - "Попросите Garden Justice Legal Initiative о юристе. Этот путь требует судебного иска об установлении права собственности (quiet title)."
    links:
      "https://groundedinphilly.org/how-to-obtain-land-adverse-possession/":
        label: "Grounded in Philly: приобретательная давность"
      "https://www.pubintlaw.org/cases-and-advocacy/garden-justice-legal-initiative/":
        label: "Garden Justice Legal Initiative"
  conservatorship:
    label: "Консерваторство (conservatorship, Act 135)"
    who: "Некоммерческая организация или человек, который подаёт ходатайство в суд"
    warning: "Консерваторство (conservatorship) может лишить собственника его недвижимости. Исследователи обнаружили, что оно применяется непропорционально часто в районах, переживающих джентрификацию. Поговорите с Garden Justice Legal Initiative, прежде чем рассматривать его."
    cost: "Судебные расходы и расходы на ремонт. С 2014 года заявителю могут выплатить наибольшую из сумм: $2500, 20% расходов или 20% цены продажи"
    timeline: "Судебное дело; спросите в юридической помощи, сколько оно может занять"
    steps:
      - "Прежде всего поговорите с Garden Justice Legal Initiative."
      - "Сначала спросите, не удовлетворит ли ту же потребность письмо владельцу или помощь семье в сохранении недвижимости."
      - "Знайте условия закона: суд может назначить попечителя (conservator) только для недвижимости, в которой не жили на законных основаниях 12 месяцев, которая не выставлена на продажу, не находится в процессе обращения взыскания и не была куплена за последние 6 месяцев."
    links:
      "https://www.pubintlaw.org/cases-and-advocacy/garden-justice-legal-initiative/":
        label: "Garden Justice Legal Initiative"
  tangled_title_help:
    label: "Помочь семье сохранить унаследованный дом (Tangled Title Fund)"
    who: "Семьи, чей дом всё ещё записан на умершего родственника, с доходом домохозяйства до 80% медианного дохода по региону (area median income); недвижимость должна быть домом заявителя"
    cost: "Бесплатно для семьи в пределах лимитов фонда; всё сверх них семья оплачивает сама"
    timeline: "В порядке очереди"
    steps:
      - "Свяжитесь с Tangled Title Fund в Philadelphia VIP (tangledtitlefund@gmail.com, 215 523 9553)."
      - "Фонд оплачивает до $6500 юридических расходов на приведение права собственности в порядок и ещё до $3500 налога на передачу, в каждом случае отдельно."
    links:
      "https://phillyvip.org/tangled-title-fund/":
        label: "Philadelphia VIP: Tangled Title Fund"
  fraud_guard:
    label: "Подписаться на бесплатные оповещения города Fraud Guard"
    who: "Владельцы недвижимости и их семьи"
    cost: "Бесплатно"
    timeline: "Оповещение приходит примерно через 30 дней после регистрации документа"
    steps:
      - "Подпишитесь на Fraud Guard, указав имя и адрес электронной почты."
      - "Город отправляет электронное письмо, когда регистрируется документ с вашим именем, поэтому поддельный документ о передаче права собственности (deed) обнаруживается рано."
      - "Вопросы направляйте в Department of Records, Департамент записей (215 686 2290, records.info@phila.gov)."
    links:
      "https://www.phila.gov/2022-09-06-own-property-in-philadelphia-get-free-deed-fraud-protection-with-fraud-guard/":
        label: "Город Филадельфия: Fraud Guard"
  bus_shelter_request:
    label: "Попросить город об автобусном навесе"
    who: "Любой человек"
    cost: "Спросить можно бесплатно"
    timeline: "Не указано. OTIS направляет места новых навесов на рассмотрение в городской Art Commission (восемь в декабре 2025 года)"
    steps:
      - "Запишите номер остановки SEPTA (на указателе и на этой карте), угол и сколько людей садится там каждый будний день."
      - "Напишите в городское Управление транспорта и инфраструктурных систем (OTIS) на otis@phila.gov или позвоните по номеру 215-686-9003. OTIS ведёт городскую программу автобусных навесов; публичной формы запроса нет."
      - "Отправьте копию в окружной офис вашего члена городского совета, а также сообщите SEPTA через её онлайн-форму отзывов или по номеру 215-580-7800."
    links:
      "https://www.phila.gov/media/20240521160603/RFI-OTIS-street-furniture-20240521.pdf":
        label: "Запрос OTIS о сведениях по уличной мебели (май 2024 года), с городской целью по навесам"
      "https://www.phila.gov/media/20251205094032/Bus-Shelter-Upgrades-submission.pdf":
        label: "Восемь новых автобусных навесов направлены в Art Commission (декабрь 2025 года)"
      "https://wwww.septa.org/customer-service/comment-form/":
        label: "Форма отзывов SEPTA"
      "https://phlcouncil.com/council-members/":
        label: "Городской совет Филадельфии: член совета и офис каждого округа"
  stop_bench_request:
    label: "Попросить город о скамейке на остановке"
    who: "Любой человек"
    cost: "Спросить можно бесплатно"
    timeline: "Не указано"
    steps:
      - "Запишите номер остановки SEPTA (на указателе и на этой карте) и угол."
      - "Напишите в OTIS на otis@phila.gov или позвоните по номеру 215-686-9003 и попросите скамейку на остановке. Скамейки на остановках относятся к городской программе уличной мебели; публичной формы запроса мы не нашли."
      - "Отправьте копию в окружной офис вашего члена городского совета."
    links:
      "https://www.phila.gov/media/20240521160603/RFI-OTIS-street-furniture-20240521.pdf":
        label: "Запрос OTIS о сведениях по уличной мебели (май 2024 года)"
      "https://phlcouncil.com/council-members/":
        label: "Городской совет Филадельфии: член совета и офис каждого округа"
  street_tree_request:
    label: "Попросить бесплатное уличное дерево"
    who: "Владелец дома, предприятия, участка или другой недвижимости, перед которой встанет дерево; соседи могут попросить владельца об этом"
    cost: "Бесплатно"
    timeline: "Следующий сезон посадки после визита арбориста"
    steps:
      - "Уличные деревья сажают в тротуаре перед недвижимостью, когда об этом просит её владелец. Поговорите с владельцами зданий рядом с этим местом. Для пустующего участка спросите владельца, названного на странице участка, или Land Bank, если участок принадлежит городу или Land Bank."
      - "Владелец просит бесплатное уличное дерево у Street Tree Management Division «Парков и зон отдыха» (Parks and Recreation) онлайн, по электронной почте StreetTree.Info@phila.gov или по телефону 215-685-4363."
      - "Городской арборист приезжает, чтобы решить, какое дерево подходит. Город сажает его бесплатно в сезон посадки (с середины апреля до середины июня или с середины октября до середины ноября) и поливает и мульчирует его первый год. После этого TreePhilly просит около 20 галлонов воды в неделю с марта по декабрь."
    links:
      "https://www.phila.gov/services/trees-parks-the-environment/tree-related-services/get-a-street-tree/":
        label: "Город Филадельфия: получить уличное дерево"
      "https://treephilly.org/street-trees/":
        label: "TreePhilly: уличные деревья"
  streetcomplete_survey:
    label: "Проверить остановку с помощью StreetComplete"
    who: "Любой, у кого есть телефон на Android (первая тестовая версия для iPhone появилась в сентябре 2026 года)"
    cost: "Бесплатно"
    timeline: "Ответы попадают на эту карту примерно через неделю"
    steps:
      - "Установите бесплатное приложение StreetComplete и заведите бесплатную учётную запись OpenStreetMap, чтобы ваши ответы публиковались."
      - "На остановке нажмите на метку приложения и ответьте на его вопросы о навесе, скамейке, освещении и номере остановки."
      - "Если в приложении на остановке нет вопроса, добавьте остановку через слой Things в приложении или оставьте заметку, чтобы это мог сделать другой картограф."
    links:
      "https://holdthedoorhoid.github.io/placekeepers/streetcomplete/":
        label: "Placekeepers: проверка автобусных остановок"
      "https://streetcomplete.app/":
        label: "StreetComplete"
  neighborhood_gardens_trust:
    label: "Сохранить общественный сад навсегда (Neighborhood Gardens Trust)"
    who: "Садоводы, чей общественный сад растёт не меньше трёх сезонов"
    cost: "Подать заявку можно бесплатно"
    timeline: "Ответ примерно через две недели; приобретение земли занимает больше времени"
    steps:
      - "Проверьте критерии траста: сад, действующий не меньше трёх вегетационных сезонов, садоводы, способные его поддерживать, связи с такими группами, как корпорация по развитию сообщества (community development corporation), церковь или школа, и поддержка соседей и члена городского совета от округа."
      - "Подайте заявку через онлайн-анкету сада траста или его печатную форму. Траст отвечает примерно за две недели, затем посещает сад и выносит его на свой совет."
      - "После одобрения траст работает с городом над приобретением земли и держит её, чтобы соседи могли продолжать заниматься садом, со страхованием ответственности и помощью с водой и уходом. Вопросы направляйте по номеру 215 988 1630 или на ngtrust@pennhort.org."
    links:
      "https://ngtrust.org/preservation/":
        label: "Neighborhood Gardens Trust: сохранение садов"
  community_land_trust:
    label: "Сохранить жильё и землю доступными навсегда (общинные земельные трасты)"
    who: "Соседи, общественные группы и некоммерческие организации"
    cost: "Спросить можно бесплатно"
    timeline: "Долго; проекты земельного траста занимают годы"
    steps:
      - "Узнайте, как работает общинный земельный траст (community land trust): некоммерческая организация владеет землёй навсегда, семьи покупают или арендуют дома на ней, а долгая аренда земли (ground lease) сохраняет доступность каждого дома при перепродаже."
      - "Поговорите с земельным трастом, который уже работает в Филадельфии, например с Community Justice Land Trust проекта Women's Community Revitalization Project, который держит дома в Point Breeze, Grays Ferry, Mantua, Germantown, Port Richmond и Haddington."
      - "Спросите Garden Justice Legal Initiative, как земельный траст мог бы держать сад или участок, о которых ваша группа уже заботится."
    links:
      "https://groundedsolutions.org/strengthening-neighborhoods/community-land-trusts":
        label: "Grounded Solutions Network: общинные земельные трасты"
      "https://www.wcrpphila.org/cjlt":
        label: "Women's Community Revitalization Project: Community Justice Land Trust"
  homestead_exemption:
    label: "Снизить налоговый счёт домовладельца (городская налоговая льгота Homestead Exemption)"
    who: "Любой, кому принадлежит дом в Филадельфии и кто живёт в нём как в основном месте жительства, даже с ипотекой или налоговым долгом; не дома с десятилетним налоговым послаблением"
    cost: "Бесплатно"
    timeline: "Крайний срок: 1 декабря каждого года"
    steps:
      - "Подайте заявку в Philadelphia Tax Center (tax-services.phila.gov), где одна общая заявка охватывает программы налоговой помощи города, или позвоните на горячую линию Homestead по номеру 215 686 9200, или отправьте форму по почте в Department of Revenue (Департамент доходов), P.O. Box 52817, Philadelphia, PA 19115."
      - "Льгота вычитает $100 000 из оценочной стоимости дома для налогового счёта, что экономит до $1399 в год."
      - "Подайте заявку до 1 декабря (до 1 октября, чтобы увидеть её в следующем счёте). После принятия подавать заявку снова не нужно, если документ о передаче права собственности (deed) не меняется."
    links:
      "https://www.phila.gov/services/payments-assistance-taxes/taxes/property-and-real-estate-taxes/get-real-estate-tax-relief/get-the-homestead-exemption/":
        label: "Город Филадельфия: получить Homestead Exemption"
  longtime_owner_occupants:
    label: "Ограничить рост оценки для давнего владельца (городская программа для давних владельцев, живущих в своём доме, LOOP)"
    who: "Домовладельцы, которые живут в своём доме не менее 10 лет, у которых оценка выросла не менее чем на 50 процентов за один год или на 75 процентов за пять лет, с доходом домохозяйства ниже городского предела (например $103 050 для одного человека или $147 200 для четырёх в 2026 году), с уплаченными налогами или по соглашению о платежах"
    cost: "Бесплатно"
    timeline: "Ежегодный крайний срок, в последние годы 30 сентября"
    steps:
      - "Подайте заявку в Philadelphia Tax Center (tax-services.phila.gov) по общей заявке города или позвоните по номеру 215 686 9200, напишите на revenue@phila.gov или отправьте форму по почте в Department of Revenue, P.O. Box 53190, Philadelphia, PA 19105."
      - "LOOP ограничивает оценку, которую использует налоговый счёт, в 1,5 раза выше прошлогодней или в 1,75 раза выше самой низкой стоимости за последние пять лет, пока владелец остаётся подходящим."
      - "Подайте заявку до ежегодного крайнего срока города (30 сентября в последние годы); на странице города указан текущий."
    links:
      "https://www.phila.gov/services/payments-assistance-taxes/payment-plans-and-assistance-programs/income-based-programs-for-residents/apply-for-the-longtime-owner-occupants-program-loop/":
        label: "Город Филадельфия: подать заявку на LOOP"

