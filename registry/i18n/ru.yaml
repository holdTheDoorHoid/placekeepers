# Russian (ru) translations of the visitor facing words in registry/*.yaml, by id. English in
# registry/*.yaml is the source; anything left out here shows the English. Which fields may be
# translated, and the shape of this file, are in docs/TRANSLATING.md and
# web/src/i18n/registry-text.ts. The key terms are fixed in docs/i18n/glossary-ru.md and are the
# same here as in web/src/i18n/locales/ru.ts and content/ru/.

groups:
  lots:
    label: "Участки и здания"
    description: "Пустующие участки и заброшенные здания, и что с ними можно сделать."
  care:
    label: "Забота, которая уже есть"
    description: "Участки, за которыми уже ухаживают, сады, парки и другие места, о которых люди уже заботятся."
  displacement:
    label: "Цены и защита"
    description: "Где растут цены, чтобы озеленение и другие улучшения можно было сочетать с защитой для соседей, которые живут там сейчас."
  rules:
    label: "Правила для земли и слушания"
    description: "Исторические районы и объекты, зоны overlay зонирования, предстоящие слушания об участках и зданиях и федеральные участки brownfield."
  streets:
    label: "Улицы и мемориалы"
    description: "Сеть с высоким уровнем травматизма (High Injury Network), аварии, люди, погибшие на наших улицах, а также уличные столбы, меры успокоения движения и дежурные на школьных переходах, которых указывает город."
  transit:
    label: "Автобусы и поезда"
    description: "Остановки и маршруты SEPTA, как часто ходит транспорт, сколько людей садится и на каких остановках есть навес или скамейка, по городскому списку навесов и OpenStreetMap."
  heat:
    label: "Жара, деревья и наводнения"
    description: "Насколько сильно летняя жара бьёт по каждому району, деревья, о которых город заботится на улицах и в парках, и где FEMA ожидает наводнений."
  amenities:
    label: "Скамейки, вода, туалеты и другое"
    description: "Места, где можно сесть, попить воды, воспользоваться туалетом или взять книгу, по данным OpenStreetMap, и питьевые фонтанчики в парках."
  public_places:
    label: "Библиотеки, центры отдыха и бассейны"
    description: "Филиалы Free Library, центры отдыха, бассейны и водные игровые площадки «Парков и зон отдыха», а также городские пункты обогрева и охлаждения, как их указывает город."
  conditions:
    label: "Проблемы, о которых сообщили в 311"
    description: "Незаконный сброс мусора, неработающие фонари и граффити, о которых люди сообщили в Philly311 за последние 90 дней, с подсчётом по отрезкам улиц."
  placemaking:
    label: "Искусство и обустройство общественных мест"
    description: "Муралы, скульптуры, мозаики и другое публичное искусство, по данным города, OpenStreetMap и Wikidata, а также городские игровые площадки."
  walking:
    label: "Ходьба, велосипед и люди"
    description: "Насколько удобно ходить пешком в каждом районе, сколько людей и повседневных мест находится в пределах короткой прогулки и насколько напряжённой для велосипедистов бывает каждая улица."
  then_and_now:
    label: "Раньше и теперь"
    description: "Что стояло на этом месте раньше и что осталось от прошлого. Аэрофотоснимки с 1959 года и атлас 1860 года загружаются с серверов города, только когда их включают; карта редлайнинга 1937 года находится на этом сайте."
  safety_context:
    label: "Где больше всего нужна забота"
    description: "Контекст, который показывает, где улучшения, вероятно, помогут больше всего."
  boundaries:
    label: "Границы"
    description: "Округа городского совета, общественные организации и районы."
  basemap:
    label: "Базовая карта"
    description: "Улицы, здания и названия мест под всем остальным."

