options:
  live_city_data:
    label: "Получать данные города в реальном времени"
    description: "Когда вы открываете страницу участка или ищете адрес, ваш браузер запрашивает у открытых серверов города Филадельфия самые новые записи: о владельце, продажах, оценках, инспекциях и апелляциях. Эти запросы идут прямо с вашего устройства в город, никогда не через Placekeepers, и серверы города видят их так, как увидели бы посещение собственного сайта города о недвижимости. Аэрофотоснимки города и его атлас 1860 года в разделе «Раньше и теперь» тоже приходят прямо с серверов города, но только когда вы включаете один из них. Выключите эту настройку, чтобы использовать только еженедельную копию данных, которую публикует Placekeepers. Для поиска адреса, открытия земельного участка, которого нет в нашем списке, и старых снимков и атласа эта настройка должна быть включена."
