  philly311_dumping_history:
    name: "Обращения в Philly311 о незаконном сбросе мусора с 2016 года"
    publisher: "Город Филадельфия, Philly311"
  li_complaints_history:
    name: "Жалобы в L&I на пустующие участки и здания с 2015 года"
    publisher: "Город Филадельфия, Департамент лицензий и инспекций (L&I)"

layers:
  vacant_parcels:
    label: "Пустующие участки и здания"
    description: "Земельные участки, которые, вероятно, пустуют, с указанием того, насколько мы уверены и почему. Объединяет городской показатель пустования с записями оценочной службы, контурами зданий, сносами, делами L&I и картой землепользования, чтобы ни один источник не мог всё сломать."
    settings:
      min_confidence:
        label: "Показывать участки, в которых мы уверены не меньше, чем"
        options:
          "1":
            label: "Любой признак пустования"
          "2":
            label: "Вероятно или очень вероятно пустует"
          "3":
            label: "Только очень вероятно пустует"
      kinds:
        label: "Показывать"
        options:
          both:
            label: "Участки и здания"
          lots:
            label: "Только участки"
          buildings:
            label: "Только здания"
      listed:
        label: "Внесены городскими земельными ведомствами в список доступных"
        options:
          any:
            label: "Любой земельный участок"
          available:
            label: "Только внесённые в список доступных"
      lens:
        label: "Раскрашивать участки по"
        options:
          violence:
            label: "Ракурсу «Снижение насилия»"
          heat:
            label: "Ракурсу «Жара и тень»"
          placemaking:
            label: "Ракурсу «Обустройство общественных мест»"
  hin_2025:
    label: "Сеть с высоким уровнем травматизма (High Injury Network)"
    description: "Улицы, на которых в Филадельфии происходит большинство смертей и тяжёлых травм в дорожном движении, по карте программы города Vision Zero за 2025 год."
  shootings_hex:
    label: "Стрельба, подсчёт по областям"
    description: "Люди, пострадавшие от стрельбы за выбранный период, подсчитанные по шестиугольникам шириной примерно в два квартала. Показано, чтобы направить заботу туда, где она нужнее всего, а не чтобы называть места опасными."
    settings:
      window:
        label: "Период"
        options:
          m12:
            label: "За последние 12 месяцев"
          m36:
            label: "За последние 3 года"
  landcare_lots:
    label: "Участки, за которыми ухаживает PHS LandCare"
    description: "Пустующие участки, которые Pennsylvania Horticultural Society очистила, озеленила и продолжает косить через LandCare и Community LandCare. Это тот уход, который проверяли испытания в Филадельфии."
  gardens:
    label: "Общественные сады"
    description: "Общественные сады и фермы, которые поддерживают PHS или Neighborhood Gardens Trust, и сады, зарегистрированные в «Парках и зонах отдыха» (Parks and Recreation). Об этих местах люди уже заботятся, поэтому они никогда не показываются как пустующие."
  council_districts:
    label: "Округа городского совета"
    description: "Десять округов городского совета в границах 2024 года, чтобы вы видели, в какой офис обращаться."
    settings:
      names:
        label: "Показывать названия"
  community_organizations:
    label: "Зарегистрированные общественные организации (RCO)"
    description: "Районные группы, зарегистрированные в городе, которые узнают об изменениях зонирования в своей области. Их области часто пересекаются."
    settings:
      names:
        label: "Показывать названия"
  neighborhoods:
    label: "Районы"
    description: "Названия и границы районов, по карте районов OpenDataPhilly от Abaca Labs."
    settings:
      names:
        label: "Показывать названия"
  segments:
    label: "Безопасность улиц по отрезкам"
    description: "Каждый отрезок улицы раскрашен по ракурсу «Безопасность улиц»: находится ли он в Сети с высоким уровнем травматизма, сколько людей погибло или получило тяжёлые травмы здесь, когда шли пешком или ехали на велосипеде, за последние пять лет записей PennDOT, погиб ли здесь кто-то за последние два года и есть ли школа в пределах 400 метров. Двигайте ползунки ракурса, чтобы изменить сочетание. Для отрезка улицы также указано, сколько столбов город указывает вдоль него и у скольких из них светодиодные светильники, и какие меры успокоения движения город там указывает."
    settings:
      min_score:
        label: "Показывать отрезки улиц с оценкой не ниже"
        options:
          "1":
            label: "Любая оценка выше нуля"
          "20":
            label: "20 из 100"
          "40":
            label: "40 из 100"
          "60":
            label: "60 из 100"
  crashes:
    label: "Аварии"
    description: "Аварии в Филадельфии, о которых сообщено в PennDOT, с 2015 по 2024 год, раскрашенные по тому, насколько сильно пострадали люди. Выберите годы, тяжесть травм и тех, кто участвовал. Записи PennDOT поступают примерно через год после аварий, поэтому самые недавние смерти показаны как мемориалы."
    settings:
      years:
        label: "Годы"
        options:
          latest:
            label: "Самый последний год записей"
          recent:
            label: "Последние пять лет"
          all:
            label: "Каждый год с 2015"
      severity:
        label: "Насколько сильно пострадали люди"
        options:
          "3":
            label: "Человек погиб"
          "2":
            label: "Человек погиб или получил тяжёлую травму"
          "1":
            label: "Человек получил травму"
          "0":
            label: "Каждая авария"
      mode:
        label: "Кто участвовал"
        options:
          all:
            label: "Все"
          walk_cycle:
            label: "Люди, которые шли пешком или ехали на велосипеде"
          walk:
            label: "Люди, которые шли пешком"
          cycle:
            label: "Люди, которые ехали на велосипеде"
          motorcycle:
            label: "Люди на мотоциклах"
  memorials:
    label: "Мемориалы"
    description: "Люди, погибшие на наших улицах, когда шли пешком, ехали на велосипеде или на самокате, по записям полицейского управления о гибели в дорожных авариях с 2019 года, каждый отмечен скромно там, где это случилось. Имя появляется, только если его уже называет открытый список памяти, и любой может попросить убрать имя или отметку."
    settings:
      show_names:
        label: "Показывать имена"
      all_fatal:
        label: "Помнить также людей, погибших в автомобилях и на мотоциклах"
  parking_reports:
    label: "Сообщения о проблемах с парковкой (Laser Vision)"
    description: "Где пользователи приложения Laser Vision от Philly Bike Action сообщили о транспорте, который перекрывает тротуары, пешеходные переходы, углы, съезды с тротуара и велодорожки, за 12 месяцев до даты в условных обозначениях, с подсчётом по областям размером примерно с квартал. Это показывает, где сообщили о проблемах пользователи одного приложения, а не все проблемы. Область, где меньше 5 сообщений, не показана, чтобы не было видно ни одного отдельного сообщения. Много сообщений в одном месте говорят в пользу физических исправлений: выступов тротуара, столбиков, углов без парковки для лучшего обзора, защищённых велодорожек и зон погрузки."
    settings:
      kind:
        label: "Показывать сообщения о транспорте"
        options:
          all:
            label: "Который мешает пройти любым из этих способов"
          sidewalk:
            label: "На тротуаре"
          bike_lane:
            label: "На велодорожке"
          crosswalk:
            label: "На пешеходном переходе"
          corner:
            label: "На углу"
          ramp:
            label: "Перекрывает съезд с тротуара"
  street_poles:
    label: "Уличные столбы и светильники из городского списка"
    description: "Каждый уличный столб, который указывает Департамент улиц, со светильниками, которые он указывает на них: светодиодными (LED), более старыми натриевыми высокого давления или светильником вида, которого он не называет. У многих столбов, например у столбов PECO и светофоров, светильник не указан. Это то, что город установил, а не сведения о том, работает ли светильник сегодня вечером: о погасшем фонаре сообщайте в Philly311, назвав номер столба. Показывается вблизи, на участке в несколько кварталов."
    settings:
      show:
        label: "Показывать"
        options:
          all:
            label: "Каждый столб"
          lamps:
            label: "Столбы со светильником из городского списка"
          not_led:
            label: "Светильники, которые город не указывает как светодиодные"
  traffic_calming:
    label: "Успокоение движения по городскому списку"
    description: "Скоростные подушки, искусственные неровности и приподнятые площадки, которые Департамент улиц установил, чтобы водители ехали медленнее на жилых улицах, с днём установки каждого. Соседи могут попросить город установить их на жилой улице; магистрали и государственные дороги не подходят. Для отрезка улицы показано, сколько их там и с какого времени, а для отрезка из Сети с высоким уровнем травматизма, где люди пострадали, сказано, когда ничего пока не записано."
  crossing_guards:
    label: "Посты дежурных на школьных переходах"
    description: "Углы, где город ставит дежурного на школьном переходе: это служба безопасности, которая помогает детям и всем остальным переходить улицу у школ в начале и в конце учебного дня. Для каждого поста названы его угол и ближайшая школа в пределах 400 метров."
  basemap:
    label: "Базовая карта"
    description: "Улицы, здания, парки, вода и названия мест из OpenStreetMap под всем остальным. Выберите серый вид, чтобы данные были заметнее, или выключите базовую карту."
    settings:
      look:
        label: "Вид"
        options:
          light:
            label: "Светлая, в цвете"
          muted:
            label: "Серая, чтобы данные были заметнее"
  transit_stops:
    label: "Остановки автобусов и трамваев"
    description: "Каждая остановка автобуса и трамвая SEPTA в Филадельфии по действующим расписаниям SEPTA: маршруты, которые там останавливаются, как часто приходит автобус или трамвай в обычный будний день, в субботу и в воскресенье, когда начинается и заканчивается движение и сколько людей садится там в обычный будний день, по собственным подсчётам SEPTA. Для каждой остановки показано, что находят там пассажиры, если это известно OpenStreetMap, навес, если он есть в городском списке, её приоритет по ракурсу «Комфорт на остановках» и что могут сделать соседи. Станции метро, надземки (El) и Regional Rail можно добавить в настройках."
    settings:
      service:
        label: "Показывать остановки с"
        options:
          all:
            label: "Любым движением"
          frequent:
            label: "Частым движением: каждые 15 минут или чаще в середине дня"
          long_wait:
            label: "Долгим ожиданием: реже, чем каждые 30 минут в середине дня"
      color:
        label: "Раскрашивать остановки по"
        options:
          lens:
            label: "Приоритету по ракурсу «Комфорт на остановках»"
          wait:
            label: "Тому, как часто приходит автобус или поезд в середине дня"
          boardings:
            label: "Тому, сколько людей садится в каждый будний день"
      stations:
        label: "Показывать также станции метро, надземки (El) и Regional Rail"
  transit_routes:
    label: "Маршруты автобусов, трамваев и поездов"
    description: "Улицы и пути, по которым идёт каждый маршрут SEPTA в Филадельфии, по действующим расписаниям SEPTA, раскрашенные по виду транспорта. Выберите частые маршруты, чтобы увидеть, где автобус или поезд приходит не реже, чем каждые 15 минут в середине дня."
    settings:
      service:
        label: "Показывать маршруты"
        options:
          all:
            label: "Все маршруты"
          frequent:
            label: "Частые маршруты: каждые 15 минут или чаще в середине дня"
  stop_amenities:
    label: "Навесы и скамейки на остановках"
    description: "Что находят пассажиры на остановках автобусов и трамваев, о которых знает OpenStreetMap: навес или крыша, скамейка без навеса, ничего или пока не проверено. «Пока не проверено» означает, что никто ещё этого не записал; это не значит, что на остановке ничего нет. В OpenStreetMap пока есть лишь примерно одна остановка из десяти (полный список остановок SEPTA это отдельный слой). Соседи могут проверять остановки с помощью приложения StreetComplete на телефоне, и их ответы появятся здесь примерно через неделю."
    settings:
      show:
        label: "Показывать"
        options:
          all:
            label: "Все остановки"
          surveyed:
            label: "Остановки, которые кто-то проверил"
          unsurveyed:
            label: "Остановки, которые пока не проверены"
  city_shelters:
    label: "Автобусные навесы из городского списка"
    description: "Автобусные навесы из собственного списка города, который город устанавливает и содержит вместе со своим рекламным партнёром, с остановкой SEPTA, которую обслуживает каждый. Остановка с городским навесом в ракурсе «Комфорт на остановках» считается остановкой с навесом. Если OpenStreetMap говорит, что на остановке нет навеса, а город указывает навес, на странице остановки сказано, что данные расходятся, и это выяснит проверка на месте. Список последний раз менялся в январе 2025 года, поэтому навес, который поставили или убрали после этого, может отсутствовать."
  heat_tracts:
    label: "Уязвимость к жаре по районам"
    description: "Насколько сильно летняя жара бьёт по людям в каждом переписном участке, по Индексу уязвимости к жаре, который ведёт город (Департамент общественного здравоохранения и Управление устойчивого развития, данные с 2017 по 2019 год). Он объединяет воздействие жары, то есть насколько жарко становится участку в летние дни по измерениям со спутников, и чувствительность к жаре, то есть сколько из живущих там людей в большей группе риска при жаре (двенадцать показателей: возраст, здоровье, доход, образование, язык и раса, как город построил этот индекс). Участки закрашены по пятым частям города, самая тёмная пятая часть самая подверженная риску. Воздействие и чувствительность можно показать отдельно в настройках."
    settings:
      measure:
        label: "Закрашивать участки по"
        options:
          vulnerability:
            label: "Уязвимости к жаре: жара и люди в группе риска вместе"
          exposure:
            label: "Воздействию жары: насколько становится жарко"
          sensitivity:
            label: "Чувствительности к жаре: сколько людей в группе риска при жаре"
      priority:
        label: "Обвести участки, которые город оценивает очень высоко"
  city_trees:
    label: "Деревья на улицах и в парках"
    description: "Каждое дерево из перечня деревьев «Парков и зон отдыха» (Parks and Recreation, 2025): деревья, о которых город заботится на тротуарах и в парках, но не деревья на частных дворах, с видом каждого дерева и размером его ствола. Показывается вблизи, на участке в несколько кварталов. Небольшие деревья со стволом тоньше 4 дюймов часто молодые, и TreePhilly просит, чтобы молодые деревья получали примерно 20 галлонов воды в неделю с марта по декабрь."
    settings:
      show:
        label: "Показывать"
        options:
          all:
            label: "Каждое дерево"
          big:
            label: "Большие деревья, дающие тень: ствол не тоньше 12 дюймов"
          small:
            label: "Небольшие деревья: ствол тоньше 4 дюймов, часто молодые"
  floodplain:
    label: "Пойма (зона затопления)"
    description: "Где карты наводнений FEMA ожидают затопления, как их публикует город (2023): пойма с вероятностью затопления 1 процент в год, где наводнение происходит с вероятностью не меньше 1 к 100 каждый год, и рядом с ней зона с вероятностью 0,2 процента в год (их часто называют поймами раз в 100 лет и раз в 500 лет). Всё, что строится там, должно соблюдать городские правила для пойм. Озеленение, которое впитывает дождевую воду, там помогает, с растениями, которые переносят сырую землю."
    settings:
      zones:
        label: "Показывать"
        options:
          both:
            label: "Зоны с вероятностью затопления 1 процент и 0,2 процента в год"
          high:
            label: "Только пойму с вероятностью затопления 1 процент в год"
  benches:
    label: "Скамейки по данным OpenStreetMap"
    description: "Места, где можно сесть: скамейки, которые люди добавили в OpenStreetMap, свободную карту, которую может улучшать любой, с указанием, есть ли у каждой спинка, где карта об этом говорит. В OpenStreetMap не хватает многих скамеек, поэтому на улице, где ни одной не показано, они всё же могут быть. Любой может добавить скамейку с помощью приложения StreetComplete на телефоне, и она появится здесь примерно через неделю."
  picnic_tables:
    label: "Столы для пикника по данным OpenStreetMap"
    description: "Столы для пикника, которые люди добавили в OpenStreetMap, в основном в парках, с указанием, находится ли каждый под крышей, где карта об этом говорит. В OpenStreetMap не хватает многих из них. Любой может добавить стол с помощью приложения StreetComplete на телефоне, и он появится здесь примерно через неделю."
  drinking_water:
    label: "Питьевая вода по данным OpenStreetMap"
    description: "Питьевые фонтанчики и краны с водой, которые люди добавили в OpenStreetMap, с указанием, можно ли набрать воду в бутылку, где карта об этом говорит. OpenStreetMap знает лишь несколько десятков таких мест в городе, поэтому питьевые фонтанчики, которые указывают «Парки и зоны отдыха», составляют отдельный слой. Любой может добавить фонтанчик с помощью приложения StreetComplete на телефоне, и он появится здесь примерно через неделю."
  toilets:
    label: "Общественные туалеты по данным OpenStreetMap"
    description: "Туалеты, которые люди добавили в OpenStreetMap, с указанием, кто может ими пользоваться, есть ли плата и доступ для инвалидных колясок, где карта об этом говорит. Туалеты, закрытые для публики, не показаны. OpenStreetMap знает меньше сотни таких туалетов в городе. Любой может добавить туалет с помощью приложения StreetComplete на телефоне, и он появится здесь примерно через неделю."
  bookcases:
    label: "Маленькие бесплатные библиотеки (Little Free Library) по данным OpenStreetMap"
    description: "Общественные книжные шкафы, часто называемые маленькими бесплатными библиотеками, где любой может взять или оставить книгу, как их добавили в OpenStreetMap. Многих не хватает. Любой может добавить такую библиотеку с помощью приложения StreetComplete на телефоне, и она появится здесь примерно через неделю."
  park_water:
    label: "Питьевые фонтанчики в парках"
    description: "Питьевые фонтанчики и пункты наполнения бутылок в парках и центрах отдыха, как их указывает Philadelphia Parks and Recreation. Тем, что находится внутри центра отдыха, можно пользоваться, когда центр открыт."
  libraries:
    label: "Филиалы Free Library"
    description: "Каждый филиал Free Library of Philadelphia, который указывает город, с адресом, номером телефона и ссылкой на его страницу с часами работы. Библиотеки бесплатны и открыты для всех."
  recreation_centers:
    label: "Центры отдыха"
    description: "Где Philadelphia Parks and Recreation проводит программы: центры отдыха, центры для пожилых людей и центры экологического образования, с указанием, есть ли в каждом спортзал, как их указывает город."
  pools:
    label: "Бассейны и водные игровые площадки"
    description: "Городские бассейны, водные игровые площадки (spraygrounds) и разбрызгиватели, места, где можно охладиться в жаркие дни, с указанием, работает ли каждый в этом году, как его указывает Philadelphia Parks and Recreation. Бассейны открыты только в летний сезон; часы работы на этой неделе уточняйте в «Парках и зонах отдыха» (Parks and Recreation)."
    settings:
      show:
        label: "Показывать"
        options:
          in_service:
            label: "Только те, что работают в этом году"
          all:
            label: "Все, в том числе те, что не работают"
  cooling_centers:
    label: "Пункты охлаждения и обогрева"
    description: "Места, которые городское Управление по чрезвычайным ситуациям (Office of Emergency Management) указывает как пункты обогрева или охлаждения: библиотеки, центры отдыха, партнёры сообщества и общественные центры Philadelphia Housing Authority, с указанием, был ли каждый указан как открытый, его часов работы и того, что он предлагает, как указано в тот день, когда эта карта в последний раз копировала список. Это не данные в реальном времени: пункты открываются и закрываются в зависимости от погоды, поэтому позвоните в пункт или в Philly311, прежде чем идти. Библиотека или центр отдыха, который тоже является таким пунктом, показан один раз."
    settings:
      kind:
        label: "Пункты для"
        options:
          any:
            label: "Жары или холода"
          cooling:
            label: "Охлаждения в жаркую погоду"
          warming:
            label: "Обогрева в холодную погоду"
      show:
        label: "Показывать"
        options:
          all:
            label: "Все, открытые или закрытые по списку"
          open:
            label: "Только указанные как открытые"
  dumping:
    label: "Незаконный сброс мусора, о котором сообщили в 311"
    description: "Отрезки улиц, где кто-то обратился в Philly311 по поводу незаконного сброса мусора за последние 90 дней, с числом обращений и указанием, есть ли ещё открытое. Подсчёт по отрезкам улиц, а не по адресам, и без сведений о том, кто сообщил. Обращение показывает, что кто-то заметил проблему и попросил о помощи; на одних отрезках улиц просят чаще, чем на других, поэтому малое число обращений не означает, что отрезок улицы чистый."
    settings:
      show:
        label: "Показывать отрезки улиц, где есть"
        options:
          any:
            label: "Любое обращение за последние 90 дней"
          open:
            label: "Ещё открытое обращение"
  dark_lights:
    label: "Неработающие фонари на улицах и в переулках, о которых сообщили"
    description: "Отрезки улиц, где кто-то обратился в Philly311, чтобы починить уличный фонарь или фонарь в переулке, который не горел, за последние 90 дней, с числом обращений и указанием, есть ли ещё открытое, рядом со столбами и светильниками, которые город указывает вдоль отрезка. Подсчёт по отрезкам улиц, а не по адресам, и без сведений о том, кто сообщил."
    settings:
      show:
        label: "Показывать отрезки улиц, где есть"
        options:
          any:
            label: "Любое обращение за последние 90 дней"
          open:
            label: "Ещё открытое обращение"
  graffiti:
    label: "Граффити, о котором сообщили в 311"
    description: "Отрезки улиц, где кто-то обратился в Philly311, чтобы убрали граффити, за последние 90 дней, с числом обращений и указанием, есть ли ещё открытое. Подсчёт по отрезкам улиц, а не по адресам, и без сведений о том, кто сообщил."
    settings:
      show:
        label: "Показывать отрезки улиц, где есть"
        options:
          any:
            label: "Любое обращение за последние 90 дней"
          open:
            label: "Ещё открытое обращение"
  public_art:
    label: "Публичное искусство"
    description: "Муралы, скульптуры и статуи, мозаики и другое публичное искусство, по списку городской программы Percent for Art, OpenStreetMap и Wikidata. Когда два или три из них указывают одну и ту же работу, карта показывает её один раз и даёт ссылки на каждый. Произведения, которые хранят память о ком-то, показаны только как мемориальные произведения, без имён. Mural Arts Philadelphia ведёт самый большой список муралов города на своём сайте; его условия не разрешают копировать список, поэтому карта даёт ссылку на него. Если какой-то работы нет, добавьте её в OpenStreetMap, и она появится здесь примерно через неделю."
    settings:
      murals:
        label: "Муралы (росписи на стенах)"
      sculptures:
        label: "Скульптуры и статуи"
      mosaics:
        label: "Мозаики"
      other:
        label: "Другие виды искусства"
      inside:
        label: "Работы внутри зданий"
  playgrounds:
    label: "Игровые площадки"
    description: "Игровые площадки, которые указывает Philadelphia Parks and Recreation, с возрастом детей, для которого предназначена каждая, и годом установки, если город его называет. В парке часто их две, одна для младших детей и одна для старших. На странице участка названа ближайшая игровая площадка и расстояние до неё по прямой."
  walkability:
    label: "Насколько удобно ходить пешком в каждом районе (EPA)"
    description: "Национальный индекс пешей доступности Агентства по охране окружающей среды США (EPA) для каждой группы кварталов переписи (block group), области в несколько кварталов, по его базе Smart Location Database (2021, по данным примерно с 2017 по 2019 год). Он оценивает от 1 до 20, насколько область поддерживает ходьбу, по четырём показателям: сколько там перекрёстков, как близко ближайшая остановка транспорта и два показателя того, насколько хорошо сочетаются жильё, работа и магазины. Области закрашены по пятым частям групп кварталов Филадельфии или по собственным классам EPA, которые сравнивают всю страну. Каждый показатель можно показать отдельно в настройках. Группы кварталов обрезаны по суше города, поэтому реки остаются чистыми."
    settings:
      measure:
        label: "Закрашивать области по"
        options:
          index:
            label: "Индексу пешей доступности: все четыре показателя вместе"
          corners:
            label: "Перекрёсткам: насколько связаны улицы"
          transit:
            label: "Транспорту: как близко ближайшая остановка"
          mix:
            label: "Сочетанию жилья, работы и магазинов"
      compare:
        label: "Сравнивать с"
        options:
          city:
            label: "Филадельфией: пятые части групп кварталов города"
          nation:
            label: "Всей страной: собственные классы EPA"
  walking_distance:
    label: "Люди и места в пределах пешей доступности"
    description: "Для каждого шестиугольника шириной примерно в два квартала: сколько людей живёт в пределах 5 минут ходьбы от его середины, по переписи 2020 года; сколько из семи видов повседневных мест находится в пределах 10 минут ходьбы (библиотека, центр отдыха, бассейн или водная игровая площадка, питьевой фонтанчик в парке, школа, продуктовый магазин или рынок, принимающий SNAP, и остановка автобуса, трамвая или поезда); или сколько перекрёстков находится в пределах 5 минут ходьбы. 5 минут ходьбы считаются как 400 метров, а 10 минут ходьбы как 800 метров по прямой, что достигает немного дальше, чем прогулка по улицам, и пересекает железнодорожные пути, скоростные трассы и реки, которые пешеходы пересечь не могут."
    settings:
      measure:
        label: "Закрашивать шестиугольники по"
        options:
          people:
            label: "Людям, которые живут в пределах 5 минут ходьбы"
          places:
            label: "Видам повседневных мест в пределах 10 минут ходьбы"
          corners:
            label: "Перекрёсткам в пределах 5 минут ходьбы"
  traffic_stress:
    label: "Нагрузка от движения для велосипедистов (DVRPC)"
    description: "Насколько напряжённо ехать на велосипеде по каждой улице, как её оценивает Региональная комиссия по планированию долины Делавэр по числу полос, скорости движения и виду велодорожки, если она есть: уровень 1 подходит большинству людей любого возраста, уровень 2 большинству взрослых, уровень 3 только уверенным велосипедистам, а уровень 4 только самым бесстрашным. Если два направления улицы различаются, показано более напряжённое. Оценки основаны на моделях DVRPC и установленных ограничениях скорости, а не на поездках по каждой улице."
    settings:
      show:
        label: "Показывать"
        options:
          all:
            label: "Каждую улицу, которую оценивает DVRPC"
          stressful:
            label: "Только напряжённые улицы: уровни 3 и 4"
          calm:
            label: "Только спокойные улицы: уровни 1 и 2"
  displacement_watch:
    label: "Наблюдение за вытеснением жителей: признаки роста цен"
    description: "Области (переписные участки) как минимум с двумя из этих признаков, хотя бы один из которых связан с самими ценами (первые три): дома продаются намного дороже, чем пять лет назад, а цены растут быстрее, чем по городу в целом; городская оценочная стоимость растёт намного быстрее, чем по городу; городской Анализ рыночной стоимости (Market Value Analysis) показывает, что цены растут и становятся недоступными для давних жителей; компании покупают многие из проданных домов; не менее трёх из пяти домов сдаются в аренду; или многие арендаторы тратят на аренду половину дохода или больше (добавлено владельцем проекта 2026-10-09). Озеленение и другие улучшения могут поднять цены ещё выше, поэтому, где предложение озеленить участок, посадить деревья, сделать место для сидения, завести сад или попросить искусство, или участок, который город указывает как доступный, находится в одной из этих областей, его карточка добавляет способы защитить соседей. Это показывает признаки из открытых записей, а не прогноз, и ничего не говорит о том, кто здесь живёт. Нажмите на область, чтобы увидеть её признаки и то, что измерено по каждому, а также, как контекст, медианную арендную плату, медианный доход домохозяйства и сколько домов пустует, по опросу Бюро переписи населения; каждая цифра опроса сопровождается своей погрешностью."
    settings:
      shade:
        label: "Закрашивать области (если выключено, видны только их контуры)"
  historic_districts:
    label: "Исторические районы"
    description: "Местные исторические районы Philadelphia Historical Commission. Изменения зданий и участков в историческом районе могут потребовать проверки комиссии, даже мурал, забор или сад: сначала спросите комиссию (215 686 7660). Город просит всех подтверждать исторический статус объекта в комиссии. Нажмите на район, чтобы увидеть его название и день, когда ему присвоили статус."
  historic_properties:
    label: "Объекты в историческом реестре"
    description: "Объекты в Philadelphia Register of Historic Places, каждый на своём земельном участке, внесённые отдельно или как часть исторического района (показываются вблизи). Изменения здесь могут потребовать проверки Historical Commission: сначала спросите её (215 686 7660)."
  zoning_overlays:
    label: "Зоны overlay зонирования"
    description: "Области, где Zoning Code добавляет свои правила сверх базового зонирования: сохранение районов, торговые улицы, защита от наводнений и крутых склонов, ограничения на мощение у Wissahickon, высота зданий у аэропорта, вывески и другое. Многие пересекаются, а несколько покрывают большую часть города. Нажмите на место, чтобы увидеть все зоны overlay там, с их разделом Zoning Code. Зоны overlay могут менять то, что разрешено; уточните в городе, прежде чем планировать."
    settings:
      show:
        label: "Показывать"
        options:
          all:
            label: "Районы overlay и другие особые правила"
          districts:
            label: "Только районы overlay"
  hearings:
    label: "Предстоящие слушания"
    description: "Слушания, назначенные в Zoning Board of Adjustment, L&I Review Board, Board of Building Standards и других городских советах по какому-либо объекту, по городским записям об апелляциях, с днём, временем и видом апелляции. В слушании по зонированию может участвовать любой; нажмите на слушание, чтобы увидеть, как, и открыть страницу участка. Кто подал апелляцию, показано только на странице самого участка, но никогда на карте."
    settings:
      boards:
        label: "Показывать"
        options:
          all:
            label: "Каждый совет"
          zoning:
            label: "Только Zoning Board of Adjustment"
  brownfields:
    label: "Участки brownfield (EPA)"
    description: "Объекты, где федеральный грант на brownfield оплатил оценку или рекультивацию, по записям EPA. Это не карта всей загрязнённой земли, и она не говорит, загрязнён ли участок сегодня. Сделайте анализ почвы, прежде чем выращивать продукты питания на таком участке или рядом с ним."
  aerial_photos:
    label: "Аэрофотоснимки по годам"
    description: "Аэрофотоснимки всего города, сделанные с самолёта: собственные снимки города за каждый год, за который они есть, с 1996 года (каждую весну, в большинстве лет с марта по май), и более старые, которые размещает город, от Региональной комиссии по планированию долины Делавэр (1959 и 1975 годы) и Геологической службы США (1999). Листайте годы, чтобы увидеть, что стояло на этом месте раньше: дома, которые снесли, участки, которые расчистили, сады, которые выросли. Снимки приходят прямо с серверов города, когда этот слой включён, и рисуются под всем остальным на карте. Более старые годы менее чёткие, а снимки до 2000 года чёрно-белые."
    settings:
      year:
        label: "Год"
        options:
          "1959":
            label: "1959"
          "1975":
            label: "1975"
          "1996":
            label: "1996"
          "1999":
            label: "1999"
          "2000":
            label: "2000"
          "2004":
            label: "2004"
          "2005":
            label: "2005"
          "2008":
            label: "2008"
          "2009":
            label: "2009"
          "2010":
