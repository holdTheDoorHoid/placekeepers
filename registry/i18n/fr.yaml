options:
  live_city_data:
    label: "Récupérer les données en direct de la Ville"
    description: >-
      Quand vous ouvrez la page d'un terrain ou cherchez une adresse, votre navigateur demande
      aux serveurs publics de la Ville de Philadelphie les registres les plus récents : le
      propriétaire, les ventes, les évaluations, les inspections et les appels. Ces demandes
      vont directement de votre appareil à la Ville, sans jamais passer par Placekeepers, et les
      serveurs de la Ville les voient comme ils verraient une visite sur le site web des
      propriétés de la Ville. Les photos aériennes de la Ville et son atlas de 1860, sous « Hier et
      aujourd'hui », viennent aussi directement des serveurs de la Ville, mais seulement quand
      vous activez l'une d'elles. Désactivez cette option pour utiliser seulement la copie
      hebdomadaire des données que Placekeepers publie. La recherche d'adresse, l'ouverture d'une
      parcelle qui n'est pas dans notre liste, et les anciennes photos et l'atlas ont besoin
      qu'elle soit activée.
