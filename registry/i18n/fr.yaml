# French (fr) translations of the visitor facing words in registry/*.yaml, by id. English in
# registry/*.yaml is the source; anything left out here shows the English. Which fields may be
# translated, and the shape of this file, are in docs/TRANSLATING.md and
# web/src/i18n/registry-text.ts. The key terms are fixed in docs/i18n/glossary-fr.md.

groups:
  lots:
    label: "Terrains et bâtiments"
    description: "Terrains vacants et bâtiments abandonnés, et ce qu'on pourrait en faire."
  care:
    label: "Soins déjà en cours"
    description: "Terrains déjà entretenus, jardins, parcs et autres lieux dont des gens s'occupent déjà."
  displacement:
    label: "Prix et protections"
    description: "Là où les prix montent, pour que le verdissement et d'autres améliorations soient associés à des protections pour les voisins qui y habitent maintenant."
  rules:
    label: "Règles du terrain et audiences"
    description: "Quartiers et propriétés historiques, zonages superposés, audiences à venir sur des terrains et des bâtiments, et sites brownfield fédéraux."
  streets:
    label: "Rues et mémoriaux"
    description: "Le réseau High Injury Network, les accidents, les personnes tuées dans nos rues, et les poteaux de rue, les aménagements de modération de la circulation et les brigadiers scolaires que la Ville répertorie."
  transit:
    label: "Bus et trains"
    description: "Arrêts et lignes de la SEPTA, la fréquence du service, le nombre de personnes qui montent, et les arrêts qui ont un abribus ou un banc, d'après la liste des abribus de la Ville et OpenStreetMap."
  heat:
    label: "Chaleur, arbres et inondations"
    description: "À quel point la chaleur de l'été frappe chaque quartier, les arbres que la Ville entretient dans ses rues et ses parcs, et les endroits où la FEMA prévoit des inondations."
  amenities:
    label: "Bancs, eau, toilettes et plus"
    description: "Des endroits pour s'asseoir, boire de l'eau, utiliser des toilettes ou emprunter un livre, tels que cartographiés dans OpenStreetMap, et les fontaines à boire des parcs."
  public_places:
    label: "Bibliothèques, centres de loisirs et piscines"
    description: "Les bibliothèques de la Free Library, les centres de loisirs, piscines et aires de jeux d'eau de Parks and Recreation, et les refuges de la Ville contre le froid ou la chaleur, tels que la Ville les répertorie."
  conditions:
    label: "Problèmes signalés au 311"
    description: "Dépôts sauvages, lumières éteintes et graffitis que des gens ont signalés à Philly311 au cours des 90 derniers jours, comptés par tronçon de rue."
  placemaking:
    label: "Art et création de lieux"
    description: "Fresques, sculptures, mosaïques et autre art public, de la Ville, d'OpenStreetMap et de Wikidata, et les aires de jeux de la Ville."
  walking:
    label: "Marche, vélo et habitants"
    description: "À quel point chaque zone est praticable à pied, combien de personnes et de lieux du quotidien se trouvent à courte distance à pied, et à quel point chaque rue est stressante pour les personnes à vélo."
  then_and_now:
    label: "Hier et aujourd'hui"
    description: "Ce qui se trouvait dans une rue avant, et ce qu'il reste du passé. Les photos aériennes depuis 1959 et l'atlas de 1860 se chargent depuis les serveurs de la Ville seulement quand on les active ; la carte du redlining de 1937 vient de ce site."
  safety_context:
    label: "Là où le soin est le plus nécessaire"
    description: "Du contexte qui montre où les améliorations aideront probablement le plus."
  boundaries:
    label: "Limites"
    description: "Districts du Conseil municipal, organisations communautaires et quartiers."
  basemap:
    label: "Fond de carte"
    description: "Rues, bâtiments et noms de lieux, sous tout le reste."

