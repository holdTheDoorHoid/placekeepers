# Suggestions. Which places get which suggestion is decided in the pipeline. See docs/CONTRACTS.md.
- id: clean_and_green
  label: Clean and green this lot
  applies_to: parcel
  summary: Clear trash, grade, plant grass and a few trees, add a low post and rail fence, and mow regularly.
  evidence: strong
  cost: "About $1,100 to $1,500 up front and $150 to $300 a year (to confirm with PHS)"
  routes: [land_bank_garden_agreement, ask_the_owner, community_landcare]
  partners: [phs, gjli]
  default_on: true
  release: v0.1
- id: seal_abandoned_building
  label: Get this building sealed
  applies_to: parcel
  summary: Report an open abandoned building so the City seals its doors and windows.
  evidence: strong
  cost: Free to report
  routes: [report_to_311]
  partners: []
  default_on: true
  release: v0.1
# The heat and shade lens (M3.1). Which lots get them is decided in
# pipeline/src/placekeepers/derive/heat.py, from the lens factors. Both are greening, so the web
# app shows the displacement caution of docs/ETHICS.md with them (web/src/config/suggestions.ts).
- id: plant_shade_trees
  label: Plant shade trees on and along this lot
  applies_to: parcel
  summary: >-
    Fewer trees shade this area than around at least half the places on this map (the City's 2018
    tree canopy survey). Trees cool a block with their shade and with the water their leaves give
    off. The City plants free street trees in the sidewalk when a property's owner asks, and
    TreePhilly gives away free trees to plant in the ground on private land. Choose trees that
    will grow tall, so they shade the street and neighbors can still see across the lot.
  evidence: mixed
  cost: Free trees from the City and TreePhilly. Young trees need about 20 gallons of water a week from March through December
  routes: [land_bank_garden_agreement, ask_the_owner, community_landcare, street_tree_request, treephilly_yard_trees]
  partners: [treephilly, phs]
  default_on: true
  release: v0.3
- id: cool_green_lot
  label: Green this lot to cool the block
  applies_to: parcel
  summary: >-
    By the City's heat vulnerability index, summer heat hits people here harder than around at
    least half the places on this map. Bare dirt, gravel and rubble soak up the sun, while grass,
    garden beds and above all trees keep a lot cooler and shade the sidewalk beside it. Whatever
    this lot becomes, a garden, a clean and green lot or a side yard, plant shade trees in it, and
    keep them tall so the lot stays open to view.
  evidence: mixed
  cost: "From free trees (TreePhilly) to about $1,100 to $1,500 up front for a full clean and green (to confirm with PHS)"
  routes: [land_bank_garden_agreement, ask_the_owner, community_landcare, treephilly_yard_trees]
  partners: [phs, treephilly, gjli]
  default_on: true
  release: v0.3
# The placemaking lens (M3.4). Which lots get them is decided in
# pipeline/src/placekeepers/derive/placemaking.py. A place to sit, a garden and art can raise
# nearby prices as greening does, so the web app shows a placemaking version of the displacement
# caution with them (web/src/config/suggestions.ts). The three reports to Philly311 are for physical
# conditions on the street only, never about people and never to the police (docs/ETHICS.md).
- id: seating_and_shade
  label: Make a place to sit in the shade
  applies_to: parcel
  summary: >-
    More people live within a 5 minute walk of this lot than around at least half the places on
    this map. A few benches or a picnic table under shade trees can make it a place where
    neighbors stop, rest and meet. Ask the neighbors what they would use, choose sturdy seats, and
    plant trees that will grow tall so the lot stays open to view. Plan who will keep it clean.
  evidence: not_violence
  cost: "From free trees (TreePhilly) and a bench built from an open design to a few thousand dollars. Feet First Philly's public space mini grants give $500 to $2,500"
  routes: [land_bank_garden_agreement, ask_the_owner, community_landcare, public_space_mini_grant, treephilly_yard_trees, street_tree_request]
  partners: [feet_first, treephilly, phs]
  default_on: true
  release: v0.3
- id: community_garden
  label: Start a community garden
  applies_to: parcel
  summary: >-
    This lot is farther from a park than at least half the places on this map. A community garden
    gives neighbors green space, food and flowers, and a reason to meet. It needs gardeners who
    come back every week, water, and permission to use the land. Once a garden is working, the
    Neighborhood Gardens Trust can help keep it a garden for good.
  evidence: not_violence
  cost: "From a few raised beds to a few thousand dollars with soil, a fence and water. The Land Bank's Urban Garden Agreement costs $1"
  routes: [land_bank_garden_agreement, ask_the_owner, community_landcare]
  partners: [phs, ngt, gjli]
  default_on: true
  release: v0.3
- id: art_request
  label: Ask about a mural or other art
  applies_to: parcel
  summary: >-
    Many people live around this lot, and no work on the City's Percent for Art list or in
    Wikidata stands within a 5 minute walk. Those lists miss many murals, so look at the Public
    art layer and at Mural Arts' own list of murals first. A blank wall facing the lot could hold
    a mural: Mural Arts takes requests from the owners of walls on its own site. Art is welcome
    for beauty and pride; no study links it to less violence.
  evidence: not_violence
  cost: Free to ask Mural Arts
  routes: [mural_arts_wall_request]
  partners: [mural_arts]
  default_on: true
  release: v0.3
- id: report_dumping
  label: Report the illegal dumping to Philly311
  applies_to: parcel
  summary: >-
    Someone asked Philly311 about illegal dumping on a street block this lot faces in the last 90
    days, and the request is still open. If the trash is still there, add your own request, with
    a photo, so the City clears it away. A report is about the trash, never about who left it.
  evidence: not_violence
  cost: Free to report
  routes: [report_to_311]
  partners: []
  default_on: true
  release: v0.3
- id: report_dark_light
  label: Report the dark street light to Philly311
  applies_to: parcel
  summary: >-
    Someone asked Philly311 to fix a street or alley light that is out on a street block this lot
    faces, in the last 90 days, and the request is still open. If the light is still dark, add
    your own request, with the pole's number if it has one. A lit street helps neighbors use the
    street and the lot after dark.
  evidence: moderate
  cost: Free to report
  routes: [report_to_311]
  partners: []
  default_on: true
  release: v0.3
- id: report_graffiti
  label: Report the graffiti to Philly311
  applies_to: parcel
  summary: >-
    Someone asked Philly311 to remove graffiti on a street block this lot faces in the last 90
    days, and the request is still open. If it is still there, add your own request, with a
    photo, so the City can clean it off. If neighbors would rather have art on that wall, ask its
    owner about a mural.
  evidence: not_violence
  cost: Free to report
  routes: [report_to_311]
  partners: []
  default_on: true
  release: v0.3
- id: memorial_or_ghost_bike
  label: A memorial or a ghost bike
  applies_to: crash
  summary: >-
    A memorial honors the person who died and reminds everyone passing to slow down. For a person
    killed while cycling, the Bicycle Coalition can place a ghost bike, a bicycle painted white.
  evidence: not_violence
  cost: Low; a ghost bike request is free
  routes: [ghost_bike_request]
  partners: [bike_coalition]
  default_on: true
  release: v0.1
- id: traffic_calming_petition
  label: Ask for traffic calming on this residential street
  applies_to: crash
  summary: >-
    Neighbors can ask the City for speed cushions on a residential street. The City scores
    requests three times a year using crash data, and if this street is chosen, 60 percent of the
    block signs a petition. Arterials, state highways, short, steep and curving streets do not
    qualify.
  evidence: not_violence
  cost: Free to request
  routes: [traffic_calming_request]
  partners: [bike_coalition, feet_first]
  default_on: true
  release: v0.1
- id: daylighting_check
  label: Check that this corner is clear for 20 feet
  applies_to: crash
  summary: >-
    Pennsylvania law already bans parking within 20 feet of a crosswalk at an intersection, and
    within 30 feet of a stop sign or signal, so drivers and people crossing can see each other.
    If cars park there, ask the City about daylighting the corner with paint, posts or planters.
    Report a dark streetlight here to Philly311.
  evidence: not_violence
  cost: Free to ask
  routes: [otis_contact, report_to_311]
  partners: [feet_first]
  default_on: true
  release: v0.1
- id: asphalt_art_check
  label: Asphalt art at this corner, check with the City first
  applies_to: crash
  summary: >-
    One study of painted intersections found fewer crashes involving people walking and cycling,
    but it had no comparison group and was paid for by the program's sponsor. In 2025 the federal
    government began urging states to remove crosswalk art, and Philadelphia has no permit process
    for it. Check with the City before painting anything.
  evidence: weak
  cost: Not known; there is no City process to price it
  routes: [otis_contact]
  partners: [feet_first]
  default_on: true
  release: v0.1
# Bus and trolley stops (M2.3). Which stops get which is decided in
# pipeline/src/placekeepers/derive/transit_comfort.py; a stop lists them in this order.
- id: stop_survey
  label: Survey this stop with StreetComplete
  applies_to: stop
  summary: >-
    No one has recorded yet whether this stop has a shelter or a bench. Anyone can find out in a
    few minutes with the free StreetComplete phone app, and the answers reach this map within about
    a week. If the app has no question here, the stop is not in OpenStreetMap yet: add it with the
    app's Things overlay, or leave a note.
  evidence: context
  cost: Free; about three minutes a stop
  routes: [streetcomplete_survey]
  partners: []
  default_on: true
  release: v0.2
- id: stop_shelter_request
  label: Ask the City for a shelter at this stop
  applies_to: stop
  summary: >-
    A survey found no shelter here. The City's bus shelter program, run by its transportation
    office (OTIS), builds shelters paid for by the advertising on them and aims to put them at the
    busiest 15 percent of bus stops. There is no public request form, so write to OTIS with the
    stop's number and how many people get on here.
  evidence: weak
  cost: Free to ask
  routes: [bus_shelter_request]
  partners: []
  default_on: true
  release: v0.2
- id: stop_bench_request
  label: Ask the City for a bench at this stop
  applies_to: stop
  summary: >-
    A survey found no bench here. Benches at stops belong to the City's street furniture program,
    run by OTIS, and we found no public way to request one, so write to OTIS with the stop's
    number. A bench you build yourself needs permission, and the City's permit path for a bench on
    a sidewalk is not yet confirmed.
  evidence: weak
  cost: Free to ask
  routes: [stop_bench_request]
  partners: []
  default_on: true
  release: v0.2
- id: stop_streetlight_report
  label: Report a dark streetlight at this stop
  applies_to: stop
  summary: >-
    OpenStreetMap says this stop is not lit. If a streetlight here is out, report it to Philly311.
    The City's current streetlight program replaces lights but does not add new ones, so a stop
    with no light at all is a question for OTIS.
  evidence: moderate
  cost: Free to report
  routes: [report_to_311, otis_contact]
  partners: []
  default_on: true
  release: v0.2
- id: stop_shade_trees
  label: Plant shade trees by this stop
  applies_to: stop
  summary: >-
    Few trees shade this stop. The City plants free street trees in the sidewalk in front of a home
    or business when its owner asks, and waters them the first year. Ask the owners of the
    buildings beside the stop to request one; neighbors can help water it after that.
  evidence: mixed
  cost: Free street trees for property owners
  routes: [street_tree_request]
  partners: [treephilly]
  default_on: true
  release: v0.2
