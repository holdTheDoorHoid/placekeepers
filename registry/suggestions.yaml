# Suggestions. Which places get which suggestion is decided in the pipeline. See docs/CONTRACTS.md.
- id: clean_and_green
  label: Clean and green this lot
  applies_to: parcel
  summary: Clear trash, grade, plant grass and a few trees, add a low post and rail fence, and mow regularly.
  evidence: strong
  cost: "About $1,100 to $1,500 up front and $150 to $300 a year (to confirm with PHS)"
  routes: [land_bank_garden_agreement, ask_the_owner, community_landcare]
  partners: [phs, gjli]
  default_on: true
  release: v0.1
- id: seal_abandoned_building
  label: Get this building sealed
  applies_to: parcel
  summary: Report an open abandoned building so the City seals its doors and windows.
  evidence: strong
  cost: Free to report
  routes: [report_to_311]
  partners: []
  default_on: true
  release: v0.1
- id: memorial_or_ghost_bike
  label: A memorial or a ghost bike
  applies_to: crash
  summary: >-
    A memorial honors the person who died and reminds everyone passing to slow down. For a person
    killed while cycling, the Bicycle Coalition can place a ghost bike, a bicycle painted white.
  evidence: not_violence
  cost: Low; a ghost bike request is free
  routes: [ghost_bike_request]
  partners: [bike_coalition]
  default_on: true
  release: v0.1
- id: traffic_calming_petition
  label: Ask for traffic calming on this residential street
  applies_to: crash
  summary: >-
    Neighbors can ask the City for speed cushions on a residential street. The City scores
    requests three times a year using crash data, and if this street is chosen, 60 percent of the
    block signs a petition. Arterials, state highways, short, steep and curving streets do not
    qualify.
  evidence: not_violence
  cost: Free to request
  routes: [traffic_calming_request]
  partners: [bike_coalition, feet_first]
  default_on: true
  release: v0.1
- id: daylighting_check
  label: Check that this corner is clear for 20 feet
  applies_to: crash
  summary: >-
    Pennsylvania law already bans parking within 20 feet of a crosswalk at an intersection, and
    within 30 feet of a stop sign or signal, so drivers and people crossing can see each other.
    If cars park there, ask the City about daylighting the corner with paint, posts or planters.
    Report a dark streetlight here to Philly311.
  evidence: not_violence
  cost: Free to ask
  routes: [otis_contact, report_to_311]
  partners: [feet_first]
  default_on: true
  release: v0.1
- id: asphalt_art_check
  label: Asphalt art at this corner, check with the City first
  applies_to: crash
  summary: >-
    One study of painted intersections found fewer crashes involving people walking and cycling,
    but it had no comparison group and was paid for by the program's sponsor. In 2025 the federal
    government began urging states to remove crosswalk art, and Philadelphia has no permit process
    for it. Check with the City before painting anything.
  evidence: weak
  cost: Not known; there is no City process to price it
  routes: [otis_contact]
  partners: [feet_first]
  default_on: true
  release: v0.1
# Bus and trolley stops (M2.3). Which stops get which is decided in
# pipeline/src/placekeepers/derive/transit_comfort.py; a stop lists them in this order.
- id: stop_survey
  label: Survey this stop with StreetComplete
  applies_to: stop
  summary: >-
    No one has recorded yet whether this stop has a shelter or a bench. Anyone can find out in a
    few minutes with the free StreetComplete phone app, and the answers reach this map within about
    a week. If the app has no question here, the stop is not in OpenStreetMap yet: add it with the
    app's Things overlay, or leave a note.
  evidence: context
  cost: Free; about three minutes a stop
  routes: [streetcomplete_survey]
  partners: []
  default_on: true
  release: v0.2
- id: stop_shelter_request
  label: Ask the City for a shelter at this stop
  applies_to: stop
  summary: >-
    A survey found no shelter here. The City's bus shelter program, run by its transportation
    office (OTIS), builds shelters paid for by the advertising on them and aims to put them at the
    busiest 15 percent of bus stops. There is no public request form, so write to OTIS with the
    stop's number and how many people get on here.
  evidence: weak
  cost: Free to ask
  routes: [bus_shelter_request]
  partners: []
  default_on: true
  release: v0.2
- id: stop_bench_request
  label: Ask the City for a bench at this stop
  applies_to: stop
  summary: >-
    A survey found no bench here. Benches at stops belong to the City's street furniture program,
    run by OTIS, and we found no public way to request one, so write to OTIS with the stop's
    number. A bench you build yourself needs permission, and the City's permit path for a bench on
    a sidewalk is not yet confirmed.
  evidence: weak
  cost: Free to ask
  routes: [stop_bench_request]
  partners: []
  default_on: true
  release: v0.2
- id: stop_streetlight_report
  label: Report a dark streetlight at this stop
  applies_to: stop
  summary: >-
    OpenStreetMap says this stop is not lit. If a streetlight here is out, report it to Philly311.
    The City's current streetlight program replaces lights but does not add new ones, so a stop
    with no light at all is a question for OTIS.
  evidence: moderate
  cost: Free to report
  routes: [report_to_311, otis_contact]
  partners: []
  default_on: true
  release: v0.2
- id: stop_shade_trees
  label: Plant shade trees by this stop
  applies_to: stop
  summary: >-
    Few trees shade this stop. The City plants free street trees in the sidewalk in front of a home
    or business when its owner asks, and waters them the first year. Ask the owners of the
    buildings beside the stop to request one; neighbors can help water it after that.
  evidence: mixed
  cost: Free street trees for property owners
  routes: [street_tree_request]
  partners: [treephilly]
  default_on: true
  release: v0.2
