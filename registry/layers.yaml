# The 1937 redlining map (owner, 2026-10-09): from the site's own file, never a download, under
# Mapping Inequality's non commercial license (docs/CONTRACTS.md). Off by default in both views.
- id: redlining_1937
  label: 1937 redlining map (HOLC grades)
  group: then_and_now
  description: >-
    In 1937 a federal agency, the Home Owners' Loan Corporation (HOLC), graded Philadelphia's
    neighborhoods from A to D for how safe it judged mortgage lending there. The grades leaned on
    who lived in each area: areas where Black families and many immigrant families lived were
    usually graded D and outlined in red, which is where the word redlining comes from. This
    layer shows the 1937 areas and grades as Mapping Inequality traced them. The grades are a
    record of how the agency judged places in 1937; they say nothing about the people who live
    there today. Tap an area for its grade and a link to its 1937 description at Mapping
    Inequality. Non commercial use only.
  sources: [mapping_inequality_1937]
  file: tiles/redlining.pmtiles
  source_layer: holc
  geometry: polygon
  style: redlining
  evidence: context
  default: {field: false, analysis: false}
  settings:
    - id: shade
      label: Shade the areas (off shows their outlines and grades only)
      type: toggle
      default: true
  release: v0.4
