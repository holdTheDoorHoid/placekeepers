  file: tiles/boundaries.pmtiles
  source_layer: council_districts
  geometry: polygon
  style: boundary
  evidence: context
  default: {field: false, analysis: false}
  settings: []
  release: v0.1
- id: community_organizations
  label: Registered Community Organizations
  group: boundaries
  description: >-
    Neighborhood groups registered with the City, which hear about zoning changes in their area.
    Their areas often overlap.
  sources: [community_organizations]
  file: tiles/boundaries.pmtiles
  source_layer: rcos
  geometry: polygon
  style: boundary
  evidence: context
  default: {field: false, analysis: false}
  settings: []
  release: v0.1
- id: neighborhoods
  label: Neighborhoods
  group: boundaries
  description: >-
    Neighborhood names and boundaries, from the OpenDataPhilly neighborhoods map by Abaca Labs.
  sources: [neighborhoods]
  file: tiles/boundaries.pmtiles
  source_layer: neighborhoods
  geometry: polygon
  style: boundary
  evidence: context
  default: {field: false, analysis: false}
  settings: []
  release: v0.1
