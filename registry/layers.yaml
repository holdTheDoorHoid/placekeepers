# Public art (M3.2): one point per work from the City, OpenStreetMap and Wikidata, off by default
# in both views (several hundred points would crowd the lots and streets).
- id: public_art
  label: Public art
  group: placemaking
  description: >-
    Murals, sculptures and statues, mosaics and other public art, from the City's Percent for Art
    list, OpenStreetMap and Wikidata. When two or three of them list the same work, the map shows
    it once and links to each. Artworks that remember someone are shown only as memorial
    artworks, without names. Mural Arts Philadelphia keeps the largest list of the city's murals
    on its own site; its terms do not allow copying it, so the map links to it instead. If a work
    is missing, add it to OpenStreetMap and it appears here within about a week.
  sources: [percent_for_art, osm_philadelphia, wikidata_art]
  file: tiles/art.pmtiles
  source_layer: art
  geometry: point
  style: public_art
  evidence: not_violence
  default: {field: false, analysis: false}
  settings:
    - id: murals
      label: Murals and wall paintings
      type: toggle
      default: true
    - id: sculptures
      label: Sculptures and statues
      type: toggle
      default: true
    - id: mosaics
      label: Mosaics
      type: toggle
      default: true
    - id: other
      label: Other kinds of art
      type: toggle
      default: true
    - id: inside
      label: Works inside buildings
      type: toggle
      default: true
  release: v0.3
# Walking, cycling and people (M3.3). Off by default in both views: their fills would compete with
# the lots' lens colors, and the placemaking lens (M3.4) will use their measures on the lots.
- id: walkability
  label: How walkable each area is (EPA)
  group: walking
  description: >-
    The U.S. Environmental Protection Agency's National Walkability Index for each census block
    group, an area of a few blocks, from its Smart Location Database (2021, from data of about 2017
    to 2019). It scores from 1 to 20 how well an area supports walking, from four measures: how
    many street corners there are, how close the nearest transit stop is, and two measures of how
    well homes, jobs and shops are mixed. Areas are shaded by fifths of Philadelphia's block groups,
    or by the EPA's own classes, which compare the whole country. Each measure can be shown on its
    own in the settings. The block groups are trimmed to the city's land, so rivers stay clear.
  sources: [epa_walkability, census_tracts_2020, land_use]
  file: tiles/walk.pmtiles
  source_layer: block_groups
  geometry: polygon
  style: walkability
  evidence: context
  default: {field: false, analysis: false}
  settings:
    - id: measure
      label: Shade areas by
      type: choice
      options:
        - {value: index, label: "The walkability index: all four measures together"}
        - {value: corners, label: "Street corners: how connected the streets are"}
        - {value: transit, label: "Transit: how close the nearest stop is"}
        - {value: mix, label: "A mix of homes, jobs and shops"}
      default: index
    - id: compare
      label: Compare with
      type: choice
      options:
        - {value: city, label: "Philadelphia: fifths of the city's block groups"}
        - {value: nation, label: "The whole country: the EPA's own classes"}
      default: city
  release: v0.3
- id: walking_distance
  label: People and places within walking distance
  group: walking
  description: >-
    For each hexagon about two blocks across: how many people live within a 5 minute walk of its
    middle, from the 2020 census; how many of seven kinds of everyday places are within a 10 minute
    walk (a library, a recreation center, a pool or sprayground, a drinking fountain in a park, a
    school, a grocery store or market that takes SNAP, and a bus, trolley or train stop); or how
    many street corners are within a 5 minute walk. A 5 minute walk is counted as 400 meters and a
    10 minute walk as 800 meters in a straight line, which reaches a little farther than a walk
    along the streets and crosses rail lines, expressways and rivers that people on foot cannot.
  sources:
    - census_blocks_2020
    - street_centerlines
    - library_locations
    - ppr_program_sites
    - ppr_swimming_pools
    - ppr_spraygrounds
    - ppr_hydration_stations
    - schools
    - snap_retailers
    - septa_gtfs
    - census_tracts_2020
    - land_use
  file: tiles/walk.pmtiles
  source_layer: cells
  geometry: polygon
  style: walking_distance
  evidence: context
  default: {field: false, analysis: false}
  settings:
    - id: measure
      label: Shade hexagons by
      type: choice
      options:
        - {value: people, label: People who live within a 5 minute walk}
        - {value: places, label: Kinds of everyday places within a 10 minute walk}
        - {value: corners, label: Street corners within a 5 minute walk}
      default: people
  release: v0.3
- id: traffic_stress
  label: Traffic stress for people on bikes (DVRPC)
  group: walking
  description: >-
    How stressful each street is to ride a bike on, as the Delaware Valley Regional Planning
    Commission rates it from the number of lanes, how fast traffic goes and the kind of bike lane,
    if any: level 1 suits most people of all ages, level 2 most adults, level 3 only confident
    riders, and level 4 only the most fearless. Where the two directions of a street differ, the
    more stressful one is shown. The ratings come from DVRPC's models and posted speed limits, not
    from riding every street.
  sources: [dvrpc_lts]
  file: tiles/cycling.pmtiles
  source_layer: stress
  geometry: line
  style: traffic_stress
  evidence: context
  default: {field: false, analysis: false}
  settings:
    - id: show
      label: Show
      type: choice
      options:
        - {value: all, label: Every street DVRPC rates}
        - {value: stressful, label: "Only stressful streets: levels 3 and 4"}
        - {value: calm, label: "Only calm streets: levels 1 and 2"}
      default: all
  release: v0.3
