- id: segments
  label: Street safety, block by block
  group: streets
  description: >-
    Each street block colored by the street safety lens: whether it is on the High Injury Network,
    how many people were killed or seriously injured there while walking or cycling in the five
    most recent years of PennDOT records, whether someone was killed there in the last two years,
    and whether a school is within 400 meters. Move the lens sliders to change the blend.
  sources: [street_centerlines, high_injury_network, crashes_2020_2024, fatal_crashes, schools]
  file: tiles/streets.pmtiles
  source_layer: segments
  geometry: line
  style: street_segments
  evidence: context
  default: {field: false, analysis: true}
  settings:
    - id: min_score
      label: Show blocks that score at least
      type: choice
      options:
        - {value: "1", label: Any score above zero}
        - {value: "20", label: 20 out of 100}
        - {value: "40", label: 40 out of 100}
        - {value: "60", label: 60 out of 100}
      default: "20"
  release: v0.1
- id: crashes
  label: Crashes
  group: streets
  description: >-
    Crashes reported to PennDOT in Philadelphia from 2015 to 2024, colored by how badly people
    were hurt. Choose the years, how badly people were hurt, and who was involved. PennDOT's
    records arrive about a year after the crashes, so the most recent deaths appear as memorials
    instead.
  sources: [crashes_2020_2024, crashes_2016_2020, crashes_2007_2017]
  file: tiles/streets.pmtiles
  source_layer: crashes
  geometry: point
  style: crashes
  evidence: context
  default: {field: false, analysis: false}
  settings:
    - id: years
      label: Years
      type: choice
      options:
        - {value: latest, label: The most recent year of records}
        - {value: recent, label: The most recent five years}
        - {value: all, label: Every year since 2015}
      default: recent
    - id: severity
      label: How badly people were hurt
      type: choice
      options:
        - {value: "3", label: Someone was killed}
        - {value: "2", label: Someone was killed or seriously injured}
        - {value: "1", label: Someone was injured}
        - {value: "0", label: Every crash}
      default: "2"
    - id: mode
      label: Who was involved
      type: choice
      options:
        - {value: all, label: Everyone}
        - {value: walk_cycle, label: People walking or cycling}
        - {value: walk, label: People walking}
        - {value: cycle, label: People cycling}
        - {value: motorcycle, label: People on motorcycles}
      default: all
  release: v0.1
- id: memorials
  label: Memorials
  group: streets
  description: >-
    People killed on our streets while walking, cycling or riding a scooter, from the Police
    Department's records of deaths in traffic crashes since 2019, each marked quietly where it
    happened. A name appears only when a public memorial list already shares it, and anyone can
    ask for a name or a marker to be removed.
  sources: [fatal_crashes, memorial_names]
  file: tiles/streets.pmtiles
  source_layer: memorials
  geometry: point
  style: memorials
  evidence: context
  default: {field: true, analysis: true}
  settings:
    - id: show_names
      label: Show names
      type: toggle
      default: true
    - id: all_fatal
      label: Also remember people killed in cars and on motorcycles
      type: toggle
      default: false
  release: v0.1
- id: basemap
  label: Base map
  group: basemap
  description: >-
    Streets, buildings, parks, water and place names from OpenStreetMap, underneath everything
    else. Choose the gray look to let the data stand out, or turn the base map off.
  sources: [basemap_openstreetmap]
  # Made by web/scripts/make-basemap.sh, not by the pipeline (docs/CONTRACTS.md section 2). The file
  # holds many layers (earth, water, roads, buildings, places and more); earth names the land under
  # them all, and the whole base map is drawn.
  file: basemap/philly.pmtiles
  source_layer: earth
  geometry: polygon
  style: basemap
  evidence: context
  default: {field: true, analysis: true}
  settings:
    - id: look
      label: Look
      type: choice
      options:
        - {value: light, label: "Light, in color"}
        - {value: muted, label: "Gray, so the data stands out"}
      default: light
  release: v0.1
# SEPTA stops and routes (M2.1). Off by default in both views until the transit comfort lens
# (M2.3) gives them a job on the map.
- id: transit_stops
  label: Bus and trolley stops
  group: transit
  description: >-
    Every SEPTA bus and trolley stop in Philadelphia, from SEPTA's current schedules: the routes
    that stop there, how often a bus or trolley comes on a typical weekday, Saturday and Sunday,
    when service starts and ends, and how many people get on there on an average weekday, from
    SEPTA's own counts. Each stop shows what riders find there where OpenStreetMap knows it, its
    priority under the transit comfort lens, and what neighbors can do about it. Subway, El and
    Regional Rail stations can be added in the settings.
  sources:
    - septa_gtfs
    - septa_ridership_bus
    - septa_ridership_trolley
    # The transit comfort lens (M2.3); land use gives the water left out of the canopy measure
    - osm_philadelphia
    - tree_canopy_2018
    - census_tracts_2020
    - land_use
    - heat_vulnerability
    - high_injury_network
    # The walking factors for the placemaking lens (M3.3)
    - epa_walkability
    - census_blocks_2020
    - street_centerlines
    - library_locations
    - ppr_program_sites
    - ppr_swimming_pools
    - ppr_spraygrounds
    - ppr_hydration_stations
    - schools
    - snap_retailers
  file: tiles/transit.pmtiles
  source_layer: stops
  geometry: point
  style: transit_stops
  evidence: context
  # Off until someone taps the Bus stops chip or uses the transit comfort lens (M2.3).
  default: {field: false, analysis: false}
  guide: streetcomplete
  settings:
    - id: service
      label: Show stops with
      type: choice
      options:
        - {value: all, label: Any service}
        - {value: frequent, label: "Frequent service: every 15 minutes or better at midday"}
        - {value: long_wait, label: "Long waits: less often than every 30 minutes at midday"}
      default: all
    - id: color
      label: Color stops by
      type: choice
      options:
        - {value: lens, label: Priority under the transit comfort lens}
        - {value: wait, label: How often a bus or train comes at midday}
        - {value: boardings, label: How many people get on each weekday}
      default: lens
    - id: stations
      label: Also show subway, El and Regional Rail stations
      type: toggle
      default: false
  release: v0.2
- id: transit_routes
  label: Bus, trolley and train routes
  group: transit
  description: >-
    The streets and tracks each SEPTA route follows in Philadelphia, from SEPTA's current
    schedules, colored by the kind of vehicle. Choose frequent routes to see where a bus or
    train comes at least every 15 minutes at midday.
  sources: [septa_gtfs]
  file: tiles/transit.pmtiles
  source_layer: routes
  geometry: line
  style: transit_routes
  evidence: context
  default: {field: false, analysis: false}
  settings:
    - id: service
      label: Show routes
      type: choice
      options:
        - {value: all, label: Every route}
        - {value: frequent, label: "Frequent routes: every 15 minutes or better at midday"}
      default: all
  release: v0.2
- id: stop_amenities
  label: Shelters and benches at stops
  group: transit
  description: >-
    What riders find at the bus and trolley stops OpenStreetMap knows about: a shelter or a roof, a
    bench but no shelter, neither, or not yet surveyed. Not yet surveyed means no one has recorded
    it yet; it does not mean the stop has nothing. OpenStreetMap has only about one stop in ten so
    far (SEPTA's full list of stops is its own layer). Neighbors can survey stops with the
    StreetComplete phone app, and their answers appear here within about a week.
  sources: [osm_philadelphia]
  # Amenities from OpenStreetMap share one tile file; M3.5 adds water, toilets and more to it.
  file: tiles/amenities.pmtiles
  source_layer: stops
  geometry: point
  style: stop_amenities
  evidence: not_violence
  # SEPTA's stops layer carries the transit comfort lens (M2.3); this one stays off unless
  # switched on.
  default: {field: false, analysis: false}
  guide: streetcomplete
  settings:
    - id: show
      label: Show
      type: choice
      options:
        - {value: all, label: Every stop}
        - {value: surveyed, label: Stops someone has surveyed}
        - {value: unsurveyed, label: Stops not yet surveyed}
      default: all
  release: v0.2
# Heat, trees and the floodplain (M3.1). Context for the heat and shade lens, off by default in
# both views: their fills would compete with the lots' colors, and the trees are many.
- id: heat_tracts
  label: Heat vulnerability by neighborhood
  group: heat
  description: >-
    How hard summer heat hits the people of each census tract, from the City's Heat Vulnerability
    Index (Department of Public Health and Office of Sustainability, data of 2017 to 2019). It
    puts together heat exposure, how hot the tract gets on summer days as satellites measure it,
    and heat sensitivity, how many of the people living there are more at risk in the heat
    (twelve measures of age, health, income, education, language and race, as the City built
    the index). Tracts are shaded by fifths of the city, the darkest fifth the most at risk.
    Exposure and sensitivity can be shown on their own in the settings.
  sources: [heat_vulnerability]
  file: tiles/environment.pmtiles
  source_layer: heat_tracts
  geometry: polygon
  style: heat_tracts
  evidence: context
  default: {field: false, analysis: false}
  settings:
    - id: measure
      label: Shade tracts by
      type: choice
      options:
        - {value: vulnerability, label: "Heat vulnerability: the heat and the people at risk together"}
        - {value: exposure, label: "Heat exposure: how hot it gets"}
        - {value: sensitivity, label: "Heat sensitivity: how many people are at risk in the heat"}
      default: vulnerability
    - id: priority
      label: Outline the tracts the City rates very high
      type: toggle
      default: true
  release: v0.3
- id: city_trees
  label: Street and park trees
  group: heat
  description: >-
    Every tree in Parks and Recreation's tree inventory (2025): the trees the City keeps on its
    sidewalks and in its parks, not trees in private yards, with each tree's kind and the size of
    its trunk. Shown close in, a few blocks across. Small trees, with a trunk under 4 inches
    across, are often young ones, and TreePhilly asks that young trees get about 20 gallons of
    water a week from March through December.
  sources: [street_trees]
  file: tiles/trees.pmtiles
  source_layer: trees
  geometry: point
  style: city_trees
  evidence: context
  default: {field: false, analysis: false}
  settings:
    - id: show
      label: Show
      type: choice
      options:
        - {value: all, label: Every tree}
        - {value: big, label: "Big shade trees: a trunk at least 12 inches across"}
        - {value: small, label: "Small trees: a trunk under 4 inches across, often young"}
      default: all
  release: v0.3
- id: floodplain
  label: Floodplain
  group: heat
  description: >-
    Where FEMA's flood maps expect flooding, as the City publishes them (2023): the 1 percent
    annual chance floodplain, where a flood has at least a 1 in 100 chance each year, and the 0.2
    percent annual chance area beside it (often called the 100 year and the 500 year
    floodplains). Anything built there must follow the City's floodplain rules. Greening that
    soaks up rain helps there, with plants that can stand wet ground.
  sources: [fema_floodplain]
  file: tiles/environment.pmtiles
  source_layer: floodplain
  geometry: polygon
  style: floodplain
  evidence: context
  default: {field: false, analysis: false}
  settings:
    - id: zones
      label: Show
      type: choice
      options:
        - {value: both, label: The 1 percent and the 0.2 percent annual chance areas}
        - {value: high, label: The 1 percent annual chance floodplain only}
      default: both
  release: v0.3

# Amenities from OpenStreetMap (M3.5), one layer per kind, in the same tile file as the shelters
# and benches at stops. OpenStreetMap is missing many of them, so each says so and links the guide
# that shows how to add them.
- id: benches
  label: Benches, as mapped in OpenStreetMap
  group: amenities
  description: >-
    Places to sit: the benches people have added to OpenStreetMap, the free map anyone can improve,
    with whether each has a backrest where the map says so. OpenStreetMap is missing many benches,
    so a street with none shown may still have some. Anyone can add a bench with the StreetComplete
    phone app, and it appears here within about a week.
  sources: [osm_philadelphia]
  file: tiles/amenities.pmtiles
  source_layer: benches
  geometry: point
  style: amenity
  evidence: not_violence
  default: {field: false, analysis: false}
  guide: streetcomplete
  release: v0.3
- id: picnic_tables
  label: Picnic tables, as mapped in OpenStreetMap
  group: amenities
  description: >-
    Picnic tables people have added to OpenStreetMap, mostly in parks, with whether each is under
    a roof where the map says so. OpenStreetMap is missing many of them. Anyone can add one with
    the StreetComplete phone app, and it appears here within about a week.
  sources: [osm_philadelphia]
  file: tiles/amenities.pmtiles
  source_layer: picnic_tables
  geometry: point
  style: amenity
  evidence: not_violence
  default: {field: false, analysis: false}
  guide: streetcomplete
  release: v0.3
- id: drinking_water
  label: Drinking water, as mapped in OpenStreetMap
  group: amenities
  description: >-
    Drinking fountains and water taps people have added to OpenStreetMap, with whether a bottle can
    be filled where the map says so. OpenStreetMap knows only a few dozen in the city, so the
    drinking fountains Parks and Recreation lists are their own layer. Anyone can add a fountain
    with the StreetComplete phone app, and it appears here within about a week.
  sources: [osm_philadelphia]
  file: tiles/amenities.pmtiles
  source_layer: water
  geometry: point
  style: amenity
  evidence: not_violence
  # A neighbor on foot, especially on a hot day, needs water: on by default in the field view.
  default: {field: true, analysis: false}
  guide: streetcomplete
  release: v0.3
- id: toilets
  label: Public toilets, as mapped in OpenStreetMap
  group: amenities
  description: >-
    Toilets people have added to OpenStreetMap, with who may use them, whether there is a fee and
    wheelchair access where the map says so. Toilets closed to the public are left out.
    OpenStreetMap knows fewer than a hundred in the city. Anyone can add one with the
    StreetComplete phone app, and it appears here within about a week.
  sources: [osm_philadelphia]
  file: tiles/amenities.pmtiles
  source_layer: toilets
  geometry: point
  style: amenity
  evidence: not_violence
  # A neighbor on foot needs a toilet: on by default in the field view.
  default: {field: true, analysis: false}
  guide: streetcomplete
  release: v0.3
- id: bookcases
  label: Little free libraries, as mapped in OpenStreetMap
  group: amenities
  description: >-
    Public bookcases, often called little free libraries, where anyone can take or leave a book,
    as people have added them to OpenStreetMap. Many are missing. Anyone can add one with the
    StreetComplete phone app, and it appears here within about a week.
  sources: [osm_philadelphia]
  file: tiles/amenities.pmtiles
  source_layer: bookcases
  geometry: point
  style: amenity
  evidence: not_violence
  default: {field: false, analysis: false}
  guide: streetcomplete
  release: v0.3
# Public places from the City (M3.5), in their own tile file: the City's data is under its own
# terms, and OpenStreetMap's license asks that data built from it stay apart.
- id: park_water
  label: Drinking fountains in parks
  group: amenities
  description: >-
    Drinking fountains and bottle filling stations at parks and recreation centers, as
    Philadelphia Parks and Recreation lists them. One inside a recreation center can be used when
    the center is open.
  sources: [ppr_hydration_stations]
  file: tiles/places.pmtiles
  source_layer: park_water
  geometry: point
  style: public_place
  evidence: not_violence
  # Water for a neighbor on foot: on by default in the field view, like the fountains above.
  default: {field: true, analysis: false}
  release: v0.3
- id: libraries
  label: Free Library branches
  group: public_places
  description: >-
    Every Free Library of Philadelphia location the City lists, with its address, phone number and
