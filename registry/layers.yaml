- id: neighborhoods
  label: Neighborhoods
  group: boundaries
  description: >-
    Neighborhood names and boundaries, from the OpenDataPhilly neighborhoods map by Abaca Labs.
  sources: [neighborhoods]
  file: tiles/boundaries.pmtiles
  source_layer: neighborhoods
  geometry: polygon
  style: boundary
  evidence: context
  default: {field: false, analysis: false}
  settings:
    - id: names
      label: Show names
      type: toggle
