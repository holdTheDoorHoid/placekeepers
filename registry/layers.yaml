# Map layers. Every layer gets a toggle generated from this file. See docs/CONTRACTS.md.
- id: vacant_parcels
  label: Vacant lots and buildings
  group: lots
  description: >-
    Parcels that are probably vacant, with how sure we are and why. Combines the City's vacancy
    indicator with the assessor's records, building footprints, demolitions, L&I cases and the
    land use map, so no single source can break it.
  sources:
    - vacant_indicators_land
    - vacant_indicators_bldg
    - opa_properties
    - pwd_parcels
    - building_footprints
    - land_use
    - phs_landcare
    - li_clean_and_seal
    - li_demolitions
    - li_unsafe
    - li_imminently_dangerous
    - li_permits
    - li_violations
    - li_complaints
    - ppr_properties
    - gardens_phs_ngt
    - gardens_registered
    # The violence reduction lens factors (M1.4)
    - shootings
    - acs_poverty
    - census_tracts_2020
    - tree_canopy_2018
    # The heat and shade lens factors and the floodplain note (M3.1)
    - heat_vulnerability
    - street_trees
    - fema_floodplain
    # The walking measures for the placemaking lens (M3.3)
    - epa_walkability
    - census_blocks_2020
    - street_centerlines
    - library_locations
    - ppr_program_sites
    - ppr_swimming_pools
    - ppr_spraygrounds
    - ppr_hydration_stations
    - schools
    - snap_retailers
    - septa_gtfs
    # The placemaking lens's own factors and its reports to Philly311 (M3.4)
    - percent_for_art
    - wikidata_art
    - commercial_corridors
    - philly311_conditions
  file: tiles/lots.pmtiles
  source_layer: parcels
  geometry: polygon
  style: vacant_parcels
  evidence: strong
  default: {field: true, analysis: true}
  settings:
    - id: min_confidence
      label: Show parcels we are at least this sure about
      type: choice
      options:
        - {value: "1", label: Any sign of vacancy}
        - {value: "2", label: Probably or very likely vacant}
        - {value: "3", label: Very likely vacant only}
      default: "2"
    - id: kinds
      label: Show
      type: choice
      options:
        - {value: both, label: Lots and buildings}
        - {value: lots, label: Lots only}
        - {value: buildings, label: Buildings only}
      default: both
    # Which lens colors the lots (M3.1). Each value is the id of a lens that applies to parcels;
    # moving a lens's sliders sets it to that lens (docs/CONTRACTS.md section 1).
    - id: lens
      label: Color lots by
      type: choice
      options:
        - {value: violence, label: The violence reduction lens}
        - {value: heat, label: The heat and shade lens}
        - {value: placemaking, label: The placemaking lens}
      default: violence
  release: v0.1
- id: hin_2025
  label: High Injury Network
  group: streets
  description: >-
    The streets where most traffic deaths and serious injuries happen in Philadelphia, as mapped by
    the City's Vision Zero program in 2025.
  sources: [high_injury_network]
  file: tiles/streets.pmtiles
  source_layer: hin
  geometry: line
  style: hin
  evidence: context
  default: {field: true, analysis: true}
  settings: []
  release: v0.1
- id: shootings_hex
  label: Shootings, counted by area
  group: safety_context
  description: >-
    Shooting victims in the chosen time window, counted per hexagon about two blocks across. Shown
    to point care where it helps most, not to label places as dangerous.
  sources: [shootings]
  file: tiles/context.pmtiles
  source_layer: h3
  geometry: polygon
  style: shootings_hex
  evidence: context
  default: {field: false, analysis: true}
  settings:
    - id: window
      label: Time window
      type: choice
      options:
        - {value: m12, label: Last 12 months}
        - {value: m36, label: Last 3 years}
      default: m12
  release: v0.1
- id: landcare_lots
  label: Lots kept up by PHS LandCare
  group: care
  description: >-
    Vacant lots the Pennsylvania Horticultural Society has cleaned and greened and keeps mowing,
    through LandCare and Community LandCare. This is the care the Philadelphia trials tested.
  sources: [phs_landcare]
  file: tiles/care.pmtiles
  source_layer: landcare
  geometry: polygon
  style: landcare
  evidence: strong
  default: {field: false, analysis: true}
  settings: []
  release: v0.1
- id: gardens
  label: Community gardens
  group: care
  description: >-
    Community gardens and farms supported by PHS or the Neighborhood Gardens Trust, and gardens
    registered with Parks and Recreation. People already care for these places, so they are never
    shown as vacant.
  sources: [gardens_phs_ngt, gardens_registered]
  file: tiles/care.pmtiles
  source_layer: gardens
  geometry: point
  style: gardens
  evidence: not_violence
  default: {field: false, analysis: true}
  settings: []
  release: v0.1
