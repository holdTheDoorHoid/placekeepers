  sources: [library_locations]
  file: tiles/places.pmtiles
  source_layer: libraries
  geometry: point
  style: public_place
  evidence: not_violence
  default: {field: false, analysis: false}
  release: v0.3
- id: recreation_centers
  label: Recreation centers
  group: public_places
  description: >-
    Where Philadelphia Parks and Recreation runs programs: recreation centers, older adult centers
    and environmental education centers, with whether each has a gym, as the City lists them.
  sources: [ppr_program_sites]
  file: tiles/places.pmtiles
  source_layer: recreation
  geometry: point
  style: public_place
  evidence: not_violence
  default: {field: false, analysis: false}
  release: v0.3
- id: pools
  label: Pools and spraygrounds
  group: public_places
  description: >-
    City pools, spraygrounds and sprinklers, places to cool off on hot days, with whether each is in
    service this year as Philadelphia Parks and Recreation lists it. Pools open for the summer
    season only; check with Parks and Recreation for this week's hours.
  sources: [ppr_swimming_pools, ppr_spraygrounds]
  file: tiles/places.pmtiles
  source_layer: pools
  geometry: point
  style: public_place
  evidence: not_violence
  default: {field: false, analysis: false}
  settings:
    - id: show
      label: Show
      type: choice
      options:
        - {value: in_service, label: Only those in service this year}
        - {value: all, label: "All of them, also those not in service"}
      default: in_service
  release: v0.3
# Conditions reported to 311 (M3.5): physical conditions only, never people (docs/ETHICS.md).
# Counted by block, so the map never points at the door a request came from.
- id: dumping
  label: Illegal dumping reported to 311
  group: conditions
  description: >-
    Blocks where someone asked Philly311 about illegal dumping in the last 90 days, with how many
    requests and whether any is still open. Counted by block, never by address, and with nothing
    about who reported. A request shows that someone noticed and asked for help; some blocks ask
    more often than others, so few requests does not mean a clean block.
  sources: [philly311_conditions, street_centerlines]
  file: tiles/conditions.pmtiles
  source_layer: dumping
  geometry: point
  style: condition
  evidence: context
  default: {field: false, analysis: false}
  settings:
    - id: show
      label: Show blocks with
      type: choice
      options:
        - {value: any, label: Any request in the last 90 days}
        - {value: open, label: A request still open}
      default: any
  release: v0.3
- id: dark_lights
  label: Street and alley lights reported out
  group: conditions
  description: >-
    Blocks where someone asked Philly311 to fix a street light or an alley light that was out in
    the last 90 days, with how many requests and whether any is still open. Counted by block, never
    by address, and with nothing about who reported.
  sources: [philly311_conditions, street_centerlines]
  file: tiles/conditions.pmtiles
  source_layer: lights
  geometry: point
  style: condition
  evidence: context
  default: {field: false, analysis: false}
  settings:
    - id: show
      label: Show blocks with
      type: choice
      options:
        - {value: any, label: Any request in the last 90 days}
        - {value: open, label: A request still open}
      default: any
  release: v0.3
- id: graffiti
  label: Graffiti reported to 311
  group: conditions
  description: >-
    Blocks where someone asked Philly311 to remove graffiti in the last 90 days, with how many
    requests and whether any is still open. Counted by block, never by address, and with nothing
