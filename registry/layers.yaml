# Map layers. Every layer gets a toggle generated from this file. See docs/CONTRACTS.md.
- id: vacant_parcels
  label: Vacant lots and buildings
  group: lots
  description: >-
    Parcels that are probably vacant, with how sure we are and why. Combines the City's vacancy
    indicator with other City records, so no single source can break it.
  sources: [vacant_indicators_land, vacant_indicators_bldg, opa_properties, pwd_parcels, phs_landcare]
  file: tiles/lots.pmtiles
  source_layer: parcels
  geometry: polygon
  style: vacant_parcels
  evidence: strong
  default: {field: true, analysis: true}
  settings:
    - id: min_confidence
      label: Show parcels we are at least this sure about
      type: choice
      options:
        - {value: "1", label: Any signal}
        - {value: "2", label: Medium or high}
        - {value: "3", label: High only}
      default: "2"
    - id: kinds
      label: Show
      type: choice
      options:
        - {value: both, label: Lots and buildings}
        - {value: lots, label: Lots only}
        - {value: buildings, label: Buildings only}
      default: both
  release: v0.1
- id: hin_2025
  label: High Injury Network
  group: streets
  description: >-
    The streets where most traffic deaths and serious injuries happen in Philadelphia, as mapped by
    the City's Vision Zero program in 2025.
  sources: [high_injury_network]
  file: tiles/streets.pmtiles
  source_layer: hin
  geometry: line
  style: hin
  evidence: context
  default: {field: true, analysis: true}
  settings: []
  release: v0.1
- id: shootings_hex
  label: Shootings, counted by area
  group: safety_context
  description: >-
    Shooting victims in the chosen time window, counted per hexagon about two blocks across. Shown
    to point care where it helps most, not to label places as dangerous.
  sources: [shootings]
  file: tiles/context.pmtiles
  source_layer: h3
  geometry: polygon
  style: shootings_hex
  evidence: context
  default: {field: false, analysis: true}
  settings:
    - id: window
      label: Time window
      type: choice
      options:
        - {value: m12, label: Last 12 months}
        - {value: m36, label: Last 3 years}
      default: m12
  release: v0.1
- id: landcare_lots
  label: Lots kept up by PHS LandCare
  group: care
  description: >-
    Vacant lots the Pennsylvania Horticultural Society has cleaned and greened and keeps mowing,
    through LandCare and Community LandCare. This is the care the Philadelphia trials tested.
  sources: [phs_landcare]
  file: tiles/care.pmtiles
  source_layer: landcare
  geometry: polygon
  style: landcare
  evidence: strong
  default: {field: false, analysis: true}
  settings: []
  release: v0.1
- id: gardens
  label: Community gardens
  group: care
  description: >-
    Community gardens and farms supported by PHS or the Neighborhood Gardens Trust, and gardens
    registered with Parks and Recreation. People already care for these places, so they are never
    shown as vacant.
  sources: [gardens_phs_ngt, gardens_registered]
  file: tiles/care.pmtiles
  source_layer: gardens
  geometry: point
  style: gardens
  evidence: not_violence
  default: {field: false, analysis: true}
  settings: []
  release: v0.1
- id: council_districts
  label: City Council districts
  group: boundaries
  description: >-
    The ten City Council districts as drawn in 2024, so you can see whose office to contact.
  sources: [council_districts]
  file: tiles/boundaries.pmtiles
  source_layer: council_districts
  geometry: polygon
  style: boundary
  evidence: context
  default: {field: false, analysis: false}
  settings:
    - id: names
      label: Show names
      type: toggle
      default: true
  release: v0.1
- id: community_organizations
  label: Registered Community Organizations
  group: boundaries
  description: >-
    Neighborhood groups registered with the City, which hear about zoning changes in their area.
    Their areas often overlap.
  sources: [community_organizations]
  file: tiles/boundaries.pmtiles
  source_layer: rcos
  geometry: polygon
  style: boundary
  evidence: context
  default: {field: false, analysis: false}
  settings:
    - id: names
      label: Show names
      type: toggle
      default: false
  release: v0.1
- id: neighborhoods
  label: Neighborhoods
  group: boundaries
  description: >-
    Neighborhood names and boundaries, from the OpenDataPhilly neighborhoods map by Abaca Labs.
  sources: [neighborhoods]
  file: tiles/boundaries.pmtiles
  source_layer: neighborhoods
  geometry: polygon
  style: boundary
  evidence: context
  default: {field: false, analysis: false}
  settings:
    - id: names
      label: Show names
      type: toggle
      default: true
  release: v0.1
- id: segments
  label: Street safety, block by block
  group: streets
  description: >-
    Each street block colored by the street safety lens: whether it is on the High Injury Network,
    how many people were killed or seriously injured there while walking or cycling in the five
    most recent years of PennDOT records, whether someone was killed there in the last two years,
    and whether a school is within 400 meters. Move the lens sliders to change the blend.
  sources: [street_centerlines, high_injury_network, crashes_2020_2024, fatal_crashes, schools]
  file: tiles/streets.pmtiles
  source_layer: segments
  geometry: line
  style: street_segments
  evidence: context
  default: {field: false, analysis: true}
  settings:
    - id: min_score
      label: Show blocks that score at least
      type: choice
      options:
        - {value: "1", label: Any score above zero}
        - {value: "20", label: 20 out of 100}
        - {value: "40", label: 40 out of 100}
        - {value: "60", label: 60 out of 100}
      default: "20"
  release: v0.1
- id: crashes
  label: Crashes
  group: streets
  description: >-
    Crashes reported to PennDOT in Philadelphia from 2015 to 2024, colored by how badly people
    were hurt. Choose the years, how badly people were hurt, and who was involved. PennDOT's
    records arrive about a year after the crashes, so the most recent deaths appear as memorials
    instead.
  sources: [crashes_2020_2024, crashes_2016_2020, crashes_2007_2017]
  file: tiles/streets.pmtiles
  source_layer: crashes
  geometry: point
  style: crashes
  evidence: context
  default: {field: false, analysis: false}
  settings:
    - id: years
      label: Years
      type: choice
      options:
        - {value: latest, label: The most recent year of records}
        - {value: recent, label: The most recent five years}
        - {value: all, label: Every year since 2015}
      default: recent
    - id: severity
      label: How badly people were hurt
      type: choice
      options:
        - {value: "3", label: Someone was killed}
        - {value: "2", label: Someone was killed or seriously injured}
        - {value: "1", label: Someone was injured}
        - {value: "0", label: Every crash}
      default: "2"
    - id: mode
      label: Who was involved
      type: choice
      options:
        - {value: all, label: Everyone}
        - {value: walk_cycle, label: People walking or cycling}
        - {value: walk, label: People walking}
        - {value: cycle, label: People cycling}
        - {value: motorcycle, label: People on motorcycles}
      default: all
  release: v0.1
- id: memorials
  label: Memorials
  group: streets
  description: >-
    People killed on our streets while walking, cycling or riding a scooter, from the Police
    Department's records of deaths in traffic crashes since 2019, each marked quietly where it
    happened. A name appears only when a public memorial list already shares it, and anyone can
    ask for a name or a marker to be removed.
  sources: [fatal_crashes, memorial_names]
  file: tiles/streets.pmtiles
  source_layer: memorials
  geometry: point
  style: memorials
  evidence: context
  default: {field: true, analysis: true}
  settings:
    - id: show_names
      label: Show names
      type: toggle
      default: true
    - id: all_fatal
      label: Also remember people killed in cars and on motorcycles
      type: toggle
      default: false
  release: v0.1
