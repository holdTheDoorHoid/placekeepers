# Legal routes. Content comes from docs/ROUTES.md; keep last_checked current.
- id: land_bank_garden_agreement
  label: Garden agreement or license from the Land Bank
  who: Anyone for a $1 Urban Garden Agreement; groups with a nonprofit sponsor for a Community Garden License
  steps:
    - Check that the Land Bank or City owns the lot.
    - Read Grounded in Philly's guide to getting permission to use City land.
    - Apply to the Land Bank, or join one of its free webinars first.
  cost: "$1 (Urban Garden Agreement), $25 a year (Individual Garden Agreement), or insurance and a sponsor (Community Garden License)"
  timeline: Weeks for short agreements; months for a license
  links:
    - {label: Philadelphia Land Bank, url: "https://phillylandbank.org/"}
    - {label: "Grounded in Philly: permission to use City land", url: "https://groundedinphilly.org/get-permission-to-use-land-city/"}
  last_checked: 2026-10-04
  status: confirm
- id: ask_the_owner
  label: Ask the owner for permission
  who: Anyone
  steps:
    - Find the owner's mailing address on the lot page.
    - Write to ask permission to clean and green the lot, and offer a simple written agreement.
    - Ask the Garden Justice Legal Initiative to review any agreement before you sign.
  cost: Free
  timeline: Depends on the owner
  links:
    - {label: Garden Justice Legal Initiative, url: "https://www.pubintlaw.org/cases-and-advocacy/garden-justice-legal-initiative/"}
  last_checked: 2026-10-04
  status: verified
- id: community_landcare
  label: Steward a lot with PHS Community LandCare
  who: Resident groups
  steps:
    - Contact PHS about Community LandCare.
  cost: To confirm with PHS
  timeline: To confirm with PHS
  links:
    - {label: Pennsylvania Horticultural Society, url: "https://phsonline.org/"}
  last_checked: 2026-10-04
  status: confirm
- id: report_to_311
  label: Report it to Philly311
  who: Anyone
  steps:
    - Report the open building, illegal dumping or dark streetlight to Philly311 online, by app, or by calling 311.
    - Keep the service request number and check back.
  cost: Free
  timeline: Days to weeks
  links:
    - {label: Philly311, url: "https://www.phila.gov/services/property-lots-housing/submit-a-service-request-with-311/"}
  last_checked: 2026-10-04
  status: verified
- id: ghost_bike_request
  label: Ask the Bicycle Coalition about a ghost bike or memorial
  who: The family, or friends with the family's blessing
  steps:
    - Talk with the family first. A memorial goes up only with their blessing.
    - For a person killed while cycling, fill in the Bicycle Coalition's ghost bike request form. The same form asks for a ghost bike to be repaired or replaced.
    - Families for Safe Streets, run by the Bicycle Coalition, supports families after a crash and shares a post crash resource guide.
    - Plan who will care for the memorial over time.
  cost: Free to request
  timeline: Not stated
  links:
    - {label: "Bicycle Coalition: what is a ghost bike", url: "https://bicyclecoalition.org/what-is-a-ghost-bike/"}
    - {label: Ghost bike request form, url: "https://forms.gle/HBtY1hG4xcdVJKNb8"}
    - {label: Families for Safe Streets Greater Philadelphia, url: "https://bicyclecoalition.org/programs/families-for-safe-streets/"}
  last_checked: 2026-10-04
  status: verified
- id: traffic_calming_request
  label: Request traffic calming for a residential street
  who: Residents of the block, mainly for the street where they live
  steps:
    - Check whether the street qualifies on the City's traffic calming map, or by calling 311.
    - Send the City's online traffic calming request.
    - If the City selects the request, collect signatures from 60 percent of the households on the block, one per household.
  cost: Free to request
  timeline: The City scores requests three times a year and usually installs speed cushions from May to October
  links:
    - {label: "City of Philadelphia: request traffic calming", url: "https://www.phila.gov/services/streets-sidewalks-alleys/request-traffic-calming-for-a-residential-street/"}
  last_checked: 2026-10-04
  status: verified
- id: otis_contact
  label: Ask the City's transportation office (OTIS)
  who: Anyone
  steps:
    - Write to the Office of Transportation and Infrastructure Systems at otis@phila.gov, naming the corner and what you see there.
    - Ask what the City allows at this corner and how to request it.
  cost: Free
  timeline: Not stated
  links:
    - {label: Vision Zero Philadelphia, url: "https://visionzerophl.com/"}
  last_checked: 2026-10-04
  status: confirm
# Milestone M3.1: giveaway trees for the heat and shade lens, from TreePhilly's own page, checked
# 2026-10-05 (docs/ROUTES.md section 1). Street trees use street_tree_request (M2.3).
- id: treephilly_yard_trees
  label: Get free trees from a TreePhilly giveaway
  who: Philadelphia residents, for trees planted in the ground on private property, such as a lot you own or a private lot whose owner agrees in writing
  steps:
    - Sign up for TreePhilly's newsletter to hear when registration opens. Giveaways happen in spring (March to May) and fall (September to December) in priority ZIP codes.
    - Register with the community group hosting a giveaway near you. Registration opens about two weeks to a month before the giveaway and closes when the trees run out.
    - Pick up the tree, 2 to 10 feet tall in a 5 gallon bucket, with a free bag of mulch, and plant it in the ground. Giveaway trees cannot go in a container, in the sidewalk or anywhere else in the public right of way.
  cost: Free
  timeline: The next spring or fall giveaway
  links:
    - {label: "TreePhilly: yard trees", url: "https://treephilly.org/yard-trees/"}
  last_checked: 2026-10-05
  status: confirm
# Milestone M1.3: routes for owner flags and for Land Bank, Redevelopment Authority and private lots.
- id: land_bank_side_yard
  label: Get it as a side or rear yard (next door owners only)
  who: The owner of the house next door, and only when the City's list marks the lot as eligible for a side yard
  steps:
    - Check that you own the house next door and that the lot is marked eligible for a side yard.
    - Read the Land Bank's side and rear yard page and apply.
    - Expect a long wait. After staff review, the Land Bank board and City Council must approve it.
  cost: A nominal price. The lot must stay a side yard for good, under a 30 year mortgage at its appraised value that is forgiven if the rules are kept; the City can take it back if they are not
  timeline: Staff aim to answer in 120 days, then the Land Bank board and City Council decide. Only 67 lots were conveyed this way citywide from 2020 to 2023
  links:
    - {label: "Philadelphia Land Bank: side or rear yards", url: "https://phillylandbank.org/side-or-rear-yards/"}
  last_checked: 2026-10-04
  status: verified
- id: contact_phdc
  label: Ask PHDC about this parcel
  who: Anyone
  steps:
    - Contact PHDC and name the parcel's address and its OPA account number.
    - Ask who manages the parcel, whether it is available, and how neighbors could care for it.
    - If you are not sure whom to ask, start with the Land Bank (land@phdc.phila.gov, 215 448 3034).
  cost: Free to ask
  timeline: Not known. Redevelopment Authority lots have no published route for neighbors yet
  links:
    - {label: PHDC, url: "https://phdcphila.org/"}
    - {label: Philadelphia Land Bank, url: "https://phillylandbank.org/"}
  last_checked: 2026-10-04
  status: confirm
- id: garden_adverse_possession
  label: Garden adverse possession (2024 law)
  who: Philadelphia residents, groups or nonprofits that have gardened a privately owned lot
  steps:
    - "Check the conditions of the 2024 law (53 Pa.C.S. section 1143, in effect since September 6, 2024): privately owned land of half an acre or less, 10 years of use with at least 5 of them as a garden, and no permanent buildings (fences and sheds are allowed)."
    - Read Grounded in Philly's guide to adverse possession.
    - Ask the Garden Justice Legal Initiative for a lawyer. This route needs a quiet title lawsuit.
  cost: A lawyer and court costs. Any liens on the land stay with it
  timeline: At least 10 years of use, then a lawsuit
  links:
    - {label: "Grounded in Philly: adverse possession", url: "https://groundedinphilly.org/how-to-obtain-land-adverse-possession/"}
    - {label: Garden Justice Legal Initiative, url: "https://www.pubintlaw.org/cases-and-advocacy/garden-justice-legal-initiative/"}
  last_checked: 2026-10-04
  status: confirm
- id: conservatorship
  label: Conservatorship (Act 135)
  who: A nonprofit or a person who petitions the court
  warning: Conservatorship can take a property away from its owner. Researchers found it is used disproportionately in neighborhoods facing gentrification. Talk to the Garden Justice Legal Initiative before you consider it.
  steps:
    - Talk to the Garden Justice Legal Initiative before anything else.
    - Ask first whether writing to the owner, or helping a family keep the property, would meet the same need.
    - "Know the law's conditions: a court can appoint a conservator only for a property that has not been legally occupied for 12 months, is not being marketed, is not in foreclosure, and was not bought in the last 6 months."
  cost: Court and repair costs. Since 2014 a petitioner can be paid the greatest of $2,500, 20% of the costs, or 20% of the sale price
  timeline: A court case; ask legal aid how long it would take
  links:
    - {label: Garden Justice Legal Initiative, url: "https://www.pubintlaw.org/cases-and-advocacy/garden-justice-legal-initiative/"}
  last_checked: 2026-10-04
  status: verified
- id: tangled_title_help
  label: Help a family keep an inherited home (Tangled Title Fund)
  who: Families whose home is still in the name of a relative who died, with household income up to 80% of the area median; the property must be the applicant's home
  steps:
    - Contact the Tangled Title Fund at Philadelphia VIP (tangledtitlefund@gmail.com, 215 523 9553).
    - The fund pays up to $6,500 toward the legal cost of clearing the title, and up to $3,500 more toward transfer tax, case by case.
  cost: Free to the family up to the fund's limits; the family covers anything beyond them
  timeline: First come, first served
  links:
    - {label: "Philadelphia VIP: Tangled Title Fund", url: "https://phillyvip.org/tangled-title-fund/"}
  last_checked: 2026-10-04
  status: verified
- id: fraud_guard
  label: Sign up for the City's free Fraud Guard alerts
  who: Property owners and their families
  steps:
    - Sign up for Fraud Guard with a name and an email address.
    - The City sends an email when a document naming you is recorded, so a fake deed is caught early.
    - Questions go to the Department of Records (215 686 2290, records.info@phila.gov).
  cost: Free
  timeline: An alert comes about 30 days after a document is recorded
  links:
    - {label: "City of Philadelphia: Fraud Guard", url: "https://www.phila.gov/2022-09-06-own-property-in-philadelphia-get-free-deed-fraud-protection-with-fraud-guard/"}
  last_checked: 2026-10-04
  status: verified
# Milestone M2.3: routes for bus and trolley stops. No public request path exists for a shelter or
# a bench (checked 2026-10-05); these routes say so and name the office that runs the program.
- id: bus_shelter_request
  label: Ask the City for a bus shelter
  who: Anyone
  steps:
    - Note the stop's SEPTA number (on the sign, and on this map), the corner, and how many people get on there each weekday.
    - Write to the City's Office of Transportation and Infrastructure Systems (OTIS) at otis@phila.gov, or call 215-686-9003. OTIS runs the City's bus shelter program; there is no public request form.
    - Copy your City Council district office, and tell SEPTA too, through its online comment form or at 215-580-7800.
  cost: Free to ask
  timeline: Not stated. OTIS sends new shelter locations to the City's Art Commission for review (eight in December 2025)
  links:
    - {label: "OTIS street furniture request for information (May 2024), with the City's shelter goal", url: "https://www.phila.gov/media/20240521160603/RFI-OTIS-street-furniture-20240521.pdf"}
    - {label: "Eight new bus shelters sent to the Art Commission (December 2025)", url: "https://www.phila.gov/media/20251205094032/Bus-Shelter-Upgrades-submission.pdf"}
    # wwww is SEPTA's own spelling of its host: its Customer Service page links the form this way.
    - {label: SEPTA comment form, url: "https://wwww.septa.org/customer-service/comment-form/"}
  last_checked: 2026-10-05
  status: confirm
- id: stop_bench_request
  label: Ask the City for a bench at a stop
  who: Anyone
  steps:
    - Note the stop's SEPTA number (on the sign, and on this map) and the corner.
    - Write to OTIS at otis@phila.gov, or call 215-686-9003, and ask for a bench at the stop. Benches at stops belong to the City's street furniture program; we found no public request form.
    - Copy your City Council district office.
  cost: Free to ask
  timeline: Not stated
  links:
    - {label: "OTIS street furniture request for information (May 2024)", url: "https://www.phila.gov/media/20240521160603/RFI-OTIS-street-furniture-20240521.pdf"}
  last_checked: 2026-10-05
  status: confirm
- id: street_tree_request
  label: Ask for a free street tree
  # Shared by the shade trees at a stop (M2.3) and on and along a vacant lot (M3.1).
  who: The owner of the home, business, lot or other property the tree would stand in front of; neighbors can ask the owner to
  steps:
    - Street trees are planted in the sidewalk in front of a property when its owner asks. Talk with the owners of the buildings beside the spot. For a vacant lot, ask the owner its lot page names, or the Land Bank for a lot the City or the Land Bank owns.
    - The owner asks Parks and Recreation's Street Tree Management Division for a free street tree, online, by email at StreetTree.Info@phila.gov, or by phone at 215-685-4363.
    - A City arborist visits to decide which tree fits. The City plants it for free in a planting season (mid April to mid June, or mid October to mid November) and waters and mulches it for the first year. After that, TreePhilly asks for about 20 gallons of water a week from March through December.
  cost: Free
  timeline: The next planting season after the arborist's visit
  links:
    - {label: "City of Philadelphia: get a street tree", url: "https://www.phila.gov/services/trees-parks-the-environment/tree-related-services/get-a-street-tree/"}
    - {label: "TreePhilly: street trees", url: "https://treephilly.org/street-trees/"}
  last_checked: 2026-10-05
  status: verified
- id: streetcomplete_survey
  label: Survey the stop with StreetComplete
  who: Anyone with an Android phone (a first iPhone test version appeared in September 2026)
  steps:
    - Install the free StreetComplete app and make a free OpenStreetMap account so your answers are published.
    - At the stop, tap the app's marker and answer its questions about the shelter, the bench, the light and the stop's number.
    - If the app has no question at the stop, add the stop with its Things overlay, or leave a note so another mapper can.
  cost: Free
  timeline: Answers reach this map within about a week
  links:
    - {label: "Placekeepers: survey bus stops", url: "https://holdthedoorhoid.github.io/placekeepers/streetcomplete/"}
    - {label: StreetComplete, url: "https://streetcomplete.app/"}
  last_checked: 2026-10-05
  status: verified
