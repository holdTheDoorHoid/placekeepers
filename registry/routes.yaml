# Legal routes. Content comes from docs/ROUTES.md; keep last_checked current.
- id: land_bank_garden_agreement
  label: Garden agreement or license from the Land Bank
  who: Anyone for a $1 Urban Garden Agreement; groups with a nonprofit sponsor for a Community Garden License
  steps:
    - Check that the Land Bank or City owns the lot.
    - Read Grounded in Philly's guide to getting permission to use City land.
    - Apply to the Land Bank, or join one of its free webinars first.
  cost: "$1 (Urban Garden Agreement), $25 a year (Individual Garden Agreement), or insurance and a sponsor (Community Garden License)"
  timeline: Weeks for short agreements; months for a license
  links:
    - {label: Philadelphia Land Bank, url: "https://phillylandbank.org/"}
    - {label: "Grounded in Philly: permission to use City land", url: "https://groundedinphilly.org/get-permission-to-use-land-city/"}
  last_checked: 2026-10-04
  status: confirm
- id: ask_the_owner
  label: Ask the owner for permission
  who: Anyone
  steps:
    - Find the owner's mailing address on the lot page.
    - Write to ask permission to clean and green the lot, and offer a simple written agreement.
    - Ask the Garden Justice Legal Initiative to review any agreement before you sign.
  cost: Free
  timeline: Depends on the owner
  links:
    - {label: Garden Justice Legal Initiative, url: "https://www.pubintlaw.org/cases-and-advocacy/garden-justice-legal-initiative/"}
  last_checked: 2026-10-04
  status: verified
- id: community_landcare
  label: Steward a lot with PHS Community LandCare
  who: Resident groups
  steps:
    - Contact PHS about Community LandCare.
  cost: To confirm with PHS
  timeline: To confirm with PHS
  links:
    - {label: Pennsylvania Horticultural Society, url: "https://phsonline.org/"}
  last_checked: 2026-10-04
  status: confirm
- id: report_to_311
  label: Report it to Philly311
  who: Anyone
  steps:
    - Report the open building, illegal dumping or dark streetlight to Philly311 online, by app, or by calling 311.
    - Keep the service request number and check back.
  cost: Free
  timeline: Days to weeks
  links:
    - {label: Philly311, url: "https://www.phila.gov/services/property-lots-housing/submit-a-service-request-with-311/"}
  last_checked: 2026-10-04
  status: verified
- id: ghost_bike_request
  label: Ask the Bicycle Coalition about a ghost bike or memorial
  who: The family, or friends with the family's blessing
  steps:
    - Talk with the family first. A memorial goes up only with their blessing.
    - For a person killed while cycling, fill in the Bicycle Coalition's ghost bike request form. The same form asks for a ghost bike to be repaired or replaced.
    - Families for Safe Streets, run by the Bicycle Coalition, supports families after a crash and shares a post crash resource guide.
    - Plan who will care for the memorial over time.
  cost: Free to request
  timeline: Not stated
  links:
    - {label: "Bicycle Coalition: what is a ghost bike", url: "https://bicyclecoalition.org/what-is-a-ghost-bike/"}
    - {label: Ghost bike request form, url: "https://forms.gle/HBtY1hG4xcdVJKNb8"}
    - {label: Families for Safe Streets Greater Philadelphia, url: "https://bicyclecoalition.org/programs/families-for-safe-streets/"}
  last_checked: 2026-10-04
  status: verified
- id: traffic_calming_request
  label: Request traffic calming for a residential street
  who: Residents of the block, mainly for the street where they live
  steps:
    - Check whether the street qualifies on the City's traffic calming map, or by calling 311.
    - Send the City's online traffic calming request.
    - If the City selects the request, collect signatures from 60 percent of the households on the block, one per household.
  cost: Free to request
  timeline: The City scores requests three times a year and usually installs speed cushions from May to October
  links:
    - {label: "City of Philadelphia: request traffic calming", url: "https://www.phila.gov/services/streets-sidewalks-alleys/request-traffic-calming-for-a-residential-street/"}
  last_checked: 2026-10-04
  status: verified
- id: otis_contact
  label: Ask the City's transportation office (OTIS)
  who: Anyone
  steps:
    - Write to the Office of Transportation and Infrastructure Systems at otis@phila.gov, naming the corner and what you see there.
    - Ask what the City allows at this corner and how to request it.
  cost: Free
  timeline: Not stated
  links:
    - {label: Vision Zero Philadelphia, url: "https://visionzerophl.com/"}
  last_checked: 2026-10-04
  status: confirm
