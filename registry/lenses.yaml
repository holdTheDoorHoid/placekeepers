# Lenses. Scores are weighted averages of 0 to 100 factor fields, computed in the map style.
# See docs/CONTRACTS.md and docs/EVIDENCE.md. Factors are added as their data arrives.
- id: violence
  label: Violence reduction
  applies_to: parcel
  description: >-
    Where cleaning, greening or sealing would most likely reduce gun violence nearby, based on
    randomized trials in Philadelphia.
  factors:
    - id: untreated_vacancy
      label: Untreated vacant lot or open abandoned building
      field: f_vacant
      evidence: strong
      default_weight: 3
      explain: >-
        Randomized trials in Philadelphia found that greening vacant lots and giving abandoned
        houses working doors and windows reduced gun violence nearby. Places already treated that
        way score 0: lots PHS LandCare keeps up, and buildings whose owner fixed the doors and
        windows after an L&I citation. Every other vacant lot or building scores 100.
    - id: shootings_nearby
      label: Shootings nearby in the last three years
      field: f_shoot
      evidence: context
      default_weight: 3
      explain: >-
        People shot in the last three years within about a quarter mile (the place's hexagon and
        the six around it), from the Police Department's shooting victim records. The rank is the
        share of places on the map with fewer. The trials measured fewer shootings around treated
        places, so care helps most where shootings happen.
    - id: poverty
      label: Neighborhood poverty rate
      field: f_poverty
      evidence: strong
      default_weight: 2
      explain: >-
        The share of people living below the poverty line in the place's census tract (Census
        Bureau survey, 2020 to 2024). The rank is the share of places on the map in tracts with a
        lower rate. In the citywide trial, the drop in gun violence was found in neighborhoods
        below the poverty line.
    - id: canopy_gap
      label: Few trees nearby
      field: f_canopy
      evidence: mixed
      default_weight: 1
      explain: >-
        Tree canopy on the land within about a quarter mile, from the City's 2018 tree canopy
        survey. The rank is the share of places on the map with more trees around them, so fewer
        trees rank higher. Street trees are linked to less crime, but evidence is mixed and
        depends on placement.
  presets:
    - id: research
      label: Research based
      weights: {untreated_vacancy: 3, shootings_nearby: 3, poverty: 2, canopy_gap: 1}
    - id: vacancy_only
      label: Vacancy only
      weights: {untreated_vacancy: 1, shootings_nearby: 0, poverty: 0, canopy_gap: 0}
  release: v0.1
- id: street_safety
  label: Street safety
  applies_to: segment
  description: >-
    Street blocks where people walking and cycling are most at risk, from crash records, the
    City's High Injury Network and nearby schools.
  factors:
    - id: high_injury_network
      label: On the High Injury Network
      field: f_hin
      evidence: context
      default_weight: 3
      explain: The City found that most traffic deaths and serious injuries happen on these streets, about 12 percent of all streets in Philadelphia.
    - id: walking_cycling_harm
      label: People killed or seriously injured walking or cycling, last 5 years
      field: f_ksi_vru
      evidence: context
      default_weight: 3
      explain: Counts people killed or seriously hurt while walking or cycling on this block or at its corners, in the five most recent years of PennDOT's crash records. The rank is the share of blocks citywide with fewer.
    - id: recent_death
      label: Someone killed here in the last 2 years
      field: f_fatal2
      evidence: context
      default_weight: 2
      explain: A death on this block or at its corners in the last two years, from the Police Department's fatal crash records, which are updated nightly.
    - id: school_nearby
      label: School within 400 meters
      field: f_school
      evidence: context
      default_weight: 1
      explain: Children walk to and from school here. 400 meters is about a five minute walk.
  presets:
    - id: research
      label: Research based
      weights: {high_injury_network: 3, walking_cycling_harm: 3, recent_death: 2, school_nearby: 1}
    - id: recorded_harm
      label: Recorded harm only
      weights: {high_injury_network: 0, walking_cycling_harm: 3, recent_death: 2, school_nearby: 0}
  release: v0.1
# The transit comfort lens (M2.3): SEPTA's bus and trolley stops. Factors are computed by the
# pipeline (placekeepers.derive.transit_comfort); the method is in docs/TRANSIT_METHOD.md and the
# evidence behind each badge in docs/EVIDENCE.md ("Bus stop comfort").
- id: transit_comfort
  label: Transit comfort
  applies_to: stop
  description: >-
    Bus and trolley stops where a shelter, a bench or shade would help riders most: busy stops,
    stops where a survey found nothing to sit under or on, stops with little shade in hot
    neighborhoods, stops on the High Injury Network, and stops with long waits. Where no one has
    surveyed a stop yet, its shelter and bench count halfway.
  factors:
    - id: riders
      label: People getting on each weekday
      field: f_riders
      evidence: context
      default_weight: 3
      explain: >-
        How many people get on here on an average weekday, from SEPTA's own count. The rank is the
        share of stops with fewer riders. More riders means more people helped by a shelter or a
        bench; the City aims to put shelters at the busiest 15 percent of bus stops. Stops SEPTA
        has not counted yet are left out of this factor.
    - id: no_shelter
      label: No shelter
      field: f_noshelter
      evidence: weak
      default_weight: 3
      explain: >-
        100 where a survey found no shelter, 0 where there is a shelter or the whole stop is under a
        roof. Where no one has surveyed the stop yet it counts as 50, halfway, so a stop is never
        scored as missing a shelter it may have; survey it to find out. In a study in Minneapolis
        and Saint Paul, riders at stops without a bench or a shelter felt their waits were longer
        than they were.
    - id: no_bench
      label: No bench
      field: f_nobench
      evidence: weak
      default_weight: 2
      explain: >-
        100 where a survey found no bench, 0 where there is one, and 50, halfway, where no one has
        surveyed the stop yet. The same study found that a bench makes a wait feel shorter.
    - id: little_shade
      label: Little shade nearby
      field: f_shade
      evidence: mixed
      default_weight: 2
      explain: >-
        Tree canopy on the land around the stop, in an area about two blocks across, from the City's
        2018 tree canopy survey. The rank is the share of stops with more trees around them, so fewer
        trees rank higher. Shade cools people waiting in the sun, but how much it helps depends on
        the climate and on what gives the shade.
    - id: heat
      label: Hot neighborhood in summer
      field: f_heat
      evidence: context
      default_weight: 1
      explain: >-
        How hot the stop's census tract runs on summer days, from the heat exposure part of the
        City's Heat Vulnerability Index (satellite surface temperatures and how much of the tract
        is paved, built or green). The rank is the share of stops in cooler tracts.
    - id: high_injury_network
      label: On the High Injury Network
      field: f_hin
      evidence: context
      default_weight: 2
      explain: >-
        The stop stands on or at one of the streets where most traffic deaths and serious injuries
        happen in Philadelphia, so many riders cross that street to reach the stop or to leave it.
        Studies elsewhere found that crashes involving people on foot gather at busy bus stops on
        wide roads, where a safe crossing matters most.
    - id: long_wait
      label: Long waits at midday
      field: f_wait
      evidence: weak
      default_weight: 1
      explain: >-
        The typical time between buses or trolleys from 10 to 2 on weekdays, from SEPTA's schedules.
        The rank is the share of stops with shorter waits. A long wait is when a seat and a roof
        matter most. Stops with no midday service are left out of this factor.
  presets:
    - id: balanced
      label: Balanced
      weights: {riders: 3, no_shelter: 3, no_bench: 2, little_shade: 2, heat: 1, high_injury_network: 2, long_wait: 1}
    - id: busiest_first
      label: Busiest stops first
      weights: {riders: 5, no_shelter: 3, no_bench: 2, little_shade: 0, heat: 0, high_injury_network: 0, long_wait: 0}
    - id: heat_and_shade
      label: Heat and shade
      weights: {riders: 2, no_shelter: 2, no_bench: 0, little_shade: 4, heat: 4, high_injury_network: 0, long_wait: 1}
  release: v0.2
